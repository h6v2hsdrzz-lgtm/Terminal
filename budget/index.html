function prochaineEcheance(f, du, au) {
  const oc = occurrences(f, du, au, du);
  return oc.length ? oc[0] : null;
}

function rendreFlux(cible, p) {
  const revenus = ETAT.flux.filter((f) => f.type === "revenu" && f.actif);
  const depenses = ETAT.flux.filter((f) => f.type === "depense" && f.actif);
  const virements = ETAT.flux.filter((f) => f.type === "virement" && f.actif);
  const rythmeR = revenus.reduce((s, f) => s + mensualiteMoyenne(f), 0);
  const rythmeD = depenses.reduce((s, f) => s + mensualiteMoyenne(f), 0);
  const rythmeV = virements.reduce((s, f) => s + mensualiteMoyenne(f), 0);

  const entete = carte(
    '<div class="grille g3">' +
    kpi("Revenus, rythme mensuel", argent(rythmeR), esc(revenus.length + " flux actifs"), "var(--revenu-texte)") +
    kpi("Dépenses, rythme mensuel", argent(rythmeD), esc(depenses.length + " flux actifs"), "var(--depense-texte)") +
    kpi("Écart", argent(rythmeR - rythmeD, { signe: true }),
      rythmeR > 0 ? esc(pourcent(((rythmeR - rythmeD) / rythmeR) * 100, 1) + " des revenus") : "",
      rythmeR - rythmeD >= 0 ? "var(--revenu-texte)" : "var(--depense-texte)") +
    "</div>" +
    '<p class="sous" style="margin:10px 0 0">Rythme moyen, ponctuels exclus : un trimestriel de 300 € compte pour 100 €/mois. ' +
    "La projection, elle, place chaque échéance à sa date." +
    (virements.length ? " S'y ajoutent " + esc(nombre(rythmeV)) + " € par mois de virements entre vos comptes, qui ne sont ni des revenus ni des dépenses." : "") +
    "</p>");

  const barreOutils = '<div class="rangee" style="margin-bottom:12px">' +
    '<input type="text" id="rech" placeholder="Rechercher un flux…" value="' + esc(ui.recherche) + '" style="max-width:240px">' +
    '<div class="segments" data-groupe="filtreType">' +
    ["tous", "revenu", "depense"].concat(ETAT.flux.some((f) => f.type === "virement") ? ["virement"] : []).map((v) =>
      '<button data-act="filtre-type" data-v="' + v + '" class="' + (ui.filtreType === v ? "on" : "") + '">' +
      (v === "tous" ? "Tout" : v === "revenu" ? "Revenus" : v === "depense" ? "Dépenses" : "Virements") + "</button>").join("") +
    "</div>" +
    '<div class="segments" data-groupe="tri">' +
    [["montant", "Montant"], ["libelle", "Nom"], ["date", "Prochaine"]].map(([v, n]) =>
      '<button data-act="tri" data-v="' + v + '" class="' + (ui.tri === v ? "on" : "") + '">' + n + "</button>").join("") +
    "</div>" +
    '<button class="btn primaire" data-act="flux-nouveau" style="margin-left:auto">+ Nouveau flux</button></div>';

  let liste = ETAT.flux.slice();
  if (ui.filtreType !== "tous") liste = liste.filter((f) => f.type === ui.filtreType);
  if (ui.recherche.trim()) {
    const q = ui.recherche.trim().toLowerCase();
    liste = liste.filter((f) => (f.libelle + " " + nomCategorie(f.categorieId) + " " + f.note).toLowerCase().includes(q));
  }
  const suivante = new Map(liste.map((f) => [f.id, prochaineEcheance(f, p.du, p.au)]));
  const totalHorizon = new Map();
  for (const f of liste) {
    totalHorizon.set(f.id, occurrences(f, p.du, p.au, p.du).reduce((s, o) => s + o.montant, 0));
  }
  liste.sort((a, b) => {
    if (ui.tri === "libelle") return a.libelle.localeCompare(b.libelle, "fr");
    if (ui.tri === "date") {
      const da = suivante.get(a.id), db = suivante.get(b.id);
      if (!da) return 1; if (!db) return -1;
      return da.date < db.date ? -1 : da.date > db.date ? 1 : 0;
    }
    return mensualiteMoyenne(b) - mensualiteMoyenne(a);
  });

  const lignes = liste.map((f) => {
    const c = categorie(f.categorieId);
    const s = suivante.get(f.id);
    const freq = FREQ[f.frequence] || FREQ.mensuel;
    return '<tr class="cliquable" data-act="flux-editer" data-id="' + esc(f.id) + '">' +
      "<td><div style=\"font-weight:500\">" + esc(f.libelle) +
        (f.actif ? "" : ' <span class="etiquette off">en pause</span>') +
        (f.indexation ? ' <span class="etiquette" title="Revalorisation annuelle">+' + esc(nombre(f.indexation, 1)) + " %/an</span>" : "") +
        "</div>" +
        '<div class="faible" style="font-size:12.5px"><i class="puce" style="background:' + teinte(c ? c.teinte : 1) + '"></i>' +
        (f.type === "virement"
          ? esc(nomCompte(f.compteId) + " → " + nomCompte(f.compteDest))
          : esc(nomCategorie(f.categorieId) + " · " + nomCompte(f.compteId))) +
        (f.fin ? " · jusqu'au " + esc(libelleDate(f.fin)) : "") + "</div></td>" +
      '<td><span class="etiquette">' + esc(freq.court) + "</span>" +
        (f.type === "virement" ? ' <span class="etiquette">virement</span>' : "") + "</td>" +
      '<td class="num ' + (f.type === "revenu" ? "pos" : f.type === "depense" ? "neg" : "dim") + '" style="font-weight:600">' +
        esc(f.type === "virement" ? "↔ " + argent(f.montant) : argent(f.type === "revenu" ? f.montant : -f.montant, { signe: true })) + "</td>" +
      '<td class="num dim">' + esc(argent(mensualiteMoyenne(f))) + "</td>" +
      '<td class="dim">' + (s ? esc(libelleDate(s.date, true)) : '<span class="faible">—</span>') + "</td>" +
      '<td class="num dim">' + esc(argent(totalHorizon.get(f.id) || 0)) + "</td>" +
      '<td class="num" style="white-space:nowrap">' +
        '<button class="btn fantome petit" data-act="flux-basculer" data-id="' + esc(f.id) + '" title="' + (f.actif ? "Mettre en pause" : "Réactiver") + '">' + (f.actif ? "⏸" : "▶") + "</button>" +
        '<button class="btn fantome petit" data-act="flux-dupliquer" data-id="' + esc(f.id) + '" title="Dupliquer">⧉</button>' +
        '<button class="btn fantome petit" data-act="flux-supprimer" data-id="' + esc(f.id) + '" title="Supprimer">✕</button></td></tr>';
  }).join("");

  const table = liste.length
    ? '<div class="tableau-boite"><table><thead><tr>' +
      "<th>Flux</th><th>Rythme</th><th class=\"num\">Montant</th><th class=\"num\">Par mois</th><th>Prochaine</th>" +
      '<th class="num">Sur ' + ETAT.parametres.horizon + " mois</th><th></th></tr></thead><tbody>" + lignes + "</tbody></table></div>"
    : '<div class="vide">Aucun flux ne correspond à cette recherche.</div>';

  cible.innerHTML = (ETAT.flux.length ? entete : "") + carte(barreOutils + table);

  const rech = boite("rech");
  if (rech) {
    rech.addEventListener("input", () => {
      ui.recherche = rech.value;
      const pos = rech.selectionStart;
      rendre();
      const neuf = boite("rech");
      if (neuf) { neuf.focus(); neuf.setSelectionRange(pos, pos); }
    });
  }
}

/* ── Projection ───────────────────────────────────────────────────────── */

function rendreProjection(cible, p) {
  // un compte supprimé entre-temps ramène la vue à tous les comptes
  const filtre = compte(ui.compteProjection) ? ui.compteProjection : "";
  const proj = filtre ? projeter({ du: p.du, au: p.au, compteId: filtre }) : p;

  const choixCompte = '<label class="champ" style="max-width:240px"><span class="ttl">Périmètre</span>' +
    '<select data-act="compte-projection"><option value="">Tous les comptes</option>' +
    ETAT.comptes.map((c) => '<option value="' + esc(c.id) + '"' + (filtre === c.id ? " selected" : "") + ">" + esc(c.nom) + "</option>").join("") +
    "</select></label>";

  const lignes = proj.mois.map((m) => {
    const ouvert = ui.moisOuverts.has(m.cle);
    let html = '<tr class="cliquable" data-act="mois-detail" data-cle="' + m.cle + '">' +
      "<td>" + (m.operations.length ? '<span class="faible">' + (ouvert ? "▾" : "▸") + "</span> " : "&nbsp;&nbsp;&nbsp;") + esc(libelleMois(m.cle)) + "</td>" +
      '<td class="num pos">' + (m.revenus ? esc(argent(m.revenus)) : '<span class="faible">—</span>') + "</td>" +
      '<td class="num neg">' + (m.depenses ? esc(argent(m.depenses)) : '<span class="faible">—</span>') + "</td>" +
      '<td class="num ' + (m.net >= 0 ? "pos" : "neg") + '" style="font-weight:600">' + esc(argent(m.net, { signe: true })) + "</td>" +
      '<td class="num" style="font-weight:600' + (m.soldeFin < 0 ? ";color:var(--depense-texte)" : "") + '">' + esc(argent(m.soldeFin)) + "</td>" +
      '<td class="num dim">' + esc(argent(m.soldeMin)) + "</td></tr>";
    if (ouvert && m.operations.length) {
      html += '<tr class="repli"><td colspan="6"><div style="padding:6px 10px 10px"><table>' +
        m.operations.map((op) =>
          "<tr><td style=\"width:88px\" class=\"dim\">" + esc(libelleDate(op.date, true)) + "</td>" +
          "<td><i class=\"puce\" style=\"background:" + teinte(categorie(op.categorieId) ? categorie(op.categorieId).teinte : 1) + "\"></i>" + esc(op.libelle) + "</td>" +
          '<td class="dim">' + esc(contexteOperation(op)) + "</td>" +
          '<td class="num">' + montantOperation(op) + "</td>" +
          '<td class="num dim">' + esc(argent(op.solde)) + "</td></tr>").join("") +
        "</table></div></td></tr>";
    }
    return html;
  }).join("");

  const total = '<tr class="total"><td>Total sur ' + proj.nbMois + " mois</td>" +
    '<td class="num pos">' + esc(argent(proj.totaux.revenus)) + "</td>" +
    '<td class="num neg">' + esc(argent(proj.totaux.depenses)) + "</td>" +
    '<td class="num ' + (proj.totaux.net >= 0 ? "pos" : "neg") + '">' + esc(argent(proj.totaux.net, { signe: true })) + "</td>" +
    '<td class="num">' + esc(argent(proj.soldeFinal)) + "</td><td></td></tr>";

  cible.innerHTML =
    carte('<div class="rangee" style="align-items:flex-end">' + choixCompte +
      '<div style="margin-left:auto" class="rangee">' +
      '<button class="btn" data-act="export-csv">Exporter en CSV</button>' +
      '<button class="btn" data-act="tout-replier">' + (ui.moisOuverts.size ? "Tout replier" : "Tout déplier") + "</button></div></div>" +
      '<div id="g-proj" style="margin-top:14px"></div>',
      { titre: "Trajectoire du solde", sous: filtre ? "Compte « " + nomCompte(filtre) + " » seul." : "Tous comptes confondus." }) +
    carte('<div class="tableau-boite"><table><thead><tr><th>Mois</th><th class="num">Revenus</th><th class="num">Dépenses</th>' +
      '<th class="num">Net</th><th class="num">Solde fin de mois</th><th class="num">Point bas</th></tr></thead>' +
      "<tbody>" + lignes + total + "</tbody></table></div>",
      { titre: "Mois par mois", sous: "Cliquez une ligne pour voir le détail des opérations du mois." });

  grapheCourbes(boite("g-proj"), [{ nom: "Solde", couleur: "var(--epargne)", points: proj.points, remplir: true }],
    { seuil: filtre ? 0 : ETAT.parametres.seuilAlerte, hauteur: 260 });
}

/* ── Catégories ───────────────────────────────────────────────────────── */

function rendreCategories(cible, p) {
  const env = enveloppes(p);
  const totalDep = env.reduce((s, e) => s + e.mensuel, 0);
  const parts = env.filter((e) => e.mensuel > 0).map((e) => ({
    nom: e.categorie.nom, valeur: e.mensuel, couleur: teinte(e.categorie.teinte),
  }));

  const lignesDep = env.map((e) => {
    const c = e.categorie;
    const depassement = e.ratio !== null && e.ratio > 1;
    return '<tr><td><i class="puce" style="background:' + teinte(c.teinte) + '"></i>' + esc(c.nom) + "</td>" +
      '<td class="num">' + esc(argent(e.mensuel)) + '<div class="faible" style="font-size:11.5px">par mois</div></td>' +
      '<td class="num dim">' + esc(argent(e.total)) + "</td>" +
      '<td class="num dim">' + (totalDep ? esc(pourcent((e.mensuel / totalDep) * 100, 1)) : "—") + "</td>" +
      '<td style="min-width:150px">' +
        (e.plafond
          ? '<div class="jauge"><i style="width:' + Math.min(100, (e.ratio || 0) * 100).toFixed(1) + "%;background:" +
            (depassement ? "var(--depense)" : "var(--revenu)") + '"></i></div>' +
            '<div style="font-size:12px;margin-top:3px" class="' + (depassement ? "neg" : "dim") + '">' +
            esc(argent(e.plafond)) + " · " + esc(argent(e.ecart, { signe: true })) + "</div>"
          : '<span class="faible" style="font-size:12.5px">aucun plafond</span>') + "</td>" +
      '<td class="num" style="white-space:nowrap">' +
        '<button class="btn fantome petit" data-act="cat-editer" data-id="' + esc(c.id) + '">Modifier</button>' +
        '<button class="btn fantome petit" data-act="cat-supprimer" data-id="' + esc(c.id) + '" title="Supprimer">✕</button></td></tr>';
  }).join("");

  const revenusCats = ETAT.categories.filter((c) => c.type === "revenu").map((c) => {
    const e = p.parCategorie.get(c.id);
    const total = e ? e.total : 0;
    return '<tr><td><i class="puce" style="background:' + teinte(c.teinte) + '"></i>' + esc(c.nom) + "</td>" +
      '<td class="num">' + esc(argent(total / p.nbMois)) + "</td>" +
      '<td class="num dim">' + esc(argent(total)) + "</td>" +
      '<td class="num"><button class="btn fantome petit" data-act="cat-editer" data-id="' + esc(c.id) + '">Modifier</button>' +
      '<button class="btn fantome petit" data-act="cat-supprimer" data-id="' + esc(c.id) + '">✕</button></td></tr>';
  }).join("");

  const depassees = env.filter((e) => e.ratio !== null && e.ratio > 1);
  const alerte = depassees.length
    ? '<div class="bandeau ambre" style="margin-bottom:14px"><span class="ic">◉</span><div><b>' + depassees.length +
      (depassees.length > 1 ? " enveloppes dépassées" : " enveloppe dépassée") + "</b> — " +
      esc(depassees.map((e) => e.categorie.nom + " (" + argent(e.ecart, { signe: true }) + ")").join(", ")) +
      " par rapport au plafond mensuel que vous avez fixé.</div></div>"
    : "";

  cible.innerHTML = alerte +
    carte('<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center">' +
      '<div id="g-cat"></div><div style="flex:1;min-width:200px">' +
      parts.slice(0, 8).map((x) => '<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:13.5px">' +
        '<span><i class="puce" style="background:' + x.couleur + '"></i>' + esc(x.nom) + "</span>" +
        '<span class="mono dim">' + esc(argent(x.valeur)) + "/mois</span></div>").join("") +
      "</div></div>",
      { titre: "Répartition mensuelle moyenne", sous: "Moyenne sur l'horizon : les charges annuelles y sont lissées." }) +
    carte('<div class="tableau-boite"><table><thead><tr><th>Catégorie de dépense</th><th class="num">Par mois</th>' +
      '<th class="num">Sur ' + ETAT.parametres.horizon + ' mois</th><th class="num">Part</th><th>Enveloppe</th><th></th></tr></thead>' +
      "<tbody>" + lignesDep + "</tbody></table></div>" +
      '<div class="rangee" style="margin-top:12px"><button class="btn" data-act="cat-nouvelle" data-type="depense">+ Catégorie de dépense</button></div>',
      { titre: "Enveloppes", sous: "Un plafond mensuel par catégorie ; la barre compare la moyenne projetée à ce plafond." }) +
    carte('<div class="tableau-boite"><table><thead><tr><th>Catégorie de revenu</th><th class="num">Par mois</th>' +
      '<th class="num">Sur ' + ETAT.parametres.horizon + " mois</th><th></th></tr></thead><tbody>" + revenusCats + "</tbody></table></div>" +
      '<div class="rangee" style="margin-top:12px"><button class="btn" data-act="cat-nouvelle" data-type="revenu">+ Catégorie de revenu</button></div>',
      { titre: "Revenus par catégorie" });

  grapheAnneau(boite("g-cat"), parts, { legende: "par mois" });
}

/* ── Objectifs ────────────────────────────────────────────────────────── */

function rendreObjectifs(cible, p) {
  if (!ETAT.objectifs.length) {
    cible.innerHTML = carte('<div class="vide"><p>Aucun objectif. Un objectif, c\'est un montant et une date : ' +
      "l'application dit alors si votre trajectoire y mène, et ce qu'il faudrait mettre de côté chaque mois sinon.</p>" +
      '<button class="btn primaire" data-act="obj-nouveau">Ajouter un objectif</button></div>', { titre: "Objectifs d'épargne" });
    return;
  }

  const cartes = ETAT.objectifs.map((o) => {
    const e = evaluerObjectif(o, p);
    const couleur = teinte(o.teinte);
    const verdicts = {
      atteint: ['<span class="etiquette rev">Atteint</span>', "Au rythme projeté, l'objectif est dépassé de " + argent(-e.manque) + " à la date visée."],
      juste: ['<span class="etiquette">De justesse</span>', "Il manquerait " + argent(e.manque) + ", soit " + argent(e.effortMensuel) + " de plus par mois."],
      insuffisant: ['<span class="etiquette dep">Hors d\'atteinte</span>', "Il manquerait " + argent(e.manque) + " — soit " + argent(e.effortMensuel) + " de plus chaque mois pendant " + nombre(e.moisRestants) + " mois."],
      "hors-horizon": ['<span class="etiquette">Au-delà de l\'horizon</span>', "La date visée dépasse la fenêtre de projection ; allongez l'horizon pour l'évaluer."],
      echu: ['<span class="etiquette">Échue</span>', "La date visée est passée."],
    };
    const [badge, phrase] = verdicts[e.verdict] || verdicts.insuffisant;

    return carte(
      '<div class="carte-tete"><h3>' + esc(o.nom) + "</h3><div class=\"droite\">" + badge + "</div></div>" +
      '<div class="rangee" style="gap:6px;margin:2px 0 10px"><span class="chiffre" style="font-size:24px;font-weight:700;color:' + couleur + '">' +
      esc(argent(e.projete === null ? e.actuel : e.projete)) + '</span><span class="dim">sur ' + esc(argent(o.cible)) +
      ' visés pour le ' + esc(libelleDate(o.dateCible)) + "</span></div>" +
      '<div class="jauge" style="height:9px"><i style="width:' + (e.progression * 100).toFixed(1) + "%;background:" + couleur + '"></i></div>' +
      '<div class="rangee" style="justify-content:space-between;margin-top:6px;font-size:12.5px">' +
      '<span class="dim">Aujourd\'hui ' + esc(argent(e.actuel)) + " · " + esc(pourcent(e.progressionActuelle * 100, 0)) + "</span>" +
      '<span class="dim">' + esc(nombre(e.moisRestants)) + " mois restants</span></div>" +
      '<p class="sous" style="margin:10px 0 0">' + esc(phrase) + "</p>" +
      '<div class="rangee fin" style="margin-top:8px">' +
      '<button class="btn fantome petit" data-act="obj-editer" data-id="' + esc(o.id) + '">Modifier</button>' +
      '<button class="btn fantome petit" data-act="obj-supprimer" data-id="' + esc(o.id) + '">Supprimer</button></div>');
  }).join("");

  cible.innerHTML = '<div class="grille g2">' + cartes + "</div>" +
    '<div class="rangee"><button class="btn primaire" data-act="obj-nouveau">+ Nouvel objectif</button></div>';
}

/* ── Scénarios ────────────────────────────────────────────────────────── */

function rendreScenarios(cible, p) {
  const actifs = ETAT.scenarios.filter((s) => s.actif);
  const series = [{ nom: "Référence", couleur: "var(--epargne)", points: p.points, remplir: true, epaisseur: 2.4 }];
  const projections = new Map();
  for (const s of actifs) {
    const pr = projeterScenario(s, p.du, p.au);
    projections.set(s.id, pr);
    series.push({ nom: s.nom, couleur: teinte(s.teinte), points: pr.points, pointille: true });
  }

  const lignes = ETAT.scenarios.map((s) => {
    const pr = projections.get(s.id) || projeterScenario(s, p.du, p.au);
    const ecart = arrondi2(pr.soldeFinal - p.soldeFinal);
    const modifs = [];
    if (s.ajustRevenus) modifs.push("revenus " + (s.ajustRevenus > 0 ? "+" : "−") + nombre(Math.abs(s.ajustRevenus), 1) + " %");
    if (s.ajustDepenses) modifs.push("dépenses " + (s.ajustDepenses > 0 ? "+" : "−") + nombre(Math.abs(s.ajustDepenses), 1) + " %");
    if (s.exclus.length) modifs.push(s.exclus.length + (s.exclus.length > 1 ? " flux retirés" : " flux retiré"));
    if (s.extras.length) modifs.push(s.extras.length + (s.extras.length > 1 ? " flux ajoutés" : " flux ajouté"));
    if (s.soldeDelta) modifs.push("solde de départ " + argent(s.soldeDelta, { signe: true }));

    return "<tr><td><label class=\"case\"><input type=\"checkbox\" data-act=\"scn-basculer\" data-id=\"" + esc(s.id) + "\"" + (s.actif ? " checked" : "") + ">" +
      '<span><i class="puce" style="background:' + teinte(s.teinte) + '"></i>' + esc(s.nom) + "</span></label>" +
      '<div class="faible" style="font-size:12.5px;padding-left:26px">' + esc(modifs.join(" · ") || "aucune modification") + "</div></td>" +
      '<td class="num">' + esc(argent(pr.soldeFinal)) + "</td>" +
      '<td class="num ' + (ecart >= 0 ? "pos" : "neg") + '" style="font-weight:600">' + esc(argent(ecart, { signe: true })) + "</td>" +
      '<td class="num ' + (pr.totaux.netMensuel >= 0 ? "pos" : "neg") + '">' + esc(argent(pr.totaux.netMensuel, { signe: true })) + "</td>" +
      "<td class=\"dim\">" + (pr.alerte.dateDecouvert ? '<span class="neg">découvert le ' + esc(libelleDate(pr.alerte.dateDecouvert, true)) + "</span>" : "jamais à découvert") + "</td>" +
      '<td class="num" style="white-space:nowrap">' +
      '<button class="btn fantome petit" data-act="scn-editer" data-id="' + esc(s.id) + '">Modifier</button>' +
      '<button class="btn fantome petit" data-act="scn-supprimer" data-id="' + esc(s.id) + '">✕</button></td></tr>';
  }).join("");

  cible.innerHTML =
    carte('<div id="g-scn"></div><div class="legende">' +
      series.map((s) => '<span><i class="puce" style="background:' + s.couleur + '"></i>' + esc(s.nom) + "</span>").join("") + "</div>",
      { titre: "Trajectoires comparées",
        sous: "La référence en trait plein, les scénarios en pointillés. Un scénario ne modifie jamais vos flux : il les rejoue autrement." }) +
    carte(ETAT.scenarios.length
      ? '<div class="tableau-boite"><table><thead><tr><th>Scénario</th><th class="num">Solde à l\'horizon</th>' +
        '<th class="num">Écart</th><th class="num">Reste par mois</th><th>Découvert</th><th></th></tr></thead><tbody>' +
        '<tr class="total"><td>Référence — vos flux tels quels</td><td class="num">' + esc(argent(p.soldeFinal)) + "</td>" +
        '<td class="num dim">—</td><td class="num">' + esc(argent(p.totaux.netMensuel, { signe: true })) + "</td>" +
        "<td class=\"dim\">" + (p.alerte.dateDecouvert ? '<span class="neg">le ' + esc(libelleDate(p.alerte.dateDecouvert, true)) + "</span>" : "jamais") + "</td><td></td></tr>" +
        lignes + "</tbody></table></div>"
      : '<div class="vide">Aucun scénario. Un scénario répond à « et si… » : et si je déménageais, et si je perdais 20 % de revenus, et si je coupais les abonnements ?</div>') +

  grapheCourbes(boite("g-scn"), series, { seuil: ETAT.parametres.seuilAlerte, hauteur: 300 });
}

    '<th class="num">Solde à l\'horizon</th><th class="num">Variation</th><th></th></tr></thead><tbody>' + lignes + "</tbody></table></div>" +

    { titre: "Comptes",

/* ══════════════════════════════════════════════════════════════════════
   10. Dialogues
   ══════════════════════════════════════════════════════════════════════ */

function ouvrirDialogue(titre, corpsHTML, boutons, apres) {
  boite("dialogue-titre").textContent = titre;
  // le corps est remplacé par un clone vide : les écouteurs posés par le
  // dialogue précédent partent avec l'ancien nœud, et ne s'empilent pas
  const ancien = boite("dialogue-corps");
  const neuf = ancien.cloneNode(false);
  ancien.replaceWith(neuf);
  neuf.innerHTML = corpsHTML;
  const pied = boite("dialogue-pied");
  pied.innerHTML = "";
  for (const b of boutons || []) {
    const el = document.createElement("button");
    el.className = "btn " + (b.classe || "") + (b.gauche ? " gauche" : "");
    el.textContent = b.texte;
    el.addEventListener("click", () => b.action && b.action());
    pied.appendChild(el);
  }
  boite("voile").classList.remove("masque");
  if (apres) apres();
  const premier = boite("dialogue-corps").querySelector("input, select, textarea");
  if (premier) premier.focus();
}

function fermerDialogue() {
  boite("voile").classList.add("masque");
  boite("dialogue-corps").innerHTML = "";
}

function confirmer(titre, texte, libelleAction, action) {
  ouvrirDialogue(titre, '<p class="sous" style="margin:0">' + esc(texte) + "</p>", [
    { texte: "Annuler", action: fermerDialogue },
    { texte: libelleAction, classe: "danger", action: () => { fermerDialogue(); action(); } },
  ]);
}

function optionsCategories(type, choisie) {
  return ETAT.categories.filter((c) => c.type === type)
    .map((c) => '<option value="' + esc(c.id) + '"' + (c.id === choisie ? " selected" : "") + ">" + esc(c.nom) + "</option>").join("");
}

function optionsComptes(choisi) {
  return ETAT.comptes.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === choisi ? " selected" : "") + ">" + esc(c.nom) + "</option>").join("");
}

/* ── Formulaire d'un flux ─────────────────────────────────────────────── */

function formulaireFlux(flux) {
  const f = flux || {
    id: null, libelle: "", type: "depense", montant: "", categorieId: null, compteId: ETAT.comptes[0].id,
    compteDest: null, frequence: "mensuel", debut: aujourdhui(), fin: null, indexation: 0, actif: true, note: "",
  };
  const plusieursComptes = ETAT.comptes.length > 1;

  const corps =
    '<div class="segments" id="f-type">' +
    '<button data-v="depense" class="' + (f.type === "depense" ? "on" : "") + '">Dépense</button>' +
    '<button data-v="revenu" class="' + (f.type === "revenu" ? "on" : "") + '">Revenu</button>' +
    (plusieursComptes ? '<button data-v="virement" class="' + (f.type === "virement" ? "on" : "") + '">Virement entre comptes</button>' : "") +
    "</div>" +
    '<div class="ligne-champs">' +
    '<label class="champ"><span class="ttl">Libellé</span><input type="text" id="f-libelle" maxlength="60" value="' + esc(f.libelle) + '" placeholder="Loyer, salaire, assurance…"></label>' +
    '<label class="champ"><span class="ttl">Montant</span><input type="number" id="f-montant" min="0" step="0.01" value="' + esc(f.montant) + '" placeholder="0"></label>' +
    '<label class="champ" id="f-bloc-categorie"' + (f.type === "virement" ? ' style="display:none"' : "") + '><span class="ttl">Catégorie</span><select id="f-categorie">' +
      optionsCategories(f.type === "virement" ? "depense" : f.type, f.categorieId) + "</select></label>" +
    '<label class="champ"><span class="ttl" id="f-titre-compte">' + (f.type === "virement" ? "Depuis le compte" : "Compte") + '</span><select id="f-compte">' + optionsComptes(f.compteId) + "</select></label>" +
    '<label class="champ" id="f-bloc-dest"' + (f.type === "virement" ? "" : ' style="display:none"') + '><span class="ttl">Vers le compte</span><select id="f-compte-dest">' +
      optionsComptes(f.compteDest) + "</select>" +
      '<span class="aide">Ce qui sort d\'un compte entre sur l\'autre : votre patrimoine total ne bouge pas.</span></label>' +
    '<label class="champ"><span class="ttl">Rythme</span><select id="f-frequence">' +
    FREQUENCES.map((x) => '<option value="' + x.id + '"' + (f.frequence === x.id ? " selected" : "") + ">" + esc(x.nom) + "</option>").join("") +
    "</select></label>" +
    '<label class="champ"><span class="ttl">Première échéance</span><input type="date" id="f-debut" value="' + esc(f.debut) + '"></label>' +
    "</div>" +
    '<div class="ligne-champs">' +
    '<label class="champ"><span class="ttl">Dernière échéance <span class="faible">(facultatif)</span></span>' +
    '<input type="date" id="f-fin" value="' + esc(f.fin || "") + '">' +
    '<span class="aide">Un crédit qui se termine, un contrat qui expire.</span></label>' +
    '<label class="champ"><span class="ttl">Revalorisation annuelle</span>' +
    '<input type="number" id="f-indexation" step="0.1" min="-50" max="50" value="' + esc(f.indexation) + '">' +
    '<span class="aide">En % par an, appliqué à chaque date anniversaire. Loyer +2, énergie +4…</span></label>' +
    "</div>" +
    '<label class="champ"><span class="ttl">Note <span class="faible">(facultatif)</span></span>' +
    '<textarea id="f-note" maxlength="300" rows="2">' + esc(f.note) + "</textarea></label>" +
    '<label class="case"><input type="checkbox" id="f-actif"' + (f.actif ? " checked" : "") + "> Flux actif (décochez pour le mettre en pause sans le supprimer)</label>" +
    '<div class="sep"></div>' +
    '<details><summary style="cursor:pointer;font-size:13.5px;color:var(--attenue)">Calculer une mensualité de prêt</summary>' +
    '<div class="ligne-champs trois" style="margin-top:10px">' +
    '<label class="champ"><span class="ttl">Capital emprunté</span><input type="number" id="p-capital" min="0" step="100" placeholder="15000"></label>' +
    '<label class="champ"><span class="ttl">Taux annuel (%)</span><input type="number" id="p-taux" min="0" step="0.01" placeholder="3,5"></label>' +
    '<label class="champ"><span class="ttl">Durée (mois)</span><input type="number" id="p-duree" min="1" step="1" placeholder="48"></label>' +
    "</div>" +
    '<div class="rangee" style="margin-top:10px"><button class="btn petit" id="p-calc" type="button">Reporter dans le formulaire</button>' +
    '<span class="faible" id="p-resultat" style="font-size:13px"></span></div>' +
    '<p class="sous" style="margin:8px 0 0">Le montant et la dernière échéance sont remplis à partir de la formule d\'annuité constante.</p></details>';

  const lire = () => {
    const type = boite("dialogue-corps").querySelector("#f-type .on").dataset.v;
    return {
      id: f.id || identifiant("flx"),
      libelle: boite("f-libelle").value.trim(),
      type,
      montant: Number(boite("f-montant").value.replace(",", ".")),
      categorieId: boite("f-categorie").value,
      compteId: boite("f-compte").value,
      compteDest: boite("f-compte-dest").value,
      frequence: boite("f-frequence").value,
      debut: boite("f-debut").value,
      fin: boite("f-fin").value || null,
      indexation: Number(boite("f-indexation").value.replace(",", ".")) || 0,
      actif: boite("f-actif").checked,
      note: boite("f-note").value.trim(),
    };
  };

  const brancher = () => {
    // un virement ne peut pas arriver sur son compte de départ : la
    // destination se déplace d'elle-même quand la source vient l'occuper
    const ajusterDestination = () => {
      const dest = boite("f-compte-dest");
      if (dest.value !== boite("f-compte").value) return;
      const autre = Array.from(dest.options).find((o) => o.value !== boite("f-compte").value);
      if (autre) dest.value = autre.value;
    };
    boite("f-compte").addEventListener("change", ajusterDestination);
    if (f.type === "virement") ajusterDestination();

    // le choix du type refiltre les catégories proposées
    boite("dialogue-corps").querySelectorAll("#f-type button").forEach((b) => {
      b.addEventListener("click", () => {
        boite("dialogue-corps").querySelectorAll("#f-type button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        const virement = b.dataset.v === "virement";
        boite("f-bloc-categorie").style.display = virement ? "none" : "";
        boite("f-bloc-dest").style.display = virement ? "" : "none";
        boite("f-titre-compte").textContent = virement ? "Depuis le compte" : "Compte";
        if (virement) ajusterDestination();
        else boite("f-categorie").innerHTML = optionsCategories(b.dataset.v, null);
      });
    });
    boite("p-calc").addEventListener("click", () => {
      const capital = Number(boite("p-capital").value.replace(",", "."));
      const taux = Number(boite("p-taux").value.replace(",", ".")) || 0;
      const duree = Math.round(Number(boite("p-duree").value));
      if (!(capital > 0) || !(duree > 0)) { boite("p-resultat").textContent = "Capital et durée sont nécessaires."; return; }
      const m = mensualitePret(capital, taux, duree);
      boite("f-montant").value = m;
      boite("f-frequence").value = "mensuel";
      const debut = boite("f-debut").value || aujourdhui();
      boite("f-fin").value = ajouterMois(debut, duree - 1);
      boite("p-resultat").textContent = nombre(duree) + " mensualités de " + argent(m) + " — coût total " +
        argent(arrondi2(m * duree)) + ", dont " + argent(arrondi2(m * duree - capital)) + " d'intérêts.";
    });
  };

  return { corps, lire, brancher, existant: !!flux };
}

function ouvrirFlux(id) {
  const flux = id ? ETAT.flux.find((f) => f.id === id) : null;
  const form = formulaireFlux(flux);
  const boutons = [];
  if (flux) {
    boutons.push({ texte: "Supprimer", classe: "danger gauche", action: () => { fermerDialogue(); supprimerFlux(flux.id); } });
    boutons.push({ texte: "Dupliquer", action: () => { fermerDialogue(); dupliquerFlux(flux.id); } });
  }
  boutons.push({ texte: "Annuler", action: fermerDialogue });
  boutons.push({
    texte: flux ? "Enregistrer" : "Ajouter", classe: "primaire",
    action: () => {
      const brut = form.lire();
      if (!brut.libelle) { message("Donnez un libellé à ce flux."); return; }
      if (!(brut.montant >= 0)) { message("Le montant doit être un nombre positif."); return; }
      if (!estIso(brut.debut)) { message("La date de première échéance est invalide."); return; }
      if (brut.type === "virement" && brut.compteId === brut.compteDest) {
        message("Un virement va d'un compte vers un autre."); return;
      }
      modifier(() => {
        const propre = normaliserFlux(brut, 0, ETAT.comptes, ETAT.categories);
        const i = ETAT.flux.findIndex((f) => f.id === brut.id);
        if (i >= 0) ETAT.flux[i] = propre; else ETAT.flux.push(propre);
      });
      fermerDialogue();
      message(flux ? "Flux mis à jour." : "Flux ajouté.");
    },
  });
  ouvrirDialogue(flux ? "Modifier un flux" : "Nouveau flux", form.corps, boutons, form.brancher);
}

function supprimerFlux(id) {
  const f = ETAT.flux.find((x) => x.id === id);
  if (!f) return;
  confirmer("Supprimer ce flux ?", "« " + f.libelle + " » disparaîtra de la projection. Cette action ne peut pas être annulée.",
    "Supprimer", () => {
      modifier(() => {
        ETAT.flux = ETAT.flux.filter((x) => x.id !== id);
        for (const s of ETAT.scenarios) s.exclus = s.exclus.filter((x) => x !== id);
      });
      message("Flux supprimé.");
    });
}

function dupliquerFlux(id) {
  const f = ETAT.flux.find((x) => x.id === id);
  if (!f) return;
  modifier(() => {
    const copie = Object.assign({}, f, { id: identifiant("flx"), libelle: f.libelle + " (copie)" });
    ETAT.flux.splice(ETAT.flux.indexOf(f) + 1, 0, copie);
  });
  message("Flux dupliqué.");
}

/* ── Compte, catégorie, objectif ──────────────────────────────────────── */

function ouvrirCompte(id) {
  const c = id ? compte(id) : null;
  const corps = '<div class="ligne-champs">' +
    '<label class="champ"><span class="ttl">Nom</span><input type="text" id="c-nom" maxlength="40" value="' + esc(c ? c.nom : "") + '" placeholder="Compte courant"></label>' +
    '<label class="champ"><span class="ttl">Solde d\'aujourd\'hui</span><input type="number" id="c-solde" step="0.01" value="' + esc(c ? c.solde : 0) + '"></label>' +
    '<label class="champ"><span class="ttl">Type</span><select id="c-type">' +
    '<option value="courant"' + (c && c.type === "courant" ? " selected" : "") + ">Compte courant</option>" +
    '<option value="epargne"' + (c && c.type === "epargne" ? " selected" : "") + ">Épargne</option></select></label>" +
    '<label class="champ"><span class="ttl">Couleur</span><select id="c-teinte">' +
    Array.from({ length: TEINTES_MAX }, (_, i) => '<option value="' + (i + 1) + '"' + (c && c.teinte === i + 1 ? " selected" : "") + ">Teinte " + (i + 1) + "</option>").join("") +
    "</select></label></div>";

  ouvrirDialogue(c ? "Modifier le compte" : "Nouveau compte", corps, [
    { texte: "Annuler", action: fermerDialogue },
    {
      texte: c ? "Enregistrer" : "Ajouter", classe: "primaire", action: () => {
        const nom = boite("c-nom").value.trim();
        if (!nom) { message("Donnez un nom à ce compte."); return; }
        modifier(() => {
          const propre = normaliserCompte({
            id: c ? c.id : identifiant("cpt"), nom,
            solde: Number(boite("c-solde").value.replace(",", ".")),
            type: boite("c-type").value, teinte: Number(boite("c-teinte").value),

function supprimerCompte(id) {
  if (ETAT.comptes.length <= 1) { message("Il faut au moins un compte."); return; }
  const c = compte(id);
  const rattaches = ETAT.flux.filter((f) => f.compteId === id);
  confirmer("Supprimer « " + c.nom + " » ?",
    rattaches.length
      ? rattaches.length + (rattaches.length > 1 ? " flux seront rattachés" : " flux sera rattaché") + " au compte « " +
        ETAT.comptes.find((x) => x.id !== id).nom + " »."
      : "Ce compte n'a aucun flux rattaché.",
    "Supprimer", () => {
      modifier(() => {
        const remplacant = ETAT.comptes.find((x) => x.id !== id);
        for (const f of ETAT.flux) if (f.compteId === id) f.compteId = remplacant.id;
        for (const o of ETAT.objectifs) if (o.compteId === id) o.compteId = null;
        ETAT.comptes = ETAT.comptes.filter((x) => x.id !== id);

/* Certains hôtes n'autorisent pas une page à déclencher un téléchargement
   elle-même et le prennent en charge, en demandant confirmation au lecteur.
   On leur pose la question une fois, à la première exportation. */
let _hoteFichiers = null;

function hoteDeTelechargement() {
  if (!_hoteFichiers) {
    _hoteFichiers = (typeof window !== "undefined" && window.claude && typeof window.claude.use === "function")
      ? Promise.resolve(window.claude.use("downloads")).catch(() => null)
      : Promise.resolve(null);
  }
  return _hoteFichiers;
}

function telecharger(nom, contenu, type, reussite) {
  hoteDeTelechargement().then((hote) => {
    if (hote) {
      return hote.save({ filename: nom, data: contenu }).then(
        () => message(reussite),
        (erreur) => {
          // un refus du lecteur n'est pas une erreur : il a dit non
          if (erreur && erreur.code === "declined") return;
          message("Enregistrement impossible depuis cette page.");
        }
      );
    }
    const blob = new Blob([contenu], { type: type + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    message(reussite);
  });
}

function nomFichier(extension) {
  const t = ETAT.parametres.titre.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "budget";
  return t + "-" + aujourdhui() + "." + extension;
}

function exporterJson() {
  telecharger(nomFichier("json"), JSON.stringify(ETAT, null, 2), "application/json",
    ETAT.flux.length + (ETAT.flux.length > 1 ? " flux exportés." : " flux exporté."));
}

function exporterCsv(projection) {
  const sep = ";";
  const echappe = (v) => {
    const s = String(v === null || v === undefined ? "" : v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lignes = [["Date", "Libellé", "Type", "Catégorie", "Compte", "Montant", "Solde projeté"].join(sep)];
  for (const op of projection.operations) {
    lignes.push([
      op.date, op.libelle, op.montant >= 0 ? "Revenu" : "Dépense",
      nomCategorie(op.categorieId), nomCompte(op.compteId),
      String(op.montant).replace(".", ","), String(op.solde).replace(".", ","),
    ].map(echappe).join(sep));
  }
  // le BOM évite qu'un tableur ouvre les accents de travers
  telecharger(nomFichier("csv"), "﻿" + lignes.join("\r\n"), "text/csv",
    projection.operations.length + " opérations exportées.");
}

function importerJson() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.addEventListener("change", () => {
    const fichier = input.files && input.files[0];
    if (!fichier) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      let brut;
      try { brut = JSON.parse(String(lecteur.result)); }
      catch (e) { message("Ce fichier n'est pas un JSON valide."); return; }
      const propre = normaliser(brut);
      confirmer("Remplacer vos données ?",
        "Le fichier contient " + propre.flux.length + " flux, " + propre.comptes.length + " comptes et " +
        propre.objectifs.length + " objectifs. Vos données actuelles seront écrasées.",
        "Importer", () => {
          ETAT = propre;
          enregistrerEtat();
          rendre();
          message("Données importées.");
        });
    };
    lecteur.readAsText(fichier);
  });
  input.click();
}

function rendre() {
  PROJECTION = projeter({});

  boite("pilule-solde-val").textContent = argent(PROJECTION.soldeInitial);
  const fin = boite("pilule-fin-val");
  fin.textContent = argent(PROJECTION.soldeFinal);

    : (PROJECTION.alerte.dateSousSeuil ? "var(--alerte-texte)" : "");
  boite("pilule-fin-etiq").textContent = ETAT.parametres.horizon % 12 === 0
    ? "Dans " + (ETAT.parametres.horizon / 12) + (ETAT.parametres.horizon === 12 ? " an" : " ans")
    : "Dans " + ETAT.parametres.horizon + " mois";
  boite("sel-horizon").value = String(ETAT.parametres.horizon);
  document.title = ETAT.parametres.titre + " — Prévoyant";

  for (const v of VUES) {
    const section = boite("vue-" + v);
    section.classList.toggle("masque", v !== vueActive);
  }
  document.querySelectorAll("#onglets button").forEach((b) => {
    b.classList.toggle("on", b.dataset.vue === vueActive);
  });

  const cible = boite("vue-" + vueActive);
  const rendus = {
    tableau: rendreTableau, flux: rendreFlux, projection: rendreProjection,
    categories: rendreCategories, objectifs: rendreObjectifs, scenarios: rendreScenarios,
    comptes: rendreComptes, reglages: rendreReglages,
  };
  rendus[vueActive](cible, PROJECTION);
}

function allerA(vue) {
  if (!VUES.includes(vue)) return;
  vueActive = vue;
  if (location.hash.slice(1) !== vue) location.hash = vue;
  rendre();
  window.scrollTo({ top: 0, behavior: "instant" });
}

/**
 * Le thème est porté par `data-theme` sur la racine, aux valeurs que pose
 * n'importe quel hôte : `light` ou `dark`.
 *
 * Au démarrage (`initial`), « automatique » ne retire rien : si la page est
 * servie dans un cadre qui a déjà posé l'attribut, c'est le choix du lecteur,
 * et l'effacer le trahirait. Seul un choix explicite dans les réglages
 * écrase ce que l'hôte a posé.
 */
function appliquerTheme(valeur, initial) {
  if (valeur === "auto") {
    if (!initial) document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", valeur);
  }
  if (!initial) ecrireLocal(CLE_THEME, valeur);
}

  "scn-editer": (b) => ouvrirScenario(b.dataset.id),
  "scn-supprimer": (b) => {
    const s = ETAT.scenarios.find((x) => x.id === b.dataset.id);
    if (!s) return;
    confirmer("Supprimer « " + s.nom + " » ?", "Vos flux ne sont pas touchés : seul le scénario disparaît.", "Supprimer", () => {
      modifier(() => { ETAT.scenarios = ETAT.scenarios.filter((x) => x.id !== s.id); });
    });
  },
  "scn-basculer": (b) => modifier(() => {
    const s = ETAT.scenarios.find((x) => x.id === b.dataset.id);
    if (s) s.actif = !s.actif;
  }),
  "theme": (b) => { appliquerTheme(b.dataset.v); rendre(); },
  "demo": chargerDemo,
  "raz": toutEffacer,
  "export-json": exporterJson,
  "export-csv": () => exporterCsv(ui.compteProjection
    ? projeter({ du: PROJECTION.du, au: PROJECTION.au, compteId: ui.compteProjection })
    : PROJECTION),
  "import-json": importerJson,
};

function brancherEvenements() {
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.closest("#dialogue-corps")) return;
    const action = ACTIONS[b.dataset.act];
    if (!action) return;
    ev.preventDefault();
    action(b);
  });

  document.addEventListener("change", (ev) => {
    const cible = ev.target;
    if (cible.dataset.act === "compte-projection") {
      ui.compteProjection = cible.value;
      rendre();
    } else if (cible.dataset.act === "param") {
      const cle = cible.dataset.cle;
      modifier(() => {
        if (cle === "horizon") ETAT.parametres.horizon = Number(cible.value);
        else if (cle === "arrondi") ETAT.parametres.arrondi = cible.value === "1";
        else if (cle === "seuilAlerte") ETAT.parametres.seuilAlerte = arrondi2(nombreSur(cible.value, 0, 0));
        else if (cle === "debutProjection") ETAT.parametres.debutProjection = estIso(cible.value) ? cible.value : null;
        else if (cle === "devise") ETAT.parametres.devise = DEVISES[cible.value] ? cible.value : "EUR";
        else if (cle === "titre") ETAT.parametres.titre = texteSur(cible.value, "Mon budget", 60);
        _formats = {};
      });
    }
  });

  boite("sel-horizon").addEventListener("change", (ev) => {
    modifier(() => { ETAT.parametres.horizon = Number(ev.target.value); });
  });

  document.querySelectorAll("#onglets button").forEach((b) => {
    b.addEventListener("click", () => allerA(b.dataset.vue));
  });

  boite("btn-theme").addEventListener("click", () => {
    const ordre = ["auto", "light", "dark"];
    const actuel = lireLocal(CLE_THEME) || "auto";
    const suivant = ordre[(ordre.indexOf(actuel) + 1) % ordre.length];
    appliquerTheme(suivant);
    message("Thème : " + NOMS_THEME[suivant]);
    if (vueActive === "reglages") rendre();
  });

  boite("dialogue-x").addEventListener("click", fermerDialogue);
  boite("voile").addEventListener("mousedown", (ev) => {
    if (ev.target === boite("voile")) fermerDialogue();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !boite("voile").classList.contains("masque")) fermerDialogue();
  });

  window.addEventListener("hashchange", () => {
    const v = location.hash.slice(1);
    if (VUES.includes(v) && v !== vueActive) { vueActive = v; rendre(); }
  });

  // les graphiques sont dessinés à la largeur mesurée : un redimensionnement
  // les rejoue, une fois la fenêtre stabilisée
  let minuterie = null;
  window.addEventListener("resize", () => {
    clearTimeout(minuterie);
    minuterie = setTimeout(rendre, 180);
  });
}

/* ══════════════════════════════════════════════════════════════════════
   13. Démarrage
   ══════════════════════════════════════════════════════════════════════ */

function demarrer() {
  appliquerTheme(lireLocal(CLE_THEME) || "auto", true);

  const dejaVu = chargerEtat();
  if (!dejaVu) {
    // première ouverture : mieux vaut une application vivante qu'une page vide
    ETAT = jeuDemo();
    enregistrerEtat();
    setTimeout(() => message("Budget d'exemple chargé — remplacez les montants par les vôtres."), 400);
  }

  const depart = location.hash.slice(1);
  if (VUES.includes(depart)) vueActive = depart;

  brancherEvenements();
  rendre();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}

if (typeof document !== "undefined" && document.getElementById) {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer);
  else demarrer();
}

/* Le moteur est exposé pour les tests, qui évaluent ce script hors navigateur. */
if (typeof globalThis !== "undefined") {
  globalThis.Prevoyant = {
    normaliser, occurrences, projeter, soldeALaDate, mensualiteMoyenne, mensualitePret,
    evaluerObjectif, enveloppes, fluxDuScenario, projeterScenario, jeuDemo, montantA,
    ajouterMois, ajouterJours, moisEntre, joursEntre, joursDansMois, estIso, cleMois,
    finDeMois, moisSuivant, graduations, arrondi2,
    etat: () => ETAT,
    poserEtat: (e) => { ETAT = normaliser(e); return ETAT; },
    FREQUENCES, VERSION_ETAT,
  };
}
</script>
</body>
