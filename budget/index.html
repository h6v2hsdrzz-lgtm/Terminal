/* Le focus qu'il faudra rendre à la fermeture : sans cela, fermer un
   dialogue renvoie le clavier en haut de page, et il faut tout retraverser. */
let FOCUS_AVANT_DIALOGUE = null;

function focusables(racine) {
  return Array.from(racine.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex]:not([tabindex="-1"])'
  )).filter((n) => n.offsetParent !== null || n === document.activeElement);
}

function ouvrirDialogue(titre, corpsHTML, boutons, apres, classe) {
  if (boite("voile").classList.contains("masque")) FOCUS_AVANT_DIALOGUE = document.activeElement;
  boite("dialogue").classList.toggle("large", classe === "large");
  boite("dialogue-titre").textContent = titre;
  // le corps est remplacé par un clone vide : les écouteurs posés par le
  // dialogue précédent partent avec l'ancien nœud, et ne s'empilent pas
  const ancien = boite("dialogue-corps");
  const neuf = ancien.cloneNode(false);
  ancien.replaceWith(neuf);
  neuf.innerHTML = corpsHTML;
  const pied = boite("dialogue-pied");
  pied.innerHTML = "";
  for (const b of boutons || []) {
    const el = document.createElement("button");
    el.className = "btn " + (b.classe || "") + (b.gauche ? " gauche" : "");
    el.textContent = b.texte;
    el.addEventListener("click", () => b.action && b.action());
    pied.appendChild(el);
  }
  boite("voile").classList.remove("masque");
  if (apres) apres();
  /* Le clavier entre dans le dialogue : d'abord un champ s'il y en a un,
     sinon le premier élément atteignable — sans quoi la tabulation reprend
     en haut de page et le piège ne sert à rien. */
  const premier = boite("dialogue-corps").querySelector("input, select, textarea") ||
    focusables(boite("dialogue"))[0];
  if (premier) premier.focus();
}

function fermerDialogue() {
  boite("voile").classList.add("masque");
  boite("dialogue-corps").innerHTML = "";
  const retour = FOCUS_AVANT_DIALOGUE;
  FOCUS_AVANT_DIALOGUE = null;
  if (retour && retour.focus && document.contains(retour)) retour.focus();
}

function confirmer(titre, texte, libelleAction, action) {
  ouvrirDialogue(titre, '<p class="sous" style="margin:0">' + esc(texte) + "</p>", [
    { texte: "Annuler", action: fermerDialogue },
    { texte: libelleAction, classe: "danger", action: () => { fermerDialogue(); action(); } },
  ]);
}

function optionsCategories(type, choisie) {
  return ETAT.categories.filter((c) => c.type === type)
    .map((c) => '<option value="' + esc(c.id) + '"' + (c.id === choisie ? " selected" : "") + ">" + esc(c.nom) + "</option>").join("");
}

function optionsComptes(choisi) {
  return ETAT.comptes.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === choisi ? " selected" : "") + ">" + esc(c.nom) + "</option>").join("");
}

/* ── Formulaire d'un flux ─────────────────────────────────────────────── */

function formulaireFlux(flux, prereglage) {
  const f = flux || Object.assign({
    id: null, libelle: "", type: "depense", montant: "", categorieId: null, compteId: ETAT.comptes[0].id,
    compteDest: null, frequence: "mensuel", debut: aujourdhui(), fin: null, indexation: 0, actif: true, note: "",
  }, prereglage || {});
  const plusieursComptes = ETAT.comptes.length > 1;

  const corps =
    '<div class="segments" id="f-type">' +
    '<button data-v="depense" class="' + (f.type === "depense" ? "on" : "") + '">Dépense</button>' +
    '<button data-v="revenu" class="' + (f.type === "revenu" ? "on" : "") + '">Revenu</button>' +
    (plusieursComptes ? '<button data-v="virement" class="' + (f.type === "virement" ? "on" : "") + '">Virement entre comptes</button>' : "") +
    "</div>" +
    '<div class="ligne-champs">' +
    '<label class="champ"><span class="ttl">Libellé</span><input type="text" id="f-libelle" maxlength="60" value="' + esc(f.libelle) + '" placeholder="Loyer, salaire, assurance…"></label>' +
    '<label class="champ"><span class="ttl">Montant</span><input type="number" id="f-montant" min="0" step="0.01" value="' + esc(f.montant) + '" placeholder="0"></label>' +
    '<label class="champ" id="f-bloc-categorie"' + (f.type === "virement" ? ' style="display:none"' : "") + '><span class="ttl">Catégorie</span><select id="f-categorie">' +
      optionsCategories(f.type === "virement" ? "depense" : f.type, f.categorieId) + "</select></label>" +
    '<label class="champ"><span class="ttl" id="f-titre-compte">' + (f.type === "virement" ? "Depuis le compte" : "Compte") + '</span><select id="f-compte">' + optionsComptes(f.compteId) + "</select></label>" +
    '<label class="champ" id="f-bloc-dest"' + (f.type === "virement" ? "" : ' style="display:none"') + '><span class="ttl">Vers le compte</span><select id="f-compte-dest">' +
      optionsComptes(f.compteDest) + "</select>" +
      '<span class="aide">Ce qui sort d\'un compte entre sur l\'autre : votre patrimoine total ne bouge pas.</span></label>' +
    '<label class="champ"><span class="ttl">Rythme</span><select id="f-frequence">' +
    FREQUENCES.map((x) => '<option value="' + x.id + '"' + (f.frequence === x.id ? " selected" : "") + ">" + esc(x.nom) + "</option>").join("") +
    "</select></label>" +
    '<label class="champ"><span class="ttl">Première échéance</span><input type="date" id="f-debut" value="' + esc(f.debut) + '"></label>' +
    "</div>" +
    '<div class="ligne-champs">' +
    '<label class="champ"><span class="ttl">Dernière échéance <span class="faible">(facultatif)</span></span>' +
    '<input type="date" id="f-fin" value="' + esc(f.fin || "") + '">' +
    '<span class="aide">Un crédit qui se termine, un contrat qui expire.</span></label>' +
    '<label class="champ"><span class="ttl">Revalorisation annuelle</span>' +
    '<input type="number" id="f-indexation" step="0.1" min="-50" max="50" value="' + esc(f.indexation) + '">' +
    '<span class="aide">En % par an, appliqué à chaque date anniversaire. Loyer +2, énergie +4…</span></label>' +
    "</div>" +
    '<label class="champ"><span class="ttl">Note <span class="faible">(facultatif)</span></span>' +
    '<textarea id="f-note" maxlength="300" rows="2">' + esc(f.note) + "</textarea></label>" +
    '<label class="case"><input type="checkbox" id="f-actif"' + (f.actif ? " checked" : "") + "> Flux actif (décochez pour le mettre en pause sans le supprimer)</label>" +
    '<div class="sep"></div>' +
    '<details><summary style="cursor:pointer;font-size:13.5px;color:var(--attenue)">Calculer une mensualité de prêt</summary>' +
    '<div class="ligne-champs trois" style="margin-top:10px">' +
    '<label class="champ"><span class="ttl">Capital emprunté</span><input type="number" id="p-capital" min="0" step="100" placeholder="15000"></label>' +
    '<label class="champ"><span class="ttl">Taux annuel (%)</span><input type="number" id="p-taux" min="0" step="0.01" placeholder="3,5"></label>' +
    '<label class="champ"><span class="ttl">Durée (mois)</span><input type="number" id="p-duree" min="1" step="1" placeholder="48"></label>' +
    "</div>" +
    '<div class="rangee" style="margin-top:10px"><button class="btn petit" id="p-calc" type="button">Reporter dans le formulaire</button>' +
    '<span class="faible" id="p-resultat" style="font-size:13px"></span></div>' +
    '<p class="sous" style="margin:8px 0 0">Le montant et la dernière échéance sont remplis à partir de la formule d\'annuité constante.</p></details>';

  const lire = () => {
    const type = boite("dialogue-corps").querySelector("#f-type .on").dataset.v;
    return {
      id: f.id || identifiant("flx"),
      libelle: boite("f-libelle").value.trim(),
      type,
      montant: Number(boite("f-montant").value.replace(",", ".")),
      categorieId: boite("f-categorie").value,
      compteId: boite("f-compte").value,
      compteDest: boite("f-compte-dest").value,
      frequence: boite("f-frequence").value,
      debut: boite("f-debut").value,
      fin: boite("f-fin").value || null,
      indexation: Number(boite("f-indexation").value.replace(",", ".")) || 0,
      actif: boite("f-actif").checked,
      note: boite("f-note").value.trim(),
    };
  };

  const brancher = () => {
    // un virement ne peut pas arriver sur son compte de départ : la
    // destination se déplace d'elle-même quand la source vient l'occuper
    const ajusterDestination = () => {
      const dest = boite("f-compte-dest");
      if (dest.value !== boite("f-compte").value) return;
      const autre = Array.from(dest.options).find((o) => o.value !== boite("f-compte").value);
      if (autre) dest.value = autre.value;
    };
    boite("f-compte").addEventListener("change", ajusterDestination);
    if (f.type === "virement") ajusterDestination();

    // le choix du type refiltre les catégories proposées
    boite("dialogue-corps").querySelectorAll("#f-type button").forEach((b) => {
      b.addEventListener("click", () => {
        boite("dialogue-corps").querySelectorAll("#f-type button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        const virement = b.dataset.v === "virement";
        boite("f-bloc-categorie").style.display = virement ? "none" : "";
        boite("f-bloc-dest").style.display = virement ? "" : "none";
        boite("f-titre-compte").textContent = virement ? "Depuis le compte" : "Compte";
        if (virement) ajusterDestination();
        else boite("f-categorie").innerHTML = optionsCategories(b.dataset.v, null);
      });
    });
    boite("p-calc").addEventListener("click", () => {
      const capital = Number(boite("p-capital").value.replace(",", "."));
      const taux = Number(boite("p-taux").value.replace(",", ".")) || 0;
      const duree = Math.round(Number(boite("p-duree").value));
      if (!(capital > 0) || !(duree > 0)) { boite("p-resultat").textContent = "Capital et durée sont nécessaires."; return; }
      const m = mensualitePret(capital, taux, duree);
      boite("f-montant").value = m;
      boite("f-frequence").value = "mensuel";
      const debut = boite("f-debut").value || aujourdhui();
      boite("f-fin").value = ajouterMois(debut, duree - 1);
      boite("p-resultat").textContent = nombre(duree) + " mensualités de " + argent(m) + " — coût total " +
        argent(arrondi2(m * duree)) + ", dont " + argent(arrondi2(m * duree - capital)) + " d'intérêts.";
    });
  };

  return { corps, lire, brancher, existant: !!flux };
}

function ouvrirFlux(id, prereglage) {
  const flux = id ? ETAT.flux.find((f) => f.id === id) : null;
  const form = formulaireFlux(flux, prereglage);
  const boutons = [];
  if (flux) {
    boutons.push({ texte: "Supprimer", classe: "danger gauche", action: () => { fermerDialogue(); supprimerFlux(flux.id); } });
    boutons.push({ texte: "Dupliquer", action: () => { fermerDialogue(); dupliquerFlux(flux.id); } });
  }
  boutons.push({ texte: "Annuler", action: fermerDialogue });
  boutons.push({
    texte: flux ? "Enregistrer" : "Ajouter", classe: "primaire",
    action: () => {
      const brut = form.lire();
      if (!brut.libelle) { message("Donnez un libellé à ce flux."); return; }
      if (!(brut.montant >= 0)) { message("Le montant doit être un nombre positif."); return; }
      if (!estIso(brut.debut)) { message("La date de première échéance est invalide."); return; }
      if (brut.type === "virement" && brut.compteId === brut.compteDest) {
        message("Un virement va d'un compte vers un autre."); return;
      }
      modifier(() => {
        const propre = normaliserFlux(brut, 0, ETAT.comptes, ETAT.categories);
        const i = ETAT.flux.findIndex((f) => f.id === brut.id);
        // les ajustements d'échéance appartiennent au flux, pas au formulaire
        if (i >= 0) { propre.exceptions = ETAT.flux[i].exceptions; ETAT.flux[i] = propre; }
        else ETAT.flux.push(propre);
      }, flux ? "Flux mis à jour." : "Flux ajouté.");
      fermerDialogue();
    },
  });
  ouvrirDialogue(flux ? "Modifier un flux" : "Nouveau flux", form.corps, boutons, form.brancher);
}

function supprimerFlux(id) {
  const f = ETAT.flux.find((x) => x.id === id);
  if (!f) return;
  confirmer("Supprimer ce flux ?", "« " + f.libelle + " » disparaîtra de la projection. Cette action ne peut pas être annulée.",
    "Supprimer", () => {
      modifier(() => {
        ETAT.flux = ETAT.flux.filter((x) => x.id !== id);
        for (const s of ETAT.scenarios) s.exclus = s.exclus.filter((x) => x !== id);
      }, "« " + f.libelle + " » supprimé.");
    });
}

function dupliquerFlux(id) {
  const f = ETAT.flux.find((x) => x.id === id);
  if (!f) return;
  modifier(() => {
    const copie = Object.assign({}, f, { id: identifiant("flx"), libelle: f.libelle + " (copie)", exceptions: [] });
    ETAT.flux.splice(ETAT.flux.indexOf(f) + 1, 0, copie);
  }, "Flux dupliqué.");
}

function supprimerCompte(id) {
  if (ETAT.comptes.length <= 1) { message("Il faut au moins un compte."); return; }
  const c = compte(id);
  const rattaches = ETAT.flux.filter((f) => f.compteId === id);
  confirmer("Supprimer « " + c.nom + " » ?",
    rattaches.length
      ? rattaches.length + (rattaches.length > 1 ? " flux seront rattachés" : " flux sera rattaché") + " au compte « " +
        ETAT.comptes.find((x) => x.id !== id).nom + " »."
      : "Ce compte n'a aucun flux rattaché.",
    "Supprimer", () => {
      modifier(() => {
        const remplacant = ETAT.comptes.find((x) => x.id !== id);
        for (const f of ETAT.flux) if (f.compteId === id) f.compteId = remplacant.id;
        for (const o of ETAT.objectifs) if (o.compteId === id) o.compteId = null;
        ETAT.comptes = ETAT.comptes.filter((x) => x.id !== id);
      });
      message("Compte supprimé.");

}

function ouvrirScenario(id) {
  const s = id ? ETAT.scenarios.find((x) => x.id === id) : null;

  /* Ajouter ou retirer une ligne de flux redessine le dialogue. Tout ce qui
     est saisi vit donc dans ce brouillon, et non dans le DOM : sans cela, le
     nom et les pourcentages déjà tapés disparaissaient au premier ajout. */
  const brouillon = {
    nom: s ? s.nom : "",
    teinte: s ? s.teinte : ((ETAT.scenarios.length + 2) % TEINTES_MAX) + 1,
    ajustRevenus: s ? s.ajustRevenus : 0,
    ajustDepenses: s ? s.ajustDepenses : 0,
    soldeDelta: s ? s.soldeDelta : 0,
    exclus: s ? s.exclus.slice() : [],
    extras: s ? s.extras.map((f) => Object.assign({}, f)) : [],
  };

  /** Relit le dialogue dans le brouillon, avant de le redessiner ou d'enregistrer. */
  const relire = () => {
    if (!boite("s-nom")) return brouillon;
    brouillon.nom = boite("s-nom").value.trim();
    brouillon.teinte = Number(boite("s-teinte").value);
    brouillon.ajustRevenus = Number(String(boite("s-rev").value).replace(",", ".")) || 0;
    brouillon.ajustDepenses = Number(String(boite("s-dep").value).replace(",", ".")) || 0;
    brouillon.soldeDelta = Number(String(boite("s-solde").value).replace(",", ".")) || 0;
    brouillon.exclus = Array.from(document.querySelectorAll(".s-exclu:checked")).map((x) => x.value);
    brouillon.extras = Array.from(document.querySelectorAll("#s-extras .extra")).map((n) => ({
      id: identifiant("flx"),
      libelle: n.querySelector(".x-libelle").value.trim(),
      montant: Number(String(n.querySelector(".x-montant").value).replace(",", ".")) || 0,
      type: n.querySelector(".x-type").value,
      frequence: n.querySelector(".x-frequence").value,
      debut: n.querySelector(".x-debut").value || aujourdhui(),
      compteId: ETAT.comptes[0].id,
      categorieId: null, fin: null, indexation: 0, actif: true, note: "", exceptions: [],
    }));
    return brouillon;
  };

  const dessiner = () => {
    const corps =
      '<div class="ligne-champs">' +
      '<label class="champ"><span class="ttl">Nom du scénario</span><input type="text" id="s-nom" maxlength="50" value="' +
      esc(brouillon.nom) + '" placeholder="Et si je déménageais ?"></label>' +
      '<label class="champ"><span class="ttl">Couleur</span><select id="s-teinte">' +
      Array.from({ length: TEINTES_MAX }, (_, i) => '<option value="' + (i + 1) + '"' +
        (brouillon.teinte === i + 1 ? " selected" : "") + ">Teinte " + (i + 1) + "</option>").join("") +
      "</select></label></div>" +
      '<div class="ligne-champs trois">' +
      '<label class="champ"><span class="ttl">Tous les revenus</span><input type="number" id="s-rev" step="1" value="' +
      esc(brouillon.ajustRevenus) + '"><span class="aide">en % (−20 = un cinquième de moins)</span></label>' +
      '<label class="champ"><span class="ttl">Toutes les dépenses</span><input type="number" id="s-dep" step="1" value="' +
      esc(brouillon.ajustDepenses) + '"><span class="aide">en %</span></label>' +
      '<label class="champ"><span class="ttl">Solde de départ</span><input type="number" id="s-solde" step="10" value="' +
      esc(brouillon.soldeDelta) + '"><span class="aide">un apport, un imprévu</span></label></div>' +
      '<div class="sep"></div>' +
      '<div><div class="ttl" style="font-weight:600;margin-bottom:6px">Flux retirés dans ce scénario</div>' +
      '<div style="max-height:190px;overflow:auto;border:1px solid var(--bordure);border-radius:10px;padding:8px">' +
      (ETAT.flux.length ? ETAT.flux.map((f) =>
        '<label class="case" style="padding:2px 0"><input type="checkbox" class="s-exclu" value="' + esc(f.id) + '"' +
        (brouillon.exclus.indexOf(f.id) >= 0 ? " checked" : "") + '><span>' + esc(f.libelle) +
        ' <span class="faible">· ' + esc(argent(f.type === "revenu" ? f.montant : -f.montant, { signe: true })) + " " +
        esc((FREQ[f.frequence] || FREQ.mensuel).court) + "</span></span></label>").join("")
        : '<span class="faible">Aucun flux à retirer.</span>') +
      "</div></div>" +
      '<div><div class="ttl" style="font-weight:600;margin:4px 0 6px">Flux ajoutés dans ce scénario</div>' +
      '<div id="s-extras">' + brouillon.extras.map(ligneExtra).join("") + "</div>" +
      '<button type="button" class="btn petit" data-act="scn-extra-ajouter">+ Ajouter un flux au scénario</button></div>';

    ouvrirDialogue(s ? "Modifier le scénario" : "Nouveau scénario", corps, [
      { texte: "Annuler", action: fermerDialogue },
      {
        texte: s ? "Enregistrer" : "Créer", classe: "primaire", action: () => {
          relire();
          if (!brouillon.nom) { message("Donnez un nom à ce scénario."); return; }
          const brut = Object.assign({ id: s ? s.id : identifiant("scn"), actif: s ? s.actif : true }, brouillon, {
            extras: brouillon.extras.filter((f) => f.libelle || f.montant),
          });
          modifier(() => {
            const propre = normaliserScenario(brut, ETAT.scenarios.length, ETAT.comptes, ETAT.categories);
            const i = ETAT.scenarios.findIndex((x) => x.id === propre.id);
            if (i >= 0) ETAT.scenarios[i] = propre; else ETAT.scenarios.push(propre);
          }, s ? "Scénario mis à jour." : "Scénario créé.");
          fermerDialogue();
        },
      },
    ], () => {
      boite("dialogue-corps").addEventListener("click", (ev) => {
        const b = ev.target.closest("[data-act]");
        if (!b) return;
        if (b.dataset.act === "scn-extra-ajouter") {
          relire();
          brouillon.extras.push({ libelle: "", montant: 0, type: "depense", frequence: "mensuel", debut: aujourdhui() });
          dessiner();
        } else if (b.dataset.act === "scn-extra-retirer") {
          relire();
          brouillon.extras.splice(Number(b.dataset.i), 1);
          dessiner();
        }
      });
    }, "large");
  };
  dessiner();
}

/**
 * Adopter un scénario, c'est en faire le budget de référence : ses flux
 * remplacent les vôtres, son décalage de solde est reporté sur le premier
 * compte. Une seule action, annulable comme les autres — sinon il faudrait
 * ressaisir à la main ce que le scénario décrivait déjà.
 */
function adopterScenario(id) {
  const s = ETAT.scenarios.find((x) => x.id === id);
  if (!s) return;
  const liste = fluxDuScenario(s);
  const retires = (s.exclus || []).length;
  confirmer("Adopter « " + s.nom + " » ?",
    "Vos flux seront remplacés par ceux du scénario : " + liste.length + " flux au total" +
    (retires > 0 ? ", " + retires + " retiré" + (retires > 1 ? "s" : "") : "") +
    (s.soldeDelta ? ", et " + argent(s.soldeDelta, { signe: true }) + " sur « " + ETAT.comptes[0].nom + " »" : "") +
    ". Le scénario disparaît une fois adopté ; « Annuler » revient en arrière.",
    "Adopter", () => {
      modifier(() => {
        ETAT.flux = liste.map((f, i) => normaliserFlux(f, i, ETAT.comptes, ETAT.categories));
        if (s.soldeDelta) ETAT.comptes[0].solde = arrondi2(ETAT.comptes[0].solde + s.soldeDelta);
        ETAT.scenarios = ETAT.scenarios.filter((x) => x.id !== id);
      }, "Scénario adopté.");
      allerA("tableau");
    });
}

function dupliquerScenario(id) {
  const s = ETAT.scenarios.find((x) => x.id === id);
  if (!s) return;
  modifier(() => {
    ETAT.scenarios.splice(ETAT.scenarios.indexOf(s) + 1, 0,
      normaliserScenario(Object.assign({}, s, { id: identifiant("scn"), nom: s.nom + " (copie)" }),
        ETAT.scenarios.length, ETAT.comptes, ETAT.categories));
  }, "Scénario dupliqué.");
}

/* Certains hôtes n'autorisent pas une page à déclencher un téléchargement
   elle-même et le prennent en charge, en demandant confirmation au lecteur.
   On leur pose la question une fois, à la première exportation. */
let _hoteFichiers = null;

function hoteDeTelechargement() {
  if (!_hoteFichiers) {
    _hoteFichiers = (typeof window !== "undefined" && window.claude && typeof window.claude.use === "function")
      ? Promise.resolve(window.claude.use("downloads")).catch(() => null)
      : Promise.resolve(null);
  }
  return _hoteFichiers;
}

function telecharger(nom, contenu, type, reussite) {
  hoteDeTelechargement().then((hote) => {
    if (hote) {
      return hote.save({ filename: nom, data: contenu }).then(
        () => message(reussite),
        (erreur) => {
          // un refus du lecteur n'est pas une erreur : il a dit non
          if (erreur && erreur.code === "declined") return;
          message("Enregistrement impossible depuis cette page.");
        }
      );
    }
    const blob = new Blob([contenu], { type: type + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    message(reussite);
  });
}

function nomFichier(extension) {
  const t = ETAT.parametres.titre.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "budget";
  return t + "-" + aujourdhui() + "." + extension;
}

function exporterJson() {
  telecharger(nomFichier("json"), JSON.stringify(ETAT, null, 2), "application/json",
    ETAT.flux.length + (ETAT.flux.length > 1 ? " flux exportés." : " flux exporté."));
}

function exporterCsv(projection) {
  const sep = ";";
  const echappe = (v) => {
    const s = String(v === null || v === undefined ? "" : v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lignes = [["Date", "Libellé", "Type", "Catégorie", "Compte", "Montant", "Solde projeté"].join(sep)];
  for (const op of projection.operations) {
    lignes.push([
      op.date, op.libelle, op.montant >= 0 ? "Revenu" : "Dépense",
      nomCategorie(op.categorieId), nomCompte(op.compteId),
      String(op.montant).replace(".", ","), String(op.solde).replace(".", ","),
    ].map(echappe).join(sep));
  }
  // le BOM évite qu'un tableur ouvre les accents de travers
  telecharger(nomFichier("csv"), "﻿" + lignes.join("\r\n"), "text/csv",
    projection.operations.length + " opérations exportées.");
}

/* ── Importer un relevé bancaire ──────────────────────────────────────── */

/** État de l'assistant, le temps des deux étapes. */
let RELEVE = null;

function importerReleve() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".csv,.txt,text/csv,text/plain";
  input.addEventListener("change", () => {
    const fichier = input.files && input.files[0];
    if (!fichier) return;
    if (fichier.size > 8 * 1024 * 1024) { message("Ce fichier dépasse 8 Mo."); return; }
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const analyse = analyserCsv(String(lecteur.result));
      if (analyse.erreur) { message(analyse.erreur); return; }
      RELEVE = { analyse, plan: {
        colonneDate: analyse.colonneDate,
        colonneLibelle: analyse.colonneLibelle,
        colonneMontant: analyse.colonneMontant,
        colonneDebit: analyse.colonneDebit,
        colonneCredit: analyse.colonneCredit,
      }, nom: fichier.name };
      etapeColonnes();
    };
    lecteur.onerror = () => message("Ce fichier n'a pas pu être lu.");
    // la plupart des banques françaises exportent en Windows-1252 ; l'UTF-8
    // reste le choix par défaut, et les accents abîmés se voient à l'aperçu
    lecteur.readAsText(fichier, "utf-8");
  });
  input.click();
}

/** Étape 1 : vérifier que chaque colonne a été comprise. */
function etapeColonnes() {
  const { analyse, plan } = RELEVE;
  const options = (choisie, avecVide) =>
    (avecVide ? '<option value="-1">— aucune —</option>' : "") +
    analyse.notes.map((n) => '<option value="' + n.i + '"' + (n.i === choisie ? " selected" : "") + ">" +

  const apercu = analyse.lignes.slice(0, 6);
  const corps =
    '<p class="sous" style="margin:0">' + esc(nombre(analyse.lignes.length)) + " lignes lues dans « " + esc(RELEVE.nom) +
    " ». Vérifiez que les colonnes ont été reconnues — les banques n'écrivent pas deux relevés de la même façon.</p>" +
    '<div class="ligne-champs">' +
    '<label class="champ"><span class="ttl">Date</span><select id="im-date">' + options(plan.colonneDate) + "</select></label>" +
    '<label class="champ"><span class="ttl">Libellé</span><select id="im-libelle">' + options(plan.colonneLibelle) + "</select></label>" +
    "</div>" +
    '<div class="segments" id="im-mode" style="margin-top:4px">' +
    '<button data-v="simple" class="' + (plan.colonneMontant >= 0 ? "on" : "") + '">Une colonne signée</button>' +
    '<button data-v="double" class="' + (plan.colonneMontant >= 0 ? "" : "on") + '">Débit et crédit séparés</button></div>' +
    '<div class="ligne-champs" id="im-simple"' + (plan.colonneMontant >= 0 ? "" : ' style="display:none"') + ">" +
    '<label class="champ"><span class="ttl">Montant</span><select id="im-montant">' + options(plan.colonneMontant) + "</select></label></div>" +
    '<div class="ligne-champs" id="im-double"' + (plan.colonneMontant >= 0 ? ' style="display:none"' : "") + ">" +
    '<label class="champ"><span class="ttl">Débit (ce qui sort)</span><select id="im-debit">' + options(plan.colonneDebit, true) + "</select></label>" +
    '<label class="champ"><span class="ttl">Crédit (ce qui entre)</span><select id="im-credit">' + options(plan.colonneCredit, true) + "</select></label></div>" +
    '<div class="sep"></div>' +
    '<div class="ttl" style="font-weight:600">Aperçu</div>' +
    '<div class="tableau-boite" style="margin:0"><table><thead><tr>' +
    analyse.notes.map((n) => "<th>" + esc(n.titre || "Colonne " + (n.i + 1)) + "</th>").join("") +
    "</tr></thead><tbody>" +
    apercu.map((l) => "<tr>" + l.map((c) => "<td>" + esc(String(c).slice(0, 34)) + "</td>").join("") + "</tr>").join("") +
    "</tbody></table></div>" +
    '<div id="im-verdict" class="sous" style="margin:0"></div>';

  ouvrirDialogue("Importer un relevé — 1/2 : les colonnes", corps, [
    { texte: "Annuler", action: () => { RELEVE = null; fermerDialogue(); } },
    { texte: "Analyser le relevé", classe: "primaire", action: () => {
      if (!lirePlan()) { message("Il faut au moins une colonne de date et une colonne de montant."); return; }
      etapeRecurrences();
    } },
  ], () => {
    const basculer = (mode) => {
      boite("im-simple").style.display = mode === "simple" ? "" : "none";
      boite("im-double").style.display = mode === "double" ? "" : "none";
      verdict();
    };
    boite("dialogue-corps").querySelectorAll("#im-mode button").forEach((b) => {
      b.addEventListener("click", () => {
        boite("dialogue-corps").querySelectorAll("#im-mode button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        basculer(b.dataset.v);
      });
    });
    boite("dialogue-corps").querySelectorAll("select").forEach((sel) => sel.addEventListener("change", verdict));
    verdict();
  }, "large");

  function mode() {
    const actif = boite("dialogue-corps").querySelector("#im-mode .on");
    return actif ? actif.dataset.v : "simple";
  }

  function lirePlan() {
    const simple = mode() === "simple";
    RELEVE.plan = {
      colonneDate: Number(boite("im-date").value),
      colonneLibelle: Number(boite("im-libelle").value),
      colonneMontant: simple ? Number(boite("im-montant").value) : -1,
      colonneDebit: simple ? -1 : Number(boite("im-debit").value),
      colonneCredit: simple ? -1 : Number(boite("im-credit").value),
    };
    const p = RELEVE.plan;
    return p.colonneDate >= 0 && (p.colonneMontant >= 0 || p.colonneDebit >= 0 || p.colonneCredit >= 0);
  }

  /** L'aperçu du résultat, recalculé à chaque changement de colonne. */
  function verdict() {
    if (!lirePlan()) { boite("im-verdict").innerHTML = "Choisissez au moins une date et un montant."; return; }
    const { operations, ignorees } = operationsCsv(analyse, RELEVE.plan);
    if (!operations.length) {
      boite("im-verdict").innerHTML = "Aucune opération lisible avec ces colonnes.";
      return;
    }
    const entrees = operations.filter((x) => x.montant > 0);
    const sorties = operations.filter((x) => x.montant < 0);
    boite("im-verdict").innerHTML =
      "<b>" + esc(nombre(operations.length)) + " opérations</b> du " + esc(libelleDate(operations[0].date)) +
      " au " + esc(libelleDate(operations[operations.length - 1].date)) + " — " +
      esc(nombre(entrees.length)) + " entrées (" + esc(argent(entrees.reduce((s, x) => s + x.montant, 0))) + "), " +
      esc(nombre(sorties.length)) + " sorties (" + esc(argent(sorties.reduce((s, x) => s + x.montant, 0))) + ")" +
      (ignorees ? ", " + esc(nombre(ignorees)) + " lignes ignorées" : "") + ".";
  }
}

/** Devine la catégorie d'un flux proposé d'après son libellé. */
const INDICES_CATEGORIE = [
  [/loyer|bail|logement|gestion immo|syndic|copropriete/i, "cat-logement"],
  [/monoprix|carrefour|leclerc|auchan|lidl|intermarche|casino|super|courses|franprix|picard/i, "cat-courses"],
  [/edf|engie|gaz|electricite|eau|veolia|suez|energie|total energies/i, "cat-energie"],
  [/essence|carburant|sncf|ratp|navigo|uber|peage|total|station|garage|auto/i, "cat-transport"],
  [/mutuelle|pharmacie|medecin|sante|dentiste|hopital|harmonie/i, "cat-sante"],
  [/netflix|spotify|canal|deezer|orange|sfr|bouygues|free|internet|mobile|abonnement|apple|amazon prime/i, "cat-abos"],
  [/restaurant|cinema|sport|gym|basic fit|fnac|loisir|bar |brasserie|theatre/i, "cat-loisirs"],
  [/impot|dgfip|tresor public|taxe|urssaf/i, "cat-impots"],
  [/credit|pret|emprunt|financement/i, "cat-credits"],
  [/salaire|paie|payroll|remuneration|traitement/i, "cat-salaire"],
  [/prime|bonus|interessement|participation/i, "cat-primes"],
  [/caf|allocation|pension|aide|apl/i, "cat-aides"],
];

function categorieProbable(prop) {
  const texte = prop.libelleBrut + " " + prop.libelle;
  for (const [motif, cible] of INDICES_CATEGORIE) {
    const c = categorie(cible);
    if (c && c.type === prop.type && motif.test(texte)) return c.id;
  }
  const memeType = ETAT.categories.filter((c) => c.type === prop.type);
  const divers = memeType.find((c) => /divers|autre/i.test(c.nom));
  return (divers || memeType[0] || {}).id;
}

function creerFluxImportes() {
  const compteId = boite("im-compte").value;
  const gardes = Array.from(document.querySelectorAll(".im-garde:checked")).map((x) => x.dataset.cle);
  if (!gardes.length) { message("Rien de sélectionné."); return; }
  const categories = {};
  document.querySelectorAll(".im-cat").forEach((sel) => { categories[sel.dataset.cle] = sel.value; });

  const aCreer = [];
  for (const cle of gardes) {
    if (cle === "var") {
      const v = RELEVE.trouve.variables;
      aCreer.push({
        libelle: v.libelle, type: "depense", montant: v.montant, frequence: "mensuel",
        debut: v.debut, compteId, categorieId: categorieProbable({ libelleBrut: "divers", libelle: "divers", type: "depense" }),
        note: v.nombre + " opérations sans rythme, relevées sur " + v.jours + " jours.",
      });
      continue;
    }
    const prop = RELEVE.trouve.propositions[Number(cle.slice(1))];
    if (!prop) continue;
    aCreer.push({
      libelle: prop.libelle, type: prop.type, montant: prop.montant, frequence: prop.frequence,
      debut: prop.debut, compteId, categorieId: categories[cle],
      note: "Importé d'un relevé : " + prop.nombre + " occurrences entre le " +
        libelleDate(prop.premiere) + " et le " + libelleDate(prop.derniere) + ".",
    });
  }

  modifier(() => {
    for (const brut of aCreer) {
      ETAT.flux.push(normaliserFlux(Object.assign({ id: identifiant("flx") }, brut), 0, ETAT.comptes, ETAT.categories));
    }
  }, aCreer.length + (aCreer.length > 1 ? " flux créés." : " flux créé."));
  RELEVE = null;
  fermerDialogue();
  allerA("flux");
}

function importerJson() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.addEventListener("change", () => {
    const fichier = input.files && input.files[0];
    if (!fichier) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      let brut;
      try { brut = JSON.parse(String(lecteur.result)); }
      catch (e) { message("Ce fichier n'est pas un JSON valide."); return; }
      const propre = normaliser(brut);
      confirmer("Remplacer vos données ?",
        "Le fichier contient " + propre.flux.length + " flux, " + propre.comptes.length + " comptes et " +
        propre.objectifs.length + " objectifs. Vos données actuelles seront écrasées.",
        "Importer", () => {
          memoriser();
          ETAT = propre;
          enregistrerEtat();
          rendre();
          message("Données importées.", { annuler: true });
        });
    };
    lecteur.readAsText(fichier);
  });
  input.click();
}

function rendre() {

function allerA(vue) {
  if (!VUES.includes(vue)) return;

/**
 * Le thème est porté par `data-theme` sur la racine, aux valeurs que pose
 * n'importe quel hôte : `light` ou `dark`.
 *
 * Au démarrage (`initial`), « automatique » ne retire rien : si la page est
 * servie dans un cadre qui a déjà posé l'attribut, c'est le choix du lecteur,
 * et l'effacer le trahirait. Seul un choix explicite dans les réglages
 * écrase ce que l'hôte a posé.
 */
function appliquerTheme(valeur, initial) {
  if (valeur === "auto") {
    if (!initial) document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", valeur);
  }
  if (!initial) ecrireLocal(CLE_THEME, valeur);
}

  "constats-tout": () => { ui.tousConstats = !ui.tousConstats; rendre(); },
  "cal-precedent": () => {
    const cle = moisCalendrier(PROJECTION);
    ui.moisCalendrier = cle.slice(5) === "01"
      ? (Number(cle.slice(0, 4)) - 1) + "-12"
      : cle.slice(0, 4) + "-" + deuxChiffres(Number(cle.slice(5)) - 1);
    rendre();
  },
  "cal-suivant": () => { ui.moisCalendrier = moisSuivant(moisCalendrier(PROJECTION)); rendre(); },
  "cal-aujourdhui": () => { ui.moisCalendrier = cleMois(aujourdhui()); rendre(); },
  "vue-calendrier": () => allerA("calendrier"),
  "vue-categories": () => allerA("categories"),
  "annuler": annuler,
  "aide": ouvrirAide,
  "theme": (b) => { appliquerTheme(b.dataset.v); rendre(); },
  "demo": chargerDemo,
  "raz": toutEffacer,
  "export-json": exporterJson,
  "export-csv": () => exporterCsv(ui.compteProjection
    ? projeter({ du: PROJECTION.du, au: PROJECTION.au, compteId: ui.compteProjection })
    : PROJECTION),
  "import-json": importerJson,
  "import-releve": importerReleve,
  "restaurer": (b) => restaurerSauvegarde(Number(b.dataset.quand)),
};

const RACCOURCIS = [
  ["1 … 9", "changer de vue"],
  ["N", "nouveau flux"],
  ["/", "chercher un flux"],
  ["C", "calendrier du mois en cours"],
  ["Ctrl / ⌘ + Z", "annuler la dernière modification"],
  ["T", "changer de thème"],
  ["Échap", "fermer la fenêtre ouverte"],
  ["Ctrl / ⌘ + K", "palette de commandes"],
  ["?", "afficher cette aide"],
];

function ouvrirAide() {
  ouvrirDialogue("Raccourcis et repères",
    '<div>' + RACCOURCIS.map(([touche, quoi]) =>
      '<div class="rangee" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--grille)">' +
      "<span>" + esc(quoi) + '</span><kbd>' + esc(touche) + "</kbd></div>").join("") + "</div>" +
    '<div class="sep"></div>' +
    '<p class="sous" style="margin:0"><b>Trois repères pour que la projection dise vrai.</b> Le montant saisi est celui ' +
    "d'aujourd'hui : la revalorisation annuelle part de là, à date anniversaire. Les charges annuelles se saisissent à leur " +
    "date réelle, pas lissées — c'est exactement ce qui creuse les mois difficiles. Et une échéance particulière " +
    "(la facture d'énergie de ce mois-ci) se corrige au cas par cas depuis le calendrier, sans toucher au flux.</p>",
    [{ texte: "Fermer", classe: "primaire", action: fermerDialogue }]);
}

function brancherEvenements() {
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    // les lignes de flux d'un scénario sont gérées par le dialogue lui-même,
    // qui doit relire ce qui est saisi avant de se redessiner
    if (b.dataset.act.indexOf("scn-extra-") === 0) return;
    const action = ACTIONS[b.dataset.act];
    if (!action) return;
    ev.preventDefault();
    action(b);
  });

  document.addEventListener("change", (ev) => {
    const cible = ev.target;
    if (cible.dataset.act === "compte-projection") {
      ui.compteProjection = cible.value;
      rendre();
    } else if (cible.dataset.act === "param") {
      const cle = cible.dataset.cle;
      modifier(() => {
        if (cle === "horizon") ETAT.parametres.horizon = Number(cible.value);
        else if (cle === "arrondi") ETAT.parametres.arrondi = cible.value === "1";
        else if (cle === "seuilAlerte") ETAT.parametres.seuilAlerte = arrondi2(nombreSur(cible.value, 0, 0));
        else if (cle === "debutProjection") ETAT.parametres.debutProjection = estIso(cible.value) ? cible.value : null;
        else if (cle === "devise") ETAT.parametres.devise = DEVISES[cible.value] ? cible.value : "EUR";
        else if (cle === "titre") ETAT.parametres.titre = texteSur(cible.value, "Mon budget", 60);
        _formats = {};
      });
    }
  });

  boite("sel-horizon").addEventListener("change", (ev) => {
    modifier(() => { ETAT.parametres.horizon = Number(ev.target.value); });
  });

  document.querySelectorAll("#onglets button").forEach((b) => {
    b.addEventListener("click", () => allerA(b.dataset.vue));
  });

  boite("btn-aide").addEventListener("click", ouvrirAide);
  boite("btn-palette").addEventListener("click", ouvrirPalette);

  boite("btn-theme").addEventListener("click", () => {
    const ordre = ["auto", "light", "dark"];
    const actuel = lireLocal(CLE_THEME) || "auto";
    const suivant = ordre[(ordre.indexOf(actuel) + 1) % ordre.length];
    appliquerTheme(suivant);
    message("Thème : " + NOMS_THEME[suivant]);
    if (vueActive === "reglages") rendre();
  });

  boite("dialogue-x").addEventListener("click", fermerDialogue);
  boite("voile").addEventListener("mousedown", (ev) => {
    if (ev.target === boite("voile")) fermerDialogue();
  });
  document.addEventListener("keydown", (ev) => {
    if (PALETTE) return;   // la palette gère ses propres touches
    const dialogueOuvert = !boite("voile").classList.contains("masque");

    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") {
      ev.preventDefault();
      if (!dialogueOuvert) ouvrirPalette();
      return;
    }

    // tant qu'un dialogue est ouvert, la tabulation y reste enfermée
    if (dialogueOuvert && ev.key === "Tab") {
      const cibles = focusables(boite("dialogue"));
      if (cibles.length) {
        const premier = cibles[0], dernier = cibles[cibles.length - 1];
        if (ev.shiftKey && document.activeElement === premier) { ev.preventDefault(); dernier.focus(); }
        else if (!ev.shiftKey && document.activeElement === dernier) { ev.preventDefault(); premier.focus(); }
        else if (!boite("dialogue").contains(document.activeElement)) { ev.preventDefault(); premier.focus(); }
      }
      return;
    }

    if (ev.key === "Escape" && dialogueOuvert) { fermerDialogue(); return; }

    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z" && !ev.shiftKey) {
      const champ = document.activeElement;
      // dans un champ de saisie, Ctrl+Z appartient au navigateur
      if (!champ || !champ.matches("input, textarea, select")) { ev.preventDefault(); annuler(); }
      return;
    }

    // les raccourcis d'une seule touche ne doivent pas manger la frappe
    if (dialogueOuvert || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const champ = document.activeElement;
    if (champ && champ.matches("input, textarea, select")) return;

    const touche = ev.key;
    if (touche >= "1" && touche <= "9" && VUES[Number(touche) - 1]) { ev.preventDefault(); allerA(VUES[Number(touche) - 1]); }
    else if (touche === "n" || touche === "N") { ev.preventDefault(); ouvrirFlux(null); }
    else if (touche === "c" || touche === "C") { ev.preventDefault(); ui.moisCalendrier = cleMois(aujourdhui()); allerA("calendrier"); }
    else if (touche === "t" || touche === "T") { ev.preventDefault(); boite("btn-theme").click(); }
    else if (touche === "?") { ev.preventDefault(); ouvrirAide(); }
    else if (touche === "/") {
      ev.preventDefault();
      if (vueActive !== "flux") allerA("flux");
      const rech = boite("rech");
      if (rech) rech.focus();
    }
  });

  /* Déplacement dans la grille du calendrier : les flèches parcourent les
     jours, la semaine se saute avec Haut et Bas. */
  document.addEventListener("keydown", (ev) => {
    const case_ = document.activeElement;
    if (!case_ || !case_.classList || !case_.classList.contains("cal-case")) return;
    const pas = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
    if (!pas) return;
    ev.preventDefault();
    const toutes = Array.from(document.querySelectorAll(".cal-case[data-date]"));
    const i = toutes.indexOf(case_);
    const cible = toutes[Math.max(0, Math.min(toutes.length - 1, i + pas))];
    if (!cible) return;
    case_.setAttribute("tabindex", "-1");
    cible.setAttribute("tabindex", "0");
    cible.focus();
  });

  window.addEventListener("hashchange", () => {
    const v = location.hash.slice(1);
    if (VUES.includes(v) && v !== vueActive) { vueActive = v; rendre(); }
  });

  // les graphiques sont dessinés à la largeur mesurée : un redimensionnement
  // les rejoue, une fois la fenêtre stabilisée
  let minuterie = null;
  window.addEventListener("resize", () => {
    clearTimeout(minuterie);
    minuterie = setTimeout(rendre, 180);
  });
}

/* ── Palette de commandes ─────────────────────────────────────────────── */

/** Sans accents ni casse : « Épargne » se trouve en tapant « epargne ». */
function pliage(texte) {
  return String(texte || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

/**
 * Toutes les commandes atteignables au clavier : les vues, les créations,
 * les actions sur les données, et chacun de vos flux et comptes. Tout ce
 * qui se fait à la souris doit pouvoir se faire ici.
 */
function commandes() {
  const liste = [];
  for (const v of VUES) {
    liste.push({ groupe: "Aller à", titre: TITRES[v][1], detail: TITRES[v][0], faire: () => allerA(v) });
  }
  liste.push(
    { groupe: "Créer", titre: "Nouveau flux", detail: "revenu, dépense ou virement", faire: () => ouvrirFlux(null) },
    { groupe: "Créer", titre: "Nouveau compte", faire: () => ouvrirCompte(null) },
    { groupe: "Créer", titre: "Nouvel objectif", faire: () => ouvrirObjectif(null) },
    { groupe: "Créer", titre: "Nouveau scénario", faire: () => ouvrirScenario(null) },
    { groupe: "Données", titre: "Importer un relevé bancaire", detail: "CSV", faire: importerReleve },
    { groupe: "Données", titre: "Exporter mes données", detail: "JSON", faire: exporterJson },
    { groupe: "Données", titre: "Exporter la projection", detail: "CSV", faire: () => exporterCsv(PROJECTION) },
    { groupe: "Données", titre: "Importer un fichier", detail: "JSON", faire: importerJson },
    { groupe: "Action", titre: "Annuler la dernière modification", faire: annuler },
    { groupe: "Action", titre: "Changer de thème", faire: () => boite("btn-theme").click() },
    { groupe: "Action", titre: "Raccourcis clavier", faire: ouvrirAide }
  );
  for (const c of ETAT.comptes) {
    liste.push({ groupe: "Pointer", titre: c.nom, detail: "solde constaté le " + libelleDate(c.soldeDate, true), faire: () => ouvrirPointage(c.id) });
  }
  for (const f of ETAT.flux.slice(0, 300)) {
    liste.push({
      groupe: "Flux", titre: f.libelle,
      detail: argent(f.type === "revenu" ? f.montant : -f.montant, { signe: true }) + " · " + (FREQ[f.frequence] || FREQ.mensuel).nom.toLowerCase(),
      faire: () => ouvrirFlux(f.id),
    });
  }
  for (const s of ETAT.scenarios) {
    liste.push({ groupe: "Scénario", titre: s.nom, detail: "modifier", faire: () => ouvrirScenario(s.id) });
  }
  return liste;
}

/** Tous les mots de la recherche doivent se retrouver, dans n'importe quel ordre. */
function filtrerCommandes(liste, recherche) {
  const mots = pliage(recherche).split(/\s+/).filter(Boolean);
  if (!mots.length) return liste;
  return liste.filter((c) => {
    const foin = pliage(c.groupe + " " + c.titre + " " + (c.detail || ""));
    return mots.every((m) => foin.includes(m));
  });
}

let PALETTE = null;

function ouvrirPalette() {
  if (PALETTE) return;
  const liste = commandes();
  let filtrees = liste;
  let choisi = 0;

  const voile = document.createElement("div");
  voile.id = "voile-palette";
  voile.innerHTML =
    '<div id="palette" role="dialog" aria-modal="true" aria-label="Palette de commandes">' +
    '<input id="palette-champ" type="text" placeholder="Chercher une vue, un flux, une action…" ' +
    'autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-liste" aria-autocomplete="list">' +
    '<div id="palette-liste" role="listbox" aria-label="Résultats"></div>' +
    '<div id="palette-pied"><span><kbd>↑</kbd> <kbd>↓</kbd> naviguer</span><span><kbd>Entrée</kbd> ouvrir</span>' +
    "<span><kbd>Échap</kbd> fermer</span></div></div>";
  document.body.appendChild(voile);

  const champ = voile.querySelector("#palette-champ");
  const zone = voile.querySelector("#palette-liste");
  const rendu = () => {
    if (!filtrees.length) {
      zone.innerHTML = '<div class="palette-vide">Rien ne correspond.</div>';
      return;
    }
    let groupe = null;
    zone.innerHTML = filtrees.map((c, i) => {
      const entete = c.groupe !== groupe ? '<div class="palette-groupe">' + esc(c.groupe) + "</div>" : "";
      groupe = c.groupe;
      return entete + '<div class="palette-item' + (i === choisi ? " on" : "") + '" role="option" id="palette-' + i +
        '" aria-selected="' + (i === choisi ? "true" : "false") + '" data-i="' + i + '">' +
        "<span>" + esc(c.titre) + "</span>" +
        (c.detail ? '<span class="faible">' + esc(c.detail) + "</span>" : "") + "</div>";
    }).join("");
    const actif = zone.querySelector(".palette-item.on");
    if (actif) actif.scrollIntoView({ block: "nearest" });
    champ.setAttribute("aria-activedescendant", filtrees.length ? "palette-" + choisi : "");
  };

  const lancer = (i) => {
    const c = filtrees[i];
    if (!c) return;
    fermerPalette();
    c.faire();
  };

  champ.addEventListener("input", () => {
    filtrees = filtrerCommandes(liste, champ.value);
    choisi = 0;
    rendu();
  });
  champ.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); choisi = Math.min(filtrees.length - 1, choisi + 1); rendu(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); choisi = Math.max(0, choisi - 1); rendu(); }
    else if (ev.key === "Home") { ev.preventDefault(); choisi = 0; rendu(); }
    else if (ev.key === "End") { ev.preventDefault(); choisi = filtrees.length - 1; rendu(); }
    else if (ev.key === "Enter") { ev.preventDefault(); lancer(choisi); }
    else if (ev.key === "Escape") { ev.preventDefault(); fermerPalette(); }
  });
  zone.addEventListener("mousemove", (ev) => {
    const item = ev.target.closest(".palette-item");
    if (item && Number(item.dataset.i) !== choisi) { choisi = Number(item.dataset.i); rendu(); }
  });
  zone.addEventListener("click", (ev) => {
    const item = ev.target.closest(".palette-item");
    if (item) lancer(Number(item.dataset.i));
  });
  voile.addEventListener("mousedown", (ev) => { if (ev.target === voile) fermerPalette(); });

  PALETTE = { voile, renduPrecedent: document.activeElement };
  rendu();
  champ.focus();
}

function fermerPalette() {
  if (!PALETTE) return;
  PALETTE.voile.remove();
  const retour = PALETTE.renduPrecedent;
  PALETTE = null;
  if (retour && retour.focus && document.contains(retour)) retour.focus();
}

/* ══════════════════════════════════════════════════════════════════════
   13. Démarrage
   ══════════════════════════════════════════════════════════════════════ */

function demarrer() {
  appliquerTheme(lireLocal(CLE_THEME) || "auto", true);

  const dejaVu = chargerEtat();
  if (!dejaVu) {
    // première ouverture : mieux vaut une application vivante qu'une page vide
    ETAT = jeuDemo();
    enregistrerEtat();
    setTimeout(() => message("Budget d'exemple chargé — remplacez les montants par les vôtres."), 400);
  }

  const depart = location.hash.slice(1);
  if (VUES.includes(depart)) vueActive = depart;

  brancherEvenements();
  rendre();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}

if (typeof document !== "undefined" && document.getElementById) {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer);
  else demarrer();
}

/* Le moteur est exposé pour les tests, qui évaluent ce script hors navigateur. */
if (typeof globalThis !== "undefined") {
  globalThis.Prevoyant = {
    normaliser, occurrences, projeter, soldeALaDate, mensualiteMoyenne, mensualitePret,
    evaluerObjectif, enveloppes, fluxDuScenario, projeterScenario, jeuDemo, montantA,
    resteAVivre, calendrier, jourSemaine, exceptionDe, poserException, normaliserExceptions,
    soldeRoule, soldeDepart, pointerSolde, derives, statistiquesDerive, bandeIncertitude, migrer,
    observations, annuelCategorie,
    peutEtreSauvegarder, lireSauvegardes, CLE_SAUVEGARDES, SAUVEGARDES_MAX,
    pliage, filtrerCommandes,
    moisCalendrier, CALENDRIER_RESTE_MINIMUM,
    analyserCsv, operationsCsv, lireDate, lireMontant, decouperLigne, detecterSeparateur,
    normaliserLibelle, detecterRythme, detecterRecurrences, mediane, prochaineEcheancePrevue,
    ajouterMois, ajouterJours, moisEntre, joursEntre, joursDansMois, estIso, cleMois,
    finDeMois, moisSuivant, graduations, arrondi2,
    etat: () => ETAT,
    poserEtat: (e) => { ETAT = normaliser(e); invaliderProjections(); return ETAT; },
    FREQUENCES, VERSION_ETAT,
  };
}
