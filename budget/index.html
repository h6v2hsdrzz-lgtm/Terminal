/* ════════════════════════════════════════════════════════════════════
   Prévoyant — un seul fichier, aucune dépendance, aucun réseau.

   Tout ce qui est affiché est calculé à partir d'une seule liste : les
   flux. Un flux dit « combien, à partir de quand, à quel rythme, et
   jusqu'à quand » ; le reste — solde jour par jour, mois par mois,
   calendrier, enveloppes, objectifs, scénarios — en découle par
   projection.

   L'identité tient en trois teintes : une encre bleu-vert très sombre,
   un pétrole qui porte toutes les actions et la courbe de solde, et le
   couple vert / rouille des mouvements. Les huit teintes de catégorie
   sont espacées en teinte et tenues dans une bande de clarté étroite,
   séparément pour chaque thème, pour rester lisibles côte à côte dans
   un anneau ou une pile de barres.
   ════════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: light;

  --fond: #edf1f3;
  --fond-2: #e4eaee;
  --surface: #ffffff;
  --surface-2: #e9eef1;
  --surface-3: #dde5e9;
  --bordure: #dde4e9;
  --bordure-2: #bfcbd3;

  --texte: #0e191f;
  --attenue: #4e5f6a;
  --faible: #84939e;

  --serie-1: #0f6572;
  --serie-2: #2f8f6b;
  --serie-3: #b0740f;
  --serie-4: #7d5cb8;
  --serie-5: #bd5238;
  --serie-6: #2c6fae;
  --serie-7: #75792a;
  --serie-8: #ab4d7c;

  --revenu: #2f8f6b;
  --revenu-texte: #1f6b50;
  --revenu-fond: #e6f2ed;
  --depense: #bd5238;
  --depense-texte: #a1412a;
  --depense-fond: #faeae6;
  --alerte: #b0740f;
  --alerte-texte: #8a5a09;
  --alerte-fond: #fbf1de;

  --accent: #0f6572;
  --accent-fort: #0a4c57;
  --accent-doux: #e2eef0;
  --accent-texte: #ffffff;

  --grille: #e6ebee;
  --ombre-1: 0 1px 2px rgb(14 25 31 / .05);
  --ombre-2: 0 1px 2px rgb(14 25 31 / .05), 0 10px 24px -14px rgb(14 25 31 / .25);
  --ombre-3: 0 2px 6px rgb(14 25 31 / .09), 0 28px 60px -26px rgb(14 25 31 / .45);

  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --corps: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  --r-s: 8px;
  --r: 12px;
  --r-l: 16px;
  --rail: 236px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: #0b1216;
    --fond-2: #0e161b;
    --surface: #141d23;
    --surface-2: #1b262d;
    --surface-3: #24313a;
    --bordure: #212d35;
    --bordure-2: #35444f;
    --texte: #dbe4e9;
    --attenue: #91a1ac;
    --faible: #5d6c78;
    --serie-1: #3aa5b5;
    --serie-2: #35a880;
    --serie-3: #c8912c;
    --serie-4: #9c85e0;
    --serie-5: #d9705a;
    --serie-6: #5b93d6;
    --serie-7: #9aa243;
    --serie-8: #cf7aa6;
    --revenu: #35a880;
    --revenu-texte: #4dc19a;
    --revenu-fond: #12312a;
    --depense: #d9705a;
    --depense-texte: #e88f79;
    --depense-fond: #35201b;
    --alerte: #c8912c;
    --alerte-texte: #dcaa45;
    --alerte-fond: #322612;
    --accent: #3aa5b5;
    --accent-fort: #59c0cf;
    --accent-doux: #13323a;
    --accent-texte: #06171c;
    --grille: #1e2932;
    --ombre-1: 0 1px 2px rgb(0 0 0 / .5);
    --ombre-2: 0 1px 2px rgb(0 0 0 / .45), 0 12px 28px -16px rgb(0 0 0 / .8);
    --ombre-3: 0 2px 8px rgb(0 0 0 / .55), 0 32px 70px -30px rgb(0 0 0 / .95);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --fond: #0b1216;
  --fond-2: #0e161b;
  --surface: #141d23;
  --surface-2: #1b262d;
  --surface-3: #24313a;
  --bordure: #212d35;
  --bordure-2: #35444f;
  --texte: #dbe4e9;
  --attenue: #91a1ac;
  --faible: #5d6c78;
  --serie-1: #3aa5b5;
  --serie-2: #35a880;
  --serie-3: #c8912c;
  --serie-4: #9c85e0;
  --serie-5: #d9705a;
  --serie-6: #5b93d6;
  --serie-7: #9aa243;
  --serie-8: #cf7aa6;
  --revenu: #35a880;
  --revenu-texte: #4dc19a;
  --revenu-fond: #12312a;
  --depense: #d9705a;
  --depense-texte: #e88f79;
  --depense-fond: #35201b;
  --alerte: #c8912c;
  --alerte-texte: #dcaa45;
  --alerte-fond: #322612;
  --accent: #3aa5b5;
  --accent-fort: #59c0cf;
  --accent-doux: #13323a;
  --accent-texte: #06171c;
  --grille: #1e2932;
  --ombre-1: 0 1px 2px rgb(0 0 0 / .5);
  --ombre-2: 0 1px 2px rgb(0 0 0 / .45), 0 12px 28px -16px rgb(0 0 0 / .8);
  --ombre-3: 0 2px 8px rgb(0 0 0 / .55), 0 32px 70px -30px rgb(0 0 0 / .95);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fond);
  color: var(--texte);
  font-family: var(--corps);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: -.018em; }

.chiffre, td.num, th.num, .mono, .jauge-val {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 5px; }

.masque { display: none !important; }
.dim { color: var(--attenue); }
.faible { color: var(--faible); }
.pos { color: var(--revenu-texte); }
.neg { color: var(--depense-texte); }
.eyebrow {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faible);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ═══════════════════ Charpente ═══════════════════ */

#appli { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
#zone { min-width: 0; display: flex; flex-direction: column; }

/* ─── Rail de navigation ─── */

#rail {
  background: var(--fond-2);
  border-right: 1px solid var(--bordure);
  padding: 16px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.marque {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 0;
}
.marque .logo {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--accent);
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: var(--ombre-1);
}
.marque .logo svg { display: block; }
.marque .nom { font-family: var(--display); font-weight: 700; font-size: 16.5px; letter-spacing: -.02em; line-height: 1.1; }
.marque .sous-nom { display: block; font-size: 10.5px; color: var(--faible); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }

#onglets { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; scrollbar-width: thin; }
#onglets button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: var(--r-s);
  padding: 8px 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--attenue);
  white-space: nowrap;
  transition: background .13s, color .13s;
}
#onglets button .ic { width: 18px; height: 18px; flex: none; opacity: .8; }
#onglets button:hover { background: var(--surface-2); color: var(--texte); }
#onglets button.on {
  background: var(--surface);
  color: var(--texte);
  font-weight: 600;
  box-shadow: var(--ombre-1);
}
#onglets button.on .ic { color: var(--accent); opacity: 1; }

.rail-pied {
  margin-top: auto;
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: var(--r);
  padding: 11px 13px;
  box-shadow: var(--ombre-1);
}
.rail-pied .l { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 0; }
.rail-pied .l span { font-size: 12px; color: var(--attenue); }
.rail-pied .l b { font-family: var(--display); font-size: 15px; font-variant-numeric: tabular-nums; }
.rail-pied .sep-fin { height: 1px; background: var(--bordure); margin: 6px 0; }

/* ─── Barre supérieure ─── */

header#tete {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--fond) 86%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--bordure);
  padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.tete-titre { margin-right: auto; min-width: 0; }
.tete-titre h1 { font-size: 19px; line-height: 1.2; }
.tete-outils { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.pilule {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: 13px;
  color: var(--attenue);
  white-space: nowrap;
  box-shadow: var(--ombre-1);
}
.pilule b { color: var(--texte); font-weight: 600; font-variant-numeric: tabular-nums; }
.pilule.select { padding: 2px 6px 2px 13px; }
.pilule select { border: 0; background: none; width: auto; padding: 3px 2px; font-size: 13px; font-weight: 600; box-shadow: none; }

button.outil {
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: 999px;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  color: var(--attenue);
  box-shadow: var(--ombre-1);
  transition: background .13s, color .13s;
}
button.outil:hover { background: var(--surface-2); color: var(--texte); }
button.outil svg { width: 17px; height: 17px; }

main {
  padding: 20px max(16px, env(safe-area-inset-right)) 96px max(16px, env(safe-area-inset-left));
  max-width: 1280px;
  width: 100%;
}

/* ─── Téléphone : le rail passe en tête ─── */

@media (max-width: 999px) {
  #appli { grid-template-columns: minmax(0, 1fr); }
  #rail {
    position: sticky;
    top: 0;
    z-index: 40;
    height: auto;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px 0;
    border-right: 0;
    border-bottom: 1px solid var(--bordure);
    background: color-mix(in srgb, var(--fond-2) 92%, transparent);
    backdrop-filter: blur(14px);
  }
  #onglets {
    flex-direction: row;
    overflow-x: auto;
    scrollbar-width: none;
    gap: 2px;
    padding-bottom: 2px;
  }
  #onglets::-webkit-scrollbar { display: none; }
  #onglets button { width: auto; padding: 7px 11px; }
  #onglets button .ic { display: none; }
  .rail-pied { display: none; }
  header#tete { position: static; backdrop-filter: none; background: none; padding-bottom: 4px; }
  main { padding-top: 12px; }
}

/* ═══════════════════ Cartes ═══════════════════ */

.pile { display: flex; flex-direction: column; gap: 16px; }
.grille { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g-2-1 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 620px) { .g2, .g4 { grid-template-columns: minmax(0, 1fr); } }

.carte {
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: var(--r-l);
  padding: 17px 19px;
  box-shadow: var(--ombre-2);
}
.carte.plat { box-shadow: var(--ombre-1); }

.carte-tete { display: flex; align-items: baseline; gap: 12px; margin-bottom: 3px; flex-wrap: wrap; }
.carte-tete h2 { font-size: 15.5px; letter-spacing: -.01em; }
.carte-tete h3 { font-size: 14.5px; letter-spacing: -.01em; }
.carte-tete .droite { margin-left: auto; font-size: 12.5px; color: var(--attenue); font-variant-numeric: tabular-nums; }
.sous { font-size: 13px; color: var(--attenue); margin: 0 0 14px; max-width: 74ch; }
.sous:last-child { margin-bottom: 0; }

/* ═══════════════════ Indicateurs ═══════════════════ */

.kpis { display: grid; gap: 1px; background: var(--bordure); border: 1px solid var(--bordure); border-radius: var(--r-l); overflow: hidden; box-shadow: var(--ombre-2); grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

.kpi { background: var(--surface); padding: 15px 17px 13px; display: flex; flex-direction: column; gap: 3px; position: relative; min-width: 0; }
.kpi .etiq { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--faible); font-weight: 700; }
.kpi .val { font-family: var(--display); font-size: 27px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .note { font-size: 12.5px; color: var(--attenue); }
.kpi .etincelle { position: absolute; right: 0; bottom: 0; left: 0; width: 100%; height: 34px; opacity: .55; pointer-events: none; }

.jauge { height: 7px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.jauge > i { display: block; height: 100%; border-radius: 999px; transition: width .3s ease; }
.jauge.fine { height: 5px; }

/* ═══════════════════ Bandeaux ═══════════════════ */

.bandeau {
  display: flex; gap: 13px; align-items: flex-start;
  border-radius: var(--r-l); padding: 14px 17px;
  border: 1px solid; font-size: 14px;
  box-shadow: var(--ombre-1);
}
.bandeau .ic { flex: none; width: 20px; height: 20px; margin-top: 1px; }
.bandeau b { font-weight: 600; }
.bandeau.rouge { background: var(--depense-fond); border-color: color-mix(in srgb, var(--depense) 34%, var(--bordure)); color: var(--texte); }
.bandeau.rouge .ic { color: var(--depense); }
.bandeau.ambre { background: var(--alerte-fond); border-color: color-mix(in srgb, var(--alerte) 34%, var(--bordure)); }
.bandeau.ambre .ic { color: var(--alerte); }
.bandeau.vert { background: var(--revenu-fond); border-color: color-mix(in srgb, var(--revenu) 30%, var(--bordure)); }
.bandeau.vert .ic { color: var(--revenu); }

/* ═══════════════════ Tableaux ═══════════════════ */

.tableau-boite { overflow-x: auto; margin: 0 -19px; padding: 0 19px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
table th {
  text-align: left;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--faible); font-weight: 700;
  padding: 0 10px 8px; white-space: nowrap;
  border-bottom: 1px solid var(--bordure);
}
table td { padding: 10px; border-bottom: 1px solid var(--grille); vertical-align: middle; }
table tbody tr:last-child td { border-bottom: 0; }
table .num { text-align: right; font-variant-numeric: tabular-nums; }
table tbody tr.cliquable { cursor: pointer; transition: background .1s; }
table tbody tr.cliquable:hover { background: var(--surface-2); }
table tr.repli > td { background: var(--surface-2); padding: 0; border-bottom: 1px solid var(--bordure); }
table tr.repli table td { border-bottom-color: color-mix(in srgb, var(--bordure) 60%, transparent); }
table tr.total td { font-weight: 600; border-top: 1px solid var(--bordure-2); background: var(--surface-2); }
table tr.annee td { background: var(--accent-doux); font-weight: 600; font-size: 13px; }
.actions { white-space: nowrap; text-align: right; opacity: .55; transition: opacity .12s; }
tr:hover .actions, .actions:focus-within { opacity: 1; }

.puce { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; vertical-align: 0; flex: none; }

.etiquette {
  display: inline-block; font-size: 11.5px; font-weight: 500;
  padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--bordure);
  color: var(--attenue); white-space: nowrap;
}
.etiquette.rev { background: var(--revenu-fond); border-color: color-mix(in srgb, var(--revenu) 30%, transparent); color: var(--revenu-texte); }
.etiquette.dep { background: var(--depense-fond); border-color: color-mix(in srgb, var(--depense) 30%, transparent); color: var(--depense-texte); }
.etiquette.acc { background: var(--accent-doux); border-color: color-mix(in srgb, var(--accent) 26%, transparent); color: var(--accent-fort); }
.etiquette.off { opacity: .6; text-decoration: line-through; }

/* ═══════════════════ Boutons ═══════════════════ */

.btn {
  border: 1px solid var(--bordure-2); background: var(--surface);
  border-radius: var(--r-s); padding: 8px 15px;
  font-size: 14px; font-weight: 500;
  box-shadow: var(--ombre-1);
  transition: background .12s, border-color .12s, transform .06s, box-shadow .12s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primaire { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); font-weight: 600; }
.btn.primaire:hover { background: var(--accent-fort); border-color: var(--accent-fort); }
.btn.danger { color: var(--depense-texte); border-color: color-mix(in srgb, var(--depense) 40%, var(--bordure)); }
.btn.danger:hover { background: var(--depense-fond); }
.btn.petit { padding: 4px 10px; font-size: 12.5px; border-radius: 7px; }
.btn.fantome { border-color: transparent; background: none; color: var(--attenue); box-shadow: none; }
.btn.fantome:hover { background: var(--surface-2); color: var(--texte); }
.btn.icone { padding: 4px 7px; line-height: 1; }
.btn.icone svg { width: 15px; height: 15px; display: block; }

.segments { display: inline-flex; background: var(--surface-2); border: 1px solid var(--bordure); border-radius: var(--r-s); padding: 2px; gap: 2px; flex-wrap: wrap; }
.segments button { border: 0; background: none; border-radius: 6px; padding: 5px 11px; font-size: 13px; font-weight: 500; color: var(--attenue); transition: background .12s, color .12s; }
.segments button:hover { color: var(--texte); }
.segments button.on { background: var(--surface); color: var(--texte); font-weight: 600; box-shadow: var(--ombre-1); }

/* ═══════════════════ Formulaires ═══════════════════ */

label.champ { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--attenue); min-width: 0; }
label.champ > .ttl { font-weight: 600; color: var(--texte); font-size: 13px; }
label.champ .aide { font-size: 12px; color: var(--faible); line-height: 1.4; }

input[type="text"], input[type="number"], input[type="date"], input[type="month"], select, textarea {
  background: var(--surface);
  border: 1px solid var(--bordure-2);
  border-radius: var(--r-s);
  padding: 8px 10px;
  font-size: 14px; width: 100%; min-width: 0;
  transition: border-color .12s, box-shadow .12s;
}
input:hover, select:hover, textarea:hover { border-color: var(--faible); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
textarea { resize: vertical; min-height: 60px; }
input:disabled, select:disabled { background: var(--surface-2); color: var(--faible); }

.ligne-champs { display: grid; gap: 13px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ligne-champs.trois { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 620px) { .ligne-champs, .ligne-champs.trois { grid-template-columns: minmax(0, 1fr); } }

.case { display: flex; align-items: center; gap: 9px; font-size: 14px; cursor: pointer; }
.case input { width: auto; accent-color: var(--accent); }

details.repliable > summary {
  cursor: pointer; font-size: 13.5px; color: var(--attenue);
  padding: 6px 0; list-style: none; display: flex; align-items: center; gap: 6px;
}
details.repliable > summary::-webkit-details-marker { display: none; }
details.repliable > summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 16px; }
details.repliable[open] > summary::before { transform: rotate(90deg); }

/* ═══════════════════ Dialogue ═══════════════════ */

#voile {
  position: fixed; inset: 0; z-index: 50;
  background: rgb(6 12 16 / .55);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 16px;
  animation: fondu .14s ease-out;
}
#voile.masque { display: none !important; }
@keyframes fondu { from { opacity: 0; } }

#dialogue {
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: 18px;
  box-shadow: var(--ombre-3);
  width: min(640px, 100%);
  transition: width .15s;
  max-height: min(88vh, 920px);
  display: flex; flex-direction: column;
  animation: monte-dialogue .18s cubic-bezier(.2, .8, .3, 1);
}
@keyframes monte-dialogue { from { opacity: 0; transform: translateY(12px) scale(.985); } }

#dialogue.large { width: min(960px, 100%); }
#dialogue.large .tronque { max-width: 230px; }
.tronque { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
#dialogue-tete { display: flex; align-items: center; gap: 10px; padding: 16px 19px; border-bottom: 1px solid var(--bordure); }
#dialogue-tete h2 { font-size: 16.5px; margin-right: auto; }
#dialogue-corps { padding: 19px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
#dialogue-pied { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 19px; border-top: 1px solid var(--bordure); flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 17px 17px; }
#dialogue-pied .gauche { margin-right: auto; }

/* ═══════════════════ Palette de commandes ═══════════════════ */

#voile-palette {
  position: fixed; inset: 0; z-index: 60;
  background: rgb(6 12 16 / .5);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(8vh, 40px) 16px 16px;
  animation: fondu .12s ease-out;
}
#palette {
  width: min(620px, 100%);
  background: var(--surface);
  border: 1px solid var(--bordure-2);
  border-radius: 16px;
  box-shadow: var(--ombre-3);
  overflow: hidden;
  display: flex; flex-direction: column;
  max-height: min(70vh, 620px);
  animation: monte-dialogue .16s cubic-bezier(.2, .8, .3, 1);
}
#palette-champ {
  border: 0; border-bottom: 1px solid var(--bordure); border-radius: 0;
  padding: 15px 18px; font-size: 16px; background: none;
}
#palette-champ:focus { box-shadow: none; border-color: var(--bordure); }
#palette-liste { overflow-y: auto; padding: 6px; }
.palette-groupe {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--faible); font-weight: 700; padding: 10px 12px 4px;
}
.palette-item {
  display: flex; align-items: baseline; gap: 12px; justify-content: space-between;
  padding: 8px 12px; border-radius: var(--r-s); cursor: pointer; font-size: 14px;
}
.palette-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item span.faible { font-size: 12.5px; white-space: nowrap; flex: none; }
.palette-item.on { background: var(--accent-doux); }
.palette-item.on span:first-child { font-weight: 600; }
.palette-vide { padding: 26px; text-align: center; color: var(--attenue); font-size: 14px; }
#palette-pied {
  display: flex; gap: 16px; padding: 9px 16px;
  border-top: 1px solid var(--bordure); background: var(--surface-2);
  font-size: 12px; color: var(--faible);
}
#palette-pied span { display: inline-flex; align-items: center; gap: 5px; }

/* ═══════════════════ Messages ═══════════════════ */

#messages {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
  transform: translateX(-50%); z-index: 80;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none; width: max-content; max-width: calc(100vw - 32px);
}
.message {
  display: flex; align-items: center; gap: 12px;
  background: var(--texte); color: var(--fond);
  padding: 9px 10px 9px 17px; border-radius: 999px;
  font-size: 13.5px; font-weight: 500;
  box-shadow: var(--ombre-3);
  animation: monte .2s cubic-bezier(.2, .8, .3, 1);
  pointer-events: auto;
}
.message button {
  border: 0; border-radius: 999px; padding: 4px 12px;
  background: color-mix(in srgb, var(--fond) 22%, transparent);
  color: var(--fond); font-size: 12.5px; font-weight: 600;
}
.message button:hover { background: color-mix(in srgb, var(--fond) 34%, transparent); }
@keyframes monte { from { opacity: 0; transform: translateY(10px); } }

/* ═══════════════════ Graphiques ═══════════════════ */

.boite-graphe { position: relative; }
.graphe { width: 100%; display: block; overflow: visible; touch-action: pan-y; }
.graphe text { font-family: var(--corps); font-variant-numeric: tabular-nums; }
.axe { font-size: 11px; fill: var(--faible); }
.ligne-grille { stroke: var(--grille); stroke-width: 1; }
.ligne-zero { stroke: var(--bordure-2); stroke-width: 1; stroke-dasharray: 3 3; }
.ligne-seuil { stroke: var(--alerte); stroke-width: 1.25; stroke-dasharray: 5 4; opacity: .85; }
.curseur { stroke: var(--bordure-2); stroke-width: 1; }
/* les barres et les libellés sont posés au-dessus des zones de survol :
   sans cela, ils intercepteraient le pointeur et la colonne ne s'allumerait
   jamais quand on vise précisément une barre */
.graphe .barre, .graphe text { pointer-events: none; }
.graphe .colonne { transition: fill .12s; }

.legende { display: flex; flex-wrap: wrap; gap: 5px 18px; font-size: 12.5px; color: var(--attenue); margin-top: 10px; }
.legende span { display: inline-flex; align-items: center; }

.infobulle {
  position: absolute; pointer-events: none;
  background: var(--surface); border: 1px solid var(--bordure-2);
  border-radius: var(--r); box-shadow: var(--ombre-3);
  padding: 9px 12px; font-size: 12.5px; min-width: 150px; z-index: 10;
  transition: opacity .1s;
}
.infobulle .t { font-weight: 600; margin-bottom: 4px; font-size: 12px; }
.infobulle .l { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; padding: 1px 0; }

/* ═══════════════════ Constats ═══════════════════ */

.constats { display: grid; gap: 10px; }
.constat {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  gap: 2px 12px;
  align-items: start;
  padding: 12px 14px;
  border: 1px solid var(--bordure);
  border-radius: var(--r);
  background: var(--surface-2);
  transition: border-color .12s, background .12s;
}
.constat:hover { border-color: var(--bordure-2); }
.constat .marque-ton {
  grid-row: span 2;
  width: 26px; height: 26px;
  border-radius: 8px;
  display: grid; place-items: center;
  flex: none;
}
.constat .marque-ton svg { width: 15px; height: 15px; }
.constat b { font-size: 14px; font-weight: 600; }
.constat p { margin: 0; font-size: 13px; color: var(--attenue); grid-column: 2 / 4; }
.constat .btn { grid-row: span 2; align-self: center; }
.constat.info .marque-ton { background: var(--accent-doux); color: var(--accent-fort); }
.constat.attention { background: var(--alerte-fond); border-color: color-mix(in srgb, var(--alerte) 28%, var(--bordure)); }
.constat.attention .marque-ton { background: color-mix(in srgb, var(--alerte) 22%, transparent); color: var(--alerte-texte); }
.constat.bien { background: var(--revenu-fond); border-color: color-mix(in srgb, var(--revenu) 24%, var(--bordure)); }
.constat.bien .marque-ton { background: color-mix(in srgb, var(--revenu) 20%, transparent); color: var(--revenu-texte); }
@media (max-width: 560px) {
  .constat { grid-template-columns: 26px minmax(0, 1fr); }
  .constat .btn { display: none; }
  .constat p { grid-column: 2 / 3; }
}

/* ═══════════════════ Calendrier ═══════════════════ */

.cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal-jour-nom { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faible); font-weight: 700; text-align: center; padding-bottom: 2px; }
.cal-case {
  border: 1px solid var(--bordure); border-radius: 10px;
  background: var(--surface); min-height: 74px;
  padding: 6px 7px; display: flex; flex-direction: column; gap: 3px;
  text-align: left; font: inherit; color: inherit;
  transition: border-color .12s, transform .08s, box-shadow .12s;
}
.cal-case:hover { border-color: var(--bordure-2); box-shadow: var(--ombre-2); }
.cal-case.vide { background: none; border-color: transparent; pointer-events: none; }
.cal-case.hors { opacity: .45; }
.cal-case .jour { font-size: 12px; font-weight: 600; color: var(--attenue); font-variant-numeric: tabular-nums; }
.cal-case.aujourdhui { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cal-case.aujourdhui .jour { color: var(--accent); }
.cal-case .mv { font-size: 11.5px; font-variant-numeric: tabular-nums; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-case .solde { margin-top: auto; font-size: 10.5px; color: var(--faible); font-variant-numeric: tabular-nums; }
.cal-case.rouge { background: var(--depense-fond); border-color: color-mix(in srgb, var(--depense) 30%, var(--bordure)); }
@media (max-width: 620px) {
  .cal-case { min-height: 58px; padding: 4px 5px; }
  .cal-case .mv, .cal-case .solde { display: none; }
  .cal-case .points { display: flex; gap: 2px; flex-wrap: wrap; }
}
.cal-case .points { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
.cal-case .points i { width: 5px; height: 5px; border-radius: 999px; display: block; }

/* ═══════════════════ Divers ═══════════════════ */

.vide { text-align: center; padding: 38px 20px; color: var(--attenue); font-size: 14px; }
.vide p { margin: 0 auto 14px; max-width: 56ch; }
.vide .titre-vide { font-size: 17px; color: var(--texte); font-family: var(--display); font-weight: 700; margin-bottom: 8px; }

ul.agenda { list-style: none; margin: 0; padding: 0; }
ul.agenda li { display: flex; align-items: center; gap: 11px; padding: 8px 0; border-bottom: 1px solid var(--grille); font-size: 14px; }
ul.agenda li:last-child { border-bottom: 0; }
ul.agenda .quand { width: 64px; flex: none; font-size: 12.5px; color: var(--attenue); font-variant-numeric: tabular-nums; }
ul.agenda .quoi { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.agenda .combien { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }

.sep { height: 1px; background: var(--bordure); margin: 4px 0; }
.rangee { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rangee.fin { justify-content: flex-end; }
.pousse { margin-left: auto; }

kbd {
  font-family: var(--corps); font-size: 11.5px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--bordure-2);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--attenue);
}

@media print {
  #rail, header#tete, .btn, #messages { display: none !important; }
  #appli { grid-template-columns: minmax(0, 1fr); }
  .carte { break-inside: avoid; box-shadow: none; }
}
</style>
</head>
<body>

<!-- Jeu d'icônes : neuf traits pour neuf vues, plus les quelques signes
     réutilisés dans les bandeaux et les boutons. Un seul jeu, référencé
     par <use>, plutôt qu'un dessin recopié à chaque appel. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="ic-tableau" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/>
    </g>
    <g id="ic-flux" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 20V7M7 4 4 7.5M7 4l3 3.5"/><path d="M17 4v13M17 20l-3-3.5M17 20l3-3.5"/>
    </g>
    <g id="ic-projection" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 20h18"/><path d="M4 15l5-5 4 3.5L20 5"/><circle cx="20" cy="5" r="1.6" fill="currentColor" stroke="none"/>
    </g>
    <g id="ic-calendrier" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>
    </g>
    <g id="ic-suivi" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12h4l2.5-6 3.5 12 2.5-6h4.5"/>
    </g>
    <g id="ic-categories" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5l6 6"/>
    </g>
    <g id="ic-objectifs" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
    </g>
    <g id="ic-scenarios" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 20V8a3 3 0 0 1 3-3h9"/><path d="M15 2l3 3-3 3"/><path d="M6 14h6a3 3 0 0 0 3-3v-1"/>
    </g>
    <g id="ic-comptes" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19"/><path d="M17 15.5h1.5"/>
    </g>
    <g id="ic-reglages" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>
    </g>
    <g id="ic-chercher" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
    </g>
    <g id="ic-theme" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/>
    </g>
    <g id="ic-aide" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 2.9c-.6.2-.8.7-.8 1.3v.4"/><path d="M12 17h.01"/>
    </g>
    <g id="ic-alerte" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.8 2.6 20h18.8z"/><path d="M12 9.5v4.2M12 17h.01"/>
    </g>
    <g id="ic-ok" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><path d="m8.3 12.2 2.6 2.6 4.8-5.4"/>
    </g>
    <g id="ic-oeil" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M12 7.6v5M12 16.2h.01"/>
    </g>
    <g id="ic-crayon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/>

      <path d="M6 6l12 12M18 6 6 18"/>

      <path d="M9 5v14M15 5v14"/>

      <path d="M8 5.5v13l11-6.5z"/>

</svg>

<div id="appli">

  <aside id="rail">
    <div class="marque">
      <span class="logo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent-texte)"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 17 9 11l4 3 7.5-8.5"/><circle cx="20.5" cy="5.5" r="1.8" fill="var(--accent-texte)" stroke="none"/>
        </svg>
      </span>
      <span>
        <span class="nom">Prévoyant</span>
        <span class="sous-nom">Budget prévisionnel</span>
      </span>
    </div>

    <nav id="onglets" aria-label="Sections">
      <button data-vue="tableau" class="on"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-tableau"/></svg>Tableau de bord</button>
      <button data-vue="flux"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-flux"/></svg>Revenus &amp; dépenses</button>
      <button data-vue="projection"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-projection"/></svg>Projection</button>
      <button data-vue="calendrier"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-calendrier"/></svg>Calendrier</button>
      <button data-vue="suivi"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-suivi"/></svg>Suivi</button>
      <button data-vue="categories"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-categories"/></svg>Catégories</button>
      <button data-vue="objectifs"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-objectifs"/></svg>Objectifs</button>
      <button data-vue="scenarios"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-scenarios"/></svg>Scénarios</button>
      <button data-vue="comptes"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-comptes"/></svg>Comptes</button>
      <button data-vue="reglages"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-reglages"/></svg>Réglages</button>
    </nav>

    <div class="rail-pied">
      <div class="l"><span>Aujourd'hui</span><b id="rail-solde">—</b></div>
      <div class="sep-fin"></div>
      <div class="l"><span id="rail-fin-etiq">À l'horizon</span><b id="rail-fin">—</b></div>
      <div class="l"><span>Chaque mois</span><b id="rail-net">—</b></div>
    </div>
  </aside>

  <div id="zone">
    <header id="tete">
      <div class="tete-titre">
        <span class="eyebrow" id="tete-eyebrow">Prévoyant</span>
        <h1 id="tete-titre">Tableau de bord</h1>
      </div>
      <div class="tete-outils">
        <span class="pilule masque" id="pilule-solde" title="Solde de départ, tous comptes confondus">
          Aujourd'hui <b id="pilule-solde-val">—</b>
        </span>
        <label class="pilule select">
