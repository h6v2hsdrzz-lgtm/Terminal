<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prévoyant — budget prévisionnel</title>
<meta name="description" content="Estimation de tous les revenus et dépenses à venir : flux récurrents, solde projeté au jour près, enveloppes, objectifs d'épargne et scénarios comparés. Tout reste dans le navigateur.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prévoyant">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f141a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">

<style>
/* ════════════════════════════════════════════════════════════════════
   Prévoyant — un seul fichier, aucune dépendance, aucun réseau.

   Tout ce qui est affiché est calculé à partir d'une seule liste : les
   flux. Un flux dit « combien, à partir de quand, à quel rythme, et
   jusqu'à quand » ; le reste — solde jour par jour, mois par mois,
   enveloppes, objectifs, scénarios — en découle par projection.

   Les huit teintes de catégorie sont espacées en teinte et tenues dans
   une bande de clarté étroite, séparément pour chaque thème, pour
   rester lisibles côte à côte dans un anneau ou une pile de barres.
   ════════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: light;

  --fond: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eaedf1;
  --surface-3: #dfe3e9;
  --bordure: #e0e4ea;
  --bordure-2: #c3cad4;

  --texte: #15202b;
  --attenue: #56626f;
  --faible: #8b95a1;

  --serie-1: #3b6ea8;
  --serie-2: #2f8f6b;
  --serie-3: #b0740f;
  --serie-4: #8b57b0;
  --serie-5: #bd4f45;
  --serie-6: #1c8795;
  --serie-7: #75792a;
  --serie-8: #b0537c;

  --revenu: #2f8f6b;
  --revenu-texte: #227053;
  --depense: #bd4f45;
  --depense-texte: #a03c33;
  --epargne: #3b6ea8;
  --alerte: #b0740f;
  --alerte-texte: #8a5a09;

  --action: #1f4f7a;
  --action-fort: #163b5c;
  --action-texte: #ffffff;

  --grille: #e6e9ee;
  --ombre: 0 1px 2px rgb(21 32 43 / .06), 0 12px 30px -16px rgb(21 32 43 / .28);
  --ombre-forte: 0 2px 6px rgb(21 32 43 / .1), 0 26px 60px -24px rgb(21 32 43 / .4);

  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --texte-fam: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: #0f141a;
    --surface: #161d26;
    --surface-2: #1c2531;
    --surface-3: #26313e;
    --bordure: #232e3b;
    --bordure-2: #35414f;
    --texte: #dce3ea;
    --attenue: #94a0ad;
    --faible: #5e6a78;
    --serie-1: #5b93d6;
    --serie-2: #35a880;
    --serie-3: #c8912c;
    --serie-4: #a97cd4;
    --serie-5: #d96f63;
    --serie-6: #2ba7b6;
    --serie-7: #9aa243;
    --serie-8: #d0789e;
    --revenu: #35a880;
    --revenu-texte: #4dc19a;
    --depense: #d96f63;
    --depense-texte: #e58a7e;
    --epargne: #5b93d6;
    --alerte: #c8912c;
    --alerte-texte: #dcaa45;
    --action: #5b93d6;
    --action-fort: #7aabe4;
    --action-texte: #0f141a;
    --grille: #212b37;
    --ombre: 0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -18px rgb(0 0 0 / .75);
    --ombre-forte: 0 2px 8px rgb(0 0 0 / .5), 0 30px 70px -28px rgb(0 0 0 / .9);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --fond: #0f141a;
  --surface: #161d26;
  --surface-2: #1c2531;
  --surface-3: #26313e;
  --bordure: #232e3b;
  --bordure-2: #35414f;
  --texte: #dce3ea;
  --attenue: #94a0ad;
  --faible: #5e6a78;
  --serie-1: #5b93d6;
  --serie-2: #35a880;
  --serie-3: #c8912c;
  --serie-4: #a97cd4;
  --serie-5: #d96f63;
  --serie-6: #2ba7b6;
  --serie-7: #9aa243;
  --serie-8: #d0789e;
  --revenu: #35a880;
  --revenu-texte: #4dc19a;
  --depense: #d96f63;
  --depense-texte: #e58a7e;
  --epargne: #5b93d6;
  --alerte: #c8912c;
  --alerte-texte: #dcaa45;
  --action: #5b93d6;
  --action-fort: #7aabe4;
  --action-texte: #0f141a;
  --grille: #212b37;
  --ombre: 0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -18px rgb(0 0 0 / .75);
  --ombre-forte: 0 2px 8px rgb(0 0 0 / .5), 0 30px 70px -28px rgb(0 0 0 / .9);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fond);
  color: var(--texte);
  font-family: var(--texte-fam);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, .chiffre { font-family: var(--display); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.015em; }

.chiffre, table td.num, table th.num, .mono {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--action); }

:focus-visible {
  outline: 2px solid var(--action);
  outline-offset: 2px;
  border-radius: 4px;
}

.masque { display: none !important; }
.dim { color: var(--attenue); }
.faible { color: var(--faible); }
.pos { color: var(--revenu-texte); }
.neg { color: var(--depense-texte); }

/* ─────────────────────── En-tête ─────────────────────── */

header#tete {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--fond) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bordure);
  padding: 10px max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
}

.tete-haut {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 1180px;
  margin: 0 auto;
  flex-wrap: wrap;
}

.marque {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -.02em;
  margin-right: auto;
}
.marque svg { display: block; }
.marque em { font-style: normal; color: var(--attenue); font-weight: 500; }

.tete-outils { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.pilule {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  color: var(--attenue);
  white-space: nowrap;
}
.pilule b { color: var(--texte); font-weight: 600; }

button.outil {
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 13px;
  font-weight: 500;
  color: var(--attenue);
  transition: background .12s, color .12s, border-color .12s;
}
button.outil:hover { background: var(--surface-2); color: var(--texte); }

nav#onglets {
  display: flex;
  gap: 2px;
  max-width: 1180px;
  margin: 8px auto 0;
  overflow-x: auto;
  scrollbar-width: none;
}
nav#onglets::-webkit-scrollbar { display: none; }

nav#onglets button {
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 9px 13px 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--attenue);
  white-space: nowrap;
  border-radius: 6px 6px 0 0;
  transition: color .12s, border-color .12s;
}
nav#onglets button:hover { color: var(--texte); }
nav#onglets button.on { color: var(--texte); border-bottom-color: var(--action); font-weight: 600; }

/* ─────────────────────── Structure ─────────────────────── */

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 20px max(14px, env(safe-area-inset-left)) 90px max(14px, env(safe-area-inset-right));
}

.carte {
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: var(--r);
  padding: 16px 18px;
  box-shadow: var(--ombre);
}

.carte-tete {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.carte-tete h2 { font-size: 15px; letter-spacing: 0; }
.carte-tete h3 { font-size: 14px; letter-spacing: 0; }
.carte-tete .droite { margin-left: auto; font-size: 13px; color: var(--attenue); }
.sous { font-size: 13px; color: var(--attenue); margin: 0 0 12px; }

.grille { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 900px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3, .g-2-1 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .g2, .g4 { grid-template-columns: minmax(0, 1fr); }
}

/* ─────────────────────── Indicateurs ─────────────────────── */

.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .etiq {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--faible);
  font-weight: 600;
}
.kpi .val {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.kpi .note { font-size: 12.5px; color: var(--attenue); }

.jauge {
  height: 6px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 6px;
}
.jauge > i { display: block; height: 100%; border-radius: 999px; }

/* ─────────────────────── Bandeau d'alerte ─────────────────────── */

.bandeau {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  border-radius: var(--r);
  padding: 13px 16px;
  border: 1px solid;
  font-size: 14px;
}
.bandeau .ic { font-size: 17px; line-height: 1.2; }
.bandeau b { font-weight: 600; }
.bandeau.rouge { background: color-mix(in srgb, var(--depense) 12%, var(--surface)); border-color: color-mix(in srgb, var(--depense) 40%, var(--bordure)); }
.bandeau.ambre { background: color-mix(in srgb, var(--alerte) 13%, var(--surface)); border-color: color-mix(in srgb, var(--alerte) 40%, var(--bordure)); }
.bandeau.vert  { background: color-mix(in srgb, var(--revenu) 11%, var(--surface)); border-color: color-mix(in srgb, var(--revenu) 36%, var(--bordure)); }

/* ─────────────────────── Tableaux ─────────────────────── */

.tableau-boite { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--faible);
  font-weight: 600;
  padding: 0 10px 7px;
  white-space: nowrap;
  border-bottom: 1px solid var(--bordure);
}
table td { padding: 9px 10px; border-bottom: 1px solid var(--grille); vertical-align: middle; }
table tr:last-child td { border-bottom: 0; }
table .num { text-align: right; font-variant-numeric: tabular-nums; }
table tbody tr.cliquable { cursor: pointer; }
table tbody tr.cliquable:hover { background: var(--surface-2); }
table tr.repli td { background: var(--surface-2); padding: 0; }
table tr.total td { font-weight: 600; border-top: 1px solid var(--bordure-2); }

.puce {
  display: inline-block;
  width: 9px; height: 9px;
  border-radius: 3px;
  margin-right: 7px;
  vertical-align: -1px;
  flex: none;
}

.etiquette {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--bordure);
  color: var(--attenue);
  white-space: nowrap;
}
.etiquette.rev { background: color-mix(in srgb, var(--revenu) 14%, transparent); border-color: color-mix(in srgb, var(--revenu) 34%, transparent); color: var(--revenu-texte); }
.etiquette.dep { background: color-mix(in srgb, var(--depense) 14%, transparent); border-color: color-mix(in srgb, var(--depense) 34%, transparent); color: var(--depense-texte); }
.etiquette.off { opacity: .65; text-decoration: line-through; }

/* ─────────────────────── Boutons ─────────────────────── */

.btn {
  border: 1px solid var(--bordure-2);
  background: var(--surface);
  border-radius: 9px;
  padding: 8px 15px;
  font-size: 14px;
  font-weight: 500;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primaire {
  background: var(--action);
  border-color: var(--action);
  color: var(--action-texte);
  font-weight: 600;
}
.btn.primaire:hover { background: var(--action-fort); border-color: var(--action-fort); }
.btn.danger { color: var(--depense-texte); border-color: color-mix(in srgb, var(--depense) 45%, var(--bordure)); }
.btn.danger:hover { background: color-mix(in srgb, var(--depense) 12%, var(--surface)); }
.btn.petit { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
.btn.fantome { border-color: transparent; background: none; color: var(--attenue); }
.btn.fantome:hover { background: var(--surface-2); color: var(--texte); }

.segments {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--bordure);
  border-radius: 9px;
  padding: 2px;
  gap: 2px;
  flex-wrap: wrap;
}
.segments button {
  border: 0;
  background: none;
  border-radius: 7px;
  padding: 5px 11px;
  font-size: 13px;
  font-weight: 500;
  color: var(--attenue);
}
.segments button.on { background: var(--surface); color: var(--texte); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

/* ─────────────────────── Formulaires ─────────────────────── */

label.champ { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--attenue); }
label.champ > span.ttl { font-weight: 600; color: var(--texte); font-size: 13px; }
label.champ .aide { font-size: 12px; color: var(--faible); }

input[type="text"], input[type="number"], input[type="date"], select, textarea {
  background: var(--surface);
  border: 1px solid var(--bordure-2);
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 14px;
  width: 100%;
  min-width: 0;
}
textarea { resize: vertical; min-height: 60px; }
input:disabled, select:disabled { background: var(--surface-2); color: var(--faible); }

.ligne-champs { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ligne-champs.trois { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 620px) { .ligne-champs, .ligne-champs.trois { grid-template-columns: minmax(0, 1fr); } }

.case { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.case input { width: auto; }

/* ─────────────────────── Dialogue ─────────────────────── */

#voile {
  position: fixed;
  inset: 0;
  background: rgb(10 15 21 / .5);
  backdrop-filter: blur(3px);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#voile.masque { display: none !important; }

#dialogue {
  background: var(--surface);
  border: 1px solid var(--bordure);
  border-radius: 16px;
  box-shadow: var(--ombre-forte);
  width: min(620px, 100%);
  max-height: min(88vh, 900px);
  display: flex;
  flex-direction: column;
}
#dialogue-tete {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--bordure);
}
#dialogue-tete h2 { font-size: 16px; margin-right: auto; }
#dialogue-corps { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
#dialogue-pied {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 13px 18px;
  border-top: 1px solid var(--bordure);
  flex-wrap: wrap;
}
#dialogue-pied .gauche { margin-right: auto; }

/* ─────────────────────── Messages ─────────────────────── */

#messages {
  position: fixed;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.message {
  background: var(--texte);
  color: var(--fond);
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 500;
  box-shadow: var(--ombre-forte);
  animation: monte .18s ease-out;
}
@keyframes monte { from { opacity: 0; transform: translateY(8px); } }

/* ─────────────────────── Graphiques ─────────────────────── */

.graphe { width: 100%; display: block; overflow: visible; touch-action: pan-y; }
.graphe text { font-family: var(--texte-fam); font-variant-numeric: tabular-nums; }
.axe { font-size: 11px; fill: var(--faible); }
.ligne-grille { stroke: var(--grille); stroke-width: 1; }
.ligne-zero { stroke: var(--bordure-2); stroke-width: 1; stroke-dasharray: 3 3; }
.ligne-seuil { stroke: var(--alerte); stroke-width: 1; stroke-dasharray: 5 4; opacity: .8; }
.curseur { stroke: var(--bordure-2); stroke-width: 1; }

.legende { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--attenue); margin-top: 8px; }
.legende span { display: inline-flex; align-items: center; }

.infobulle {
  position: absolute;
  pointer-events: none;
  background: var(--surface);
  border: 1px solid var(--bordure-2);
  border-radius: 9px;
  box-shadow: var(--ombre-forte);
  padding: 8px 11px;
  font-size: 12.5px;
  min-width: 140px;
  z-index: 10;
  transition: opacity .1s;
}
.infobulle .t { font-weight: 600; margin-bottom: 3px; font-size: 12px; }
.infobulle .l { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.boite-graphe { position: relative; }

/* ─────────────────────── Divers ─────────────────────── */

.vide {
  text-align: center;
  padding: 34px 18px;
  color: var(--attenue);
  font-size: 14px;
}
.vide p { margin: 0 0 12px; }

ul.agenda { list-style: none; margin: 0; padding: 0; }
ul.agenda li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--grille);
  font-size: 14px;
}
ul.agenda li:last-child { border-bottom: 0; }
ul.agenda .quand { width: 62px; flex: none; font-size: 12.5px; color: var(--attenue); font-variant-numeric: tabular-nums; }
ul.agenda .quoi { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.agenda .combien { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }

.sep { height: 1px; background: var(--bordure); margin: 4px 0; }

.pile { display: flex; flex-direction: column; gap: 14px; }
.rangee { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rangee.fin { justify-content: flex-end; }

@media print {
  header#tete, nav#onglets, .btn, #messages { display: none !important; }
  .carte { break-inside: avoid; box-shadow: none; }
}
</style>
</head>
<body>

<header id="tete">
  <div class="tete-haut">
    <div class="marque">

<script id="code">
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   1. Constantes et valeurs par défaut
   ══════════════════════════════════════════════════════════════════════ */

const CLE_ETAT = "prevoyant:etat:v1";
const CLE_THEME = "prevoyant:theme";
const VERSION_ETAT = 1;

const TEINTES_MAX = 8;
const HORIZONS = [3, 6, 12, 24, 36, 60];
const OCCURRENCES_MAX = 4000;   // garde-fou : un flux ne peut pas boucler sans fin

const DEVISES = {
  EUR: { symbole: "€", nom: "Euro" },
  CHF: { symbole: "CHF", nom: "Franc suisse" },
  USD: { symbole: "$", nom: "Dollar américain" },
  CAD: { symbole: "$ CA", nom: "Dollar canadien" },
  GBP: { symbole: "£", nom: "Livre sterling" },
  MAD: { symbole: "DH", nom: "Dirham marocain" },
};

/* Un rythme se décrit soit en jours, soit en mois — jamais les deux. Les
   rythmes mensuels sont comptés en mois pour que le 31 reste le 31 quand le
   mois le permet, au lieu de dériver de quelques jours à chaque échéance. */
const FREQUENCES = [
  { id: "ponctuel",    nom: "Une seule fois",       court: "1×",     parAn: 0 },
  { id: "hebdo",       nom: "Chaque semaine",       court: "hebdo",  parAn: 365.2425 / 7,  jours: 7 },
  { id: "quinzaine",   nom: "Toutes les 2 semaines", court: "2 sem.", parAn: 365.2425 / 14, jours: 14 },
  { id: "mensuel",     nom: "Chaque mois",          court: "mensuel", parAn: 12, mois: 1 },
  { id: "bimestriel",  nom: "Tous les 2 mois",      court: "2 mois", parAn: 6,  mois: 2 },
  { id: "trimestriel", nom: "Chaque trimestre",     court: "trim.",  parAn: 4,  mois: 3 },
  { id: "semestriel",  nom: "Chaque semestre",      court: "sem.",   parAn: 2,  mois: 6 },
  { id: "annuel",      nom: "Chaque année",         court: "annuel", parAn: 1,  mois: 12 },
];
const FREQ = Object.fromEntries(FREQUENCES.map((f) => [f.id, f]));

const PARAMETRES_DEFAUT = {
  titre: "Mon budget",
  devise: "EUR",
  horizon: 24,
  seuilAlerte: 0,
  arrondi: true,          // masquer les centimes
  debutProjection: null,  // null = aujourd'hui
};

const CATEGORIES_DEFAUT = [
  { id: "cat-salaire",   nom: "Salaire",            type: "revenu",  teinte: 2 },
  { id: "cat-primes",    nom: "Primes & extras",    type: "revenu",  teinte: 6 },
  { id: "cat-aides",     nom: "Aides & allocations", type: "revenu", teinte: 4 },
  { id: "cat-logement",  nom: "Logement",           type: "depense", teinte: 1, plafond: null },
  { id: "cat-courses",   nom: "Courses",            type: "depense", teinte: 2, plafond: null },
  { id: "cat-energie",   nom: "Énergie & eau",      type: "depense", teinte: 3, plafond: null },
  { id: "cat-transport", nom: "Transport",          type: "depense", teinte: 4, plafond: null },
  { id: "cat-sante",     nom: "Santé",              type: "depense", teinte: 6, plafond: null },
  { id: "cat-abos",      nom: "Abonnements",        type: "depense", teinte: 8, plafond: null },
  { id: "cat-loisirs",   nom: "Loisirs & sorties",  type: "depense", teinte: 5, plafond: null },
  { id: "cat-impots",    nom: "Impôts & taxes",     type: "depense", teinte: 7, plafond: null },
  { id: "cat-credits",   nom: "Crédits",            type: "depense", teinte: 5, plafond: null },
  { id: "cat-epargne",   nom: "Épargne",            type: "depense", teinte: 1, plafond: null },
  { id: "cat-divers",    nom: "Divers",             type: "depense", teinte: 7, plafond: null },
];

/* ══════════════════════════════════════════════════════════════════════
   2. Dates — tout en ISO « AAAA-MM-JJ », tout en UTC.

   Le fuseau ne sert à rien ici : une échéance est un jour du calendrier,
   pas un instant. Passer par UTC évite qu'un décalage horaire fasse
   glisser une échéance de la veille au lendemain.
   ══════════════════════════════════════════════════════════════════════ */

function deuxChiffres(n) { return String(n).padStart(2, "0"); }

function estIso(v) {
  if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const [a, m, j] = v.split("-").map(Number);
  return m >= 1 && m <= 12 && j >= 1 && j <= joursDansMois(a, m);
}

function joursDansMois(annee, mois) { return new Date(Date.UTC(annee, mois, 0)).getUTCDate(); }

function versUTC(iso) {
  const [a, m, j] = iso.split("-").map(Number);
  return Date.UTC(a, m - 1, j);
}

function versIso(ms) {
  const d = new Date(ms);
  return d.getUTCFullYear() + "-" + deuxChiffres(d.getUTCMonth() + 1) + "-" + deuxChiffres(d.getUTCDate());
}

function aujourdhui() {
  const d = new Date();
  return d.getFullYear() + "-" + deuxChiffres(d.getMonth() + 1) + "-" + deuxChiffres(d.getDate());
}

function ajouterJours(iso, n) { return versIso(versUTC(iso) + n * 86400000); }

/** Ajoute des mois en gardant le jour d'ancrage, rabattu sur le dernier jour
 *  du mois quand il n'existe pas (un 31 janvier + 1 mois donne le 28 ou 29). */
function ajouterMois(iso, n, ancre) {
  const [a, m, j] = iso.split("-").map(Number);
  const total = a * 12 + (m - 1) + n;
  const na = Math.floor(total / 12);
  const nm = total - na * 12 + 1;
  const jour = Math.min(ancre || j, joursDansMois(na, nm));
  return na + "-" + deuxChiffres(nm) + "-" + deuxChiffres(jour);
}

function joursEntre(a, b) { return Math.round((versUTC(b) - versUTC(a)) / 86400000); }

/** Nombre de mois entiers écoulés de `a` à `b` (négatif si `b` précède `a`). */
function moisEntre(a, b) {
  const [aa, am, aj] = a.split("-").map(Number);
  const [ba, bm, bj] = b.split("-").map(Number);
  let n = (ba - aa) * 12 + (bm - am);
  if (bj < aj) n -= 1;
  return n;
}

function cleMois(iso) { return iso.slice(0, 7); }
function debutDeMois(cle) { return cle + "-01"; }
function finDeMois(cle) {
  const [a, m] = cle.split("-").map(Number);
  return cle + "-" + deuxChiffres(joursDansMois(a, m));
}
function moisSuivant(cle) {
  const [a, m] = cle.split("-").map(Number);
  return m === 12 ? (a + 1) + "-01" : a + "-" + deuxChiffres(m + 1);
}

const MOIS_NOMS = ["janvier", "février", "mars", "avril", "mai", "juin",
  "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const MOIS_COURTS = ["janv.", "févr.", "mars", "avr.", "mai", "juin",
  "juil.", "août", "sept.", "oct.", "nov.", "déc."];

function libelleMois(cle, court) {
  const [a, m] = cle.split("-").map(Number);
  return (court ? MOIS_COURTS[m - 1] : MOIS_NOMS[m - 1]) + " " + a;
}
function libelleDate(iso, court) {
  const [a, m, j] = iso.split("-").map(Number);
  return j + " " + (court ? MOIS_COURTS[m - 1] : MOIS_NOMS[m - 1]) + (court ? "" : " " + a);
}
function libelleJourMois(iso) {
  const [, m, j] = iso.split("-").map(Number);
  return j + " " + MOIS_COURTS[m - 1];
}

/** « dans 3 jours », « demain », « aujourd'hui » — pour l'agenda. */
function delaiTexte(iso, depuis) {
  const n = joursEntre(depuis, iso);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return "demain";
  if (n < 0) return "passé";
  if (n < 7) return "dans " + n + " j";
  return libelleJourMois(iso);
}

/* ══════════════════════════════════════════════════════════════════════
   3. Nombres et argent
   ══════════════════════════════════════════════════════════════════════ */

let _formats = {};

function devise() { return (ETAT.parametres && ETAT.parametres.devise) || "EUR"; }

function formatteur(decimales) {
  const cle = devise() + ":" + decimales;
  if (!_formats[cle]) {
    _formats[cle] = new Intl.NumberFormat("fr-FR", {
      style: "currency", currency: devise(),
      minimumFractionDigits: decimales, maximumFractionDigits: decimales,
    });
  }
  return _formats[cle];
}

function argent(v, options) {
  const o = options || {};
  if (v === null || v === undefined || !isFinite(v)) return "—";
  const dec = o.decimales !== undefined ? o.decimales
    : (ETAT.parametres && ETAT.parametres.arrondi ? 0 : 2);
  let s = formatteur(dec).format(o.signe ? Math.abs(v) : v);
  if (o.signe) s = (v < 0 ? "−" : "+") + " " + s;
  return s;
}

/** Version courte pour les axes : 1 240 → « 1,2 k ». */
function argentCourt(v) {
  const s = DEVISES[devise()] ? DEVISES[devise()].symbole : "";
  const a = Math.abs(v);
  const signe = v < 0 ? "−" : "";
  if (a >= 1000000) return signe + (a / 1000000).toFixed(a >= 10000000 ? 0 : 1).replace(".", ",") + " M" + s;
  if (a >= 1000) return signe + (a / 1000).toFixed(a >= 10000 ? 0 : 1).replace(".", ",") + " k" + s;
  return signe + Math.round(a) + " " + s;
}

function pourcent(v, decimales) {
  if (v === null || !isFinite(v)) return "—";
  const arrondi = Math.round(v * Math.pow(10, decimales || 0)) / Math.pow(10, decimales || 0);
  // le même signe moins que dans les montants, pour ne pas mélanger deux traits
  return arrondi.toLocaleString("fr-FR").replace("-", "− ") + " %";
}

function nombre(v, decimales) {
  if (v === null || !isFinite(v)) return "—";
  return v.toLocaleString("fr-FR", { minimumFractionDigits: decimales || 0, maximumFractionDigits: decimales || 0 });
}

function arrondi2(v) { return Math.round(v * 100) / 100; }

function identifiant(prefixe) {
  return prefixe + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function teinte(n) { return "var(--serie-" + (((Number(n) || 1) - 1) % TEINTES_MAX + 1) + ")"; }

/* ══════════════════════════════════════════════════════════════════════
   4. État — chargement, validation, sauvegarde

   `normaliser` est la seule porte d'entrée : état relu du navigateur,
   fichier importé, jeu de démonstration. Tout ce qui entre y passe, donc
   un fichier abîmé donne une application vide, jamais une application
   cassée.
   ══════════════════════════════════════════════════════════════════════ */

function nombreSur(v, defaut, min, max) {
  const n = typeof v === "string" ? Number(v.replace(",", ".")) : Number(v);
  if (!isFinite(n)) return defaut;
  if (min !== undefined && n < min) return min;
  if (max !== undefined && n > max) return max;
  return n;
}

function texteSur(v, defaut, max) {
  if (typeof v !== "string") return defaut;
  const t = v.trim();
  return t ? t.slice(0, max || 80) : defaut;
}

function normaliserCategorie(brut, i) {
  if (!brut || typeof brut !== "object") return null;
  const type = brut.type === "revenu" ? "revenu" : "depense";
  return {
    id: texteSur(brut.id, identifiant("cat"), 60),
    nom: texteSur(brut.nom, "Catégorie " + (i + 1), 40),
    type,
    teinte: nombreSur(brut.teinte, (i % TEINTES_MAX) + 1, 1, TEINTES_MAX),
    plafond: brut.plafond === null || brut.plafond === undefined ? null : nombreSur(brut.plafond, null, 0),
  };
}

function normaliserCompte(brut, i) {
  if (!brut || typeof brut !== "object") return null;
  return {
    id: texteSur(brut.id, identifiant("cpt"), 60),
    nom: texteSur(brut.nom, "Compte " + (i + 1), 40),
    type: brut.type === "epargne" ? "epargne" : "courant",
    solde: arrondi2(nombreSur(brut.solde, 0)),
    teinte: nombreSur(brut.teinte, (i % TEINTES_MAX) + 1, 1, TEINTES_MAX),
  };
}

function normaliserFlux(brut, i, comptes, categories) {
  if (!brut || typeof brut !== "object") return null;
  let type = brut.type === "revenu" ? "revenu" : brut.type === "virement" ? "virement" : "depense";
  // un virement suppose deux comptes distincts ; à défaut, c'est une dépense
  if (type === "virement" && comptes.length < 2) type = "depense";
  const frequence = FREQ[brut.frequence] ? brut.frequence : "mensuel";
  const debut = estIso(brut.debut) ? brut.debut : aujourdhui();
  let fin = estIso(brut.fin) ? brut.fin : null;
  if (fin && fin < debut) fin = debut;
  const cats = categories.filter((c) => c.type === type);
  const cat = cats.find((c) => c.id === brut.categorieId);
  const cpt = comptes.find((c) => c.id === brut.compteId) || comptes[0];
  let compteDest = null;
  if (type === "virement") {
    const d = comptes.find((c) => c.id === brut.compteDest && c.id !== cpt.id);
    compteDest = d ? d.id : comptes.find((c) => c.id !== cpt.id).id;
  }
  return {
    id: texteSur(brut.id, identifiant("flx"), 60),
    libelle: texteSur(brut.libelle, "Sans nom", 60),
    type,
    // le sens est porté par `type` : un montant est toujours écrit positif
    montant: Math.abs(arrondi2(nombreSur(brut.montant, 0, -1e12, 1e12))),
    categorieId: type === "virement" ? null : (cat ? cat.id : (cats[0] ? cats[0].id : null)),
    compteId: cpt.id,
    compteDest,
    frequence,
    debut,
    fin,
    indexation: nombreSur(brut.indexation, 0, -50, 50),
    actif: brut.actif !== false,
    note: texteSur(brut.note, "", 300),
  };
}

function normaliserObjectif(brut, comptes) {
  if (!brut || typeof brut !== "object") return null;
  const cpt = comptes.find((c) => c.id === brut.compteId);
  return {
    id: texteSur(brut.id, identifiant("obj"), 60),
    nom: texteSur(brut.nom, "Objectif", 50),
    cible: Math.abs(arrondi2(nombreSur(brut.cible, 1000, -1e12, 1e12))),
    dateCible: estIso(brut.dateCible) ? brut.dateCible : ajouterMois(aujourdhui(), 12),
    compteId: cpt ? cpt.id : null,
    teinte: nombreSur(brut.teinte, 1, 1, TEINTES_MAX),
  };
}

function normaliserScenario(brut, i, comptes, categories) {
  if (!brut || typeof brut !== "object") return null;
  const extras = Array.isArray(brut.extras)
    ? brut.extras.map((f, k) => normaliserFlux(f, k, comptes, categories)).filter(Boolean).slice(0, 40)
    : [];
  return {
    id: texteSur(brut.id, identifiant("scn"), 60),
    nom: texteSur(brut.nom, "Scénario " + (i + 1), 50),
    teinte: nombreSur(brut.teinte, ((i + 2) % TEINTES_MAX) + 1, 1, TEINTES_MAX),
    actif: brut.actif !== false,
    ajustRevenus: nombreSur(brut.ajustRevenus, 0, -100, 500),
    ajustDepenses: nombreSur(brut.ajustDepenses, 0, -100, 500),
    soldeDelta: arrondi2(nombreSur(brut.soldeDelta, 0)),
    exclus: Array.isArray(brut.exclus) ? brut.exclus.filter((x) => typeof x === "string").slice(0, 200) : [],
    extras,
  };
}

function normaliser(brut) {
  const src = brut && typeof brut === "object" ? brut : {};
  const p = src.parametres && typeof src.parametres === "object" ? src.parametres : {};

  const parametres = {
    titre: texteSur(p.titre, PARAMETRES_DEFAUT.titre, 60),
    devise: DEVISES[p.devise] ? p.devise : PARAMETRES_DEFAUT.devise,
    horizon: HORIZONS.includes(Number(p.horizon)) ? Number(p.horizon) : PARAMETRES_DEFAUT.horizon,
    seuilAlerte: arrondi2(nombreSur(p.seuilAlerte, 0, 0, 1e12)),
    arrondi: p.arrondi !== false,
    debutProjection: estIso(p.debutProjection) ? p.debutProjection : null,
  };

  let categories = (Array.isArray(src.categories) ? src.categories : CATEGORIES_DEFAUT)
    .map(normaliserCategorie).filter(Boolean).slice(0, 60);
  if (!categories.length) categories = CATEGORIES_DEFAUT.map(normaliserCategorie);
  if (!categories.some((c) => c.type === "revenu")) categories.push(normaliserCategorie(CATEGORIES_DEFAUT[0], 0));
  if (!categories.some((c) => c.type === "depense")) categories.push(normaliserCategorie(CATEGORIES_DEFAUT[3], 3));

  let comptes = (Array.isArray(src.comptes) ? src.comptes : [])
    .map(normaliserCompte).filter(Boolean).slice(0, 20);
  if (!comptes.length) comptes = [{ id: "cpt-courant", nom: "Compte courant", type: "courant", solde: 0, teinte: 1 }];

  const flux = (Array.isArray(src.flux) ? src.flux : [])
    .map((f, i) => normaliserFlux(f, i, comptes, categories)).filter(Boolean).slice(0, 500);

  const objectifs = (Array.isArray(src.objectifs) ? src.objectifs : [])
    .map((o) => normaliserObjectif(o, comptes)).filter(Boolean).slice(0, 40);

  const scenarios = (Array.isArray(src.scenarios) ? src.scenarios : [])
    .map((s, i) => normaliserScenario(s, i, comptes, categories)).filter(Boolean).slice(0, 12);

  return { version: VERSION_ETAT, parametres, comptes, categories, flux, objectifs, scenarios };
}

let ETAT = normaliser(null);

function categorie(id) { return ETAT.categories.find((c) => c.id === id) || null; }
function compte(id) { return ETAT.comptes.find((c) => c.id === id) || null; }
function nomCategorie(id) { const c = categorie(id); return c ? c.nom : "Sans catégorie"; }
function nomCompte(id) { const c = compte(id); return c ? c.nom : "—"; }
function soldeDepart() { return ETAT.comptes.reduce((s, c) => s + c.solde, 0); }
function departProjection() { return ETAT.parametres.debutProjection || aujourdhui(); }

/* ══════════════════════════════════════════════════════════════════════
   5. Le moteur : d'une liste de flux à un solde jour par jour
   ══════════════════════════════════════════════════════════════════════ */

/**
 * Montant d'un flux à une date donnée, revalorisation comprise.
 *
 * Le montant saisi est celui d'aujourd'hui. L'indexation ne s'applique donc
 * qu'à partir de la date de référence de la projection, et par pas d'un an
 * — une augmentation tombe à date anniversaire, elle ne se lisse pas.
 */
function montantA(flux, date, reference) {
  const idx = Number(flux.indexation) || 0;
  if (!idx) return flux.montant;
  const base = reference && reference > flux.debut ? reference : flux.debut;
  const annees = Math.floor(Math.max(0, moisEntre(base, date)) / 12);
  if (!annees) return flux.montant;
  return flux.montant * Math.pow(1 + idx / 100, annees);
}

/**
 * Toutes les échéances d'un flux dans la fenêtre [du, au].
 * Les rythmes sont recalculés depuis la date de début à chaque rang, jamais
 * de proche en proche : un 31 rabattu sur un 28 en février ne contamine pas
 * les mois suivants.
 */
function occurrences(flux, du, au, reference) {
  const res = [];
  if (!flux || !flux.actif || !estIso(flux.debut) || !estIso(du) || !estIso(au)) return res;

  const borneFin = flux.fin && flux.fin < au ? flux.fin : au;
  if (flux.debut > borneFin || du > borneFin) return res;

  const freq = FREQ[flux.frequence] || FREQ.mensuel;

  if (freq.id === "ponctuel") {
    if (flux.debut >= du && flux.debut <= borneFin) {
      res.push({ date: flux.debut, montant: arrondi2(montantA(flux, flux.debut, reference)) });
    }
    return res;
  }

  const ancre = Number(flux.debut.slice(8, 10));
  let k = 0;

  // saut direct au premier rang susceptible de tomber dans la fenêtre
  if (du > flux.debut) {
    k = freq.jours
      ? Math.max(0, Math.floor(joursEntre(flux.debut, du) / freq.jours))
      : Math.max(0, Math.floor(moisEntre(flux.debut, du) / freq.mois));
  }

  const dateDuRang = (rang) => freq.jours
    ? ajouterJours(flux.debut, rang * freq.jours)
    : ajouterMois(flux.debut, rang * freq.mois, ancre);

  let date = dateDuRang(k);
  let garde = 0;
  while (date < du && garde++ < OCCURRENCES_MAX) date = dateDuRang(++k);

  garde = 0;
  while (date <= borneFin && garde++ < OCCURRENCES_MAX) {
    res.push({ date, montant: arrondi2(montantA(flux, date, reference)) });
    date = dateDuRang(++k);
  }
  return res;
}

/** Rythme mensuel moyen d'un flux, sans tenir compte des dates. */
function mensualiteMoyenne(flux) {
  const freq = FREQ[flux.frequence] || FREQ.mensuel;
  return freq.parAn ? (flux.montant * freq.parAn) / 12 : 0;
}

/**
 * Projection complète.
 *
 * options : { du, au, flux, comptes, soldeInitial, compteId }
 * Renvoie les opérations datées, la courbe de solde, le détail mois par mois,
 * la répartition par catégorie et les dates de rupture.
 */
function projeter(options) {
  const o = options || {};
  const du = estIso(o.du) ? o.du : departProjection();
  // l'horizon se compte en mois pleins : douze mois, c'est jusqu'à la fin du
  // douzième — pas jusqu'au même quantième, qui laisserait un mois tronqué
  const au = estIso(o.au) ? o.au : finDeMois(cleMois(ajouterMois(du, ETAT.parametres.horizon - 1)));
  const listeFlux = (o.flux || ETAT.flux).filter((f) => !o.compteId
    || f.compteId === o.compteId
    || (f.type === "virement" && f.compteDest === o.compteId));
  const comptes = o.comptes || ETAT.comptes;
  const soldeInitial = o.soldeInitial !== undefined
    ? o.soldeInitial
    : (o.compteId ? (compte(o.compteId) ? compte(o.compteId).solde : 0)
                  : comptes.reduce((s, c) => s + c.solde, 0));

  /* Un virement n'est ni un revenu ni une dépense : c'est de l'argent qui
     change de poche. Il ne compte dans les totaux que si sa contrepartie est
     hors du périmètre observé — sur l'ensemble des comptes, jamais ; sur un
     compte seul, toujours. Vu de tous les comptes, les deux jambes se
     compensent et une seule ligne est affichée, à montant nul. */
  const dansPerimetre = (id) => !o.compteId || id === o.compteId;

  const operations = [];
  for (const f of listeFlux) {
    for (const oc of occurrences(f, du, au, du)) {
      const commun = { date: oc.date, brut: oc.montant, type: f.type, libelle: f.libelle, fluxId: f.id };
      if (f.type === "virement") {
        const source = dansPerimetre(f.compteId);
        const destination = dansPerimetre(f.compteDest);
        if (source && destination) {
          operations.push(Object.assign({}, commun, {
            montant: 0, comptable: false, sens: "interne",
            categorieId: null, compteId: f.compteId, compteDest: f.compteDest,
          }));
        } else if (source) {
          operations.push(Object.assign({}, commun, {
            montant: -oc.montant, comptable: true, sens: "sortie",
            categorieId: null, compteId: f.compteId, compteDest: f.compteDest,
          }));
        } else if (destination) {
          operations.push(Object.assign({}, commun, {
            montant: oc.montant, comptable: true, sens: "entree",
            categorieId: null, compteId: f.compteDest, compteDest: f.compteId,
          }));
        }
      } else {
        operations.push(Object.assign({}, commun, {
          montant: f.type === "revenu" ? oc.montant : -oc.montant,
          comptable: true,
          categorieId: f.categorieId,
          compteId: f.compteId,
        }));
      }
    }
  }
  operations.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  // courbe de solde : un point au départ, un par jour où quelque chose bouge
  const points = [{ date: du, solde: soldeInitial }];
  let solde = soldeInitial;
  let soldeMin = soldeInitial, dateSoldeMin = du;
  let dateDecouvert = null, dateSousSeuil = null;
  const seuil = ETAT.parametres.seuilAlerte;

  for (let i = 0; i < operations.length; i++) {
    solde = arrondi2(solde + operations[i].montant);
    operations[i].solde = solde;
    const dernier = operations[i].date;
    if (i === operations.length - 1 || operations[i + 1].date !== dernier) {
      points.push({ date: dernier, solde });
    }
    if (solde < soldeMin) { soldeMin = solde; dateSoldeMin = dernier; }
    if (solde < 0 && !dateDecouvert) dateDecouvert = dernier;
    if (seuil > 0 && solde < seuil && !dateSousSeuil) dateSousSeuil = dernier;
  }
  if (points[points.length - 1].date !== au) points.push({ date: au, solde });

  // mois par mois — tous les mois de la fenêtre, y compris les mois vides
  const mois = [];
  const parCle = new Map();
  for (let cle = cleMois(du); cle <= cleMois(au); cle = moisSuivant(cle)) {
    const m = {
      cle, revenus: 0, depenses: 0, net: 0,
      soldeFin: soldeInitial, soldeMin: null, operations: [],
    };
    mois.push(m);
    parCle.set(cle, m);
  }

  let courant = soldeInitial;
  for (const op of operations) {
    const m = parCle.get(cleMois(op.date));
    if (!m) continue;
    m.operations.push(op);
    if (!op.comptable) continue;
    if (op.montant >= 0) m.revenus += op.montant; else m.depenses += -op.montant;
  }
  for (const m of mois) {
    m.revenus = arrondi2(m.revenus);
    m.depenses = arrondi2(m.depenses);
    m.net = arrondi2(m.revenus - m.depenses);
    courant = arrondi2(courant + m.net);
    m.soldeFin = courant;
    m.soldeMin = m.operations.length
      ? Math.min.apply(null, m.operations.map((op) => op.solde))
      : courant;
  }

  // répartition par catégorie
  const parCategorie = new Map();
  for (const op of operations) {
    if (!op.comptable || !op.categorieId) continue;
    const cle = op.categorieId;
    if (!parCategorie.has(cle)) {
      parCategorie.set(cle, { categorieId: op.categorieId, type: op.type, total: 0, nombre: 0 });
    }
    const e = parCategorie.get(cle);
    e.total = arrondi2(e.total + op.brut);
    e.nombre++;
  }

  const totalRevenus = arrondi2(mois.reduce((s, m) => s + m.revenus, 0));
  const totalDepenses = arrondi2(mois.reduce((s, m) => s + m.depenses, 0));
  const nbMois = Math.max(1, mois.length);

  return {
    du, au, soldeInitial, soldeFinal: solde,
    operations, points, mois, parCategorie,
    nbMois,
    totaux: {
      revenus: totalRevenus,
      depenses: totalDepenses,
      net: arrondi2(totalRevenus - totalDepenses),
      revenusMensuels: arrondi2(totalRevenus / nbMois),
      depensesMensuelles: arrondi2(totalDepenses / nbMois),
      netMensuel: arrondi2((totalRevenus - totalDepenses) / nbMois),
      tauxEpargne: totalRevenus > 0 ? ((totalRevenus - totalDepenses) / totalRevenus) * 100 : null,
    },
    alerte: { dateDecouvert, dateSousSeuil, soldeMin, dateSoldeMin, seuil },
  };
}

/** Solde projeté à une date donnée, lu sur la courbe en escalier. */
function soldeALaDate(projection, date) {
  if (!projection.points.length) return projection.soldeInitial;
  if (date <= projection.points[0].date) return projection.soldeInitial;
  let solde = projection.soldeInitial;
  for (const p of projection.points) {
    if (p.date > date) break;
    solde = p.solde;
  }
  return solde;
}

/* ── Scénarios ────────────────────────────────────────────────────────── */

/** Liste de flux d'un scénario : exclusions, ajustements, ajouts. */
function fluxDuScenario(scenario) {
  if (!scenario) return ETAT.flux.slice();
  const exclus = new Set(scenario.exclus || []);
  const ajuste = (f) => {
    if (f.type === "virement") return f;
    const pct = f.type === "revenu" ? scenario.ajustRevenus : scenario.ajustDepenses;
    if (!pct) return f;
    return Object.assign({}, f, { montant: arrondi2(f.montant * (1 + pct / 100)) });
  };
  return ETAT.flux.filter((f) => !exclus.has(f.id)).map(ajuste).concat(scenario.extras || []);
}

function projeterScenario(scenario, du, au) {
  return projeter({
    du, au,
    flux: fluxDuScenario(scenario),
    soldeInitial: soldeDepart() + (scenario ? scenario.soldeDelta : 0),
  });
}

/* ── Objectifs ────────────────────────────────────────────────────────── */

/**
 * Un objectif est jugé sur la trajectoire, pas sur le seul solde final :
 * on lit le solde projeté à la date cible et on en déduit ce qu'il
 * manquerait, chaque mois, pour y arriver.
 */
function evaluerObjectif(objectif, projection) {
  const depart = projection.du;
  const cpt = objectif.compteId ? compte(objectif.compteId) : null;
  const proj = objectif.compteId
    ? projeter({ du: projection.du, au: projection.au, compteId: objectif.compteId })
    : projection;

  const actuel = cpt ? cpt.solde : projection.soldeInitial;
  const dansFenetre = objectif.dateCible <= proj.au;
  const projete = dansFenetre ? soldeALaDate(proj, objectif.dateCible) : null;
  const moisRestants = Math.max(0, moisEntre(depart, objectif.dateCible));
  const manque = projete === null ? null : arrondi2(objectif.cible - projete);
  const rythmeProjete = proj.totaux.netMensuel;

  let verdict = "hors-horizon";
  if (objectif.dateCible < depart) verdict = "echu";
  else if (projete !== null) verdict = manque <= 0 ? "atteint" : (manque <= objectif.cible * 0.1 ? "juste" : "insuffisant");

  return {
    objectif, actuel, projete, manque, moisRestants, rythmeProjete, verdict,
    progression: objectif.cible > 0 ? Math.max(0, Math.min(1, (projete === null ? actuel : projete) / objectif.cible)) : 0,
    progressionActuelle: objectif.cible > 0 ? Math.max(0, Math.min(1, actuel / objectif.cible)) : 0,
    effortMensuel: manque !== null && manque > 0 && moisRestants > 0 ? arrondi2(manque / moisRestants) : 0,
  };
}

/* ── Enveloppes par catégorie ─────────────────────────────────────────── */

function enveloppes(projection) {
  return ETAT.categories
    .filter((c) => c.type === "depense")
    .map((c) => {
      const e = projection.parCategorie.get(c.id);
      const total = e ? e.total : 0;
      const mensuel = arrondi2(total / projection.nbMois);
      const plafond = c.plafond;
      return {
        categorie: c, total, mensuel, plafond,
        ecart: plafond ? arrondi2(mensuel - plafond) : null,
        ratio: plafond ? mensuel / plafond : null,
      };
    })
    .sort((a, b) => b.mensuel - a.mensuel);
}

/* ── Prêt : mensualité d'un emprunt amortissable ──────────────────────── */

/** Mensualité constante d'un prêt — formule d'annuité classique. */
function mensualitePret(capital, tauxAnnuel, mois) {
  if (!(capital > 0) || !(mois > 0)) return 0;
  const t = (Number(tauxAnnuel) || 0) / 100 / 12;
  if (t <= 0) return arrondi2(capital / mois);
  return arrondi2((capital * t) / (1 - Math.pow(1 + t, -mois)));
}

/* ══════════════════════════════════════════════════════════════════════
   6. Persistance
   ══════════════════════════════════════════════════════════════════════ */

/* Certains contextes refusent le stockage local — navigation privée, cookies
   bloqués, page en bac à sable — et lèvent à la simple lecture. L'application
   doit alors continuer de fonctionner, sans mémoire d'une session à l'autre. */
function lireLocal(cle) {
  try { return localStorage.getItem(cle); } catch (e) { return null; }
}

function ecrireLocal(cle, valeur) {
  try { localStorage.setItem(cle, valeur); return true; } catch (e) { return false; }
}

function chargerEtat() {
  let brut = null;
  const t = lireLocal(CLE_ETAT);
  if (t) { try { brut = JSON.parse(t); } catch (e) { brut = null; } }
  ETAT = normaliser(brut);
  return brut !== null;
}

function enregistrerEtat() {
  _formats = {};
  if (!ecrireLocal(CLE_ETAT, JSON.stringify(ETAT))) {
    message("Sauvegarde impossible : ce navigateur refuse le stockage local.");
  }
}

function modifier(action) {
  action();
  enregistrerEtat();
  rendre();
}

/* ══════════════════════════════════════════════════════════════════════
   8. Graphiques — du SVG écrit à la main, aucune bibliothèque

   Les dimensions sont mesurées sur le conteneur plutôt que laissées à un
   viewBox élastique : les libellés gardent la même taille sur un téléphone
   et sur un écran large. Le redimensionnement de la fenêtre relance le
   rendu de la vue courante.
   ══════════════════════════════════════════════════════════════════════ */

function largeurDe(cible, defaut) {
  const l = cible && cible.clientWidth ? cible.clientWidth : 0;
  return Math.max(300, l || defaut || 720);
}

/** Graduations « rondes » couvrant [min, max]. */
function graduations(min, max, cible) {
  if (!isFinite(min) || !isFinite(max)) return [0];
  if (min === max) { min -= 1; max += 1; }
  const brut = (max - min) / Math.max(2, cible || 5);
  const magnitude = Math.pow(10, Math.floor(Math.log10(Math.abs(brut) || 1)));
  const normalise = brut / magnitude;
  const pas = (normalise <= 1 ? 1 : normalise <= 2 ? 2 : normalise <= 2.5 ? 2.5 : normalise <= 5 ? 5 : 10) * magnitude;
  const debut = Math.floor(min / pas) * pas;
  const res = [];
  for (let v = debut; v <= max + pas * 0.001; v += pas) res.push(arrondi2(v));
  return res;
}

function infobulleDe(boite) {
  let bulle = boite.querySelector(".infobulle");
  if (!bulle) {
    bulle = document.createElement("div");
    bulle.className = "infobulle";
    bulle.style.opacity = "0";
    boite.appendChild(bulle);
  }
  return bulle;
}

function placerBulle(bulle, boite, x, y) {
  const l = bulle.offsetWidth || 160;
  const largeur = boite.clientWidth;
  let gx = x + 14;
  if (gx + l > largeur) gx = Math.max(4, x - l - 14);
  bulle.style.left = gx + "px";
  bulle.style.top = Math.max(4, y - 10) + "px";
  bulle.style.opacity = "1";
}

/**
 * Courbes de solde dans le temps.
 * series : [{ nom, couleur, points: [{date, solde}], remplir }]
 */
function grapheCourbes(cible, series, options) {
  const o = options || {};
  const L = largeurDe(cible);
  const H = o.hauteur || 280;
  const mg = { h: 14, d: 12, b: 26, g: 58 };
  const l = L - mg.g - mg.d;
  const h = H - mg.h - mg.b;

  const utiles = series.filter((s) => s.points && s.points.length);
  if (!utiles.length) { cible.innerHTML = '<div class="vide">Rien à projeter pour l\'instant.</div>'; return; }

  const t0 = versUTC(utiles[0].points[0].date);
  const t1 = versUTC(utiles[0].points[utiles[0].points.length - 1].date);
  const etendue = Math.max(1, t1 - t0);

  let min = Infinity, max = -Infinity;
  for (const s of utiles) for (const p of s.points) { if (p.solde < min) min = p.solde; if (p.solde > max) max = p.solde; }
  if (o.seuil > 0) { min = Math.min(min, o.seuil); max = Math.max(max, o.seuil); }
  min = Math.min(min, 0);
  const marge = (max - min) * 0.08 || 100;
  min -= marge; max += marge;

  const gx = (iso) => mg.g + ((versUTC(iso) - t0) / etendue) * l;
  const gy = (v) => mg.h + h - ((v - min) / (max - min || 1)) * h;

  const ticks = graduations(min, max, 5);
  let svg = '<svg class="graphe" width="' + L + '" height="' + H + '" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="' + esc(o.titreAccessible || "Solde projeté") + '">';

  for (const t of ticks) {
    const y = gy(t);
    if (y < mg.h - 1 || y > mg.h + h + 1) continue;
    svg += '<line class="ligne-grille" x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="axe" x="' + (mg.g - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(argentCourt(t)) + "</text>";
  }

  if (min < 0 && max > 0) {
    svg += '<line class="ligne-zero" x1="' + mg.g + '" y1="' + gy(0).toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + gy(0).toFixed(1) + '"/>';
  }
  if (o.seuil > 0) {
    svg += '<line class="ligne-seuil" x1="' + mg.g + '" y1="' + gy(o.seuil).toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + gy(o.seuil).toFixed(1) + '"/>';
  }

  // repères de temps : un par trimestre au plus, six au total au maximum
  const nbMois = Math.max(1, moisEntre(utiles[0].points[0].date, utiles[0].points[utiles[0].points.length - 1].date));
  const pasMois = Math.max(1, Math.ceil(nbMois / Math.max(2, Math.floor(l / 90))));
  for (let k = 0; k <= nbMois; k += pasMois) {
    const iso = ajouterMois(utiles[0].points[0].date, k);
    if (versUTC(iso) > t1) break;
    svg += '<text class="axe" x="' + gx(iso).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(libelleMois(cleMois(iso), true)) + "</text>";
  }

  // courbes en escalier : entre deux échéances, le solde ne bouge pas
  for (const s of utiles) {
    let d = "";
    let px = null, py = null;
    for (const p of s.points) {
      const x = gx(p.date), y = gy(p.solde);
      if (px === null) { d = "M" + x.toFixed(1) + "," + y.toFixed(1); }
      else { d += "L" + x.toFixed(1) + "," + py.toFixed(1) + "L" + x.toFixed(1) + "," + y.toFixed(1); }
      px = x; py = y;
    }
    if (s.remplir) {
      const base = Math.min(mg.h + h, Math.max(mg.h, gy(Math.max(0, min))));
      svg += '<path d="' + d + "L" + px.toFixed(1) + "," + base.toFixed(1) + "L" + gx(s.points[0].date).toFixed(1) + "," + base.toFixed(1) + 'Z" fill="' + s.couleur + '" opacity=".10"/>';
    }
    svg += '<path d="' + d + '" fill="none" stroke="' + s.couleur + '" stroke-width="' + (s.epaisseur || 2) + '" stroke-linejoin="round" stroke-linecap="round"' + (s.pointille ? ' stroke-dasharray="5 4"' : "") + "/>";
  }

  // marqueur de découvert
  if (o.marqueur && o.marqueur.date >= utiles[0].points[0].date) {
    const x = gx(o.marqueur.date);
    svg += '<line x1="' + x.toFixed(1) + '" y1="' + mg.h + '" x2="' + x.toFixed(1) + '" y2="' + (mg.h + h) + '" stroke="var(--depense)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    svg += '<circle cx="' + x.toFixed(1) + '" cy="' + gy(o.marqueur.valeur).toFixed(1) + '" r="4" fill="var(--depense)"/>';
  }

  svg += '<g class="survol"><line class="curseur" x1="0" y1="' + mg.h + '" x2="0" y2="' + (mg.h + h) + '" style="opacity:0"/></g>';
  svg += '<rect x="' + mg.g + '" y="' + mg.h + '" width="' + l + '" height="' + h + '" fill="transparent" class="capteur"/>';
  svg += "</svg>";

  cible.innerHTML = svg;
  cible.classList.add("boite-graphe");

  // survol : date sous le curseur, valeur de chaque série à cette date
  const bulle = infobulleDe(cible);
  const capteur = cible.querySelector(".capteur");
  const curseur = cible.querySelector(".survol line");

  const bouger = (ev) => {
    const rect = cible.querySelector("svg").getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    const ratio = Math.max(0, Math.min(1, (px - mg.g) / l));
    const iso = versIso(t0 + ratio * etendue);
    curseur.setAttribute("x1", gx(iso).toFixed(1));
    curseur.setAttribute("x2", gx(iso).toFixed(1));
    curseur.style.opacity = "1";
    let html = '<div class="t">' + esc(libelleDate(iso)) + "</div>";
    for (const s of utiles) {
      const v = lireSurPoints(s.points, iso);
      html += '<div class="l"><span><i class="puce" style="background:' + s.couleur + '"></i>' + esc(s.nom) + "</span><b>" + esc(argent(v)) + "</b></div>";
    }
    bulle.innerHTML = html;
    placerBulle(bulle, cible, gx(iso), mg.h + 6);
  };
  capteur.addEventListener("mousemove", bouger);
  capteur.addEventListener("touchmove", (e) => { bouger(e); }, { passive: true });
  capteur.addEventListener("mouseleave", () => { bulle.style.opacity = "0"; curseur.style.opacity = "0"; });
}

function lireSurPoints(points, date) {
  let v = points.length ? points[0].solde : 0;
  for (const p of points) { if (p.date > date) break; v = p.solde; }
  return v;
}

/** Barres revenus / dépenses mois par mois. */
function grapheBarres(cible, mois, options) {
  const o = options || {};
  const L = largeurDe(cible);
  const H = o.hauteur || 250;
  const mg = { h: 14, d: 10, b: 26, g: 58 };
  const l = L - mg.g - mg.d;
  const h = H - mg.h - mg.b;

  if (!mois.length) { cible.innerHTML = '<div class="vide">Aucun mois à afficher.</div>'; return; }

  const max = Math.max(1, ...mois.map((m) => Math.max(m.revenus, m.depenses)));
  const ticks = graduations(0, max, 4);
  const haut = ticks[ticks.length - 1] || max;
  const pas = l / mois.length;
  const largeurBarre = Math.max(2, Math.min(16, pas / 2 - 2));

  const gy = (v) => mg.h + h - (v / haut) * h;

  let svg = '<svg class="graphe" width="' + L + '" height="' + H + '" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Revenus et dépenses mois par mois">';
  for (const t of ticks) {
    const y = gy(t);
    svg += '<line class="ligne-grille" x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="axe" x="' + (mg.g - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(argentCourt(t)) + "</text>";
  }

  const pasEtiquette = Math.max(1, Math.ceil(mois.length / Math.max(2, Math.floor(l / 78))));
  mois.forEach((m, i) => {
    const centre = mg.g + i * pas + pas / 2;
    const xr = centre - largeurBarre - 1;
    const xd = centre + 1;
    svg += '<rect x="' + xr.toFixed(1) + '" y="' + gy(m.revenus).toFixed(1) + '" width="' + largeurBarre.toFixed(1) +
      '" height="' + Math.max(0, mg.h + h - gy(m.revenus)).toFixed(1) + '" rx="2" fill="var(--revenu)"/>';
    svg += '<rect x="' + xd.toFixed(1) + '" y="' + gy(m.depenses).toFixed(1) + '" width="' + largeurBarre.toFixed(1) +
      '" height="' + Math.max(0, mg.h + h - gy(m.depenses)).toFixed(1) + '" rx="2" fill="var(--depense)"/>';
    if (i % pasEtiquette === 0) {
      svg += '<text class="axe" x="' + centre.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(libelleMois(m.cle, true)) + "</text>";
    }
    svg += '<rect class="colonne" data-i="' + i + '" x="' + (mg.g + i * pas).toFixed(1) + '" y="' + mg.h + '" width="' + pas.toFixed(1) + '" height="' + h + '" fill="transparent"/>';
  });
  svg += "</svg>";
  cible.innerHTML = svg;
  cible.classList.add("boite-graphe");

  const bulle = infobulleDe(cible);
  cible.querySelectorAll(".colonne").forEach((r) => {
    r.addEventListener("mouseenter", () => {
      const m = mois[Number(r.dataset.i)];
      bulle.innerHTML = '<div class="t">' + esc(libelleMois(m.cle)) + "</div>" +
        '<div class="l"><span><i class="puce" style="background:var(--revenu)"></i>Revenus</span><b>' + esc(argent(m.revenus)) + "</b></div>" +
        '<div class="l"><span><i class="puce" style="background:var(--depense)"></i>Dépenses</span><b>' + esc(argent(m.depenses)) + "</b></div>" +
        '<div class="l"><span>Net</span><b class="' + (m.net >= 0 ? "pos" : "neg") + '">' + esc(argent(m.net, { signe: true })) + "</b></div>" +
        '<div class="l"><span>Solde fin de mois</span><b>' + esc(argent(m.soldeFin)) + "</b></div>";
      placerBulle(bulle, cible, Number(r.getAttribute("x")) + Number(r.getAttribute("width")) / 2, mg.h + 6);
    });
    r.addEventListener("mouseleave", () => { bulle.style.opacity = "0"; });
  });
}

/** Anneau de répartition. parts : [{nom, valeur, couleur}] */
function grapheAnneau(cible, parts, options) {
  const o = options || {};
  const taille = o.taille || 190;
  const total = parts.reduce((s, p) => s + p.valeur, 0);
  if (!total) { cible.innerHTML = '<div class="vide">Aucune dépense sur la période.</div>'; return; }

  const r = taille / 2 - 6;
  const rInt = r * 0.62;
  const cx = taille / 2, cy = taille / 2;
  let angle = -Math.PI / 2;

  let svg = '<svg class="graphe" width="' + taille + '" height="' + taille + '" viewBox="0 0 ' + taille + ' ' + taille + '" role="img" aria-label="Répartition des dépenses">';
  for (const p of parts) {
    const part = p.valeur / total;
    const fin = angle + part * Math.PI * 2;
    const grand = part > 0.5 ? 1 : 0;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(fin), y2 = cy + r * Math.sin(fin);
    const x3 = cx + rInt * Math.cos(fin), y3 = cy + rInt * Math.sin(fin);
    const x4 = cx + rInt * Math.cos(angle), y4 = cy + rInt * Math.sin(angle);
    // un secteur complet ne se trace pas en arc : on pose un anneau plein
    if (part > 0.999) {
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((r + rInt) / 2) + '" fill="none" stroke="' + p.couleur + '" stroke-width="' + (r - rInt) + '"><title>' + esc(p.nom) + "</title></circle>";
    } else {
      svg += '<path d="M' + x1.toFixed(2) + "," + y1.toFixed(2) + "A" + r + "," + r + " 0 " + grand + ",1 " + x2.toFixed(2) + "," + y2.toFixed(2) +
        "L" + x3.toFixed(2) + "," + y3.toFixed(2) + "A" + rInt + "," + rInt + " 0 " + grand + ",0 " + x4.toFixed(2) + "," + y4.toFixed(2) +
        'Z" fill="' + p.couleur + '" stroke="var(--surface)" stroke-width="1.5"><title>' + esc(p.nom + " · " + argent(p.valeur)) + "</title></path>";
    }
    angle = fin;
  }
  svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" style="font-family:var(--display);font-weight:700;font-size:16px;fill:var(--texte)">' + esc(argentCourt(total)) + "</text>";
  svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" class="axe">' + esc(o.legende || "au total") + "</text>";
  svg += "</svg>";
  cible.innerHTML = svg;
}

function boite(id) { return document.getElementById(id); }

function carte(contenu, options) {
  const o = options || {};
  const tete = o.titre
    ? '<div class="carte-tete"><h2>' + esc(o.titre) + "</h2>" + (o.droite ? '<div class="droite">' + o.droite + "</div>" : "") + "</div>" +
      (o.sous ? '<p class="sous">' + esc(o.sous) + "</p>" : "")
    : "";

}

/** Le montant d'une opération, signé — sauf un virement interne, qui ne fait
 *  ni entrer ni sortir d'argent du périmètre observé. */
function montantOperation(op) {
  if (op.type === "virement" && op.sens === "interne") {
    return '<span class="dim">↔ ' + esc(argent(op.brut)) + "</span>";
  }
  return '<span class="' + (op.montant >= 0 ? "pos" : "neg") + '">' + esc(argent(op.montant, { signe: true })) + "</span>";
}

/** « Courant → Livret » pour un virement, la catégorie sinon. */
function contexteOperation(op) {
  if (op.type !== "virement") return nomCategorie(op.categorieId);
  if (op.sens === "entree") return nomCompte(op.compteDest) + " → " + nomCompte(op.compteId);
  return nomCompte(op.compteId) + " → " + nomCompte(op.compteDest);
}

function kpi(etiquette, valeur, note, couleur) {
  return '<div class="kpi"><span class="etiq">' + esc(etiquette) + "</span>" +
    '<span class="val"' + (couleur ? ' style="color:' + couleur + '"' : "") + ">" + esc(valeur) + "</span>" +
    (note ? '<span class="note">' + note + "</span>" : "") + "</div>";
}

/* ── Tableau de bord ──────────────────────────────────────────────────── */

function rendreTableau(cible, p) {
  if (!ETAT.flux.length) { cible.innerHTML = etatVide(); return; }

  const t = p.totaux;
  const evolution = arrondi2(p.soldeFinal - p.soldeInitial);
  const horizonTexte = ETAT.parametres.horizon + " mois";

  const kpis = carte(
    '<div class="grille g4">' +
    kpi("Solde aujourd'hui", argent(p.soldeInitial),
      esc(ETAT.comptes.length + (ETAT.comptes.length > 1 ? " comptes" : " compte"))) +
    kpi("Dans " + horizonTexte, argent(p.soldeFinal),
      '<span class="' + (evolution >= 0 ? "pos" : "neg") + '">' + esc(argent(evolution, { signe: true })) + "</span> sur la période",
      evolution >= 0 ? "var(--revenu-texte)" : "var(--depense-texte)") +
    kpi("Reste chaque mois", argent(t.netMensuel, { signe: true }),
      esc(argent(t.revenusMensuels) + " − " + argent(t.depensesMensuelles)),
      t.netMensuel >= 0 ? "var(--revenu-texte)" : "var(--depense-texte)") +
    kpi("Taux d'épargne", t.tauxEpargne === null ? "—" : pourcent(t.tauxEpargne, 1),
      "part des revenus non dépensée") +
    "</div>", { classe: "kpis" });

  const a = p.alerte;
  let bandeau;
  if (a.dateDecouvert) {
    bandeau = '<div class="bandeau rouge"><span class="ic">⚠</span><div><b>Découvert le ' + esc(libelleDate(a.dateDecouvert)) +
      "</b> — au rythme actuel, le solde passe sous zéro dans " + esc(nombre(Math.max(0, joursEntre(p.du, a.dateDecouvert)))) +
      " jours, et descend jusqu'à <b>" + esc(argent(a.soldeMin)) + "</b> le " + esc(libelleDate(a.dateSoldeMin)) +
      ". Il manque environ <b>" + esc(argent(Math.abs(a.soldeMin))) + "</b> pour tenir la période.</div></div>";
  } else if (a.dateSousSeuil) {
    bandeau = '<div class="bandeau ambre"><span class="ic">◉</span><div><b>Sous votre seuil de sécurité le ' + esc(libelleDate(a.dateSousSeuil)) +
      "</b> — le solde reste positif, mais descend à " + esc(argent(a.soldeMin)) + " le " + esc(libelleDate(a.dateSoldeMin)) +
      " alors que vous vous êtes fixé un plancher de " + esc(argent(a.seuil)) + ".</div></div>";
  } else {
    bandeau = '<div class="bandeau vert"><span class="ic">✓</span><div><b>Aucune rupture sur ' + esc(horizonTexte) + "</b> — le point bas est de " +
      esc(argent(a.soldeMin)) + " le " + esc(libelleDate(a.dateSoldeMin)) +
      (a.seuil > 0 ? ", au-dessus de votre seuil de " + esc(argent(a.seuil)) : "") + ".</div></div>";
  }

  const courbe = carte('<div id="g-solde"></div>' +
    '<div class="legende"><span><i class="puce" style="background:var(--epargne)"></i>Solde projeté</span>' +
    (ETAT.parametres.seuilAlerte > 0 ? '<span><svg width="18" height="8"><line x1="0" y1="4" x2="18" y2="4" class="ligne-seuil"/></svg>&nbsp;Seuil de sécurité</span>' : "") +
    "</div>",
    { titre: "Solde jour par jour", sous: "Chaque marche est une échéance. Le tracé suppose que tous les flux ci-dessous se réalisent comme prévu.",
      droite: esc(libelleDate(p.du, true) + " → " + libelleDate(p.au, true)) });

  const barres = carte('<div id="g-mois"></div>' +
    '<div class="legende"><span><i class="puce" style="background:var(--revenu)"></i>Revenus</span>' +
    '<span><i class="puce" style="background:var(--depense)"></i>Dépenses</span></div>',
    { titre: "Mois par mois" });

  // agenda : les 45 prochains jours
  const limite = ajouterJours(p.du, 45);
  const prochaines = p.operations.filter((op) => op.date <= limite).slice(0, 12);
  const agenda = carte(
    prochaines.length
      ? '<ul class="agenda">' + prochaines.map((op) =>
          '<li><span class="quand">' + esc(delaiTexte(op.date, p.du)) + "</span>" +
          '<span class="quoi"><i class="puce" style="background:' + teinte(categorie(op.categorieId) ? categorie(op.categorieId).teinte : 1) + '"></i>' + esc(op.libelle) +
          (op.type === "virement" ? ' <span class="faible">· ' + esc(contexteOperation(op)) + "</span>" : "") + "</span>" +
          '<span class="combien">' + montantOperation(op) + "</span></li>").join("")
        + "</ul>"
      : '<div class="vide">Rien de prévu dans les 45 prochains jours.</div>',
    { titre: "À venir", sous: "Les 45 prochains jours." });

  // répartition des dépenses
  const parts = [...p.parCategorie.values()]
    .filter((e) => e.type === "depense")
    .sort((x, y) => y.total - x.total)
    .map((e) => {
      const c = categorie(e.categorieId);
      return { nom: c ? c.nom : "Sans catégorie", valeur: e.total, couleur: teinte(c ? c.teinte : 1) };
    });
  const totalDep = parts.reduce((s, x) => s + x.valeur, 0);
  const repartition = carte(
    '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center">' +
    '<div id="g-anneau"></div>' +
    '<div style="flex:1;min-width:190px">' +
    parts.slice(0, 7).map((x) =>
      '<div class="l" style="display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:13.5px">' +
      '<span><i class="puce" style="background:' + x.couleur + '"></i>' + esc(x.nom) + "</span>" +
      '<span class="mono dim">' + esc(pourcent((x.valeur / totalDep) * 100, 0)) + " · " + esc(argent(x.valeur / p.nbMois)) + "/mois</span></div>").join("") +
    (parts.length > 7 ? '<div class="faible" style="font-size:12.5px;padding-top:4px">+ ' + (parts.length - 7) + " autres catégories</div>" : "") +
    "</div></div>",
    { titre: "Où part l'argent", sous: "Sur toute la période projetée, dépenses seulement." });

  cible.innerHTML = kpis + bandeau + courbe +
    '<div class="grille g-2-1">' + barres + agenda + "</div>" + repartition;

  grapheCourbes(boite("g-solde"), [{
    nom: "Solde", couleur: "var(--epargne)", points: p.points, remplir: true,
  }], {
    seuil: ETAT.parametres.seuilAlerte,
    marqueur: a.dateDecouvert ? { date: a.dateDecouvert, valeur: soldeALaDate(p, a.dateDecouvert) } : null,
    hauteur: 300,
  });
  grapheBarres(boite("g-mois"), p.mois, { hauteur: 230 });
  grapheAnneau(boite("g-anneau"), parts, { legende: "de dépenses" });
}
