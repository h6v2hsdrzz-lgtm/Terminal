  if (loyer) {
    etat.scenarios[0].exclus = [loyer.id];
    etat.scenarios[0].extras = [normaliserFlux(
      Object.assign({}, loyer, { id: identifiant("flx"), libelle: "Loyer (nouveau logement)", montant: 930 }),
      0, etat.comptes, etat.categories
    )];
  }
  return etat;
}

/* ══════════════════════════════════════════════════════════════════════
   8. Graphiques — du SVG écrit à la main, aucune bibliothèque

   Les dimensions sont mesurées sur le conteneur plutôt que laissées à un
   viewBox élastique : les libellés gardent la même taille sur un téléphone
   et sur un écran large. Le redimensionnement de la fenêtre relance le
   rendu de la vue courante.
   ══════════════════════════════════════════════════════════════════════ */

let _idGraphe = 0;

/** Une courbe minuscule, sans axe ni repère, posée au fond d'un indicateur. */
function etincelle(points, couleur, options) {
  const o = options || {};
  const L = o.largeur || 220, H = o.hauteur || 34;
  if (!points || points.length < 2) return "";
  const t0 = versUTC(points[0].date);
  const t1 = versUTC(points[points.length - 1].date);
  const etendue = Math.max(1, t1 - t0);
  let min = Infinity, max = -Infinity;
  for (const p of points) { if (p.solde < min) min = p.solde; if (p.solde > max) max = p.solde; }
  const amplitude = max - min || 1;
  const gx = (iso) => ((versUTC(iso) - t0) / etendue) * L;
  const gy = (v) => H - 3 - ((v - min) / amplitude) * (H - 6);
  let d = "", px = null, py = null;
  for (const p of points) {
    const x = gx(p.date), y = gy(p.solde);
    if (px === null) d = "M" + x.toFixed(1) + "," + y.toFixed(1);
    else d += "L" + x.toFixed(1) + "," + py.toFixed(1) + "L" + x.toFixed(1) + "," + y.toFixed(1);
    px = x; py = y;
  }
  return '<svg class="etincelle" viewBox="0 0 ' + L + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + "L" + L + "," + H + "L0," + H + 'Z" fill="' + couleur + '" opacity=".13"/>' +
    '<path d="' + d + '" fill="none" stroke="' + couleur + '" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".55"/></svg>';
}

function largeurDe(cible, defaut) {
  const l = cible && cible.clientWidth ? cible.clientWidth : 0;
  return Math.max(300, l || defaut || 720);
}

/** Graduations « rondes » couvrant [min, max]. */
function graduations(min, max, cible) {
  if (!isFinite(min) || !isFinite(max)) return [0];
  if (min === max) { min -= 1; max += 1; }
  const brut = (max - min) / Math.max(2, cible || 5);
  const magnitude = Math.pow(10, Math.floor(Math.log10(Math.abs(brut) || 1)));
  const normalise = brut / magnitude;
  const pas = (normalise <= 1 ? 1 : normalise <= 2 ? 2 : normalise <= 2.5 ? 2.5 : normalise <= 5 ? 5 : 10) * magnitude;
  const debut = Math.floor(min / pas) * pas;
  const res = [];
  for (let v = debut; v <= max + pas * 0.001; v += pas) res.push(arrondi2(v));
  return res;
}

function infobulleDe(boite) {
  let bulle = boite.querySelector(".infobulle");
  if (!bulle) {
    bulle = document.createElement("div");
    bulle.className = "infobulle";
    bulle.style.opacity = "0";
    boite.appendChild(bulle);
  }
  return bulle;
}

function placerBulle(bulle, boite, x, y) {
  const l = bulle.offsetWidth || 160;
  const largeur = boite.clientWidth;
  let gx = x + 14;
  if (gx + l > largeur) gx = Math.max(4, x - l - 14);
  bulle.style.left = gx + "px";
  bulle.style.top = Math.max(4, y - 10) + "px";
  bulle.style.opacity = "1";
}

/**
 * Courbes de solde dans le temps.
 * series : [{ nom, couleur, points: [{date, solde}], remplir }]
 */
function grapheCourbes(cible, series, options) {
  const o = options || {};
  const L = largeurDe(cible);
  const H = o.hauteur || 280;
  const mg = { h: 14, d: 12, b: 26, g: 58 };
  const l = L - mg.g - mg.d;
  const h = H - mg.h - mg.b;

  const utiles = series.filter((s) => s.points && s.points.length);
  if (!utiles.length) { cible.innerHTML = '<div class="vide">Rien à projeter pour l\'instant.</div>'; return; }

  const t0 = versUTC(utiles[0].points[0].date);
  const t1 = versUTC(utiles[0].points[utiles[0].points.length - 1].date);
  const etendue = Math.max(1, t1 - t0);

  let min = Infinity, max = -Infinity;
  for (const s of utiles) for (const p of s.points) { if (p.solde < min) min = p.solde; if (p.solde > max) max = p.solde; }
  if (o.bande) for (const b of o.bande) { if (b.bas < min) min = b.bas; if (b.haut > max) max = b.haut; }
  if (o.seuil > 0) { min = Math.min(min, o.seuil); max = Math.max(max, o.seuil); }
  min = Math.min(min, 0);
  const marge = (max - min) * 0.08 || 100;
  min -= marge; max += marge;

  const gx = (iso) => mg.g + ((versUTC(iso) - t0) / etendue) * l;
  const gy = (v) => mg.h + h - ((v - min) / (max - min || 1)) * h;

  const ticks = graduations(min, max, 5);
  const cleGrad = "grad-" + (++_idGraphe);
  let svg = '<svg class="graphe" width="' + L + '" height="' + H + '" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="' + esc(o.titreAccessible || "Solde projeté") + '">';
  svg += "<defs>" + utiles.map((serie, i) =>
    '<linearGradient id="' + cleGrad + "-" + i + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + serie.couleur + '" stop-opacity=".30"/>' +
    '<stop offset="100%" stop-color="' + serie.couleur + '" stop-opacity=".02"/></linearGradient>').join("") + "</defs>";

  for (const t of ticks) {
    const y = gy(t);
    if (y < mg.h - 1 || y > mg.h + h + 1) continue;
    svg += '<line class="ligne-grille" x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="axe" x="' + (mg.g - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(argentCourt(t)) + "</text>";
  }

  if (min < 0 && max > 0) {
    svg += '<line class="ligne-zero" x1="' + mg.g + '" y1="' + gy(0).toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + gy(0).toFixed(1) + '"/>';
  }
  if (o.seuil > 0) {
    svg += '<line class="ligne-seuil" x1="' + mg.g + '" y1="' + gy(o.seuil).toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + gy(o.seuil).toFixed(1) + '"/>';
  }

  // repères de temps : un par trimestre au plus, six au total au maximum
  const nbMois = Math.max(1, moisEntre(utiles[0].points[0].date, utiles[0].points[utiles[0].points.length - 1].date));
  const pasMois = Math.max(1, Math.ceil(nbMois / Math.max(2, Math.floor(l / 90))));
  for (let k = 0; k <= nbMois; k += pasMois) {
    const iso = ajouterMois(utiles[0].points[0].date, k);
    if (versUTC(iso) > t1) break;
    svg += '<text class="axe" x="' + gx(iso).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(libelleMois(cleMois(iso), true)) + "</text>";
  }

  /* La bande d'incertitude passe sous les courbes : elle est un fond, pas
     une série. Elle suit le même escalier qu'elles. */
  if (o.bande && o.bande.length > 1) {
    let haut = "", bas = "";
    let px = null, pHaut = null, pBas = null;
    for (const b of o.bande) {
      const x = gx(b.date), yh = gy(b.haut), yb = gy(b.bas);
      if (px === null) { haut = "M" + x.toFixed(1) + "," + yh.toFixed(1); bas = "L" + x.toFixed(1) + "," + yb.toFixed(1); }
      else {
        haut += "L" + x.toFixed(1) + "," + pHaut.toFixed(1) + "L" + x.toFixed(1) + "," + yh.toFixed(1);
        bas = "L" + x.toFixed(1) + "," + yb.toFixed(1) + "L" + x.toFixed(1) + "," + pBas.toFixed(1) + bas;
      }
      px = x; pHaut = yh; pBas = yb;
    }
    svg += '<path d="' + haut + bas + 'Z" fill="var(--accent)" opacity=".16"/>';
    let centre = "", cx0 = null, cy0 = null;
    for (const b of o.bande) {
      const x = gx(b.date), y = gy(b.centre);
      if (cx0 === null) centre = "M" + x.toFixed(1) + "," + y.toFixed(1);
      else centre += "L" + x.toFixed(1) + "," + cy0.toFixed(1) + "L" + x.toFixed(1) + "," + y.toFixed(1);
      cx0 = x; cy0 = y;
    }
    svg += '<path d="' + centre + '" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="2 4" opacity=".75"/>';
  }

  // courbes en escalier : entre deux échéances, le solde ne bouge pas
  utiles.forEach((s, rang) => {
    let d = "";
    let px = null, py = null;
    for (const p of s.points) {
      const x = gx(p.date), y = gy(p.solde);
      if (px === null) { d = "M" + x.toFixed(1) + "," + y.toFixed(1); }
      else { d += "L" + x.toFixed(1) + "," + py.toFixed(1) + "L" + x.toFixed(1) + "," + y.toFixed(1); }
      px = x; py = y;
    }
    if (s.remplir) {
      const base = Math.min(mg.h + h, Math.max(mg.h, gy(Math.max(0, min))));
      svg += '<path d="' + d + "L" + px.toFixed(1) + "," + base.toFixed(1) + "L" + gx(s.points[0].date).toFixed(1) + "," + base.toFixed(1) + 'Z" fill="url(#' + cleGrad + "-" + rang + ')"/>';
    }
    svg += '<path d="' + d + '" fill="none" stroke="' + s.couleur + '" stroke-width="' + (s.epaisseur || 2) + '" stroke-linejoin="round" stroke-linecap="round"' + (s.pointille ? ' stroke-dasharray="5 4"' : "") + "/>";
    // le point d'arrivée porte sa valeur : c'est le chiffre qu'on vient lire
    if (s.marquerFin !== false) {
      svg += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3.5" fill="' + s.couleur + '" stroke="var(--surface)" stroke-width="1.5"/>';
    }
  });

  // marqueur de découvert
  if (o.marqueur && o.marqueur.date >= utiles[0].points[0].date) {
    const x = gx(o.marqueur.date);
    svg += '<line x1="' + x.toFixed(1) + '" y1="' + mg.h + '" x2="' + x.toFixed(1) + '" y2="' + (mg.h + h) + '" stroke="var(--depense)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    svg += '<circle cx="' + x.toFixed(1) + '" cy="' + gy(o.marqueur.valeur).toFixed(1) + '" r="4" fill="var(--depense)"/>';
  }

  svg += '<g class="survol"><line class="curseur" x1="0" y1="' + mg.h + '" x2="0" y2="' + (mg.h + h) + '" style="opacity:0"/></g>';
  svg += '<rect x="' + mg.g + '" y="' + mg.h + '" width="' + l + '" height="' + h + '" fill="transparent" class="capteur"/>';
  svg += "</svg>";

  cible.innerHTML = svg;
  cible.classList.add("boite-graphe");

  // survol : date sous le curseur, valeur de chaque série à cette date
  const bulle = infobulleDe(cible);
  const capteur = cible.querySelector(".capteur");
  const curseur = cible.querySelector(".survol line");

  const bouger = (ev) => {
    const rect = cible.querySelector("svg").getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    const ratio = Math.max(0, Math.min(1, (px - mg.g) / l));
    const iso = versIso(t0 + ratio * etendue);
    curseur.setAttribute("x1", gx(iso).toFixed(1));
    curseur.setAttribute("x2", gx(iso).toFixed(1));
    curseur.style.opacity = "1";
    let html = '<div class="t">' + esc(libelleDate(iso)) + "</div>";
    for (const s of utiles) {
      const v = lireSurPoints(s.points, iso);
      html += '<div class="l"><span><i class="puce" style="background:' + s.couleur + '"></i>' + esc(s.nom) + "</span><b>" + esc(argent(v)) + "</b></div>";
    }
    if (o.bande && o.bande.length) {
      let b = o.bande[0];
      for (const c of o.bande) { if (c.date > iso) break; b = c; }
      html += '<div class="l"><span class="faible">Marge observée</span><b class="faible">' +
        esc(argentCourt(b.bas)) + " … " + esc(argentCourt(b.haut)) + "</b></div>";
    }
    bulle.innerHTML = html;
    placerBulle(bulle, cible, gx(iso), mg.h + 6);
  };
  capteur.addEventListener("mousemove", bouger);
  capteur.addEventListener("touchmove", (e) => { bouger(e); }, { passive: true });
  capteur.addEventListener("mouseleave", () => { bulle.style.opacity = "0"; curseur.style.opacity = "0"; });
}

function lireSurPoints(points, date) {
  let v = points.length ? points[0].solde : 0;
  for (const p of points) { if (p.date > date) break; v = p.solde; }
  return v;
}

/** Barres revenus / dépenses mois par mois. */
function grapheBarres(cible, mois, options) {
  const o = options || {};
  const L = largeurDe(cible);
  const H = o.hauteur || 250;
  const mg = { h: 14, d: 10, b: 26, g: 58 };
  const l = L - mg.g - mg.d;
  const h = H - mg.h - mg.b;

  if (!mois.length) { cible.innerHTML = '<div class="vide">Aucun mois à afficher.</div>'; return; }

  const max = Math.max(1, ...mois.map((m) => Math.max(m.revenus, m.depenses)));
  const ticks = graduations(0, max, 4);
  const haut = ticks[ticks.length - 1] || max;
  const pas = l / mois.length;
  const largeurBarre = Math.max(2, Math.min(16, pas / 2 - 2));

  const gy = (v) => mg.h + h - (v / haut) * h;

  let svg = '<svg class="graphe" width="' + L + '" height="' + H + '" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Revenus et dépenses mois par mois">';
  for (const t of ticks) {
    const y = gy(t);
    svg += '<line class="ligne-grille" x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="axe" x="' + (mg.g - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(argentCourt(t)) + "</text>";
  }

  // les zones de survol sont posées d'abord : surlignées, elles doivent
  // passer derrière les barres, pas devant
  const pasEtiquette = Math.max(1, Math.ceil(mois.length / Math.max(2, Math.floor(l / 78))));
  let barres = "";
  mois.forEach((m, i) => {
    const centre = mg.g + i * pas + pas / 2;
    svg += '<rect class="colonne" data-i="' + i + '" x="' + (mg.g + i * pas).toFixed(1) + '" y="' + mg.h + '" width="' + pas.toFixed(1) +
      '" height="' + h + '" fill="transparent" rx="4"/>';
    barres += '<rect class="barre" x="' + (centre - largeurBarre - 1).toFixed(1) + '" y="' + gy(m.revenus).toFixed(1) +
      '" width="' + largeurBarre.toFixed(1) + '" height="' + Math.max(0, mg.h + h - gy(m.revenus)).toFixed(1) + '" rx="3" fill="var(--revenu)"/>';
    barres += '<rect class="barre" x="' + (centre + 1).toFixed(1) + '" y="' + gy(m.depenses).toFixed(1) +
      '" width="' + largeurBarre.toFixed(1) + '" height="' + Math.max(0, mg.h + h - gy(m.depenses)).toFixed(1) + '" rx="3" fill="var(--depense)"/>';
    if (i % pasEtiquette === 0) {
      barres += '<text class="axe" x="' + centre.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(libelleMois(m.cle, true)) + "</text>";
    }
  });
  svg += barres + "</svg>";
  cible.innerHTML = svg;
  cible.classList.add("boite-graphe");

  const bulle = infobulleDe(cible);
  cible.querySelectorAll(".colonne").forEach((r) => {
    r.addEventListener("mouseenter", () => {
      r.setAttribute("fill", "var(--surface-2)");
      const m = mois[Number(r.dataset.i)];
      bulle.innerHTML = '<div class="t">' + esc(libelleMois(m.cle)) + "</div>" +
        '<div class="l"><span><i class="puce" style="background:var(--revenu)"></i>Revenus</span><b>' + esc(argent(m.revenus)) + "</b></div>" +
        '<div class="l"><span><i class="puce" style="background:var(--depense)"></i>Dépenses</span><b>' + esc(argent(m.depenses)) + "</b></div>" +
        '<div class="l"><span>Net</span><b class="' + (m.net >= 0 ? "pos" : "neg") + '">' + esc(argent(m.net, { signe: true })) + "</b></div>" +
        '<div class="l"><span>Solde fin de mois</span><b>' + esc(argent(m.soldeFin)) + "</b></div>";
      placerBulle(bulle, cible, Number(r.getAttribute("x")) + Number(r.getAttribute("width")) / 2, mg.h + 6);
    });
    r.addEventListener("mouseleave", () => { r.setAttribute("fill", "transparent"); bulle.style.opacity = "0"; });
  });
}

/** Anneau de répartition. parts : [{nom, valeur, couleur}] */
function grapheAnneau(cible, parts, options) {
  const o = options || {};
  const taille = o.taille || 190;
  const total = parts.reduce((s, p) => s + p.valeur, 0);
  if (!total) { cible.innerHTML = '<div class="vide">Aucune dépense sur la période.</div>'; return; }

  const r = taille / 2 - 6;
  const rInt = r * 0.62;
  const cx = taille / 2, cy = taille / 2;
  let angle = -Math.PI / 2;

  let svg = '<svg class="graphe" width="' + taille + '" height="' + taille + '" viewBox="0 0 ' + taille + ' ' + taille + '" role="img" aria-label="Répartition des dépenses">';
  for (const p of parts) {
    const part = p.valeur / total;
    const fin = angle + part * Math.PI * 2;
    const grand = part > 0.5 ? 1 : 0;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(fin), y2 = cy + r * Math.sin(fin);
    const x3 = cx + rInt * Math.cos(fin), y3 = cy + rInt * Math.sin(fin);
    const x4 = cx + rInt * Math.cos(angle), y4 = cy + rInt * Math.sin(angle);
    // un secteur complet ne se trace pas en arc : on pose un anneau plein
    if (part > 0.999) {
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((r + rInt) / 2) + '" fill="none" stroke="' + p.couleur + '" stroke-width="' + (r - rInt) + '"><title>' + esc(p.nom) + "</title></circle>";
    } else {
      svg += '<path d="M' + x1.toFixed(2) + "," + y1.toFixed(2) + "A" + r + "," + r + " 0 " + grand + ",1 " + x2.toFixed(2) + "," + y2.toFixed(2) +
        "L" + x3.toFixed(2) + "," + y3.toFixed(2) + "A" + rInt + "," + rInt + " 0 " + grand + ",0 " + x4.toFixed(2) + "," + y4.toFixed(2) +
        'Z" fill="' + p.couleur + '" stroke="var(--surface)" stroke-width="1.5"><title>' + esc(p.nom + " · " + argent(p.valeur)) + "</title></path>";
    }
    angle = fin;
  }
  svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" style="font-family:var(--display);font-weight:700;font-size:16px;fill:var(--texte)">' + esc(argentCourt(total)) + "</text>";
  svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" class="axe">' + esc(o.legende || "au total") + "</text>";
  svg += "</svg>";
  cible.innerHTML = svg;
}

}

/** Le montant d'une opération, signé — sauf un virement interne, qui ne fait
 *  ni entrer ni sortir d'argent du périmètre observé. */
function montantOperation(op) {
  if (op.type === "virement" && op.sens === "interne") {
    return '<span class="dim">↔ ' + esc(argent(op.brut)) + "</span>";
  }
  return '<span class="' + (op.montant >= 0 ? "pos" : "neg") + '">' + esc(argent(op.montant, { signe: true })) + "</span>";
}

/** « Courant → Livret » pour un virement, la catégorie sinon. */
function contexteOperation(op) {
  if (op.type !== "virement") return nomCategorie(op.categorieId);
  if (op.sens === "entree") return nomCompte(op.compteDest) + " → " + nomCompte(op.compteId);
  return nomCompte(op.compteId) + " → " + nomCompte(op.compteDest);
}

function kpi(etiquette, valeur, note, couleur, fond) {
  return '<div class="kpi">' + (fond || "") + '<span class="etiq">' + esc(etiquette) + "</span>" +
    '<span class="val"' + (couleur ? ' style="color:' + couleur + '"' : "") + ">" + esc(valeur) + "</span>" +
    (note ? '<span class="note">' + note + "</span>" : "") + "</div>";
}

/* ── Tableau de bord ──────────────────────────────────────────────────── */

function rendreTableau(cible, p) {
  if (!ETAT.flux.length) { cible.innerHTML = etatVide(); return; }

  const stats = statistiquesDerive();
  const bande = bandeIncertitude(p, stats);
  const t = p.totaux;
  const evolution = arrondi2(p.soldeFinal - p.soldeInitial);
  const rav = resteAVivre(p);
  const horizonTexte = ETAT.parametres.horizon + " mois";

  const kpis = '<div class="kpis">' +
    kpi("Solde aujourd'hui", argent(p.soldeInitial),
      esc(ETAT.comptes.length + (ETAT.comptes.length > 1 ? " comptes" : " compte"))) +
    kpi("Dans " + horizonTexte, argent(p.soldeFinal),
      bande
        ? esc(argent(bande[bande.length - 1].centre)) + " au rythme de dérive observé"
        : '<span class="' + (evolution >= 0 ? "pos" : "neg") + '">' + esc(argent(evolution, { signe: true })) + "</span> sur la période",
      evolution >= 0 ? "var(--revenu-texte)" : "var(--depense-texte)",
      etincelle(p.points, evolution >= 0 ? "var(--revenu)" : "var(--depense)")) +
    kpi("Reste chaque mois", argent(t.netMensuel, { signe: true }),
      esc(argent(t.revenusMensuels) + " − " + argent(t.depensesMensuelles)),
      t.netMensuel >= 0 ? "var(--revenu-texte)" : "var(--depense-texte)") +
    kpi("Reste à vivre", argent(rav.reste),
      esc(argent(rav.parJour) + " par jour, une fois les charges contraintes payées"),
      "var(--accent)") +
    "</div>";

  const a = p.alerte;
  let bandeau;
  if (a.dateDecouvert) {
    bandeau = '<div class="bandeau rouge">' + icone("alerte", "ic") + "<div><b>Découvert le " + esc(libelleDate(a.dateDecouvert)) +
      "</b> — au rythme actuel, le solde passe sous zéro dans " + esc(nombre(Math.max(0, joursEntre(p.du, a.dateDecouvert)))) +
      " jours, et descend jusqu'à <b>" + esc(argent(a.soldeMin)) + "</b> le " + esc(libelleDate(a.dateSoldeMin)) +
      ". Il manque environ <b>" + esc(argent(Math.abs(a.soldeMin))) + "</b> pour tenir la période.</div></div>";
  } else if (a.dateSousSeuil) {
    bandeau = '<div class="bandeau ambre">' + icone("oeil", "ic") + "<div><b>Sous votre seuil de sécurité le " + esc(libelleDate(a.dateSousSeuil)) +
      "</b> — le solde reste positif, mais descend à " + esc(argent(a.soldeMin)) + " le " + esc(libelleDate(a.dateSoldeMin)) +
      " alors que vous vous êtes fixé un plancher de " + esc(argent(a.seuil)) + ".</div></div>";
  } else {
    bandeau = '<div class="bandeau vert">' + icone("ok", "ic") + "<div><b>Aucune rupture sur " + esc(horizonTexte) + "</b> — le point bas est de " +
      esc(argent(a.soldeMin)) + " le " + esc(libelleDate(a.dateSoldeMin)) +
      (a.seuil > 0 ? ", au-dessus de votre seuil de " + esc(argent(a.seuil)) : "") + ".</div></div>";
  }

  const courbe = carte('<div id="g-solde"></div>' +
    '<div class="legende"><span><i class="puce" style="background:var(--accent)"></i>Solde projeté</span>' +
    (bande ? '<span><svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 4"/></svg>&nbsp;Corrigé de la dérive</span>' +
             '<span><i class="puce" style="background:var(--accent);opacity:.35"></i>Marge observée (80 %)</span>' : "") +
    (ETAT.parametres.seuilAlerte > 0 ? '<span><svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" class="ligne-seuil"/></svg>&nbsp;Seuil de sécurité</span>' : "") +
    (a.dateDecouvert ? '<span><i class="puce" style="background:var(--depense)"></i>Passage sous zéro</span>' : "") +
    "</div>" +
    (bande
      ? '<p class="sous" style="margin:10px 0 0">La marge vient de vos ' + esc(nombre(stats.n)) +
        " pointages : en moyenne " + esc(argent(stats.biais, { signe: true })) + " par mois d'écart avec la prévision, " +
        "dispersés de " + esc(argent(stats.ecartType)) + ". Elle s'ouvre en racine du temps." +
        ' <button class="btn fantome petit" data-act="vue-suivi">Voir le suivi</button></p>'
      : '<p class="sous" style="margin:10px 0 0">Cette courbe n\'a encore jamais été confrontée à vos relevés.' +
        ' <button class="btn fantome petit" data-act="vue-suivi">Pointer un compte</button></p>'),
    { titre: "Solde jour par jour", sous: "Chaque marche est une échéance. Le tracé suppose que tous les flux se réalisent comme prévu.",
      droite: esc(libelleDate(p.du, true) + " → " + libelleDate(p.au, true)) });

  const barres = carte('<div id="g-mois"></div>' +
    '<div class="legende"><span><i class="puce" style="background:var(--revenu)"></i>Revenus</span>' +
    '<span><i class="puce" style="background:var(--depense)"></i>Dépenses</span></div>',
    { titre: "Mois par mois", droite: esc(nombre(p.mois.length) + " mois") });

  // agenda : les 45 prochains jours
  const limite = ajouterJours(p.du, 45);
  const prochaines = p.operations.filter((op) => op.date <= limite).slice(0, 12);
  const agenda = carte(
    prochaines.length
      ? '<ul class="agenda">' + prochaines.map((op) =>
          '<li><span class="quand">' + esc(delaiTexte(op.date, p.du)) + "</span>" +
          '<span class="quoi"><i class="puce" style="background:' + teinte(categorie(op.categorieId) ? categorie(op.categorieId).teinte : 1) + '"></i>' + esc(op.libelle) +
          (op.ajuste ? ' <span class="etiquette acc">ajusté</span>' : "") +
          (op.type === "virement" ? ' <span class="faible">· ' + esc(contexteOperation(op)) + "</span>" : "") + "</span>" +
          '<span class="combien">' + montantOperation(op) + "</span>" +
          '<span class="actions"><button class="btn fantome icone" data-act="op-ajuster" data-flux="' + esc(op.fluxId) +
          '" data-date="' + op.date + '" title="Ajuster cette échéance">' + icone("crayon", "") + "</button></span></li>").join("")
        + "</ul>"
      : '<div class="vide">Rien de prévu dans les 45 prochains jours.</div>',
    { titre: "À venir", sous: "Les 45 prochains jours. Une échéance peut être corrigée ou sautée sans toucher au flux.",

  // répartition des dépenses
  const parts = [...p.parCategorie.values()]
    .filter((e) => e.type === "depense")

    .map((e) => {

      return { nom: c ? c.nom : "Sans catégorie", valeur: e.total, couleur: teinte(c ? c.teinte : 1) };

  const repartition = carte(

    '<div id="g-anneau"></div>' +
    '<div style="flex:1;min-width:200px">' +
    parts.slice(0, 7).map((x) =>
      '<div style="display:flex;justify-content:space-between;gap:12px;padding:3.5px 0;font-size:13.5px">' +
      '<span><i class="puce" style="background:' + x.couleur + '"></i>' + esc(x.nom) + "</span>" +

    "</div></div>",
    { titre: "Où part l'argent", sous: "Sur toute la période projetée, dépenses seulement.",
      droite: '<button class="btn petit" data-act="vue-categories">Enveloppes</button>' });

  // contraint / choisi
  const partContrainte = rav.revenus > 0 ? Math.min(100, (rav.contraint / rav.revenus) * 100) : 0;
  const partChoisie = rav.revenus > 0 ? Math.min(100 - partContrainte, (rav.libre / rav.revenus) * 100) : 0;
  const equilibre = carte(
    '<div class="jauge" style="height:11px;display:flex">' +
    '<i style="width:' + partContrainte.toFixed(1) + '%;background:var(--serie-1);border-radius:0"></i>' +
    '<i style="width:' + partChoisie.toFixed(1) + '%;background:var(--serie-3);border-radius:0"></i>' +
    "</div>" +
    '<div class="grille g3" style="margin-top:13px;gap:10px">' +
    '<div><span class="eyebrow"><i class="puce" style="background:var(--serie-1)"></i>Contraint</span>' +
    '<div class="chiffre" style="font-family:var(--display);font-weight:700;font-size:19px">' + esc(argent(rav.contraint)) + "</div>" +
    '<div class="faible" style="font-size:12px">logement, courses, crédits…</div></div>' +
    '<div><span class="eyebrow"><i class="puce" style="background:var(--serie-3)"></i>Choisi</span>' +
    '<div class="chiffre" style="font-family:var(--display);font-weight:700;font-size:19px">' + esc(argent(rav.libre)) + "</div>" +
    '<div class="faible" style="font-size:12px">loisirs, abonnements, épargne…</div></div>' +
    '<div><span class="eyebrow">Reste après contraint</span>' +
    '<div class="chiffre" style="font-family:var(--display);font-weight:700;font-size:19px;color:var(--accent)">' + esc(argent(rav.reste)) + "</div>" +
    '<div class="faible" style="font-size:12px">soit ' + esc(argent(rav.parJour)) + " par jour</div></div></div>",
    { titre: "Contraint et choisi",
      sous: "Le partage vient de vos catégories, pas d'un classement automatique : ce qui est un loisir chez l'un est un besoin chez l'autre.",
      droite: rav.partContrainte === null ? "" : esc(pourcent(rav.partContrainte, 0) + " des revenus") });

  const constats = observations(p);
  const carteConstats = constats.length
    ? carte('<div class="constats">' + constats.slice(0, ui.tousConstats ? 99 : 4).map((o) =>
        '<div class="constat ' + o.ton + '"><span class="marque-ton">' +
        icone(o.ton === "attention" ? "alerte" : o.ton === "bien" ? "ok" : "oeil", "") + "</span>" +
        "<b>" + esc(o.titre) + "</b>" +
        (o.vue ? '<button class="btn petit" data-act="vue-aller" data-vue="' + esc(o.vue) + '">Voir</button>' : "<span></span>") +
        "<p>" + esc(o.texte) + "</p></div>").join("") + "</div>" +
        (constats.length > 4
          ? '<div class="rangee" style="margin-top:12px"><button class="btn fantome petit" data-act="constats-tout">' +
            (ui.tousConstats ? "Voir moins" : "Voir les " + (constats.length - 4) + " autres") + "</button></div>"
          : ""),
        { titre: "Ce que vos chiffres disent",
          sous: "Des constats, pas des conseils : chacun porte le chiffre qui le fonde, pour que vous puissiez le contredire." })
    : "";

  cible.innerHTML = kpis + bandeau + courbe +
    '<div class="grille g-2-1">' + barres + agenda + "</div>" +
    carteConstats +
    '<div class="grille g-2-1">' + repartition + equilibre + "</div>";

  grapheCourbes(boite("g-solde"), [{
    nom: "Solde", couleur: "var(--accent)", points: p.points, remplir: !bande, epaisseur: 2.2,
  }], {
    seuil: ETAT.parametres.seuilAlerte,
    bande,
    marqueur: a.dateDecouvert ? { date: a.dateDecouvert, valeur: soldeALaDate(p, a.dateDecouvert) } : null,
    hauteur: 300,
  });
  grapheBarres(boite("g-mois"), p.mois, { hauteur: 230 });
  grapheAnneau(boite("g-anneau"), parts, { legende: "de dépenses" });
}

    '<button class="btn" data-act="flux-nouveau">Saisir un premier flux</button>' +

    "</div>" +
    '<p class="faible" style="font-size:12.5px;margin-top:14px">Le fichier ne quitte pas votre navigateur : ' +

/* ── Revenus & dépenses ───────────────────────────────────────────────── */

/**
 * Ce que chaque flux pèse sur l'horizon, lu sur la projection déjà calculée.
 *
 * Rejouer les échéances flux par flux coûtait une seconde projection
 * complète à chaque frappe dans la recherche ; tout est déjà là.
 */
function resumeParFlux(p) {
  const par = new Map();
  for (const op of p.operations) {
    let e = par.get(op.fluxId);
    if (!e) { e = { total: 0, nombre: 0, premiere: op.date }; par.set(op.fluxId, e); }
    e.total = arrondi2(e.total + op.brut);
    e.nombre++;
  }
  return par;
}

function rendreFlux(cible, p) {
  const revenus = ETAT.flux.filter((f) => f.type === "revenu" && f.actif);
  const depenses = ETAT.flux.filter((f) => f.type === "depense" && f.actif);
  const virements = ETAT.flux.filter((f) => f.type === "virement" && f.actif);
  const rythmeR = revenus.reduce((s, f) => s + mensualiteMoyenne(f), 0);
  const rythmeD = depenses.reduce((s, f) => s + mensualiteMoyenne(f), 0);
  const rythmeV = virements.reduce((s, f) => s + mensualiteMoyenne(f), 0);

  const entete = '<div class="kpis">' +
    kpi("Revenus, rythme mensuel", argent(rythmeR), esc(revenus.length + " flux actifs"), "var(--revenu-texte)") +
    kpi("Dépenses, rythme mensuel", argent(rythmeD), esc(depenses.length + " flux actifs"), "var(--depense-texte)") +
    kpi("Écart", argent(rythmeR - rythmeD, { signe: true }),
      rythmeR > 0 ? esc(pourcent(((rythmeR - rythmeD) / rythmeR) * 100, 1) + " des revenus") : "",
      rythmeR - rythmeD >= 0 ? "var(--revenu-texte)" : "var(--depense-texte)") +
    kpi("Virements internes", virements.length ? argent(rythmeV) : "—",
      virements.length
        ? esc(virements.length + (virements.length > 1 ? " virements entre vos comptes" : " virement entre vos comptes"))
        : "aucun mouvement entre comptes") +
    "</div>";

  const barreOutils = '<div class="rangee" style="margin-bottom:12px">' +
    '<input type="text" id="rech" placeholder="Rechercher un flux…" value="' + esc(ui.recherche) + '" style="max-width:240px">' +
    '<div class="segments" data-groupe="filtreType">' +
    ["tous", "revenu", "depense"].concat(ETAT.flux.some((f) => f.type === "virement") ? ["virement"] : []).map((v) =>
      '<button data-act="filtre-type" data-v="' + v + '" class="' + (ui.filtreType === v ? "on" : "") + '">' +
      (v === "tous" ? "Tout" : v === "revenu" ? "Revenus" : v === "depense" ? "Dépenses" : "Virements") + "</button>").join("") +
    "</div>" +
    '<div class="segments" data-groupe="tri">' +
    [["montant", "Montant"], ["libelle", "Nom"], ["date", "Prochaine"]].map(([v, n]) =>
      '<button data-act="tri" data-v="' + v + '" class="' + (ui.tri === v ? "on" : "") + '">' + n + "</button>").join("") +
    "</div>" +
    '<button class="btn primaire" data-act="flux-nouveau" style="margin-left:auto">+ Nouveau flux</button></div>';

  cible.innerHTML = (ETAT.flux.length ? entete : "") +
    carte(barreOutils + '<div id="flux-table"></div>', {
      sous: ETAT.flux.length
        ? "« Par mois » lisse chaque flux sur l'année : un trimestriel de 300 € y compte pour 100 €. La projection, elle, place chaque échéance à sa date."
        : "",
    });
  boite("flux-table").innerHTML = tableauFlux(p);

  /* La recherche ne redessine que le tableau : recréer le champ à chaque
     frappe obligeait à lui rendre le curseur, et la vue entière y passait. */
  const rech = boite("rech");
  if (rech) {
    rech.addEventListener("input", () => {
      ui.recherche = rech.value;
      boite("flux-table").innerHTML = tableauFlux(p);
    });
  }
}

/** Le tableau seul, recalculé à chaque frappe dans la recherche. */
function tableauFlux(p) {
  let liste = ETAT.flux.slice();
  if (ui.filtreType !== "tous") liste = liste.filter((f) => f.type === ui.filtreType);
  if (ui.recherche.trim()) {
    const q = ui.recherche.trim().toLowerCase();
    liste = liste.filter((f) => (f.libelle + " " + nomCategorie(f.categorieId) + " " + f.note).toLowerCase().includes(q));
  }
  const resume = resumeParFlux(p);
  liste.sort((a, b) => {
    if (ui.tri === "libelle") return a.libelle.localeCompare(b.libelle, "fr");
    if (ui.tri === "date") {
      const da = resume.get(a.id), db = resume.get(b.id);
      if (!da) return 1; if (!db) return -1;
      return da.premiere < db.premiere ? -1 : da.premiere > db.premiere ? 1 : 0;
    }
    return mensualiteMoyenne(b) - mensualiteMoyenne(a);
  });

  const lignes = liste.map((f) => {
    const c = categorie(f.categorieId);
    const s = resume.get(f.id);
    const freq = FREQ[f.frequence] || FREQ.mensuel;
    return '<tr class="cliquable" data-act="flux-editer" data-id="' + esc(f.id) + '">' +
      "<td><div style=\"font-weight:500\">" + esc(f.libelle) +
        (f.actif ? "" : ' <span class="etiquette off">en pause</span>') +
        (f.indexation ? ' <span class="etiquette" title="Revalorisation annuelle">+' + esc(nombre(f.indexation, 1)) + " %/an</span>" : "") +
        (f.exceptions && f.exceptions.length ? ' <span class="etiquette acc" title="Échéances corrigées ou sautées">' +
          f.exceptions.length + " ajusté" + (f.exceptions.length > 1 ? "es" : "e") + "</span>" : "") +
        "</div>" +
        '<div class="faible" style="font-size:12.5px"><i class="puce" style="background:' + teinte(c ? c.teinte : 1) + '"></i>' +
        (f.type === "virement"
          ? esc(nomCompte(f.compteId) + " → " + nomCompte(f.compteDest))
          : esc(nomCategorie(f.categorieId) + " · " + nomCompte(f.compteId))) +
        (f.fin ? " · jusqu'au " + esc(libelleDate(f.fin)) : "") + "</div></td>" +
      '<td><span class="etiquette">' + esc(freq.court) + "</span>" +
        (f.type === "virement" ? ' <span class="etiquette">virement</span>' : "") + "</td>" +
      '<td class="num ' + (f.type === "revenu" ? "pos" : f.type === "depense" ? "neg" : "dim") + '" style="font-weight:600">' +
        esc(f.type === "virement" ? "↔ " + argent(f.montant) : argent(f.type === "revenu" ? f.montant : -f.montant, { signe: true })) + "</td>" +
      '<td class="num dim">' + esc(argent(mensualiteMoyenne(f))) + "</td>" +
      '<td class="dim">' + (s ? esc(libelleDate(s.premiere, true)) : '<span class="faible">—</span>') + "</td>" +
      '<td class="num dim">' + esc(argent(s ? s.total : 0)) + "</td>" +
      '<td class="actions">' +
        '<button class="btn fantome icone" data-act="flux-basculer" data-id="' + esc(f.id) + '" title="' +
          (f.actif ? "Mettre en pause" : "Réactiver") + '">' + icone(f.actif ? "pause" : "lecture", "") + "</button>" +
        '<button class="btn fantome icone" data-act="flux-dupliquer" data-id="' + esc(f.id) + '" title="Dupliquer">' + icone("copie", "") + "</button>" +
        '<button class="btn fantome icone" data-act="flux-supprimer" data-id="' + esc(f.id) + '" title="Supprimer">' + icone("croix", "") + "</button></td></tr>";
  }).join("");

  return liste.length
    ? '<div class="tableau-boite"><table><thead><tr>' +
      "<th>Flux</th><th>Rythme</th><th class=\"num\">Montant</th><th class=\"num\">Par mois</th><th>Prochaine</th>" +
      '<th class="num">Sur ' + ETAT.parametres.horizon + " mois</th><th></th></tr></thead><tbody>" + lignes + "</tbody></table></div>"
    : '<div class="vide">Aucun flux ne correspond à cette recherche.</div>';
}

/* ── Projection ───────────────────────────────────────────────────────── */

function rendreProjection(cible, p) {
  // un compte supprimé entre-temps ramène la vue à tous les comptes
  const filtre = compte(ui.compteProjection) ? ui.compteProjection : "";
  const proj = filtre ? projeter({ du: p.du, au: p.au, compteId: filtre }) : p;

  const choixCompte = '<label class="champ" style="max-width:240px"><span class="ttl">Périmètre</span>' +
    '<select data-act="compte-projection"><option value="">Tous les comptes</option>' +
    ETAT.comptes.map((c) => '<option value="' + esc(c.id) + '"' + (filtre === c.id ? " selected" : "") + ">" + esc(c.nom) + "</option>").join("") +
    "</select></label>";

  /* Sur plus d'une année, un sous-total annuel évite de faire l'addition
     de tête sur douze lignes. */
  const annees = new Map();
  for (const m of proj.mois) {
    const an = m.cle.slice(0, 4);
    if (!annees.has(an)) annees.set(an, { revenus: 0, depenses: 0, dernier: m });
    const e = annees.get(an);
    e.revenus += m.revenus; e.depenses += m.depenses; e.dernier = m;
  }
  const plusieursAnnees = annees.size > 1;

  const lignes = proj.mois.map((m) => {
    const ouvert = ui.moisOuverts.has(m.cle);
    let html = '<tr class="cliquable" data-act="mois-detail" data-cle="' + m.cle + '">' +
      "<td>" + (m.operations.length ? '<span class="faible">' + (ouvert ? "▾" : "▸") + "</span> " : "&nbsp;&nbsp;&nbsp;") + esc(libelleMois(m.cle)) + "</td>" +
      '<td class="num pos">' + (m.revenus ? esc(argent(m.revenus)) : '<span class="faible">—</span>') + "</td>" +
      '<td class="num neg">' + (m.depenses ? esc(argent(m.depenses)) : '<span class="faible">—</span>') + "</td>" +
      '<td class="num ' + (m.net >= 0 ? "pos" : "neg") + '" style="font-weight:600">' + esc(argent(m.net, { signe: true })) + "</td>" +
      '<td class="num" style="font-weight:600' + (m.soldeFin < 0 ? ";color:var(--depense-texte)" : "") + '">' + esc(argent(m.soldeFin)) + "</td>" +
      '<td class="num dim">' + esc(argent(m.soldeMin)) + "</td></tr>";
    if (ouvert && m.operations.length) {
      html += '<tr class="repli"><td colspan="6"><div style="padding:6px 10px 10px"><table>' +
        m.operations.map((op) =>
          "<tr><td style=\"width:88px\" class=\"dim\">" + esc(libelleDate(op.date, true)) + "</td>" +
          "<td><i class=\"puce\" style=\"background:" + teinte(categorie(op.categorieId) ? categorie(op.categorieId).teinte : 1) + "\"></i>" + esc(op.libelle) +
          (op.ajuste ? ' <span class="etiquette acc">ajusté</span>' : "") + "</td>" +
          '<td class="dim">' + esc(contexteOperation(op)) + "</td>" +
          '<td class="num">' + montantOperation(op) + "</td>" +
          '<td class="num dim">' + esc(argent(op.solde)) + "</td>" +
          '<td class="actions"><button class="btn fantome icone" data-act="op-ajuster" data-flux="' + esc(op.fluxId) +
          '" data-date="' + op.date + '" title="Ajuster cette échéance">' + icone("crayon", "") + "</button></td></tr>").join("") +
        "</table></div></td></tr>";
    }
    const an = annees.get(m.cle.slice(0, 4));
    if (plusieursAnnees && an && an.dernier === m) {
      html += '<tr class="annee"><td>Total ' + m.cle.slice(0, 4) + "</td>" +
        '<td class="num">' + esc(argent(arrondi2(an.revenus))) + "</td>" +
        '<td class="num">' + esc(argent(arrondi2(an.depenses))) + "</td>" +
        '<td class="num">' + esc(argent(arrondi2(an.revenus - an.depenses), { signe: true })) + "</td>" +
        '<td class="num">' + esc(argent(m.soldeFin)) + "</td><td></td></tr>";
    }
    return html;
  }).join("");

  const total = '<tr class="total"><td>Total sur ' + proj.nbMois + " mois</td>" +
    '<td class="num pos">' + esc(argent(proj.totaux.revenus)) + "</td>" +
    '<td class="num neg">' + esc(argent(proj.totaux.depenses)) + "</td>" +
    '<td class="num ' + (proj.totaux.net >= 0 ? "pos" : "neg") + '">' + esc(argent(proj.totaux.net, { signe: true })) + "</td>" +
    '<td class="num">' + esc(argent(proj.soldeFinal)) + "</td><td></td></tr>";

  cible.innerHTML =
    carte('<div class="rangee" style="align-items:flex-end">' + choixCompte +
      '<div style="margin-left:auto" class="rangee">' +
      '<button class="btn" data-act="export-csv">Exporter en CSV</button>' +
      '<button class="btn" data-act="tout-replier">' + (ui.moisOuverts.size ? "Tout replier" : "Tout déplier") + "</button></div></div>" +
      '<div id="g-proj" style="margin-top:14px"></div>',
      { titre: "Trajectoire du solde", sous: filtre ? "Compte « " + nomCompte(filtre) + " » seul." : "Tous comptes confondus." }) +
    carte('<div class="tableau-boite"><table><thead><tr><th>Mois</th><th class="num">Revenus</th><th class="num">Dépenses</th>' +
      '<th class="num">Net</th><th class="num">Solde fin de mois</th><th class="num">Point bas</th></tr></thead>' +
      "<tbody>" + lignes + total + "</tbody></table></div>",
      { titre: "Mois par mois", sous: "Cliquez une ligne pour voir le détail des opérations du mois." });

  grapheCourbes(boite("g-proj"), [{ nom: "Solde", couleur: "var(--accent)", points: proj.points, remplir: true }],
    { seuil: filtre ? 0 : ETAT.parametres.seuilAlerte, hauteur: 260 });
}


/* ── Calendrier ───────────────────────────────────────────────────────── */

const JOURS_COURTS = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];

/**
 * Le mois d'ouverture du calendrier.
 *
 * Le mois en cours, sauf s'il ne lui reste presque rien : le 28, un
 * calendrier aux trois quarts grisé n'apprend rien, alors que le mois
 * suivant est précisément ce qu'on vient vérifier.
 */
const CALENDRIER_RESTE_MINIMUM = 8;

function moisCalendrier(p) {
  const premier = cleMois(p.du), dernier = cleMois(p.au);
  const dans = (cle) => cle >= premier && cle <= dernier;
  if (ui.moisCalendrier && dans(ui.moisCalendrier)) return ui.moisCalendrier;
  const restant = joursEntre(p.du, finDeMois(premier)) + 1;
  const suivant = moisSuivant(premier);
  return restant < CALENDRIER_RESTE_MINIMUM && dans(suivant) ? suivant : premier;
}

function rendreCalendrier(cible, p) {
  const cle = moisCalendrier(p);
  const cal = calendrier(p, cle);
  const mois = p.mois.find((m) => m.cle === cle);
  const premier = cleMois(p.du), dernier = cleMois(p.au);

  /* Un seul jour est atteignable par tabulation — celui d'aujourd'hui, ou
     le premier du mois : on circule ensuite aux flèches, comme dans une
     grille. Trente arrêts de tabulation rendraient la vue impraticable. */
  const ancre = cal.jours.find((x) => x.date === aujourdhui()) || cal.jours[0];
  const cases = [];
  for (let i = 0; i < cal.decalage; i++) cases.push('<div class="cal-case vide"></div>');
  for (const j of cal.jours) {
    const net = arrondi2(j.entrees - j.sorties);
    const points = j.operations.slice(0, 8).map((op) => {
      const c = categorie(op.categorieId);
      return '<i style="background:' + (op.type === "virement" ? "var(--faible)" : teinte(c ? c.teinte : 1)) + '"></i>';
    }).join("");
    cases.push('<button class="cal-case' +
      (j.date === aujourdhui() ? " aujourdhui" : "") +
      (!j.dedans ? " hors" : "") +
      (j.solde !== null && j.solde < 0 ? " rouge" : "") +
      '" data-act="cal-jour" data-date="' + j.date + '" role="gridcell"' +
      ' aria-label="' + esc(libelleDate(j.date) + (j.operations.length
        ? " : " + j.operations.length + " opération" + (j.operations.length > 1 ? "s" : "") +
          (j.solde !== null ? ", solde " + argent(j.solde) : "")
        : ", rien de prévu")) + '"' +
      ' tabindex="' + (j === ancre ? "0" : "-1") + '">' +
      '<span class="jour" aria-hidden="true">' + j.jour + "</span>" +
      (j.entrees ? '<span class="mv pos">+ ' + esc(argentCourt(j.entrees)) + "</span>" : "") +
      (j.sorties ? '<span class="mv neg">− ' + esc(argentCourt(j.sorties)) + "</span>" : "") +
      (points ? '<span class="points">' + points + "</span>" : "") +
      (j.solde !== null ? '<span class="solde">' + esc(argentCourt(j.solde)) + "</span>" : "") +
      "</button>");
  }

  const jours = [...cal.jours];
  const gros = jours.slice().sort((a, b) => b.sorties - a.sorties).filter((j) => j.sorties > 0).slice(0, 5);
  const creux = jours.filter((j) => j.solde !== null).sort((a, b) => a.solde - b.solde)[0];

  cible.innerHTML = carte(
    '<div class="rangee" style="margin-bottom:14px">' +
    '<button class="btn petit" data-act="cal-precedent"' + (cle <= premier ? " disabled" : "") + '>‹ Mois précédent</button>' +
    '<b style="font-family:var(--display);font-size:17px">' + esc(libelleMois(cle)) + "</b>" +
    '<button class="btn petit" data-act="cal-suivant"' + (cle >= dernier ? " disabled" : "") + '>Mois suivant ›</button>' +
    '<button class="btn petit fantome" data-act="cal-aujourdhui">Ce mois-ci</button>' +
    '<span class="pousse dim" style="font-size:13px">' +
    (mois ? esc(argent(mois.revenus) + " entrent, " + argent(mois.depenses) +
      " sortent · solde le " + libelleDate(finDeMois(cle), true) + " : " + argent(mois.soldeFin)) : "") +
    "</span></div>" +
    '<div class="cal-grille" style="margin-bottom:6px">' +
    JOURS_COURTS.map((j) => '<div class="cal-jour-nom">' + j + "</div>").join("") + "</div>" +
    '<div class="cal-grille" role="grid" aria-label="Calendrier de ' + esc(libelleMois(cle)) + '">' + cases.join("") + "</div>",
    { titre: "Le mois au jour le jour",
      sous: "Chaque case porte les mouvements du jour et le solde au soir ; les jours en rouge passent sous zéro. Cliquez un jour — ou circulez aux flèches — pour le détail." }) +
    '<div class="grille g2">' +
    carte(gros.length
      ? '<ul class="agenda">' + gros.map((j) =>
          '<li><span class="quand">' + esc(libelleJourMois(j.date)) + "</span>" +
          '<span class="quoi">' + esc(j.operations.filter((o) => o.montant < 0).map((o) => o.libelle).join(", ")) + "</span>" +
          '<span class="combien neg">− ' + esc(argent(j.sorties)) + "</span></li>").join("") + "</ul>"
      : '<div class="vide">Aucune sortie ce mois-ci.</div>',
      { titre: "Les journées les plus chargées", sous: "C'est là que se joue le point bas du mois." }) +
    carte(creux
      ? '<div class="kpi" style="padding:0"><span class="etiq">Point bas du mois</span>' +
        '<span class="val" style="color:' + (creux.solde < 0 ? "var(--depense-texte)" : "var(--texte)") + '">' + esc(argent(creux.solde)) + "</span>" +
        '<span class="note">le ' + esc(libelleDate(creux.date)) + "</span></div>" +
        '<p class="sous" style="margin:14px 0 0">' +
        (creux.solde < 0
          ? "Ce mois-ci ne passe pas : il manque " + esc(argent(Math.abs(creux.solde))) + " au plus bas. Décaler une échéance de quelques jours suffit parfois — cliquez la journée concernée."
          : "Le mois tient. La marge la plus faible est de " + esc(argent(creux.solde)) + ".") + "</p>"
      : '<div class="vide">Ce mois est hors de la fenêtre de projection.</div>',
      { titre: "Marge du mois" }) +
    "</div>";
}

/* ── Ajuster une échéance ─────────────────────────────────────────────── */

/**
 * Corriger une échéance précise sans toucher au flux : la facture d'énergie
 * de ce mois-ci, la prime qui tombe une fois plus haut, le prélèvement qui
 * n'aura pas lieu. C'est ce qui sépare une prévision d'un tableur figé.
 */
function ouvrirAjustement(fluxId, date) {
  const f = ETAT.flux.find((x) => x.id === fluxId);
  if (!f || !estIso(date)) return;
  const exc = exceptionDe(f, date);
  const theorique = arrondi2(montantA(f, date, PROJECTION.du));

  const corps =
    '<p class="sous" style="margin:0">Vous modifiez la seule échéance du <b>' + esc(libelleDate(date)) +
    "</b> de « " + esc(f.libelle) + " ». Les autres échéances gardent leur montant de " + esc(argent(theorique)) + ".</p>" +
    '<label class="champ"><span class="ttl">Montant pour cette échéance</span>' +
    '<input type="number" id="aj-montant" min="0" step="0.01" value="' + esc(exc && !exc.ignore ? exc.montant : theorique) + '"></label>' +
    '<label class="case"><input type="checkbox" id="aj-sauter"' + (exc && exc.ignore ? " checked" : "") +
    "> Cette échéance n'aura pas lieu</label>" +
    (exc ? '<p class="sous" style="margin:0">Cette échéance est déjà ajustée. « Rétablir » lui rend son montant normal.</p>' : "");

  const boutons = [];
  if (exc) boutons.push({ texte: "Rétablir", gauche: true, action: () => {
    modifier(() => poserException(fluxId, date, null), "Échéance rétablie.");
    fermerDialogue();
  } });
  boutons.push({ texte: "Annuler", action: fermerDialogue });
  boutons.push({ texte: "Enregistrer", classe: "primaire", action: () => {
    const sauter = boite("aj-sauter").checked;
    const montant = Number(String(boite("aj-montant").value).replace(",", "."));
    if (!sauter && !(montant >= 0)) { message("Le montant doit être un nombre positif."); return; }
    if (!sauter && arrondi2(montant) === theorique) {
      modifier(() => poserException(fluxId, date, null), "Échéance rétablie.");
    } else {
      modifier(() => poserException(fluxId, date, { montant: arrondi2(montant), ignore: sauter }),
        sauter ? "Échéance sautée." : "Échéance ajustée.");
    }
    fermerDialogue();
  } });

  ouvrirDialogue("Ajuster une échéance", corps, boutons, () => {
    const sauter = boite("aj-sauter");
    const champ = boite("aj-montant");
    const refleter = () => { champ.disabled = sauter.checked; };
    sauter.addEventListener("change", refleter);
    refleter();
  });
}


/* ── Suivi : pointer les comptes, lire la dérive ──────────────────────── */

/** Barres signées, une par pointage : l'écart entre le réel et le prévu. */
function grapheDerive(cible, points, options) {
  const o = options || {};
  const L = largeurDe(cible);
  const H = o.hauteur || 190;
  const mg = { h: 14, d: 10, b: 24, g: 58 };
  const l = L - mg.g - mg.d;
  const h = H - mg.h - mg.b;
  if (!points.length) { cible.innerHTML = '<div class="vide">Aucune dérive mesurée pour l\'instant.</div>'; return; }

  const ampleur = Math.max(1, ...points.map((p) => Math.abs(p.parMois)));
  const ticks = graduations(-ampleur, ampleur, 4);
  const borne = Math.max(Math.abs(ticks[0]), Math.abs(ticks[ticks.length - 1]));
  const gy = (v) => mg.h + h / 2 - (v / borne) * (h / 2);
  const pas = l / points.length;
  const largeur = Math.max(4, Math.min(34, pas - 10));

  let svg = '<svg class="graphe" width="' + L + '" height="' + H + '" viewBox="0 0 ' + L + ' ' + H +
    '" role="img" aria-label="Écart entre le solde réel et le solde prévu, à chaque pointage">';
  for (const t of ticks) {
    const y = gy(t);
    svg += '<line class="ligne-grille" x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="axe" x="' + (mg.g - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(argentCourt(t)) + "</text>";
  }
  svg += '<line class="ligne-zero" x1="' + mg.g + '" y1="' + gy(0).toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + gy(0).toFixed(1) + '"/>';

  points.forEach((p, i) => {
    const centre = mg.g + i * pas + pas / 2;
    const y0 = gy(0), y1 = gy(p.parMois);
    svg += '<rect class="barre" x="' + (centre - largeur / 2).toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) +
      '" width="' + largeur.toFixed(1) + '" height="' + Math.max(1, Math.abs(y1 - y0)).toFixed(1) +
      '" rx="3" fill="var(--' + (p.parMois >= 0 ? "revenu" : "depense") + ')"><title>' +
      esc(libelleDate(p.date) + " · " + argent(p.parMois, { signe: true }) + " par mois") + "</title></rect>";
    if (points.length <= 14) {
      svg += '<text class="axe" x="' + centre.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' +
        esc(libelleJourMois(p.date)) + "</text>";
    }
  });

  if (o.biais !== undefined && Math.abs(o.biais) > 0.01) {
    svg += '<line x1="' + mg.g + '" y1="' + gy(o.biais).toFixed(1) + '" x2="' + (mg.g + l) + '" y2="' + gy(o.biais).toFixed(1) +
      '" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  }
  svg += "</svg>";
  cible.innerHTML = svg;
}

    }).join("") + "</tbody></table></div>",

  const explication = jamaisPointe
    ? carte('<div class="vide"><p class="titre-vide">La prévision ne s\'est encore jamais confrontée au réel.</p>' +

        "prend dix secondes : vous lisez le solde sur votre application bancaire, vous l'entrez ici, et " +
        "l'application vous dit de combien elle s'était trompée.</p>" +
        "<p>Au bout de trois pointages, elle sait mesurer sa propre marge d'erreur et l'affiche autour de la courbe.</p>" +
        '<button class="btn primaire" data-act="pointer" data-id="' + esc(ETAT.comptes[0].id) + '">Pointer ' + esc(ETAT.comptes[0].nom) + "</button></div>")
    : carte('<div id="g-derive"></div>' +
        '<div class="legende"><span><i class="puce" style="background:var(--revenu)"></i>Il restait plus que prévu</span>' +
        '<span><i class="puce" style="background:var(--depense)"></i>Il restait moins que prévu</span>' +
        (Math.abs(st.biais) > 0.01 ? '<span><svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/></svg>&nbsp;Moyenne</span>' : "") +
        "</div>",
        { titre: "Dérive à chaque pointage", droite: esc(nombre(st.n) + (st.n > 1 ? " mesures" : " mesure")),
          sous: "Chaque barre est l'écart entre ce que vous aviez et ce que l'application annonçait, ramené à un mois pour que des périodes inégales restent comparables." });

  const lecture = st.n
    ? carte('<p class="sous" style="margin:0">' + esc(lectureDerive(st)) + "</p>" +
        (st.exploitable
          ? '<p class="sous" style="margin:10px 0 0">La courbe du tableau de bord porte désormais une <b>marge observée</b> : ' +
            "elle s'ouvre en racine du temps, parce que des écarts successifs se compensent en partie au lieu de s'ajouter. " +
            "Elle couvre 80 % des cas <i>si</i> vos dérives suivent une loi normale — elles n'y sont pas tenues.</p>"
          : '<p class="sous" style="margin:10px 0 0">Encore ' + (DERIVE_MINIMUM - st.n) +
            " pointage" + (DERIVE_MINIMUM - st.n > 1 ? "s" : "") + " avant que l'application ose en tirer une marge d'erreur.</p>"),
        { titre: "Ce que cela dit" })
    : "";

  const historique = points.length
    ? carte('<div class="tableau-boite"><table><thead><tr><th>Date</th><th>Compte</th><th class="num">Prévu</th>' +
        '<th class="num">Réel</th><th class="num">Écart</th><th class="num">Par mois</th><th class="num">Jours</th></tr></thead><tbody>' +
        points.slice().reverse().map((d) => {
          const r = (compte(d.compteId).releves || []).find((x) => x.date === d.date) || {};
          return "<tr><td>" + esc(libelleDate(d.date)) + "</td>" +
            "<td><i class=\"puce\" style=\"background:" + teinte(compte(d.compteId).teinte) + "\"></i>" + esc(nomCompte(d.compteId)) + "</td>" +
            '<td class="num dim">' + esc(argent(r.prevu)) + "</td>" +
            '<td class="num">' + esc(argent(r.solde)) + "</td>" +
            '<td class="num ' + (d.ecart >= 0 ? "pos" : "neg") + '">' + esc(argent(d.ecart, { signe: true })) + "</td>" +
            '<td class="num ' + (d.parMois >= 0 ? "pos" : "neg") + '">' + esc(argent(d.parMois, { signe: true })) + "</td>" +
            '<td class="num dim">' + nombre(d.jours) + "</td></tr>";
        }).join("") + "</tbody></table></div>",
        { titre: "Historique des pointages" })
    : "";

  cible.innerHTML = kpis + comptes + explication + lecture + historique;
  if (points.length) grapheDerive(boite("g-derive"), points, { biais: st.biais });
}

/** Une phrase qui dit ce que l'historique de dérive signifie, en euros. */
function lectureDerive(st) {
  const sens = st.biais < 0 ? "de moins" : "de plus";
  const ampleur = Math.abs(st.biais);
  if (st.n < 2) {
    return "Un seul pointage ne dit rien d'une tendance : l'écart mesuré vaut " + argent(st.total, { signe: true }) +
      " sur " + nombre(st.jours) + " jours. Il faut plusieurs mesures pour distinguer un budget mal saisi d'un mois inhabituel.";
  }
  if (ampleur < 20) {
    return "Votre budget tombe juste : la dérive moyenne est de " + argent(ampleur) + " par mois, " +
      "c'est-à-dire du bruit. La projection peut être lue telle quelle.";
  }
  if (ampleur < st.ecartType) {
    return "Il reste en moyenne " + argent(ampleur) + " " + sens + " que prévu chaque mois, mais d'un mois à l'autre " +
      "l'écart varie de " + argent(st.ecartType) + " : la dispersion dépasse la tendance, donc rien ne prouve encore " +
      "un biais systématique. Ce sont plutôt des mois irréguliers.";
  }
  return "Il reste systématiquement " + argent(ampleur) + " " + sens + " que prévu chaque mois, soit " +
    argent(ampleur * 12) + " sur un an. " +
    (st.biais < 0
      ? "Quelque chose manque à la saisie : une dépense récurrente non listée, ou des montants sous-estimés. Le calendrier aide à repérer laquelle."
      : "Vos dépenses réelles sont plus basses que ce que vous avez saisi : certains montants peuvent être revus à la baisse.");
}

/** « il y a 12 jours », pour un pointage. */
function delaiDepuis(iso) {
  const n = joursEntre(iso, aujourdhui());
  if (n <= 0) return "aujourd'hui";
  if (n === 1) return "hier";
  if (n < 31) return "il y a " + n + " jours";
  return "il y a " + Math.round(n / 30.44) + " mois";
}

/* ── Dialogue de pointage ─────────────────────────────────────────────── */

function ouvrirPointage(compteId) {
  const c = compte(compteId);
  if (!c) return;
  const date = aujourdhui();
  const prevu = soldeRoule(c, date);
  const jours = joursEntre(c.soldeDate, date);

  const corps =
    '<p class="sous" style="margin:0">Ouvrez votre application bancaire et recopiez le solde de <b>' + esc(c.nom) +
    "</b>. L'application le compare à ce qu'elle annonçait, et garde l'écart pour mesurer sa propre marge d'erreur.</p>" +
    '<div class="ligne-champs">' +
    '<label class="champ"><span class="ttl">Solde réel</span>' +
    '<input type="number" id="pt-solde" step="0.01" value="' + esc(prevu) + '"></label>' +
    '<label class="champ"><span class="ttl">Constaté le</span>' +
    '<input type="date" id="pt-date" value="' + esc(date) + '" min="' + esc(c.soldeDate) + '" max="' + esc(date) + '">' +
    '<span class="aide">Entre le dernier pointage et aujourd\'hui.</span></label></div>' +
    '<div class="sep"></div>' +
    '<div class="rangee" style="justify-content:space-between">' +
    '<span class="dim">Projeté pour ce jour</span><b class="chiffre" style="font-family:var(--display);font-size:17px">' + esc(argent(prevu)) + "</b></div>" +
    '<div class="rangee" style="justify-content:space-between">' +
    '<span class="dim">Écart</span><b id="pt-ecart" class="chiffre" style="font-family:var(--display);font-size:17px">' + esc(argent(0, { signe: true })) + "</b></div>" +
    (jours > 0
      ? '<p class="sous" style="margin:0">Depuis le ' + esc(libelleDate(c.soldeDate)) + ", soit " + nombre(jours) + " jours.</p>"
      : '<p class="sous" style="margin:0">Le dernier solde date d\'aujourd\'hui : ce pointage le corrige, il ne mesure aucune dérive.</p>');

  ouvrirDialogue("Pointer « " + c.nom + " »", corps, [
    { texte: "Annuler", action: fermerDialogue },
    {
      texte: "Enregistrer", classe: "primaire", action: () => {
        const valeur = Number(String(boite("pt-solde").value).replace(",", "."));
        const quand = boite("pt-date").value;
        if (!isFinite(valeur)) { message("Entrez le solde affiché par votre banque."); return; }
        if (!estIso(quand) || quand > aujourdhui() || quand < c.soldeDate) {
          message("Cette date doit suivre le dernier pointage, sans dépasser aujourd'hui.");
          return;
        }
        let releve = null;
        modifier(() => { releve = pointerSolde(compteId, quand, valeur); });
        fermerDialogue();
        const ecart = releve ? arrondi2(releve.solde - releve.prevu) : 0;
        message(releve && releve.jours > 0
          ? (Math.abs(ecart) < 1 ? "Pile sur la prévision." : argent(ecart, { signe: true }) + " par rapport à la prévision.")
          : "Solde corrigé.", { annuler: true });
      },
    },
  ], () => {
    const recalculer = () => {
      const valeur = Number(String(boite("pt-solde").value).replace(",", "."));
      const quand = boite("pt-date").value;
      const attendu = estIso(quand) ? soldeRoule(c, quand) : prevu;
      const ecart = isFinite(valeur) ? arrondi2(valeur - attendu) : 0;
      const champ = boite("pt-ecart");
      champ.textContent = argent(ecart, { signe: true });
      champ.className = "chiffre " + (Math.abs(ecart) < 1 ? "dim" : ecart > 0 ? "pos" : "neg");
      champ.style.fontFamily = "var(--display)";
      champ.style.fontSize = "17px";
    };
    boite("pt-solde").addEventListener("input", recalculer);
    boite("pt-date").addEventListener("change", recalculer);
    boite("pt-solde").select();
  });
}

      '<button class="btn fantome icone" data-act="cat-supprimer" data-id="' + esc(c.id) + '" title="Supprimer">' + icone("croix", "") + "</button></td></tr>";

        '<span class="mono dim">' + esc(argent(x.valeur)) + "/mois</span></div>").join("") +
      "</div></div>",
      { titre: "Répartition mensuelle moyenne", sous: "Moyenne sur l'horizon : les charges annuelles y sont lissées." }) +
    carte('<div class="tableau-boite"><table><thead><tr><th>Catégorie de dépense</th><th class="num">Par mois</th>' +

  grapheAnneau(boite("g-cat"), parts, { legende: "par mois" });

/* ── Objectifs ────────────────────────────────────────────────────────── */

function rendreObjectifs(cible, p) {
  if (!ETAT.objectifs.length) {
    cible.innerHTML = carte('<div class="vide"><p>Aucun objectif. Un objectif, c\'est un montant et une date : ' +
      "l'application dit alors si votre trajectoire y mène, et ce qu'il faudrait mettre de côté chaque mois sinon.</p>" +
      '<button class="btn primaire" data-act="obj-nouveau">Ajouter un objectif</button></div>', { titre: "Objectifs d'épargne" });
    return;
  }

  const cartes = ETAT.objectifs.map((o) => {
    const e = evaluerObjectif(o, p);
    const couleur = teinte(o.teinte);
    const verdicts = {
      atteint: ['<span class="etiquette rev">Atteint</span>', "Au rythme projeté, l'objectif est dépassé de " + argent(-e.manque) + " à la date visée."],
      juste: ['<span class="etiquette">De justesse</span>', "Il manquerait " + argent(e.manque) + ", soit " + argent(e.effortMensuel) + " de plus par mois."],
      insuffisant: ['<span class="etiquette dep">Hors d\'atteinte</span>', "Il manquerait " + argent(e.manque) + " — soit " + argent(e.effortMensuel) + " de plus chaque mois pendant " + nombre(e.moisRestants) + " mois."],
      "hors-horizon": ['<span class="etiquette">Au-delà de l\'horizon</span>', "La date visée dépasse la fenêtre de projection ; allongez l'horizon pour l'évaluer."],
      echu: ['<span class="etiquette">Échue</span>', "La date visée est passée."],
    };
    const [badge, phrase] = verdicts[e.verdict] || verdicts.insuffisant;

    return carte(
      '<div class="carte-tete"><h3>' + esc(o.nom) + "</h3><div class=\"droite\">" + badge + "</div></div>" +
      '<div class="rangee" style="gap:6px;margin:2px 0 10px"><span class="chiffre" style="font-size:24px;font-weight:700;color:' + couleur + '">' +
      esc(argent(e.projete === null ? e.actuel : e.projete)) + '</span><span class="dim">sur ' + esc(argent(o.cible)) +
      ' visés pour le ' + esc(libelleDate(o.dateCible)) + "</span></div>" +
      '<div class="jauge" style="height:9px"><i style="width:' + (e.progression * 100).toFixed(1) + "%;background:" + couleur + '"></i></div>' +
      '<div class="rangee" style="justify-content:space-between;margin-top:6px;font-size:12.5px">' +
      '<span class="dim">Aujourd\'hui ' + esc(argent(e.actuel)) + " · " + esc(pourcent(e.progressionActuelle * 100, 0)) + "</span>" +
      '<span class="dim">' + esc(nombre(e.moisRestants)) + " mois restants</span></div>" +
      '<p class="sous" style="margin:10px 0 0">' + esc(phrase) + "</p>" +
      '<div class="rangee fin" style="margin-top:8px">' +
      '<button class="btn fantome petit" data-act="obj-editer" data-id="' + esc(o.id) + '">Modifier</button>' +
      '<button class="btn fantome petit" data-act="obj-supprimer" data-id="' + esc(o.id) + '">Supprimer</button></div>');
  }).join("");

  cible.innerHTML = '<div class="grille g2">' + cartes + "</div>" +
    '<div class="rangee"><button class="btn primaire" data-act="obj-nouveau">+ Nouvel objectif</button></div>';
}

/* ── Scénarios ────────────────────────────────────────────────────────── */

function rendreScenarios(cible, p) {
  const actifs = ETAT.scenarios.filter((s) => s.actif);
  const series = [{ nom: "Référence", couleur: "var(--accent)", points: p.points, remplir: !actifs.length, epaisseur: 2.4 }];
  const projections = new Map();
  for (const s of actifs) {
    const pr = projeterScenario(s, p.du, p.au);
    projections.set(s.id, pr);
    series.push({ nom: s.nom, couleur: teinte(s.teinte), points: pr.points, pointille: true });
  }

  const lignes = ETAT.scenarios.map((s) => {
    const pr = projections.get(s.id) || projeterScenario(s, p.du, p.au);
    const ecart = arrondi2(pr.soldeFinal - p.soldeFinal);
    const modifs = [];
    if (s.ajustRevenus) modifs.push("revenus " + (s.ajustRevenus > 0 ? "+" : "−") + nombre(Math.abs(s.ajustRevenus), 1) + " %");
    if (s.ajustDepenses) modifs.push("dépenses " + (s.ajustDepenses > 0 ? "+" : "−") + nombre(Math.abs(s.ajustDepenses), 1) + " %");
    if (s.exclus.length) modifs.push(s.exclus.length + (s.exclus.length > 1 ? " flux retirés" : " flux retiré"));
    if (s.extras.length) modifs.push(s.extras.length + (s.extras.length > 1 ? " flux ajoutés" : " flux ajouté"));
    if (s.soldeDelta) modifs.push("solde de départ " + argent(s.soldeDelta, { signe: true }));

    return "<tr><td><label class=\"case\"><input type=\"checkbox\" data-act=\"scn-basculer\" data-id=\"" + esc(s.id) + "\"" + (s.actif ? " checked" : "") + ">" +
      '<span><i class="puce" style="background:' + teinte(s.teinte) + '"></i>' + esc(s.nom) + "</span></label>" +
      '<div class="faible" style="font-size:12.5px;padding-left:26px">' + esc(modifs.join(" · ") || "aucune modification") + "</div></td>" +
      '<td class="num">' + esc(argent(pr.soldeFinal)) + "</td>" +
      '<td class="num ' + (ecart >= 0 ? "pos" : "neg") + '" style="font-weight:600">' + esc(argent(ecart, { signe: true })) + "</td>" +
      '<td class="num ' + (pr.totaux.netMensuel >= 0 ? "pos" : "neg") + '">' + esc(argent(pr.totaux.netMensuel, { signe: true })) + "</td>" +
      "<td class=\"dim\">" + (pr.alerte.dateDecouvert ? '<span class="neg">découvert le ' + esc(libelleDate(pr.alerte.dateDecouvert, true)) + "</span>" : "jamais à découvert") + "</td>" +
      '<td class="actions">' +
      '<button class="btn petit" data-act="scn-adopter" data-id="' + esc(s.id) + '" title="Faire de ce scénario votre budget">Adopter</button>' +
      '<button class="btn fantome icone" data-act="scn-editer" data-id="' + esc(s.id) + '" title="Modifier">' + icone("crayon", "") + "</button>" +
      '<button class="btn fantome icone" data-act="scn-dupliquer" data-id="' + esc(s.id) + '" title="Dupliquer">' + icone("copie", "") + "</button>" +
      '<button class="btn fantome icone" data-act="scn-supprimer" data-id="' + esc(s.id) + '" title="Supprimer">' + icone("croix", "") + "</button></td></tr>";
  }).join("");

  cible.innerHTML =
    carte('<div id="g-scn"></div><div class="legende">' +
      series.map((s) => '<span><i class="puce" style="background:' + s.couleur + '"></i>' + esc(s.nom) + "</span>").join("") + "</div>",
      { titre: "Trajectoires comparées",
        sous: "La référence en trait plein, les scénarios en pointillés. Un scénario ne modifie jamais vos flux : il les rejoue autrement." }) +
    carte(ETAT.scenarios.length
      ? '<div class="tableau-boite"><table><thead><tr><th>Scénario</th><th class="num">Solde à l\'horizon</th>' +
        '<th class="num">Écart</th><th class="num">Reste par mois</th><th>Découvert</th><th></th></tr></thead><tbody>' +
        '<tr class="total"><td>Référence — vos flux tels quels</td><td class="num">' + esc(argent(p.soldeFinal)) + "</td>" +
        '<td class="num dim">—</td><td class="num">' + esc(argent(p.totaux.netMensuel, { signe: true })) + "</td>" +
        "<td class=\"dim\">" + (p.alerte.dateDecouvert ? '<span class="neg">le ' + esc(libelleDate(p.alerte.dateDecouvert, true)) + "</span>" : "jamais") + "</td><td></td></tr>" +
        lignes + "</tbody></table></div>"
      : '<div class="vide">Aucun scénario. Un scénario répond à « et si… » : et si je déménageais, et si je perdais 20 % de revenus, et si je coupais les abonnements ?</div>') +
    '<div class="rangee"><button class="btn primaire" data-act="scn-nouveau">+ Nouveau scénario</button></div>';

  grapheCourbes(boite("g-scn"), series, { seuil: ETAT.parametres.seuilAlerte, hauteur: 300 });
}

    return '<tr><td><i class="puce" style="background:' + teinte(c.teinte) + '"></i><b>' + esc(c.nom) + "</b>" +
      '<div class="faible" style="font-size:12.5px;padding-left:16px">' + (c.type === "epargne" ? "Épargne" : "Compte courant") +
      " · " + nb + (nb > 1 ? " flux rattachés" : " flux rattaché") + "</div></td>" +
      '<td class="num">' + esc(argent(reporte)) +
      (Math.abs(reporte - c.solde) > 0.005

      '<td class="actions">' +
      '<button class="btn fantome icone" data-act="cpt-editer" data-id="' + esc(c.id) + '" title="Modifier">' + icone("crayon", "") + "</button>" +
      '<button class="btn fantome icone" data-act="cpt-supprimer" data-id="' + esc(c.id) + '" title="Supprimer">' + icone("croix", "") + "</button></td></tr>";

  cible.innerHTML = '<div class="kpis">' +
    kpi("Total aujourd'hui", argent(soldeDepart()),
      esc(ETAT.comptes.filter((c) => c.type === "epargne").length + " d'épargne, " +
          ETAT.comptes.filter((c) => c.type !== "epargne").length + " courant(s)")) +
    kpi("Total à l'horizon", argent(p.soldeFinal),
      esc(argent(p.soldeFinal - p.soldeInitial, { signe: true }) + " sur " + ETAT.parametres.horizon + " mois"),
      p.soldeFinal >= p.soldeInitial ? "var(--revenu-texte)" : "var(--depense-texte)",
      etincelle(p.points, "var(--accent)")) +
    kpi("Épargne aujourd'hui", argent(ETAT.comptes.filter((c) => c.type === "epargne").reduce((t, c) => t + c.solde, 0)),
      "hors comptes courants") +
    kpi("Flux rattachés", nombre(ETAT.flux.length), "répartis sur vos comptes") +
    "</div>" +
    carte('<div class="tableau-boite"><table><thead><tr><th>Compte</th><th class="num">Solde au départ</th>' +
    '<th class="num">Solde à l\'horizon</th><th class="num">Variation</th><th></th></tr></thead><tbody>' + lignes + "</tbody></table></div>" +
    '<div class="rangee" style="margin-top:12px"><button class="btn primaire" data-act="cpt-nouveau">+ Nouveau compte</button></div>',
