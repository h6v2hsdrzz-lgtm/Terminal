<script id="code">
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   1. Constantes et valeurs par défaut
   ══════════════════════════════════════════════════════════════════════ */

const CLE_ETAT = "prevoyant:etat:v1";
const CLE_THEME = "prevoyant:theme";
const VERSION_ETAT = 2;

const TEINTES_MAX = 8;
const HORIZONS = [3, 6, 12, 24, 36, 60];
const OCCURRENCES_MAX = 4000;   // garde-fou : un flux ne peut pas boucler sans fin

const DEVISES = {
  EUR: { symbole: "€", nom: "Euro" },
  CHF: { symbole: "CHF", nom: "Franc suisse" },
  USD: { symbole: "$", nom: "Dollar américain" },
  CAD: { symbole: "$ CA", nom: "Dollar canadien" },
  GBP: { symbole: "£", nom: "Livre sterling" },
  MAD: { symbole: "DH", nom: "Dirham marocain" },
};

/* Un rythme se décrit soit en jours, soit en mois — jamais les deux. Les
   rythmes mensuels sont comptés en mois pour que le 31 reste le 31 quand le
   mois le permet, au lieu de dériver de quelques jours à chaque échéance. */
const FREQUENCES = [
  { id: "ponctuel",    nom: "Une seule fois",       court: "1×",     parAn: 0 },
  { id: "hebdo",       nom: "Chaque semaine",       court: "hebdo",  parAn: 365.2425 / 7,  jours: 7 },
  { id: "quinzaine",   nom: "Toutes les 2 semaines", court: "2 sem.", parAn: 365.2425 / 14, jours: 14 },
  { id: "mensuel",     nom: "Chaque mois",          court: "mensuel", parAn: 12, mois: 1 },
  { id: "bimestriel",  nom: "Tous les 2 mois",      court: "2 mois", parAn: 6,  mois: 2 },
  { id: "trimestriel", nom: "Chaque trimestre",     court: "trim.",  parAn: 4,  mois: 3 },
  { id: "semestriel",  nom: "Chaque semestre",      court: "sem.",   parAn: 2,  mois: 6 },
  { id: "annuel",      nom: "Chaque année",         court: "annuel", parAn: 1,  mois: 12 },
];
const FREQ = Object.fromEntries(FREQUENCES.map((f) => [f.id, f]));

const PARAMETRES_DEFAUT = {
  titre: "Mon budget",
  devise: "EUR",
  horizon: 24,
  seuilAlerte: 0,
  arrondi: true,          // masquer les centimes
  debutProjection: null,  // null = aujourd'hui
};

const CATEGORIES_DEFAUT = [
  { id: "cat-salaire",   nom: "Salaire",            type: "revenu",  teinte: 2 },
  { id: "cat-primes",    nom: "Primes & extras",    type: "revenu",  teinte: 6 },
  { id: "cat-aides",     nom: "Aides & allocations", type: "revenu", teinte: 4 },
  { id: "cat-logement",  nom: "Logement",           type: "depense", teinte: 1, plafond: null, essentiel: true },
  { id: "cat-courses",   nom: "Courses",            type: "depense", teinte: 2, plafond: null, essentiel: true },
  { id: "cat-energie",   nom: "Énergie & eau",      type: "depense", teinte: 3, plafond: null, essentiel: true },
  { id: "cat-transport", nom: "Transport",          type: "depense", teinte: 4, plafond: null, essentiel: true },
  { id: "cat-sante",     nom: "Santé",              type: "depense", teinte: 6, plafond: null, essentiel: true },
  { id: "cat-abos",      nom: "Abonnements",        type: "depense", teinte: 8, plafond: null, essentiel: false },
  { id: "cat-loisirs",   nom: "Loisirs & sorties",  type: "depense", teinte: 5, plafond: null, essentiel: false },
  { id: "cat-impots",    nom: "Impôts & taxes",     type: "depense", teinte: 7, plafond: null, essentiel: true },
  { id: "cat-credits",   nom: "Crédits",            type: "depense", teinte: 5, plafond: null, essentiel: true },
  { id: "cat-epargne",   nom: "Épargne",            type: "depense", teinte: 1, plafond: null, essentiel: false },
  { id: "cat-divers",    nom: "Divers",             type: "depense", teinte: 7, plafond: null, essentiel: false },
];

/* ══════════════════════════════════════════════════════════════════════
   2. Dates — tout en ISO « AAAA-MM-JJ », tout en UTC.

   Le fuseau ne sert à rien ici : une échéance est un jour du calendrier,
   pas un instant. Passer par UTC évite qu'un décalage horaire fasse
   glisser une échéance de la veille au lendemain.
   ══════════════════════════════════════════════════════════════════════ */

function deuxChiffres(n) { return String(n).padStart(2, "0"); }

function estIso(v) {
  if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const [a, m, j] = v.split("-").map(Number);
  return m >= 1 && m <= 12 && j >= 1 && j <= joursDansMois(a, m);
}

function joursDansMois(annee, mois) { return new Date(Date.UTC(annee, mois, 0)).getUTCDate(); }

function versUTC(iso) {
  const [a, m, j] = iso.split("-").map(Number);
  return Date.UTC(a, m - 1, j);
}

function versIso(ms) {
  const d = new Date(ms);
  return d.getUTCFullYear() + "-" + deuxChiffres(d.getUTCMonth() + 1) + "-" + deuxChiffres(d.getUTCDate());
}

function aujourdhui() {
  const d = new Date();
  return d.getFullYear() + "-" + deuxChiffres(d.getMonth() + 1) + "-" + deuxChiffres(d.getDate());
}

function ajouterJours(iso, n) { return versIso(versUTC(iso) + n * 86400000); }

/** Ajoute des mois en gardant le jour d'ancrage, rabattu sur le dernier jour
 *  du mois quand il n'existe pas (un 31 janvier + 1 mois donne le 28 ou 29). */
function ajouterMois(iso, n, ancre) {
  const [a, m, j] = iso.split("-").map(Number);
  const total = a * 12 + (m - 1) + n;
  const na = Math.floor(total / 12);
  const nm = total - na * 12 + 1;
  const jour = Math.min(ancre || j, joursDansMois(na, nm));
  return na + "-" + deuxChiffres(nm) + "-" + deuxChiffres(jour);
}

function joursEntre(a, b) { return Math.round((versUTC(b) - versUTC(a)) / 86400000); }

/** Nombre de mois entiers écoulés de `a` à `b` (négatif si `b` précède `a`). */
function moisEntre(a, b) {
  const [aa, am, aj] = a.split("-").map(Number);
  const [ba, bm, bj] = b.split("-").map(Number);
  let n = (ba - aa) * 12 + (bm - am);
  if (bj < aj) n -= 1;
  return n;
}

function cleMois(iso) { return iso.slice(0, 7); }
function debutDeMois(cle) { return cle + "-01"; }
function finDeMois(cle) {
  const [a, m] = cle.split("-").map(Number);
  return cle + "-" + deuxChiffres(joursDansMois(a, m));
}
function moisSuivant(cle) {
  const [a, m] = cle.split("-").map(Number);
  return m === 12 ? (a + 1) + "-01" : a + "-" + deuxChiffres(m + 1);
}

const MOIS_NOMS = ["janvier", "février", "mars", "avril", "mai", "juin",
  "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const MOIS_COURTS = ["janv.", "févr.", "mars", "avr.", "mai", "juin",
  "juil.", "août", "sept.", "oct.", "nov.", "déc."];

function libelleMois(cle, court) {
  const [a, m] = cle.split("-").map(Number);
  return (court ? MOIS_COURTS[m - 1] : MOIS_NOMS[m - 1]) + " " + a;
}
function libelleDate(iso, court) {
  const [a, m, j] = iso.split("-").map(Number);
  return j + " " + (court ? MOIS_COURTS[m - 1] : MOIS_NOMS[m - 1]) + (court ? "" : " " + a);
}
function libelleJourMois(iso) {
  const [, m, j] = iso.split("-").map(Number);
  return j + " " + MOIS_COURTS[m - 1];
}

/** « dans 3 jours », « demain », « aujourd'hui » — pour l'agenda. */
function delaiTexte(iso, depuis) {
  const n = joursEntre(depuis, iso);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return "demain";
  if (n < 0) return "passé";
  if (n < 7) return "dans " + n + " j";
  return libelleJourMois(iso);
}

/* ══════════════════════════════════════════════════════════════════════
   3. Nombres et argent
   ══════════════════════════════════════════════════════════════════════ */

let _formats = {};

function devise() { return (ETAT.parametres && ETAT.parametres.devise) || "EUR"; }

function formatteur(decimales) {
  const cle = devise() + ":" + decimales;
  if (!_formats[cle]) {
    _formats[cle] = new Intl.NumberFormat("fr-FR", {
      style: "currency", currency: devise(),
      minimumFractionDigits: decimales, maximumFractionDigits: decimales,
    });
  }
  return _formats[cle];
}

function argent(v, options) {
  const o = options || {};
  if (v === null || v === undefined || !isFinite(v)) return "—";
  const dec = o.decimales !== undefined ? o.decimales
    : (ETAT.parametres && ETAT.parametres.arrondi ? 0 : 2);
  let s = formatteur(dec).format(o.signe ? Math.abs(v) : v);
  if (o.signe) s = (v < 0 ? "−" : "+") + " " + s;
  return s;
}

/** Version courte pour les axes : 1 240 → « 1,2 k ». */
function argentCourt(v) {
  const s = DEVISES[devise()] ? DEVISES[devise()].symbole : "";
  const a = Math.abs(v);
  const signe = v < 0 ? "−" : "";
  if (a >= 1000000) return signe + (a / 1000000).toFixed(a >= 10000000 ? 0 : 1).replace(".", ",") + " M" + s;
  if (a >= 1000) return signe + (a / 1000).toFixed(a >= 10000 ? 0 : 1).replace(".", ",") + " k" + s;
  return signe + Math.round(a) + " " + s;
}

function pourcent(v, decimales) {
  if (v === null || !isFinite(v)) return "—";
  const arrondi = Math.round(v * Math.pow(10, decimales || 0)) / Math.pow(10, decimales || 0);
  // le même signe moins que dans les montants, pour ne pas mélanger deux traits
  return arrondi.toLocaleString("fr-FR").replace("-", "− ") + " %";
}

function nombre(v, decimales) {
  if (v === null || !isFinite(v)) return "—";
  return v.toLocaleString("fr-FR", { minimumFractionDigits: decimales || 0, maximumFractionDigits: decimales || 0 });
}

function arrondi2(v) { return Math.round(v * 100) / 100; }

function identifiant(prefixe) {
  return prefixe + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function teinte(n) { return "var(--serie-" + (((Number(n) || 1) - 1) % TEINTES_MAX + 1) + ")"; }

/* ══════════════════════════════════════════════════════════════════════
   4. État — chargement, validation, sauvegarde

   `normaliser` est la seule porte d'entrée : état relu du navigateur,
   fichier importé, jeu de démonstration. Tout ce qui entre y passe, donc
   un fichier abîmé donne une application vide, jamais une application
   cassée.
   ══════════════════════════════════════════════════════════════════════ */

function nombreSur(v, defaut, min, max) {
  const n = typeof v === "string" ? Number(v.replace(",", ".")) : Number(v);
  if (!isFinite(n)) return defaut;
  if (min !== undefined && n < min) return min;
  if (max !== undefined && n > max) return max;
  return n;
}

function texteSur(v, defaut, max) {
  if (typeof v !== "string") return defaut;
  const t = v.trim();
  return t ? t.slice(0, max || 80) : defaut;
}

function normaliserCategorie(brut, i) {
  if (!brut || typeof brut !== "object") return null;
  const type = brut.type === "revenu" ? "revenu" : "depense";
  return {
    id: texteSur(brut.id, identifiant("cat"), 60),
    nom: texteSur(brut.nom, "Catégorie " + (i + 1), 40),
    type,
    teinte: nombreSur(brut.teinte, (i % TEINTES_MAX) + 1, 1, TEINTES_MAX),
    plafond: brut.plafond === null || brut.plafond === undefined ? null : nombreSur(brut.plafond, null, 0),
    // une dépense non classée est comptée comme contrainte : c'est
    // l'hypothèse prudente pour le reste à vivre
    essentiel: type === "depense" ? brut.essentiel !== false : false,
  };
}

/**
 * Un relevé : « le 26 septembre, ce compte affichait 2 840 € ».
 *
 * `prevu` est ce que l'application annonçait pour ce jour-là au moment du
 * pointage. L'écart entre les deux — la dérive — est la seule mesure
 * honnête de ce que vaut la prévision. Il vaut `null` pour le tout premier
 * relevé, qui n'a rien à comparer.
 */
function normaliserReleve(brut) {
  if (!brut || typeof brut !== "object" || !estIso(brut.date)) return null;
  const prevu = brut.prevu === null || brut.prevu === undefined ? null : arrondi2(nombreSur(brut.prevu, 0));
  return {
    date: brut.date,
    solde: arrondi2(nombreSur(brut.solde, 0)),
    prevu,
    // le nombre de jours couverts sert à ramener la dérive au mois
    jours: Math.max(0, Math.round(nombreSur(brut.jours, 0, 0, 4000))),
  };
}

function normaliserCompte(brut, i) {
  if (!brut || typeof brut !== "object") return null;
  const releves = (Array.isArray(brut.releves) ? brut.releves : [])
    .map(normaliserReleve).filter(Boolean).slice(-200);
  releves.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  // un solde constaté dans le futur n'a pas de sens : il serait reporté
  // à l'envers par la projection
  let soldeDate = estIso(brut.soldeDate) ? brut.soldeDate : aujourdhui();
  if (soldeDate > aujourdhui()) soldeDate = aujourdhui();
  return {
    id: texteSur(brut.id, identifiant("cpt"), 60),
    nom: texteSur(brut.nom, "Compte " + (i + 1), 40),
    type: brut.type === "epargne" ? "epargne" : "courant",
    solde: arrondi2(nombreSur(brut.solde, 0)),
    soldeDate,
    releves,
    teinte: nombreSur(brut.teinte, (i % TEINTES_MAX) + 1, 1, TEINTES_MAX),
  };
}

/**
 * Les corrections apportées à une échéance précise : un montant différent
 * ce mois-ci, ou une échéance qui n'aura pas lieu. Une entrée sans effet —
 * ni montant, ni saut — n'est pas une correction et disparaît.
 */
function normaliserExceptions(brut) {
  if (!Array.isArray(brut)) return [];
  const vues = new Set();
  const res = [];
  for (const e of brut.slice(0, 400)) {
    if (!e || typeof e !== "object" || !estIso(e.date) || vues.has(e.date)) continue;
    const ignore = e.ignore === true;
    const montant = e.montant === null || e.montant === undefined
      ? null : Math.abs(arrondi2(nombreSur(e.montant, 0, -1e12, 1e12)));
    if (!ignore && montant === null) continue;
    vues.add(e.date);
    res.push({ date: e.date, montant: ignore ? null : montant, ignore });
  }
  res.sort((a, b) => (a.date < b.date ? -1 : 1));
  return res;
}

function normaliserFlux(brut, i, comptes, categories) {
  if (!brut || typeof brut !== "object") return null;
  let type = brut.type === "revenu" ? "revenu" : brut.type === "virement" ? "virement" : "depense";
  // un virement suppose deux comptes distincts ; à défaut, c'est une dépense
  if (type === "virement" && comptes.length < 2) type = "depense";
  const frequence = FREQ[brut.frequence] ? brut.frequence : "mensuel";
  const debut = estIso(brut.debut) ? brut.debut : aujourdhui();
  let fin = estIso(brut.fin) ? brut.fin : null;
  if (fin && fin < debut) fin = debut;
  const cats = categories.filter((c) => c.type === type);
  const cat = cats.find((c) => c.id === brut.categorieId);
  const cpt = comptes.find((c) => c.id === brut.compteId) || comptes[0];
  let compteDest = null;
  if (type === "virement") {
    const d = comptes.find((c) => c.id === brut.compteDest && c.id !== cpt.id);
    compteDest = d ? d.id : comptes.find((c) => c.id !== cpt.id).id;
  }
  return {
    id: texteSur(brut.id, identifiant("flx"), 60),
    libelle: texteSur(brut.libelle, "Sans nom", 60),
    type,
    // le sens est porté par `type` : un montant est toujours écrit positif
    montant: Math.abs(arrondi2(nombreSur(brut.montant, 0, -1e12, 1e12))),
    categorieId: type === "virement" ? null : (cat ? cat.id : (cats[0] ? cats[0].id : null)),
    compteId: cpt.id,
    compteDest,
    frequence,
    debut,
    fin,
    indexation: nombreSur(brut.indexation, 0, -50, 50),
    actif: brut.actif !== false,
    note: texteSur(brut.note, "", 300),
    exceptions: normaliserExceptions(brut.exceptions),
  };
}

function normaliserObjectif(brut, comptes) {
  if (!brut || typeof brut !== "object") return null;
  const cpt = comptes.find((c) => c.id === brut.compteId);
  return {
    id: texteSur(brut.id, identifiant("obj"), 60),
    nom: texteSur(brut.nom, "Objectif", 50),
    cible: Math.abs(arrondi2(nombreSur(brut.cible, 1000, -1e12, 1e12))),
    dateCible: estIso(brut.dateCible) ? brut.dateCible : ajouterMois(aujourdhui(), 12),
    compteId: cpt ? cpt.id : null,
    teinte: nombreSur(brut.teinte, 1, 1, TEINTES_MAX),
  };
}

function normaliserScenario(brut, i, comptes, categories) {
  if (!brut || typeof brut !== "object") return null;
  const extras = Array.isArray(brut.extras)
    ? brut.extras.map((f, k) => normaliserFlux(f, k, comptes, categories)).filter(Boolean).slice(0, 40)
    : [];
  return {
    id: texteSur(brut.id, identifiant("scn"), 60),
    nom: texteSur(brut.nom, "Scénario " + (i + 1), 50),
    teinte: nombreSur(brut.teinte, ((i + 2) % TEINTES_MAX) + 1, 1, TEINTES_MAX),
    actif: brut.actif !== false,
    ajustRevenus: nombreSur(brut.ajustRevenus, 0, -100, 500),
    ajustDepenses: nombreSur(brut.ajustDepenses, 0, -100, 500),
    soldeDelta: arrondi2(nombreSur(brut.soldeDelta, 0)),
    exclus: Array.isArray(brut.exclus) ? brut.exclus.filter((x) => typeof x === "string").slice(0, 200) : [],
    extras,
  };
}

/**
 * Migrations d'un schéma à l'autre.
 *
 * Elles s'enchaînent : un état v1 passe par `1 → 2` puis par les suivantes.
 * Chacune ne fait qu'ajouter ou transformer ce que sa version a changé ;
 * `normaliser` s'occupe ensuite de valider le tout. Un état sans numéro de
 * version est traité comme un v1 — c'est ce qu'écrivaient les premières
 * versions de l'application.
 */
const MIGRATIONS = {
  // v2 : les comptes gagnent un solde daté et l'historique de leurs relevés
  1: (etat) => {
    for (const c of etat.comptes || []) {
      if (!c || typeof c !== "object") continue;
      if (!c.soldeDate) c.soldeDate = aujourdhui();
      if (!Array.isArray(c.releves)) c.releves = [];
    }
    return etat;
  },
};

function migrer(brut) {
  if (!brut || typeof brut !== "object") return brut;
  let etat = brut;
  let version = Number(etat.version) || 1;
  let garde = 0;
  while (version < VERSION_ETAT && MIGRATIONS[version] && garde++ < 20) {
    etat = MIGRATIONS[version](etat) || etat;
    version += 1;
    etat.version = version;
  }
  return etat;
}

function normaliser(brut) {
  const src = migrer(brut && typeof brut === "object" ? brut : {}) || {};
  const p = src.parametres && typeof src.parametres === "object" ? src.parametres : {};

  const parametres = {
    titre: texteSur(p.titre, PARAMETRES_DEFAUT.titre, 60),
    devise: DEVISES[p.devise] ? p.devise : PARAMETRES_DEFAUT.devise,
    horizon: HORIZONS.includes(Number(p.horizon)) ? Number(p.horizon) : PARAMETRES_DEFAUT.horizon,
    seuilAlerte: arrondi2(nombreSur(p.seuilAlerte, 0, 0, 1e12)),
    arrondi: p.arrondi !== false,
    debutProjection: estIso(p.debutProjection) ? p.debutProjection : null,
  };

  let categories = (Array.isArray(src.categories) ? src.categories : CATEGORIES_DEFAUT)
    .map(normaliserCategorie).filter(Boolean).slice(0, 60);
  if (!categories.length) categories = CATEGORIES_DEFAUT.map(normaliserCategorie);
  if (!categories.some((c) => c.type === "revenu")) categories.push(normaliserCategorie(CATEGORIES_DEFAUT[0], 0));
  if (!categories.some((c) => c.type === "depense")) categories.push(normaliserCategorie(CATEGORIES_DEFAUT[3], 3));

  let comptes = (Array.isArray(src.comptes) ? src.comptes : [])
    .map(normaliserCompte).filter(Boolean).slice(0, 20);
  if (!comptes.length) comptes = [{ id: "cpt-courant", nom: "Compte courant", type: "courant", solde: 0, teinte: 1 }];

  const flux = (Array.isArray(src.flux) ? src.flux : [])
    .map((f, i) => normaliserFlux(f, i, comptes, categories)).filter(Boolean).slice(0, 500);

  const objectifs = (Array.isArray(src.objectifs) ? src.objectifs : [])
    .map((o) => normaliserObjectif(o, comptes)).filter(Boolean).slice(0, 40);

  const scenarios = (Array.isArray(src.scenarios) ? src.scenarios : [])
    .map((s, i) => normaliserScenario(s, i, comptes, categories)).filter(Boolean).slice(0, 12);

  return { version: VERSION_ETAT, parametres, comptes, categories, flux, objectifs, scenarios };
}

let ETAT = normaliser(null);

function categorie(id) { return ETAT.categories.find((c) => c.id === id) || null; }
function compte(id) { return ETAT.comptes.find((c) => c.id === id) || null; }
function nomCategorie(id) { const c = categorie(id); return c ? c.nom : "Sans catégorie"; }
function nomCompte(id) { const c = compte(id); return c ? c.nom : "—"; }
function soldeDepart(date) {
  const quand = estIso(date) ? date : departProjection();
  return arrondi2(ETAT.comptes.reduce((s, c) => s + soldeRoule(c, quand), 0));
}
function departProjection() { return ETAT.parametres.debutProjection || aujourdhui(); }

/* ══════════════════════════════════════════════════════════════════════
   5. Le moteur : d'une liste de flux à un solde jour par jour
   ══════════════════════════════════════════════════════════════════════ */

/**
 * Montant d'un flux à une date donnée, revalorisation comprise.
 *
 * Le montant saisi est celui d'aujourd'hui. L'indexation ne s'applique donc
 * qu'à partir de la date de référence de la projection, et par pas d'un an
 * — une augmentation tombe à date anniversaire, elle ne se lisse pas.
 */
function montantA(flux, date, reference) {
  const idx = Number(flux.indexation) || 0;
  if (!idx) return flux.montant;
  const base = reference && reference > flux.debut ? reference : flux.debut;
  const annees = Math.floor(Math.max(0, moisEntre(base, date)) / 12);
  if (!annees) return flux.montant;
  return flux.montant * Math.pow(1 + idx / 100, annees);
}

/**
 * Toutes les échéances d'un flux dans la fenêtre [du, au].
 * Les rythmes sont recalculés depuis la date de début à chaque rang, jamais
 * de proche en proche : un 31 rabattu sur un 28 en février ne contamine pas
 * les mois suivants.
 */
function occurrences(flux, du, au, reference) {
  const res = [];
  if (!flux || !flux.actif || !estIso(flux.debut) || !estIso(du) || !estIso(au)) return res;

  const borneFin = flux.fin && flux.fin < au ? flux.fin : au;
  if (flux.debut > borneFin || du > borneFin) return res;

  const freq = FREQ[flux.frequence] || FREQ.mensuel;
  const corrections = new Map((flux.exceptions || []).map((e) => [e.date, e]));

  /* Une échéance corrigée prend le montant saisi pour ce jour-là ; une
     échéance sautée ne produit rien. */
  const poser = (date) => {
    const c = corrections.get(date);
    if (c && c.ignore) return;
    res.push(c
      ? { date, montant: c.montant, ajuste: true }
      : { date, montant: arrondi2(montantA(flux, date, reference)) });
  };

  if (freq.id === "ponctuel") {
    if (flux.debut >= du && flux.debut <= borneFin) poser(flux.debut);
    return res;
  }

  const ancre = Number(flux.debut.slice(8, 10));
  let k = 0;

  // saut direct au premier rang susceptible de tomber dans la fenêtre
  if (du > flux.debut) {
    k = freq.jours
      ? Math.max(0, Math.floor(joursEntre(flux.debut, du) / freq.jours))
      : Math.max(0, Math.floor(moisEntre(flux.debut, du) / freq.mois));
  }

  const dateDuRang = (rang) => freq.jours
    ? ajouterJours(flux.debut, rang * freq.jours)
    : ajouterMois(flux.debut, rang * freq.mois, ancre);

  let date = dateDuRang(k);
  let garde = 0;
  while (date < du && garde++ < OCCURRENCES_MAX) date = dateDuRang(++k);

  garde = 0;
  while (date <= borneFin && garde++ < OCCURRENCES_MAX) {
    poser(date);
    date = dateDuRang(++k);
  }
  return res;
}

/** La correction posée sur une échéance, s'il y en a une. */
function exceptionDe(flux, date) {
  return (flux && flux.exceptions ? flux.exceptions.find((e) => e.date === date) : null) || null;
}

/** Pose, remplace ou retire la correction d'une échéance. */
function poserException(fluxId, date, correction) {
  const f = ETAT.flux.find((x) => x.id === fluxId);
  if (!f || !estIso(date)) return;
  f.exceptions = (f.exceptions || []).filter((e) => e.date !== date);
  if (correction) f.exceptions.push({ date, montant: correction.montant, ignore: !!correction.ignore });
  f.exceptions = normaliserExceptions(f.exceptions);
}

/** Rythme mensuel moyen d'un flux, sans tenir compte des dates. */
function mensualiteMoyenne(flux) {
  const freq = FREQ[flux.frequence] || FREQ.mensuel;
  return freq.parAn ? (flux.montant * freq.parAn) / 12 : 0;
}

/**
 * Projection complète.
 *
 * options : { du, au, flux, comptes, soldeInitial, compteId }
 * Renvoie les opérations datées, la courbe de solde, le détail mois par mois,
 * la répartition par catégorie et les dates de rupture.
 */
/* Une même projection est demandée plusieurs fois par rendu : par le
   tableau de bord, par chaque règle d'observation, par le report de solde de
   chaque compte. Les résultats sont mis en cache tant que l'état ne change
   pas — un compteur de révision, incrémenté à chaque écriture, sert de clé.
   Les projections d'un scénario ne sont pas mises en cache : leur liste de
   flux est construite à la volée, et n'a pas de clé stable. */
let REVISION = 0;
const CACHE_PROJECTION = new Map();
const CACHE_MAX = 60;

function invaliderProjections() {
  REVISION++;
  CACHE_PROJECTION.clear();
}

function projeter(options) {
  const o = options || {};

  const cle = o.flux || o.comptes ? null : [
    REVISION, o.du || "", o.au || "", o.compteId || "",
    o.soldeInitial === undefined ? "" : o.soldeInitial,
    ETAT.parametres.horizon, ETAT.parametres.seuilAlerte, ETAT.parametres.debutProjection || "",
  ].join("|");
  if (cle && CACHE_PROJECTION.has(cle)) return CACHE_PROJECTION.get(cle);
  const du = estIso(o.du) ? o.du : departProjection();
  // l'horizon se compte en mois pleins : douze mois, c'est jusqu'à la fin du
  // douzième — pas jusqu'au même quantième, qui laisserait un mois tronqué
  const au = estIso(o.au) ? o.au : finDeMois(cleMois(ajouterMois(du, ETAT.parametres.horizon - 1)));
  const listeFlux = (o.flux || ETAT.flux).filter((f) => !o.compteId
    || f.compteId === o.compteId
    || (f.type === "virement" && f.compteDest === o.compteId));
  const comptes = o.comptes || ETAT.comptes;
  const soldeInitial = o.soldeInitial !== undefined
    ? o.soldeInitial
    : (o.compteId ? soldeRoule(compte(o.compteId), du)
                  : arrondi2(comptes.reduce((s, c) => s + soldeRoule(c, du), 0)));

  /* Un virement n'est ni un revenu ni une dépense : c'est de l'argent qui
     change de poche. Il ne compte dans les totaux que si sa contrepartie est
     hors du périmètre observé — sur l'ensemble des comptes, jamais ; sur un
     compte seul, toujours. Vu de tous les comptes, les deux jambes se
     compensent et une seule ligne est affichée, à montant nul. */
  const dansPerimetre = (id) => !o.compteId || id === o.compteId;

  const operations = [];
  for (const f of listeFlux) {
    for (const oc of occurrences(f, du, au, du)) {
      const commun = { date: oc.date, brut: oc.montant, type: f.type, libelle: f.libelle, fluxId: f.id, ajuste: !!oc.ajuste };
      if (f.type === "virement") {
        const source = dansPerimetre(f.compteId);
        const destination = dansPerimetre(f.compteDest);
        if (source && destination) {
          operations.push(Object.assign({}, commun, {
            montant: 0, comptable: false, sens: "interne",
            categorieId: null, compteId: f.compteId, compteDest: f.compteDest,
          }));
        } else if (source) {
          operations.push(Object.assign({}, commun, {
            montant: -oc.montant, comptable: true, sens: "sortie",
            categorieId: null, compteId: f.compteId, compteDest: f.compteDest,
          }));
        } else if (destination) {
          operations.push(Object.assign({}, commun, {
            montant: oc.montant, comptable: true, sens: "entree",
            categorieId: null, compteId: f.compteDest, compteDest: f.compteId,
          }));
        }
      } else {
        operations.push(Object.assign({}, commun, {
          montant: f.type === "revenu" ? oc.montant : -oc.montant,
          comptable: true,
          categorieId: f.categorieId,
          compteId: f.compteId,
        }));
      }
    }
  }
  operations.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  // courbe de solde : un point au départ, un par jour où quelque chose bouge
  const points = [{ date: du, solde: soldeInitial }];
  let solde = soldeInitial;
  let soldeMin = soldeInitial, dateSoldeMin = du;
  let dateDecouvert = null, dateSousSeuil = null;
  const seuil = ETAT.parametres.seuilAlerte;

  for (let i = 0; i < operations.length; i++) {
    solde = arrondi2(solde + operations[i].montant);
    operations[i].solde = solde;
    const dernier = operations[i].date;
    if (i === operations.length - 1 || operations[i + 1].date !== dernier) {
      points.push({ date: dernier, solde });
    }
    if (solde < soldeMin) { soldeMin = solde; dateSoldeMin = dernier; }
    if (solde < 0 && !dateDecouvert) dateDecouvert = dernier;
    if (seuil > 0 && solde < seuil && !dateSousSeuil) dateSousSeuil = dernier;
  }
  if (points[points.length - 1].date !== au) points.push({ date: au, solde });

  // mois par mois — tous les mois de la fenêtre, y compris les mois vides
  const mois = [];
  const parCle = new Map();
  for (let cle = cleMois(du); cle <= cleMois(au); cle = moisSuivant(cle)) {
    const m = {
      cle, revenus: 0, depenses: 0, net: 0,
      soldeFin: soldeInitial, soldeMin: null, operations: [],
    };
    mois.push(m);
    parCle.set(cle, m);
  }

  let courant = soldeInitial;
  for (const op of operations) {
    const m = parCle.get(cleMois(op.date));
    if (!m) continue;
    m.operations.push(op);
    if (!op.comptable) continue;
    if (op.montant >= 0) m.revenus += op.montant; else m.depenses += -op.montant;
  }
  for (const m of mois) {
    m.revenus = arrondi2(m.revenus);
    m.depenses = arrondi2(m.depenses);
    m.net = arrondi2(m.revenus - m.depenses);
    courant = arrondi2(courant + m.net);
    m.soldeFin = courant;
    m.soldeMin = m.operations.length
      ? Math.min.apply(null, m.operations.map((op) => op.solde))
      : courant;
  }

  // répartition par catégorie
  const parCategorie = new Map();
  for (const op of operations) {
    if (!op.comptable || !op.categorieId) continue;
    const cle = op.categorieId;
    if (!parCategorie.has(cle)) {
      parCategorie.set(cle, { categorieId: op.categorieId, type: op.type, total: 0, nombre: 0 });
    }
    const e = parCategorie.get(cle);
    e.total = arrondi2(e.total + op.brut);
    e.nombre++;
  }

  const totalRevenus = arrondi2(mois.reduce((s, m) => s + m.revenus, 0));
  const totalDepenses = arrondi2(mois.reduce((s, m) => s + m.depenses, 0));
  const nbMois = Math.max(1, mois.length);

  const resultat = {
    du, au, soldeInitial, soldeFinal: solde,
    operations, points, mois, parCategorie,
    nbMois,
    totaux: {
      revenus: totalRevenus,
      depenses: totalDepenses,
      net: arrondi2(totalRevenus - totalDepenses),
      revenusMensuels: arrondi2(totalRevenus / nbMois),
      depensesMensuelles: arrondi2(totalDepenses / nbMois),
      netMensuel: arrondi2((totalRevenus - totalDepenses) / nbMois),
      tauxEpargne: totalRevenus > 0 ? ((totalRevenus - totalDepenses) / totalRevenus) * 100 : null,
    },
    alerte: { dateDecouvert, dateSousSeuil, soldeMin, dateSoldeMin, seuil },
  };

  if (cle) {
    // une table qui ne grandit pas indéfiniment : au-delà, on repart à neuf
    if (CACHE_PROJECTION.size > CACHE_MAX) CACHE_PROJECTION.clear();
    CACHE_PROJECTION.set(cle, resultat);
  }
  return resultat;
}

/**
 * Solde d'un compte à une date donnée, reporté depuis son dernier relevé.
 *
 * Le solde saisi est daté. Entre ce jour-là et le départ de la projection,
 * les échéances du compte ont continué de tomber : les rejouer évite de
 * partir d'un chiffre périmé, ce qui décalerait toute la courbe.
 */
function soldeRoule(compte, date) {
  if (!compte) return 0;
  const depart = compte.soldeDate;
  if (!estIso(depart) || !estIso(date) || depart >= date) return compte.solde;
  return projeter({
    du: ajouterJours(depart, 1),
    au: date,
    compteId: compte.id,
    soldeInitial: compte.solde,
  }).soldeFinal;
}

/** Solde projeté à une date donnée, lu sur la courbe en escalier. */
function soldeALaDate(projection, date) {
  if (!projection.points.length) return projection.soldeInitial;
  if (date <= projection.points[0].date) return projection.soldeInitial;
  let solde = projection.soldeInitial;
  for (const p of projection.points) {
    if (p.date > date) break;
    solde = p.solde;
  }
  return solde;
}

/* ── Scénarios ────────────────────────────────────────────────────────── */

/** Liste de flux d'un scénario : exclusions, ajustements, ajouts. */
function fluxDuScenario(scenario) {
  if (!scenario) return ETAT.flux.slice();
  const exclus = new Set(scenario.exclus || []);
  const ajuste = (f) => {
    if (f.type === "virement") return f;
    const pct = f.type === "revenu" ? scenario.ajustRevenus : scenario.ajustDepenses;
    if (!pct) return f;
    return Object.assign({}, f, { montant: arrondi2(f.montant * (1 + pct / 100)) });
  };
  return ETAT.flux.filter((f) => !exclus.has(f.id)).map(ajuste).concat(scenario.extras || []);
}

function projeterScenario(scenario, du, au) {
  return projeter({
    du, au,
    flux: fluxDuScenario(scenario),
    soldeInitial: soldeDepart() + (scenario ? scenario.soldeDelta : 0),
  });
}

/* ── Objectifs ────────────────────────────────────────────────────────── */

/**
 * Un objectif est jugé sur la trajectoire, pas sur le seul solde final :
 * on lit le solde projeté à la date cible et on en déduit ce qu'il
 * manquerait, chaque mois, pour y arriver.
 */
function evaluerObjectif(objectif, projection) {
  const depart = projection.du;
  const cpt = objectif.compteId ? compte(objectif.compteId) : null;
  const proj = objectif.compteId
    ? projeter({ du: projection.du, au: projection.au, compteId: objectif.compteId })
    : projection;

  const actuel = cpt ? cpt.solde : projection.soldeInitial;
  const dansFenetre = objectif.dateCible <= proj.au;
  const projete = dansFenetre ? soldeALaDate(proj, objectif.dateCible) : null;
  const moisRestants = Math.max(0, moisEntre(depart, objectif.dateCible));
  const manque = projete === null ? null : arrondi2(objectif.cible - projete);
  const rythmeProjete = proj.totaux.netMensuel;

  let verdict = "hors-horizon";
  if (objectif.dateCible < depart) verdict = "echu";
  else if (projete !== null) verdict = manque <= 0 ? "atteint" : (manque <= objectif.cible * 0.1 ? "juste" : "insuffisant");

  return {
    objectif, actuel, projete, manque, moisRestants, rythmeProjete, verdict,
    progression: objectif.cible > 0 ? Math.max(0, Math.min(1, (projete === null ? actuel : projete) / objectif.cible)) : 0,
    progressionActuelle: objectif.cible > 0 ? Math.max(0, Math.min(1, actuel / objectif.cible)) : 0,
    effortMensuel: manque !== null && manque > 0 && moisRestants > 0 ? arrondi2(manque / moisRestants) : 0,
  };
}

/* ── Enveloppes par catégorie ─────────────────────────────────────────── */

function enveloppes(projection) {
  return ETAT.categories
    .filter((c) => c.type === "depense")
    .map((c) => {
      const e = projection.parCategorie.get(c.id);
      const total = e ? e.total : 0;
      const mensuel = arrondi2(total / projection.nbMois);
      const plafond = c.plafond;
      return {
        categorie: c, total, mensuel, plafond,
        ecart: plafond ? arrondi2(mensuel - plafond) : null,
        ratio: plafond ? mensuel / plafond : null,
      };
    })
    .sort((a, b) => b.mensuel - a.mensuel);
}

/* ── Reste à vivre ────────────────────────────────────────────────────── */

/**
 * Ce qui reste une fois les dépenses contraintes payées.
 *
 * Le partage entre contraint et choisi vient des catégories, pas d'un
 * classement automatique : ce qui est un loisir chez l'un est un besoin
 * chez l'autre. Les virements entre comptes n'entrent nulle part — mettre
 * de côté n'est pas dépenser.
 */
function resteAVivre(projection) {
  let essentiel = 0, choisi = 0;
  for (const e of projection.parCategorie.values()) {
    if (e.type !== "depense") continue;
    const c = categorie(e.categorieId);
    if (c && c.essentiel === false) choisi += e.total; else essentiel += e.total;
  }
  const mois = projection.nbMois;
  const revenus = projection.totaux.revenusMensuels;
  const contraint = arrondi2(essentiel / mois);
  const libre = arrondi2(choisi / mois);
  const reste = arrondi2(revenus - contraint);
  return {
    revenus, contraint, libre, reste,
    parJour: arrondi2(reste / 30.44),
    partContrainte: revenus > 0 ? (contraint / revenus) * 100 : null,
  };
}

/* ── Pointage et dérive ───────────────────────────────────────────────── */

/**
 * Pointer un compte : « voilà ce que la banque affiche aujourd'hui ».
 *
 * C'est la seule boucle de retour de l'application. On enregistre le solde
 * réel, et à côté ce que la projection annonçait pour ce jour-là. L'écart
 * entre les deux — la dérive — dit ce que vaut la prévision : un budget
 * qui ne se compare jamais au relevé finit par décrire un foyer imaginaire.
 *
 * Renvoie le relevé créé, ou null si la date est refusée (antérieure au
 * dernier pointage, ou dans le futur).
 */
function pointerSolde(compteId, date, solde) {
  const c = compte(compteId);
  if (!c || !estIso(date) || date > aujourdhui() || date < c.soldeDate) return null;

  const jours = joursEntre(c.soldeDate, date);
  const releve = {
    date,
    solde: arrondi2(nombreSur(solde, 0)),
    prevu: jours > 0 ? soldeRoule(c, date) : c.solde,
    jours,
  };
  // deux pointages le même jour : le second corrige le premier
  c.releves = c.releves.filter((r) => r.date !== date).concat([releve]);
  c.releves.sort((a, b) => (a.date < b.date ? -1 : 1));
  if (c.releves.length > 200) c.releves = c.releves.slice(-200);
  c.solde = releve.solde;
  c.soldeDate = date;
  return releve;
}

/** Les dérives exploitables : un pointage qui ne couvre aucun jour n'en est
 *  pas une, c'est une correction de saisie. */
function derives(comptes) {
  const liste = comptes || ETAT.comptes;
  const points = [];
  for (const c of liste) {
    for (const r of c.releves || []) {
      if (!r.jours || r.prevu === null) continue;
      const ecart = arrondi2(r.solde - r.prevu);
      points.push({
        compteId: c.id, date: r.date, jours: r.jours,
        ecart, parMois: arrondi2((ecart / r.jours) * 30.44),
      });
    }
  }
  points.sort((a, b) => (a.date < b.date ? -1 : 1));
  return points;
}

/**
 * Ce que l'historique des dérives dit de la prévision à venir.
 *
 * `biais` est la dérive moyenne par mois — un budget systématiquement
 * optimiste le montre ici. `ecartType` est sa dispersion. Les deux ne
 * valent quelque chose qu'à partir de quelques pointages : en dessous de
 * trois, l'application ne s'en sert pas et le dit.
 */
const DERIVE_MINIMUM = 3;

function statistiquesDerive(comptes) {
  const points = derives(comptes);
  const n = points.length;
  if (!n) return { n: 0, biais: 0, ecartType: 0, total: 0, exploitable: false, points };

  const valeurs = points.map((p) => p.parMois);
  const biais = valeurs.reduce((s, v) => s + v, 0) / n;
  const variance = n > 1
    ? valeurs.reduce((s, v) => s + (v - biais) * (v - biais), 0) / (n - 1)
    : 0;
  return {
    n,
    biais: arrondi2(biais),
    ecartType: arrondi2(Math.sqrt(variance)),
    total: arrondi2(points.reduce((s, p) => s + p.ecart, 0)),
    jours: points.reduce((s, p) => s + p.jours, 0),
    exploitable: n >= DERIVE_MINIMUM,
    points,
  };
}

/**
 * La bande d'incertitude autour de la courbe de solde.
 *
 * Le modèle est délibérément simple, et c'est ce qui le rend lisible : la
 * dérive de chaque mois est traitée comme un tirage indépendant de moyenne
 * `biais` et d'écart-type `ecartType`. Sur t mois elle s'accumule en
 * moyenne à `biais × t`, et se disperse en `ecartType × √t` — la racine,
 * pas t, parce que les écarts se compensent en partie.
 *
 * Le coefficient 1,28 correspond à 80 % des cas si les dérives suivent une
 * loi normale. Elles n'y sont pas tenues : c'est une marge indicative, et
 * l'application l'annonce comme telle.
 */
const COEFF_BANDE = 1.28;

function bandeIncertitude(projection, stats) {
  if (!stats || !stats.exploitable) return null;
  const bande = [];
  for (const p of projection.points) {
    const mois = Math.max(0, moisEntre(projection.du, p.date) +
      (joursEntre(ajouterMois(projection.du, moisEntre(projection.du, p.date)), p.date) / 30.44));
    const centre = p.solde + stats.biais * mois;
    const demi = COEFF_BANDE * stats.ecartType * Math.sqrt(mois);
    bande.push({
      date: p.date,
      centre: arrondi2(centre),
      bas: arrondi2(centre - demi),
      haut: arrondi2(centre + demi),
    });
  }
  return bande;
}

/* ── Observations : ce que les chiffres disent ────────────────────────── */

/**
 * Chaque règle lit la projection et renvoie un constat, ou rien.
 *
 * Ce sont des constats, pas des conseils : « vos abonnements coûtent 1 128 €
 * par an » est vérifiable, « vous devriez les résilier » ne regarde que
 * vous. Chacun porte le chiffre qui le fonde, pour qu'on puisse le
 * contredire. Le poids sert à les ranger : ce qui coûte cher d'abord.
 */
function observations(p) {
  const res = [];
  for (const regle of REGLES_OBSERVATION) {
    const trouve = regle(p);
    if (!trouve) continue;
    if (Array.isArray(trouve)) res.push.apply(res, trouve.filter(Boolean));
    else res.push(trouve);
  }
  return res.sort((a, b) => (b.poids || 0) - (a.poids || 0));
}

/** Total annuel d'une catégorie, lu sur la projection. */
function annuelCategorie(p, categorieId) {
  const e = p.parCategorie.get(categorieId);
  return e ? arrondi2((e.total / p.nbMois) * 12) : 0;
}

const REGLES_OBSERVATION = [

  // — le plus gros poste de dépense —
  (p) => {
    const parts = [...p.parCategorie.values()].filter((e) => e.type === "depense" && e.total > 0);
    if (parts.length < 2) return null;
    parts.sort((a, b) => b.total - a.total);
    const gros = parts[0];
    const c = categorie(gros.categorieId);
    const total = parts.reduce((s, e) => s + e.total, 0);
    const part = (gros.total / total) * 100;
    if (!c || part < 18) return null;
    return {
      id: "poste-principal", ton: "info", poids: part,
      titre: c.nom + " est votre premier poste",
      texte: argent(gros.total / p.nbMois) + " par mois, soit " + pourcent(part, 0) +
        " de vos dépenses et " + argent(annuelCategorie(p, gros.categorieId)) + " par an.",
      vue: "categories",
    };
  },

  // — le poids du logement dans les revenus —
  (p) => {
    const c = ETAT.categories.find((x) => x.type === "depense" && /logement|loyer|habitation/i.test(x.nom));
    if (!c || !p.totaux.revenusMensuels) return null;
    const mensuel = (p.parCategorie.get(c.id) || { total: 0 }).total / p.nbMois;
    if (mensuel <= 0) return null;
    const part = (mensuel / p.totaux.revenusMensuels) * 100;
    return {
      id: "poids-logement", ton: part > 33 ? "attention" : "info", poids: part * 1.2,
      // une décimale : arrondi à l'entier, 32,5 % s'afficherait « 33 % »
      // juste après avoir été déclaré en dessous du tiers
      titre: "Le logement pèse " + pourcent(part, 1) + " de vos revenus",
      texte: argent(mensuel) + " par mois sur " + argent(p.totaux.revenusMensuels) + " qui entrent. " +
        (part > 33
          ? "Au-delà d'un tiers, l'usage bancaire parle de taux d'effort élevé — c'est une convention de prêteur, pas une règle de vie."
          : "L'usage bancaire situe la limite à un tiers ; vous êtes en dessous."),
      vue: "categories",
    };
  },

  // — ce que coûtent les dépenses choisies —
  (p) => {
    const choisies = ETAT.categories.filter((c) => c.type === "depense" && c.essentiel === false);
    const total = choisies.reduce((s, c) => s + annuelCategorie(p, c.id), 0);
    if (total < 240) return null;
    const detail = choisies
      .map((c) => ({ nom: c.nom, an: annuelCategorie(p, c.id) }))
      .filter((x) => x.an > 0)
      .sort((a, b) => b.an - a.an)
      .slice(0, 3);
    return {
      id: "depenses-choisies", ton: "info", poids: total / 40,
      titre: argent(total) + " par an de dépenses choisies",
      texte: detail.map((x) => x.nom + " " + argent(x.an)).join(", ") +
        ". C'est la part sur laquelle vous avez la main — le reste tombe quoi qu'il arrive.",
      vue: "categories",
    };
  },

  // — les charges non mensuelles, et ce qu'il faudrait provisionner —
  (p) => {
    const lourdes = ETAT.flux.filter((f) => f.actif && f.type === "depense" &&
      ["trimestriel", "semestriel", "annuel"].indexOf(f.frequence) >= 0);
    if (!lourdes.length) return null;
    const parAn = lourdes.reduce((s, f) => s + f.montant * FREQ[f.frequence].parAn, 0);
    if (parAn < 200) return null;
    return {
      id: "charges-lourdes", ton: "info", poids: parAn / 30,
      titre: nombre(lourdes.length) + " charges tombent en une fois",
      texte: argent(parAn) + " par an — assurances, impôts, vacances. Mises de côté, cela ferait " +
        argent(parAn / 12) + " par mois. C'est ce qui creuse les mois difficiles quand rien n'est provisionné.",
      vue: "calendrier",
    };
  },

  // — le mois le plus lourd de la période —
  (p) => {
    const mois = p.mois.filter((m) => m.depenses > 0);
    if (mois.length < 4) return null;
    const medianeDep = mediane(mois.map((m) => m.depenses));
    const pire = mois.slice().sort((a, b) => b.depenses - a.depenses)[0];
    if (!medianeDep || pire.depenses < medianeDep * 1.3) return null;
    return {
      id: "mois-lourd", ton: "attention", poids: (pire.depenses / medianeDep) * 20,
      titre: libelleMois(pire.cle) + " est le mois le plus chargé",
      texte: argent(pire.depenses) + " de dépenses, soit " + nombre(pire.depenses / medianeDep, 1) +
        " fois un mois ordinaire (" + argent(medianeDep) + "). Le solde y descend à " + argent(pire.soldeMin) + ".",
      vue: "calendrier",
    };
  },

  // — un flux qui se termine libère une mensualité —
  (p) => {
    const finissants = ETAT.flux
      .filter((f) => f.actif && f.type === "depense" && f.fin && f.fin >= p.du && f.fin <= p.au)
      .map((f) => ({ flux: f, mensuel: mensualiteMoyenne(f) }))
      .filter((x) => x.mensuel > 20)
      .sort((a, b) => b.mensuel - a.mensuel);
    if (!finissants.length) return null;
    const x = finissants[0];
    return {
      id: "flux-fini", ton: "bien", poids: x.mensuel / 4,
      titre: x.flux.libelle + " se termine le " + libelleDate(x.flux.fin),
      texte: "À partir de là, " + argent(x.mensuel) + " par mois cessent de sortir, soit " +
        argent(x.mensuel * 12) + " par an" +
        (finissants.length > 1 ? ". " + nombre(finissants.length - 1) + " autre" +
          (finissants.length > 2 ? "s flux se terminent" : " flux se termine") + " aussi dans la période." : "."),
      vue: "flux",
    };
  },

  // — ce que l'épargne couvre —
  (p) => {
    const epargne = ETAT.comptes.filter((c) => c.type === "epargne")
      .reduce((s, c) => s + soldeRoule(c, p.du), 0);
    const rav = resteAVivre(p);
    // sous 200 € de charges contraintes, le rapport ne veut plus rien dire :
    // il annoncerait « trente mois de couverture » sur un budget incomplet
    if (epargne <= 0 || rav.contraint < 200) return null;
    const mois = epargne / rav.contraint;
    return {
      id: "couverture", ton: mois < 3 ? "attention" : "bien", poids: 45,
      titre: "Votre épargne couvre " + nombre(mois, 1) + " mois de charges contraintes",
      texte: argent(epargne) + " mis de côté pour " + argent(rav.contraint) + " de charges par mois. " +
        (mois < 3
          ? "Trois mois est le matelas que recommandent la plupart des conseillers — encore " +
            argent(rav.contraint * 3 - epargne) + " à mettre de côté."
          : "C'est au-dessus des trois mois communément recommandés."),
      vue: "objectifs",
    };
  },

  // — la revalorisation, qui coûte sans qu'on la voie —
  (p) => {
    const indexes = ETAT.flux.filter((f) => f.actif && f.indexation > 0 && f.type === "depense");
    if (!indexes.length) return null;
    /* Le surcoût d'une revalorisation ne dépend pas de la date à laquelle
       elle tombe : c'est le montant, multiplié par le taux, sur une année
       entière de son rythme. */
    const parAn = indexes.reduce((s, f) => s + f.montant * (f.indexation / 100) * FREQ[f.frequence].parAn, 0);
    if (parAn < 60) return null;
    return {
      id: "revalorisation", ton: "info", poids: parAn / 12,
      titre: "Vos revalorisations ajoutent " + argent(parAn) + " par an",
      texte: "Après une revalorisation, " + nombre(indexes.length) + " charge" + (indexes.length > 1 ? "s" : "") +
        " coûteront " + argent(parAn / 12) + " de plus par mois qu'aujourd'hui, et autant de plus " +
        "chaque année suivante. C'est le coût de l'inflation que vous avez saisie.",
      vue: "flux",
    };
  },

  // — le jour du mois où tout tombe —
  (p) => {
    const parJour = new Map();
    for (const op of p.operations) {
      if (op.montant >= 0 || !op.comptable) continue;
      const jour = Number(op.date.slice(8, 10));
      parJour.set(jour, (parJour.get(jour) || 0) + -op.montant);
    }
    if (parJour.size < 5) return null;
    const total = [...parJour.values()].reduce((s, v) => s + v, 0);
    const [jour, montant] = [...parJour.entries()].sort((a, b) => b[1] - a[1])[0];
    const part = (montant / total) * 100;
    if (part < 15) return null;
    return {
      id: "jour-charge", ton: "info", poids: part,
      titre: "Le " + jour + " de chaque mois concentre " + pourcent(part, 0) + " de vos sorties",
      texte: argent(montant / p.nbMois) + " par mois tombent ce jour-là. Si le salaire arrive après, " +
        "c'est là que le compte plonge — décaler un prélèvement de quelques jours suffit parfois.",
      vue: "calendrier",
    };
  },

  // — l'argent qui dort sur le compte courant —
  (p) => {
    const courants = ETAT.comptes.filter((c) => c.type !== "epargne");
    if (!courants.length || ETAT.comptes.length < 2) return null;
    const proj = courants.length === 1
      ? projeter({ du: p.du, au: p.au, compteId: courants[0].id })
      : null;
    if (!proj) return null;
    const plancher = proj.alerte.soldeMin;
    const marge = ETAT.parametres.seuilAlerte || 500;
    if (plancher < marge * 2) return null;
    return {
      id: "dormant", ton: "info", poids: plancher / 60,
      titre: argent(plancher - marge) + " ne descendent jamais du compte courant",
      texte: "Sur toute la période, le solde de « " + courants[0].nom + " » ne passe jamais sous " +
        argent(plancher) + ". Au-delà de votre seuil de " + argent(marge) + ", cette part pourrait rejoindre l'épargne.",
      vue: "comptes",
    };
  },

  // — la dérive mesurée, quand il y en a une —
  () => {
    const st = statistiquesDerive();
    if (!st.exploitable || Math.abs(st.biais) < 20) return null;
    return {
      id: "derive", ton: st.biais < 0 ? "attention" : "bien", poids: Math.abs(st.biais) * 1.5,
      titre: "Votre budget est " + (st.biais < 0 ? "optimiste" : "prudent") + " de " + argent(Math.abs(st.biais)) + " par mois",
      texte: "Mesuré sur " + nombre(st.n) + " pointages : il reste en moyenne " + argent(Math.abs(st.biais)) +
        (st.biais < 0 ? " de moins" : " de plus") + " que prévu, soit " + argent(Math.abs(st.biais) * 12) +
        " sur un an. La courbe du tableau de bord en tient compte.",
      vue: "suivi",
    };
  },

  // — un compte pointé il y a trop longtemps —
  () => {
    const vieux = ETAT.comptes
      .map((c) => ({ c, jours: joursEntre(c.soldeDate, aujourdhui()) }))
      .filter((x) => x.jours > 45)
      .sort((a, b) => b.jours - a.jours)[0];
    if (!vieux) return null;
    return {
      id: "pointage-vieux", ton: "attention", poids: 60,
      titre: "« " + vieux.c.nom + " » n'a pas été pointé depuis " + nombre(vieux.jours) + " jours",
      texte: "Le solde de départ est reporté depuis le " + libelleDate(vieux.c.soldeDate) +
        " en rejouant les échéances. Plus le report est long, plus l'écart avec la réalité peut être grand.",
      vue: "suivi",
    };
  },
];

/* ── Calendrier d'un mois ─────────────────────────────────────────────── */

/** 0 = lundi, 6 = dimanche. */
function jourSemaine(iso) { return (new Date(versUTC(iso)).getUTCDay() + 6) % 7; }

/**
 * Les jours d'un mois, chacun avec ses opérations et le solde au soir.
 * Les jours hors fenêtre de projection sont rendus quand même, sans solde :
 * un calendrier troué serait plus déroutant qu'utile.
 */
function calendrier(projection, cle) {
  const premier = debutDeMois(cle);
  const dernier = finDeMois(cle);
  const parJour = new Map();
  for (const op of projection.operations) {
    if (op.date < premier || op.date > dernier) continue;
    if (!parJour.has(op.date)) parJour.set(op.date, []);
    parJour.get(op.date).push(op);
  }

  const jours = [];
  for (let d = premier; d <= dernier; d = ajouterJours(d, 1)) {
    const ops = parJour.get(d) || [];
    const dedans = d >= projection.du && d <= projection.au;
    jours.push({
      date: d,
      jour: Number(d.slice(8, 10)),
      semaine: jourSemaine(d),
      operations: ops,
      entrees: arrondi2(ops.filter((o) => o.montant > 0).reduce((t, o) => t + o.montant, 0)),
      sorties: arrondi2(ops.filter((o) => o.montant < 0).reduce((t, o) => t - o.montant, 0)),
      solde: dedans ? soldeALaDate(projection, d) : null,
      dedans,
    });
  }
  return { cle, jours, decalage: jours.length ? jours[0].semaine : 0 };
}

/* ── Prêt : mensualité d'un emprunt amortissable ──────────────────────── */

/** Mensualité constante d'un prêt — formule d'annuité classique. */
function mensualitePret(capital, tauxAnnuel, mois) {
  if (!(capital > 0) || !(mois > 0)) return 0;
  const t = (Number(tauxAnnuel) || 0) / 100 / 12;
  if (t <= 0) return arrondi2(capital / mois);
  return arrondi2((capital * t) / (1 - Math.pow(1 + t, -mois)));
}


/* ══════════════════════════════════════════════════════════════════════
   Lecture d'un relevé bancaire

   Saisir un budget à la main est le vrai obstacle : on oublie la moitié
   des prélèvements, et on renonce. Un relevé exporté depuis la banque
   contient déjà tout. Reste à le lire — ce qu'aucune banque n'écrit de la
   même façon — puis à y reconnaître ce qui revient.
   ══════════════════════════════════════════════════════════════════════ */

const SEPARATEURS = [";", ",", "\t", "|"];

/** Découpe une ligne de CSV en respectant les guillemets et les doublés. */
function decouperLigne(ligne, separateur) {
  const cellules = [];
  let courante = "";
  let entreGuillemets = false;
  for (let i = 0; i < ligne.length; i++) {
    const c = ligne[i];
    if (entreGuillemets) {
      if (c === '"') {
        if (ligne[i + 1] === '"') { courante += '"'; i++; }
        else entreGuillemets = false;
      } else courante += c;
    } else if (c === '"') entreGuillemets = true;
    else if (c === separateur) { cellules.push(courante.trim()); courante = ""; }
    else courante += c;
  }
  cellules.push(courante.trim());
  return cellules;
}

/**
 * Le séparateur est celui qui donne le plus de colonnes, et surtout le même
 * nombre sur toutes les lignes : un point-virgule qui découpe proprement bat
 * une virgule qui tombe au hasard dans les libellés.
 */
function detecterSeparateur(lignes) {
  let meilleur = ";", score = -1;
  for (const sep of SEPARATEURS) {
    const tailles = lignes.slice(0, 20).map((l) => decouperLigne(l, sep).length);
    if (!tailles.length) continue;
    const colonnes = tailles[0];
    if (colonnes < 2) continue;
    const reguliers = tailles.filter((t) => t === colonnes).length / tailles.length;
    const note = colonnes * reguliers;
    if (note > score) { score = note; meilleur = sep; }
  }
  return meilleur;
}

/** Une date de relevé : jour/mois/année, année-mois-jour, avec / . ou -. */
function lireDate(valeur) {
  if (typeof valeur !== "string") return null;
  const t = valeur.trim();
  let m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(t);
  if (m) {
    const iso = m[1] + "-" + deuxChiffres(Number(m[2])) + "-" + deuxChiffres(Number(m[3]));
    return estIso(iso) ? iso : null;
  }
  m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/.exec(t);
  if (m) {
    let annee = Number(m[3]);
    // « 24 » veut dire 2024 : un relevé bancaire ne remonte pas au siècle dernier
    if (annee < 100) annee += annee > 70 ? 1900 : 2000;
    const iso = annee + "-" + deuxChiffres(Number(m[2])) + "-" + deuxChiffres(Number(m[1]));
    return estIso(iso) ? iso : null;
  }
  return null;
}

/**
 * Un montant de relevé. Les banques écrivent « 1 234,56 », « -1234.56 »,
 * « 1,234.56 » ou « (123,45) » pour un débit. Le dernier séparateur rencontré
 * est le séparateur décimal — c'est ce qui permet de trancher entre les deux
 * conventions sans rien demander.
 */
function lireMontant(valeur) {
  if (typeof valeur === "number") return isFinite(valeur) ? valeur : null;
  if (typeof valeur !== "string") return null;
  let t = valeur.trim().replace(/\s| | /g, "").replace(/[€$£]/g, "");
  if (!t) return null;
  let signe = 1;
  if (/^\(.*\)$/.test(t)) { signe = -1; t = t.slice(1, -1); }
  if (t[0] === "-" || t[0] === "−") { signe = -1; t = t.slice(1); }
  else if (t[0] === "+") t = t.slice(1);
  if (!/^[\d.,]+$/.test(t) || !/\d/.test(t)) return null;

  const dernierePoint = t.lastIndexOf(".");
  const derniereVirgule = t.lastIndexOf(",");
  const decimal = Math.max(dernierePoint, derniereVirgule);
  let entier, fraction = "";
  if (decimal >= 0 && t.length - decimal - 1 <= 2 && t.length - decimal - 1 > 0) {
    entier = t.slice(0, decimal);
    fraction = t.slice(decimal + 1);
  } else entier = t;
  entier = entier.replace(/[.,]/g, "");
  if (!/^\d*$/.test(entier) || !/^\d*$/.test(fraction)) return null;
  const n = Number((entier || "0") + (fraction ? "." + fraction : ""));
  return isFinite(n) ? signe * n : null;
}

/**
 * Analyse un fichier : séparateur, lignes, en-tête, et le rôle probable de
 * chaque colonne. Le repérage se fait sur le contenu, pas sur les titres :
 * une colonne dont huit valeurs sur dix sont des dates est la colonne date,
 * quel que soit son intitulé.
 */
function analyserCsv(texte) {
  const propre = String(texte || "").replace(/^﻿/, "");
  const lignes = propre.split(/\r\n|\r|\n/).filter((l) => l.trim().length);
  if (lignes.length < 2) return { erreur: "Ce fichier ne contient pas assez de lignes.", lignes: [] };

  const separateur = detecterSeparateur(lignes);
  const grille = lignes.map((l) => decouperLigne(l, separateur));
  const colonnes = Math.max.apply(null, grille.map((g) => g.length));
  for (const g of grille) while (g.length < colonnes) g.push("");

  // une première ligne sans aucune date ni montant est un en-tête
  const premiere = grille[0];
  const entete = premiere.every((c) => lireDate(c) === null) &&
    premiere.filter((c) => lireMontant(c) !== null).length <= 1 ? premiere : null;
  const corps = entete ? grille.slice(1) : grille;
  if (!corps.length) return { erreur: "Ce fichier ne contient aucune ligne de données.", lignes: [] };

  const echantillon = corps.slice(0, 60);
  const notes = [];
  for (let i = 0; i < colonnes; i++) {
    const valeurs = echantillon.map((l) => l[i] || "");
    const remplies = valeurs.filter((v) => v !== "");
    const dates = valeurs.filter((v) => lireDate(v) !== null).length;
    const montants = remplies.filter((v) => lireMontant(v) !== null);
    const textes = remplies.filter((v) => v.length > 3 && lireMontant(v) === null && lireDate(v) === null);
    notes.push({
      i,
      titre: entete ? entete[i] : "Colonne " + (i + 1),
      partDates: dates / echantillon.length,
      // la part se mesure sur les cellules remplies : une colonne « crédit »
      // est vide une ligne sur deux sans cesser d'être une colonne de montants
      partMontants: remplies.length ? montants.length / remplies.length : 0,
      remplissage: remplies.length / echantillon.length,
      distincts: new Set(textes).size,
      negatifs: montants.filter((v) => lireMontant(v) < 0).length,
      valeurs: montants.map(lireMontant),
    });
  }

  const parDate = notes.slice().sort((a, b) => b.partDates - a.partDates);
  const colonneDate = parDate[0] && parDate[0].partDates > 0.6 ? parDate[0].i : -1;
  const parTexte = notes.slice().sort((a, b) => b.distincts - a.distincts);
  const colonneLibelle = parTexte[0] && parTexte[0].distincts > 1 ? parTexte[0].i : -1;

  const numeriques = notes.filter((n) => n.i !== colonneDate && n.partMontants > 0.8 && n.remplissage > 0.02);
  let colonneMontant = -1, colonneDebit = -1, colonneCredit = -1;

  /* Deux colonnes qui se complètent sans jamais se chevaucher : un débit et
     un crédit séparés, comme les écrivent beaucoup de banques françaises.
     Le seuil est bas sur chacune — un relevé peut ne compter que trois
     salaires pour quarante prélèvements — mais leur somme doit couvrir
     toutes les lignes, ce qui écarte une colonne accessoire. */
  const partielles = numeriques.filter((n) => n.remplissage < 0.96);
  let paire = null;
  for (let a = 0; a < partielles.length && !paire; a++) {
    for (let b = a + 1; b < partielles.length && !paire; b++) {
      if (Math.abs(partielles[a].remplissage + partielles[b].remplissage - 1) < 0.12) {
        paire = [partielles[a], partielles[b]];
      }
    }
  }

  if (paire) {
    const [a, b] = paire.slice().sort((x, y) => x.i - y.i);
    const titre = (n) => (n.titre || "").toLowerCase();
    const debitDabord = /cr[ée]dit|recette|entr[ée]e/.test(titre(b)) || !/cr[ée]dit|recette|entr[ée]e/.test(titre(a));
    colonneDebit = debitDabord ? a.i : b.i;
    colonneCredit = debitDabord ? b.i : a.i;
  } else if (numeriques.length) {
    /* Sinon la colonne de montants est la plus remplie — sauf si une autre
       colonne est son solde courant, reconnaissable à ceci : ses écarts
       successifs reproduisent les montants. Un solde pris pour un montant
       ferait un budget entièrement faux. */
    const pleines = numeriques.slice().sort((x, y) => y.remplissage - x.remplissage);
    const estSoldeDe = (solde, montant) => {
      if (solde.valeurs.length < 3 || solde.valeurs.length !== montant.valeurs.length) return false;
      let bons = 0;
      for (let k = 1; k < solde.valeurs.length; k++) {
        if (Math.abs((solde.valeurs[k] - solde.valeurs[k - 1]) - montant.valeurs[k]) < 0.02) bons++;
      }
      return bons / (solde.valeurs.length - 1) > 0.8;
    };
    let choix = pleines[0];
    for (const candidat of pleines) {
      if (pleines.some((autre) => autre !== candidat && estSoldeDe(autre, candidat))) { choix = candidat; break; }
    }
    colonneMontant = choix.i;
  }

  return {
    separateur, entete, lignes: corps, colonnes, notes,
    colonneDate, colonneLibelle, colonneMontant, colonneDebit, colonneCredit,
  };
}

/** Transforme la grille en opérations datées, selon le plan de colonnes. */
function operationsCsv(analyse, plan) {
  const p = plan || analyse;
  const operations = [];
  let ignorees = 0;
  for (const ligne of analyse.lignes) {
    const date = lireDate(ligne[p.colonneDate]);
    let montant = null;
    if (p.colonneMontant >= 0) montant = lireMontant(ligne[p.colonneMontant]);
    else {
      const debit = lireMontant(ligne[p.colonneDebit]);
      const credit = lireMontant(ligne[p.colonneCredit]);
      if (debit !== null && Math.abs(debit) > 0) montant = -Math.abs(debit);
      else if (credit !== null && Math.abs(credit) > 0) montant = Math.abs(credit);
    }
    const libelle = texteSur(ligne[p.colonneLibelle], "", 90);
    if (!date || montant === null || !isFinite(montant) || montant === 0) { ignorees++; continue; }
    operations.push({ date, libelle: libelle || "Sans libellé", montant: arrondi2(montant) });
  }
  operations.sort((a, b) => (a.date < b.date ? -1 : 1));
  return { operations, ignorees };
}

/* ── Reconnaître ce qui revient ───────────────────────────────────────── */

const BRUIT_LIBELLE = /^(carte|cb|paiement|achat|prlv|prelevement|prélèvement|vir|virement|sepa|inst|facture|ech|echeance|retrait|dab|remise|de|du|le|par|pour|ref)$/i;

/**
 * Réduit un libellé de relevé à ce qui l'identifie.
 *
 * « CARTE 12/09 MONOPRIX 2456 PARIS » et « CARTE 04/10 MONOPRIX 2456 LYON »
 * décrivent la même dépense récurrente : on retire les mots de service, les
 * dates et les suites de chiffres, et on garde les premiers mots utiles.
 */
function normaliserLibelle(libelle, motsGardes) {
  const sansAccent = String(libelle || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toUpperCase();
  const mots = sansAccent
    .replace(/\d{1,2}[/.-]\d{1,2}([/.-]\d{2,4})?/g, " ")   // dates
    .replace(/\d{4,}/g, " ")                                 // numéros de carte, références
    .replace(/[^A-Z0-9]+/g, " ")
    .split(" ")
    .filter((m) => m && !BRUIT_LIBELLE.test(m) && m.length > 1);
  return mots.slice(0, motsGardes || 3).join(" ") || sansAccent.trim().slice(0, 24) || "SANS LIBELLE";
}

function mediane(valeurs) {
  if (!valeurs.length) return 0;
  const t = valeurs.slice().sort((a, b) => a - b);
  const m = Math.floor(t.length / 2);
  return t.length % 2 ? t[m] : (t[m - 1] + t[m]) / 2;
}

/* Un rythme est reconnu par l'écart médian entre deux opérations. Les
   tolérances sont larges pour les longues périodes : un prélèvement
   « mensuel » tombe le 3 ou le 5 selon les week-ends. */
const RYTHMES_DETECTES = [
  { id: "hebdo", jours: 7, tolerance: 2, minimum: 4 },
  { id: "quinzaine", jours: 14, tolerance: 3, minimum: 3 },
  { id: "mensuel", jours: 30.44, tolerance: 6, minimum: 3 },
  { id: "bimestriel", jours: 60.88, tolerance: 9, minimum: 3 },
  { id: "trimestriel", jours: 91.31, tolerance: 13, minimum: 3 },
  // au-delà du trimestre, un relevé d'un an ne peut pas en montrer trois :
  // deux suffisent, faute de mieux
  { id: "semestriel", jours: 182.6, tolerance: 22, minimum: 2 },
  { id: "annuel", jours: 365.25, tolerance: 40, minimum: 2 },
];

/**
 * Cherche un rythme dans une suite de dates.
 *
 * L'écart médian sert de candidat, et la part des écarts qui tombent dans la
 * tolérance donne la confiance. Une suite irrégulière — des courses faites
 * quand le frigo est vide — n'atteint jamais le seuil, et c'est voulu : on
 * ne veut pas transformer du bruit en prélèvement mensuel.
 */
function detecterRythme(dates) {
  if (dates.length < 2) return null;
  const tries = dates.slice().sort();
  const ecarts = [];
  for (let i = 1; i < tries.length; i++) ecarts.push(joursEntre(tries[i - 1], tries[i]));
  const medianEcart = mediane(ecarts);
  if (medianEcart <= 0) return null;

  let meilleur = null;
  for (const r of RYTHMES_DETECTES) {
    if (tries.length < r.minimum) continue;
    if (Math.abs(medianEcart - r.jours) > r.tolerance) continue;
    const dedans = ecarts.filter((e) => Math.abs(e - r.jours) <= r.tolerance).length;
    const confiance = dedans / ecarts.length;
    if (!meilleur || confiance > meilleur.confiance) {
      meilleur = { frequence: r.id, confiance, ecartMedian: arrondi2(medianEcart) };
    }
  }
  if (!meilleur || meilleur.confiance < 0.6) return null;
  return meilleur;
}

/** La prochaine échéance attendue après la dernière observée. */
function prochaineEcheancePrevue(dates, frequence, apres) {
  const dernier = dates.slice().sort().pop();
  const freq = FREQ[frequence] || FREQ.mensuel;
  let date = dernier;
  let garde = 0;
  do {
    date = freq.jours ? ajouterJours(date, freq.jours) : ajouterMois(date, freq.mois);
  } while (date <= apres && garde++ < 400);
  return date;
}

/**
 * Regroupe les opérations et en tire des propositions de flux.
 *
 * Ce qui ne se répète pas n'est pas jeté : la somme des opérations isolées
 * est ramenée à une moyenne mensuelle et proposée comme une enveloppe de
 * dépenses variables. C'est le poste que personne ne pense à saisir, et
 * celui qui fait mentir toutes les projections.
 */
function detecterRecurrences(operations, options) {
  const o = options || {};
  const depuis = o.depuis || aujourdhui();
  const propositions = [];

  /* Trois passes, de la plus exacte à la plus large. « MONOPRIX PARIS » et
     « MONOPRIX LYON » ne se rejoignent qu'au second tour, une fois établi
     qu'aucun des deux ne tient un rythme tout seul. Une passe large exige
     davantage de régularité, faute de quoi elle rapprocherait des dépenses
     qui n'ont que leur premier mot en commun. */
  const PASSES = [
    { mots: 3, confiance: 0.6, minimum: 2 },
    { mots: 2, confiance: 0.6, minimum: 3 },
    { mots: 1, confiance: 0.75, minimum: 3 },
  ];

  let restantes = operations.slice();
  for (const passe of PASSES) {
    const groupes = new Map();
    for (const op of restantes) {
      const cle = (op.montant < 0 ? "D:" : "R:") + normaliserLibelle(op.libelle, passe.mots);
      if (!groupes.has(cle)) groupes.set(cle, { cle, libelle: op.libelle, operations: [] });
      groupes.get(cle).operations.push(op);
    }

    const suivantes = [];
    for (const g of groupes.values()) {
      const dates = g.operations.map((x) => x.date);
      const rythme = g.operations.length >= passe.minimum ? detecterRythme(dates) : null;
      if (!rythme || rythme.confiance < passe.confiance) { suivantes.push.apply(suivantes, g.operations); continue; }

      const montants = g.operations.map((x) => Math.abs(x.montant));
      const montant = arrondi2(mediane(montants));
      propositions.push({
        libelle: titreLisible(normaliserLibelle(g.libelle, passe.mots)),
        libelleBrut: g.libelle,
        type: g.operations[0].montant < 0 ? "depense" : "revenu",
        montant,
        dispersion: montants.length > 1 ? arrondi2(mediane(montants.map((m) => Math.abs(m - montant)))) : 0,
        frequence: rythme.frequence,
        confiance: rythme.confiance,
        nombre: g.operations.length,
        premiere: dates.slice().sort()[0],
        derniere: dates.slice().sort().pop(),
        debut: prochaineEcheancePrevue(dates, rythme.frequence, depuis),
        operations: g.operations,
      });
    }
    restantes = suivantes;
  }
  const isolees = restantes;

  propositions.sort((a, b) => (b.montant * (FREQ[b.frequence].parAn || 1)) - (a.montant * (FREQ[a.frequence].parAn || 1)));

  // enveloppe des opérations isolées, ramenée au mois
  let variables = null;
  const sorties = isolees.filter((x) => x.montant < 0);
  if (sorties.length >= 3) {
    const jours = Math.max(28, joursEntre(
      operations[0].date, operations[operations.length - 1].date) + 1);
    const total = sorties.reduce((s, x) => s + Math.abs(x.montant), 0);
    variables = {
      libelle: "Dépenses variables",
      type: "depense",
      montant: arrondi2((total / jours) * 30.44),
      frequence: "mensuel",
      nombre: sorties.length,
      total: arrondi2(total),
      jours,
      debut: debutDeMois(moisSuivant(cleMois(depuis))),
    };
  }

  return { propositions, variables, isolees };
}

/** « EDF CLIENTS » → « Edf clients ». */
function titreLisible(libelle) {
  const base = String(libelle || "").toLowerCase();
  return base.charAt(0).toUpperCase() + base.slice(1);
}

/* ══════════════════════════════════════════════════════════════════════
   6. Persistance
   ══════════════════════════════════════════════════════════════════════ */

/* Certains contextes refusent le stockage local — navigation privée, cookies
   bloqués, page en bac à sable — et lèvent à la simple lecture. L'application
   doit alors continuer de fonctionner, sans mémoire d'une session à l'autre. */
function lireLocal(cle) {
  try { return localStorage.getItem(cle); } catch (e) { return null; }
}

function ecrireLocal(cle, valeur) {
  try { localStorage.setItem(cle, valeur); return true; } catch (e) { return false; }
}

function chargerEtat() {
  let brut = null;
  const t = lireLocal(CLE_ETAT);
  if (t) { try { brut = JSON.parse(t); } catch (e) { brut = null; } }
  ETAT = normaliser(brut);
  invaliderProjections();
  return brut !== null;
}

function enregistrerEtat() {
  _formats = {};
  invaliderProjections();
  const serialise = JSON.stringify(ETAT);
  if (!ecrireLocal(CLE_ETAT, serialise)) {
    message("Sauvegarde impossible : ce navigateur refuse le stockage local.");
    return;
  }
  peutEtreSauvegarder(serialise);
}

/* ── Sauvegardes automatiques ─────────────────────────────────────────────

   Les données ne vivent que dans ce navigateur : vider les données du site
   les efface, et une mauvaise manipulation aussi. L'application garde donc
   quelques instantanés tournants, au plus un par heure — assez pour revenir
   en arrière après une fausse manœuvre découverte trop tard, assez peu pour
   ne pas saturer un stockage qui se compte en mégaoctets.

   Cela ne remplace pas l'export JSON : un instantané disparaît avec le reste
   si l'on vide les données du site. L'application le dit. */

const CLE_SAUVEGARDES = "prevoyant:sauvegardes:v1";
const SAUVEGARDES_MAX = 6;
const SAUVEGARDE_INTERVALLE = 3600 * 1000;
const SAUVEGARDE_TAILLE_MAX = 400 * 1024;

function lireSauvegardes() {
  try {
    const brut = JSON.parse(lireLocal(CLE_SAUVEGARDES) || "[]");
    return Array.isArray(brut) ? brut.filter((s) => s && typeof s.quand === "number" && typeof s.etat === "string") : [];
  } catch (e) { return []; }
}

/** Renvoie l'instantané créé, ou null s'il n'y avait pas lieu d'en créer un. */
function peutEtreSauvegarder(serialise, maintenant) {
  if (serialise.length > SAUVEGARDE_TAILLE_MAX) return null;
  const quand = maintenant === undefined ? Date.now() : maintenant;
  const liste = lireSauvegardes();
  const dernier = liste[liste.length - 1];
  if (dernier && quand - dernier.quand < SAUVEGARDE_INTERVALLE) return null;
  if (dernier && dernier.etat === serialise) return null;

  const instantane = { quand, taille: serialise.length, etat: serialise };
  const suite = liste.concat([instantane]).slice(-SAUVEGARDES_MAX);
  // un stockage plein ne doit pas empêcher la sauvegarde principale :
  // on abandonne les instantanés plutôt que de faire échouer l'écriture
  if (!ecrireLocal(CLE_SAUVEGARDES, JSON.stringify(suite))) {
    ecrireLocal(CLE_SAUVEGARDES, JSON.stringify(suite.slice(-2)));
  }
  return instantane;
}

function restaurerSauvegarde(quand) {
  const trouve = lireSauvegardes().find((s) => s.quand === quand);
  if (!trouve) { message("Cette sauvegarde n'existe plus."); return; }
  let contenu;
  try { contenu = JSON.parse(trouve.etat); } catch (e) { message("Cette sauvegarde est illisible."); return; }
  const propre = normaliser(contenu);
  confirmer("Revenir à cette sauvegarde ?",
    "Elle date du " + libelleDateHeure(trouve.quand) + " et contient " + propre.flux.length + " flux. " +
    "L'état actuel sera remplacé — « Annuler » permet d'y revenir.",
    "Restaurer", () => {
      memoriser();
      ETAT = propre;
      enregistrerEtat();
      rendre();
      message("Sauvegarde restaurée.", { annuler: true });
    });
}

function libelleDateHeure(ms) {
  const d = new Date(ms);
  const iso = d.getFullYear() + "-" + deuxChiffres(d.getMonth() + 1) + "-" + deuxChiffres(d.getDate());
  return libelleDate(iso) + " à " + deuxChiffres(d.getHours()) + " h " + deuxChiffres(d.getMinutes());
}

/* Toute modification est réversible : l'état d'avant est empilé, et la
   dernière opération peut être défaite — par le bouton du message, ou par
   Ctrl+Z. Trente pas suffisent ; au-delà, l'export JSON est la sauvegarde. */
const HISTORIQUE = [];
const HISTORIQUE_MAX = 30;

function memoriser() {
  HISTORIQUE.push(JSON.stringify(ETAT));
  if (HISTORIQUE.length > HISTORIQUE_MAX) HISTORIQUE.shift();
}

function modifier(action, libelle) {
  memoriser();
  action();
  enregistrerEtat();
  rendre();
  if (libelle) message(libelle, { annuler: true });
}

function annuler() {
  const avant = HISTORIQUE.pop();
  if (avant === undefined) { message("Rien à annuler."); return; }
  ETAT = normaliser(JSON.parse(avant));
  invaliderProjections();
  enregistrerEtat();
  rendre();
  message("Modification annulée.");
}
