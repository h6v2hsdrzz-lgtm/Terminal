        + '<button class="icone-btn danger" data-suppr="lieu" data-id="' + x.id + '" aria-label="Supprimer ce lieu">🗑</button></div>').join("")
    + '<div class="ajout"><input type="text" class="saisie" id="nouveau-lieu" placeholder="Ajouter un lieu"><button class="secondaire" data-ajout="lieu">Ajouter</button></div></div>'

    + '<div class="section-reglage"><h3>Mesure</h3><p>Changer l\'échelle convertit proportionnellement les mesures déjà prises — un 7 sur 10 devient un 4 sur 5.</p>'
    + '<div class="ligne-item"><span style="flex:1">Échelle de joie</span>'
    + '<span class="segments compact" role="radiogroup" aria-label="Échelle">'
    + [5, 10].map((n) => '<button type="button" role="radio" data-echelle="' + n + '" aria-checked="' + (p.echelle === n) + '">1 à ' + n + "</button>").join("")
    + "</span></div>"
    + '<div class="ligne-item"><span style="flex:1">Mesures minimales avant de croire un écart</span>'
    + '<span class="segments compact" role="radiogroup" aria-label="Seuil de fiabilité">'
    + [2, 3, 5, 10].map((n) => '<button type="button" role="radio" data-seuil="' + n + '" aria-checked="' + (p.seuilFiable === n) + '">' + n + "</button>").join("")
    + "</span></div></div>"

    + '<div class="section-reglage"><h3>Décor</h3><p>Des taches de couleur floutées derrière la page. Aucune image chargée.</p>'
    + '<div class="segments" role="radiogroup" aria-label="Décor">'
    + [["sobre", "Sobre"], ["aurore", "Aurore"], ["jardin", "Jardin"], ["nuit", "Nuit"]].map(([cle, nom]) =>
        '<button type="button" role="radio" data-decor="' + cle + '" aria-checked="' + (p.decor === cle) + '">' + nom + "</button>").join("")
    + "</div>"
    + '<button class="mini-bascule" role="switch" data-bascule="animations" aria-checked="' + p.animations + '" style="width:100%;margin-top:10px">'
    + "<span>Animer le décor</span>"
    + '<span class="interrupteur" aria-hidden="true"' + (p.animations ? ' style="background:var(--ardoise)"' : "") + "><i></i></span></button></div>"

    + '<div class="section-reglage"><h3>Cartes affichées</h3><p>Ce que le tableau de bord montre en haut.</p>'
    + '<div class="bascules-reglage">'
    + [["moyenne", "Moyenne générale"], ["profils", "Un par profil"], ["facteur", "Facteur influent"],
       ["lieu", "Lieu le plus joyeux"], ["serie", "Série en cours"], ["calendrier", "Calendrier"], ["repartition", "Répartition"]]
      .map(([cle, nom]) =>
        '<button class="mini-bascule" role="switch" data-widget="' + cle + '" aria-checked="' + !!p.widgets[cle] + '">'
        + "<span>" + nom + "</span>"
        + '<span class="interrupteur" aria-hidden="true"' + (p.widgets[cle] ? ' style="background:var(--ardoise)"' : "") + "><i></i></span></button>").join("")
    + "</div></div>"

    + '<div class="section-reglage"><h3>Données</h3><p id="note-donnees"></p>'
    + '<div class="ajout"><button class="secondaire" data-action="demo">Charger une démonstration</button>'
    + '<button class="secondaire danger-txt" data-action="vider">Tout effacer</button></div></div>';

  const { voile, fermer } = ouvrirFenetre("Réglages", html);

  voile.querySelector("#note-donnees").textContent = Sync.mode === "partage"
    ? "Ce journal est partagé : chaque modification est publiée et toutes les vues ouvertes suivent."
    : Sync.mode === "lecture"
      ? "Journal partagé, en lecture seule pour vous."
      : "Les données restent dans ce navigateur. Rien n'est envoyé.";

  if (lecture) {
    voile.querySelectorAll("input, [data-ajout], [data-suppr], [data-action], [data-teinte], [data-echelle], [data-seuil], [data-decor], [data-widget], [data-bascule]")
      .forEach((el) => { el.disabled = true; el.style.pointerEvents = "none"; el.style.opacity = ".6"; });
    return;
  }

  function rafraichir() { fermer(); ouvrirReglages(); }

  // Le texte se met à jour sans repeindre : sinon le champ perdrait le focus.
  voile.addEventListener("input", (e) => {
    const champ = e.target;
    if (champ.dataset.texte) {
      params()[champ.dataset.texte] = champ.value;
      appliquerEntete();
      enregistrerEtat();
      return;
    }
    const genre = champ.dataset.item;
    if (!genre) return;
    const id = champ.dataset.id;
    if (genre === "profil") { const x = profil(id); if (x) x.nom = champ.value; }
    if (genre === "facteur") { const x = facteur(id); if (x) x.nom = champ.value; }
    if (genre === "facteur-emoji") { const x = facteur(id); if (x) x.emoji = champ.value; }
    if (genre === "lieu") { const x = lieu(id); if (x) x.nom = champ.value; }
    if (genre === "lieu-emoji") { const x = lieu(id); if (x) x.emoji = champ.value; }
    enregistrerEtat();
    rendre();
  });

  voile.addEventListener("click", (e) => {
    const teinte = e.target.closest("[data-teinte]");
    if (teinte) {
      const cible = teinte.dataset.genre === "profil" ? profil(teinte.dataset.cible) : facteur(teinte.dataset.cible);
      if (cible) { cible.teinte = Number(teinte.dataset.teinte); enregistrerEtat(); rendre(); rafraichir(); }
      return;
    }

    const suppr = e.target.closest("[data-suppr]");
    if (suppr) {
      const genre = suppr.dataset.suppr, id = suppr.dataset.id;
      if (genre === "profil") {
        if (profils().length <= 1) { signaler("Il faut au moins un profil.", "erreur"); return; }
        const combien = ETAT.entrees.filter((x) => x.profil === id).length;
        if (combien && !confirm("Supprimer ce profil effacera aussi ses " + combien + " entrée(s). Continuer ?")) return;
        params().profils = profils().filter((x) => x.id !== id);
        ETAT.entrees = ETAT.entrees.filter((x) => x.profil !== id);
      }
      if (genre === "facteur") {
        params().facteurs = facteurs().filter((x) => x.id !== id);
        ETAT.entrees.forEach((x) => { x.facteurs = x.facteurs.filter((f) => f !== id); });
        if (vue.facteurCompare === id) vue.facteurCompare = null;
        if (vue.facteurFiltre === id) vue.facteurFiltre = "";
      }
      if (genre === "lieu") {
        params().lieux = lieux().filter((x) => x.id !== id);
        ETAT.entrees.forEach((x) => { if (x.lieu === id) x.lieu = null; });
        if (vue.lieuFiltre === id) vue.lieuFiltre = "";
      }
      enregistrerEtat();
      derniereCible = "";
      synchroniserCible();
      rendre();
      rafraichir();
      return;
    }

    const ajout = e.target.closest("[data-ajout]");
    if (ajout) {
      const genre = ajout.dataset.ajout;
      const champ = voile.querySelector("#nouveau-" + genre);
      const nom = (champ.value || "").trim();
      if (!nom) { champ.focus(); return; }
      if (genre === "profil") {
        if (profils().length >= PROFILS_MAX) return;
        const prises = profils().map((x) => x.teinte);
        const libre = TEINTES.find((t) => !prises.includes(t)) || 1;
        profils().push({ id: identifiant("p"), nom, teinte: libre });
      }
      if (genre === "facteur") facteurs().push({ id: identifiant("f"), nom, emoji: "✨", teinte: (facteurs().length % TEINTES.length) + 1 });
      if (genre === "lieu") lieux().push({ id: identifiant("l"), nom, emoji: "📍" });
      enregistrerEtat();
      rendre();
      rafraichir();
      return;
    }

    const echelleBtn = e.target.closest("[data-echelle]");
    if (echelleBtn) {
      const avant = params().echelle;
      const apres = Number(echelleBtn.dataset.echelle);
      if (avant !== apres) {
        // Les mesures sont converties proportionnellement, pas rabotées :
        // ramener un 7/10 à 5/5 au lieu de 4/5 effacerait l'écart entre une
        // bonne journée et une journée parfaite.
        const convertir = (v) => Math.max(1, Math.min(apres, Math.round((v * apres) / avant)));
        params().echelle = apres;
        ETAT.entrees.forEach((x) => { x.joie = convertir(x.joie); });
        saisie.joie = convertir(saisie.joie);
        enregistrerEtat();
        rendre();
      }
      rafraichir();
      return;
    }

    const seuil = e.target.closest("[data-seuil]");
    if (seuil) { params().seuilFiable = Number(seuil.dataset.seuil); enregistrerEtat(); rendre(); rafraichir(); return; }

    const decor = e.target.closest("[data-decor]");
    if (decor) { params().decor = decor.dataset.decor; appliquerDecor(); enregistrerEtat(); rafraichir(); return; }

    const bascule = e.target.closest("[data-bascule]");
    if (bascule) { params().animations = !params().animations; appliquerDecor(); enregistrerEtat(); rafraichir(); return; }

    const widget = e.target.closest("[data-widget]");
    if (widget) {
      const cle = widget.dataset.widget;
      params().widgets[cle] = !params().widgets[cle];
      enregistrerEtat();
      rendreKpis();
      rafraichir();
      return;
    }

    const action = e.target.closest("[data-action]");
    if (action) {
      if (action.dataset.action === "demo") {
        if (ETAT.entrees.length && !confirm("Remplacer le journal actuel par six semaines de démonstration ?")) return;
        chargerDemo();
        fermer();
      }
      if (action.dataset.action === "vider") {
        if (!confirm("Effacer toutes les entrées ? Les réglages sont conservés.")) return;
        ETAT.entrees = [];
        enregistrerEtat();
        derniereCible = "";
        synchroniserCible();
        rendre();
        fermer();
        signaler("Journal vidé.");
      }
    }
  });
}

/* ── Exports ────────────────────────────────────────────────────────── */

let sauvegardeFichier = null;

function versCsv(lignes) {
  const echappe = (v) => (/[";\n\r]/.test(v) ? '"' + v.replaceAll('"', '""') + '"' : v);
  const colonnes = ["id", "date", "profil", "joie", "lieu"].concat(facteurs().map((f) => f.nom)).concat(["notes"]);
  const sortie = [colonnes.join(";")];
  for (const e of lignes) {
    const p = profil(e.profil), l = e.lieu ? lieu(e.lieu) : null;
    const ligne = [e.id, isoVersFr(e.date), p ? p.nom : "", String(e.joie), l ? l.nom : ""]
      .concat(facteurs().map((f) => (e.facteurs.includes(f.id) ? "Vrai" : "Faux")))
      .concat([e.notes || ""]);
    sortie.push(ligne.map(echappe).join(";"));
  }
  return "﻿" + sortie.join("\r\n");
}

function versJson(lignes) {
  return JSON.stringify(lignes.map((e) => {
    const p = profil(e.profil), l = e.lieu ? lieu(e.lieu) : null;
    return {
      id: e.id, date: isoVersFr(e.date), profil: p ? p.nom : null, joie: e.joie,
      lieu: l ? l.nom : null,
      facteurs: e.facteurs.map((id) => (facteur(id) ? facteur(id).nom : null)).filter(Boolean),
      notes: e.notes,
    };
  }), null, 2);
}

function telechargerBlob(nom, contenu, format) {
  try {
    const type = format === "csv" ? "text/csv" : "application/json";
    const url = URL.createObjectURL(new Blob([contenu], { type: type + ";charset=utf-8" }));
    const lien = document.createElement("a");
    lien.href = url;
    lien.download = nom;
    document.body.append(lien);
    lien.click();
    lien.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) { return false; }
}

async function exporter(format) {
  const lignes = lignesFiltrees();
  if (!lignes.length) return;
  const contenu = format === "csv" ? versCsv(lignes) : versJson(lignes);
  const nom = "joie-" + aujourdhui() + "." + format;

  if (sauvegardeFichier) {
    try {
      await sauvegardeFichier.save({ filename: nom, data: contenu });
      signaler(lignes.length + " entrées exportées en " + format.toUpperCase() + ".");
      return;
    } catch (erreur) {
      if (erreur && erreur.code === "declined") return;
    }
  } else if (telechargerBlob(nom, contenu, format)) {
    signaler(lignes.length + " entrées exportées en " + format.toUpperCase() + ".");
    return;
  }

  const { voile } = ouvrirFenetre(nom,
    '<p style="margin:0 0 10px;font-size:12px;color:var(--attenue)">' + lignes.length
    + " entrées. Le téléchargement direct n'est pas disponible ici — copiez le contenu.</p>"
    + '<textarea class="saisie aire-export" id="export-texte" readonly></textarea>'
    + '<div class="duo"><button class="annuler" data-fermer>Fermer</button>'
    + '<button class="principal" id="copier" style="margin-top:0">Copier</button></div>');
  voile.querySelector("#export-texte").value = contenu;
  voile.querySelector("#copier").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(contenu); }
    catch (e) { voile.querySelector("#export-texte").select(); document.execCommand("copy"); }
    signaler("Contenu copié.");
  });
}

/* ── Démonstration ──────────────────────────────────────────────────── */

function chargerDemo() {
  let graine = 20260829;
  const tirage = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 0x100000000; };

  const notes = ["Longue sieste, réveil de bonne humeur.", "Journée de pluie, sortie annulée.",
    "Visite des grands-parents.", "Nuit courte.", "Premier soleil de la semaine.", null, null, null];
  const base = { 0: 0.56, 1: 0.69, 2: 0.62, 3: 0.6, 4: 0.65 };

  const produites = [];
  for (let recul = 41; recul >= 0; recul -= 1) {
    const date = decalerIso(aujourdhui(), -recul);
    const actifs = facteurs().filter(() => tirage() < 0.5).map((f) => f.id);
    for (let i = 0; i < profils().length; i += 1) {
      const p = profils()[i];
      if (tirage() > 0.9) continue;
      const effet = actifs.length ? (i === 0 ? 0.2 : 0.1) * actifs.length : 0;
      const bruit = (tirage() - 0.5) * 0.24;
      const part = Math.max(0.05, Math.min(1, (base[i] || 0.6) + effet + bruit));
      const place = lieux().length ? lieux()[Math.floor(tirage() * lieux().length)].id : null;
      produites.push({
        id: identifiant(),
        date,
        profil: p.id,
        joie: Math.max(1, Math.round(part * echelle())),
        facteurs: actifs.slice(),
        lieu: place,
        notes: notes[Math.floor(tirage() * notes.length)],
      });
    }
  }

  ETAT.entrees = produites;
  enregistrerEtat();
  derniereCible = "";
  synchroniserCible();
  signaler(produites.length + " entrées de démonstration chargées.");
  rendre();
}

/* ── Thème et décor ─────────────────────────────────────────────────── */

function themeActuel() {
  const choisi = document.documentElement.getAttribute("data-theme");
  if (choisi) return choisi;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function appliquerTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const ic = $("theme-ic");
  if (ic) ic.textContent = theme === "dark" ? "☀" : "☾";
  try { localStorage.setItem(CLE_THEME, theme); } catch (e) {}
  rendreCourbe();
  rendreBarres();
}

function appliquerDecor() {
  document.documentElement.setAttribute("data-decor", params().decor);
  document.documentElement.setAttribute("data-anim", params().animations ? "oui" : "non");
}

function appliquerEntete() {
  $("titre-journal").textContent = params().titre;
  $("sous-titre-journal").textContent = params().sousTitre;
  document.title = params().titre;
}

/* ── Rendu ──────────────────────────────────────────────────────────── */

function segments(hote, options, actif, surChoix) {
  hote.innerHTML = options.map((o) =>
    '<button type="button" role="radio" data-valeur="' + o.valeur + '" aria-checked="' + (o.valeur === actif) + '">'
    + echapper(o.libelle) + "</button>").join("");
  hote.onclick = (e) => {
    const bouton = e.target.closest("[data-valeur]");
    if (bouton) surChoix(bouton.dataset.valeur);
  };
}

function rendreSelecteurs() {
  segments($("fenetre-choix"), [
    { valeur: "30", libelle: "30 j" }, { valeur: "90", libelle: "90 j" }, { valeur: "tout", libelle: "Tout" },
  ], vue.fenetre, (v) => { vue.fenetre = v; rendreSelecteurs(); rendreCourbe(); });

  if (!vue.facteurCompare || !facteur(vue.facteurCompare)) vue.facteurCompare = facteurs().length ? facteurs()[0].id : null;
  segments($("facteur-choix"), facteurs().map((f) => ({ valeur: f.id, libelle: f.nom })), vue.facteurCompare,
    (v) => { vue.facteurCompare = v; rendreSelecteurs(); rendreBarres(); });
}

function rendre() {
  appliquerEntete();
  appliquerDecor();
  majPastille();
  rendreKpis();
  rendreFormulaire();
  rendreSelecteurs();
  rendreCourbe();
  rendreBarres();
  rendreFiltres();
  rendreJournal();
  $("note-stockage").textContent = Sync.mode === "partage"
    ? "Ce journal est partagé : chaque modification est publiée et toutes les vues ouvertes suivent."
    : Sync.mode === "lecture" ? "Journal partagé, en lecture seule pour vous."
    : "Les données restent dans ce navigateur — rien n'est envoyé nulle part.";
}

/* ── Branchements ───────────────────────────────────────────────────── */

function brancher() {
  $("formulaire").addEventListener("submit", (e) => { e.preventDefault(); enregistrerSaisie(); });
  $("f-date").addEventListener("change", (e) => { saisie.date = e.target.value; synchroniserCible(); rendreFormulaire(); });
  $("f-joie").addEventListener("input", (e) => { saisie.joie = Number(e.target.value); rendreFormulaire(); });
  $("f-notes").addEventListener("input", (e) => {
    saisie.notes = e.target.value;
    $("f-compte").textContent = saisie.notes.length + "/" + NOTES_MAX;
  });

  $("f-profil").addEventListener("click", (e) => {
    const b = e.target.closest("[data-profil]");
    if (!b) return;
    saisie.profil = b.dataset.profil;
    synchroniserCible();
    rendreFormulaire();
  });

  $("f-lieu").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lieu]");
    if (!b) return;
    saisie.lieu = b.dataset.lieu || null;
    rendreFormulaire();
  });

  $("f-facteurs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-facteur]");
    if (!b) return;
    const id = b.dataset.facteur;
    saisie.facteurs = saisie.facteurs.includes(id) ? saisie.facteurs.filter((x) => x !== id) : saisie.facteurs.concat(id);
    rendreFormulaire();
  });

  $("journal").addEventListener("click", (e) => {
    const tri = e.target.closest("[data-tri]");
    if (tri) {
      const cible = tri.dataset.tri;
      if (cible === vue.colonne) vue.sens = vue.sens === "asc" ? "desc" : "asc";
      else { vue.colonne = cible; vue.sens = cible === "date" ? "desc" : "asc"; }
      rendreJournal();
      return;
    }
    const modifier = e.target.closest("[data-modifier]");
    if (modifier) { ouvrirModification(modifier.dataset.modifier); return; }

    const supprimer = e.target.closest("[data-supprimer]");
    if (supprimer) {
      const entree = ETAT.entrees.find((x) => x.id === supprimer.dataset.supprimer);
      if (!entree || !peutEcrire()) return;
      const p = profil(entree.profil);
      if (!confirm("Supprimer l'entrée du " + isoVersFr(entree.date) + (p ? " pour " + p.nom : "") + " ?")) return;
      ETAT.entrees = ETAT.entrees.filter((x) => x.id !== entree.id);
      enregistrerEtat();
      derniereCible = "";
      synchroniserCible();
      signaler("Entrée du " + isoVersFr(entree.date) + " supprimée.");
      rendre();
      return;
    }

    if (e.target.closest("#plus")) { vue.limite += PAS; rendreJournal(); return; }
    if (e.target.closest("#demo")) chargerDemo();
  });

  $("filtres").addEventListener("click", (e) => {
    const puce = e.target.closest("[data-profil-filtre]");
    if (puce) {
      const id = puce.dataset.profilFiltre;
      vue.profilsFiltres = vue.profilsFiltres.includes(id)
        ? vue.profilsFiltres.filter((x) => x !== id) : vue.profilsFiltres.concat(id);
      rendreFiltres();
      rendreJournal();
      return;
    }
    if (e.target.closest("#reinit")) {
      Object.assign(vue, { profilsFiltres: [], du: "", au: "", facteurFiltre: "", etatFacteur: "tous", lieuFiltre: "", recherche: "" });
      rendreFiltres();
      rendreJournal();
    }
  });

  $("filtres").addEventListener("change", (e) => {
    const borne = e.target.dataset.borne;
    if (borne) { vue[borne] = e.target.value; rendreFiltres(); rendreJournal(); return; }
    const filtre = e.target.dataset.filtre;
    if (filtre) { vue[filtre] = e.target.value; rendreFiltres(); rendreJournal(); }
  });

  $("filtres").addEventListener("input", (e) => {
    if (e.target.id !== "f-recherche") return;
    vue.recherche = e.target.value;
    majReinit();
    rendreJournal();
  });

  $("export-csv").addEventListener("click", () => exporter("csv"));
  $("export-json").addEventListener("click", () => exporter("json"));
  $("ouvrir-reglages").addEventListener("click", ouvrirReglages);
  $("theme").addEventListener("click", () => appliquerTheme(themeActuel() === "dark" ? "light" : "dark"));

  let minuterie = null;
  window.addEventListener("resize", () => {
    clearTimeout(minuterie);
    minuterie = setTimeout(() => { rendreCourbe(); rendreBarres(); }, 150);
  });
}

/* ── Démarrage ──────────────────────────────────────────────────────── */

async function demarrer() {
  try {
    const memorise = localStorage.getItem(CLE_THEME);
    if (memorise) document.documentElement.setAttribute("data-theme", memorise);
  } catch (e) {}

  // La capacité se détecte avant le chargement : elle décide d'où viennent
  // les données.
  await Sync.init();

  const { etat } = await chargerEtat();
  ETAT = etat;

  // Le modèle est cloné dans la page : c'est lui, et non le DOM rendu, qui
  // sert de source quand la page se republie.
  $("racine").append(document.getElementById("modele").content.cloneNode(true));

  reprendreBrouillon();
  brancher();
  synchroniserCible();
  rendre();
  appliquerTheme(themeActuel());

  majPastille();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => { sauvegardeFichier = d; }).catch(() => {});
  }

  if ("serviceWorker" in navigator && location.protocol.startsWith("http") && window.top === window.self) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  document.fonts && document.fonts.ready.then(() => { rendreCourbe(); rendreBarres(); });
}

demarrer();
</script>
