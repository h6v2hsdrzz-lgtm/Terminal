<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" data-joie>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-joie>
<title data-joie>Journal de joie</title>
<meta name="description" content="Journal de joie partagé : niveaux de joie quotidiens, lieux, facteurs déclencheurs et tableau de bord, synchronisés entre tous les appareils." data-joie>

<link rel="manifest" href="manifest.webmanifest" data-joie>
<link rel="icon" href="icone.svg" type="image/svg+xml" data-joie>
<link rel="apple-touch-icon" href="icone-apple-180.png" data-joie>
<meta name="apple-mobile-web-app-capable" content="yes" data-joie>
<meta name="apple-mobile-web-app-title" content="Joie" data-joie>
<meta name="apple-mobile-web-app-status-bar-style" content="default" data-joie>
<meta name="mobile-web-app-capable" content="yes" data-joie>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f3ed" data-joie>
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10151d" data-joie>

<link rel="preconnect" href="https://fonts.googleapis.com" data-joie>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-joie>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" data-joie>

<style data-joie>
/* ════════════════════════════════════════════════════════════════════
   Journal de joie — un seul fichier, aucune dépendance.

   Les cinq teintes de série sont validées ensemble : bande de clarté,
   plancher de chroma, séparation en vision daltonienne et contraste,
   séparément pour chaque thème. C'est la raison du plafond à cinq
   profils : au-delà, deux profils deviennent indistinguables.
   ════════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: light;

  --fond: #f5f3ed;
  --surface: #fffefa;
  --surface-2: #ecebe3;
  --surface-3: #e3e1d7;
  --bordure: #e0ddd2;
  --bordure-2: #c9c5b7;

  --texte: #1e2a37;
  --attenue: #5c6875;
  --faible: #949daa;

  --serie-1: #37639f;
  --serie-2: #2f8f6b;
  --serie-3: #c07f0f;
  --serie-4: #9c55a8;
  --serie-5: #b4483f;

  --ardoise: #37639f;
  --vert: #2f8f6b;
  --ambre: #c07f0f;
  --rouge: #b4483f;
  --vert-texte: #237055;
  --ambre-texte: #8f5f0a;

  --action: #37639f;
  --action-texte: #fffefa;

  --grille: #e2e0d6;
  --ombre: 0 1px 2px rgb(30 42 55 / .06), 0 10px 28px -14px rgb(30 42 55 / .22);

  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --texte-fam: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: #10151d;
    --surface: #171e28;
    --surface-2: #1d2632;
    --surface-3: #26313e;
    --bordure: #253040;
    --bordure-2: #354354;
    --texte: #dde3ea;
    --attenue: #96a1af;
    --faible: #5f6b7a;
    --serie-1: #5288d4;
    --serie-2: #2fa87e;
    --serie-3: #bb8b22;
    --serie-4: #a468bd;
    --serie-5: #cf6055;
    --ardoise: #5288d4;
    --vert: #2fa87e;
    --ambre: #bb8b22;
    --rouge: #cf6055;
    --vert-texte: #4dbf93;
    --ambre-texte: #d9a441;
    --action: #5288d4;
    --action-texte: #0f1620;
    --grille: #232e3b;
    --ombre: 0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -18px rgb(0 0 0 / .7);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --fond: #10151d;
  --surface: #171e28;
  --surface-2: #1d2632;
  --surface-3: #26313e;
  --bordure: #253040;
  --bordure-2: #354354;
  --texte: #dde3ea;
  --attenue: #96a1af;
  --faible: #5f6b7a;
  --serie-1: #5288d4;
  --serie-2: #2fa87e;
  --serie-3: #bb8b22;
  --serie-4: #a468bd;
  --serie-5: #cf6055;
  --ardoise: #5288d4;
  --vert: #2fa87e;
  --ambre: #bb8b22;
  --rouge: #cf6055;
  --vert-texte: #4dbf93;
  --ambre-texte: #d9a441;
  --action: #5288d4;
  --action-texte: #0f1620;
  --grille: #232e3b;
  --ombre: 0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -18px rgb(0 0 0 / .7);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--fond);
  color: var(--texte);
  font: 400 14px/1.5 var(--texte-fam);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 600; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
:focus-visible { outline: 2px solid var(--ardoise); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.cache { display: none !important; }

/* ── Décor ────────────────────────────────────────────────────────────
   Quatre ambiances. Ce sont des taches floutées derrière la page, pas
   des images : rien à télécharger, et elles suivent le thème.
   ─────────────────────────────────────────────────────────────────── */

.decor { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.decor i {
  position: absolute; display: block; border-radius: 50%;
  filter: blur(64px); opacity: .42;
  animation: derive 34s ease-in-out infinite alternate;
}
:root[data-anim="non"] .decor i { animation: none; }
@media (prefers-reduced-motion: reduce) { .decor i { animation: none; } }

@keyframes derive {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(4vw, 3vh, 0) scale(1.12); }
}

:root[data-decor="sobre"] .decor { display: none; }

:root[data-decor="aurore"] .decor i:nth-child(1) { width: 46vw; height: 46vw; top: -14vw; left: -8vw; background: #e8a0b4; }
:root[data-decor="aurore"] .decor i:nth-child(2) { width: 40vw; height: 40vw; top: -6vw; right: -6vw; background: #f0c98a; animation-delay: -8s; }
:root[data-decor="aurore"] .decor i:nth-child(3) { width: 52vw; height: 52vw; bottom: -22vw; left: 24vw; background: #9db9e4; animation-delay: -17s; }

:root[data-decor="jardin"] .decor i:nth-child(1) { width: 44vw; height: 44vw; top: -12vw; left: -10vw; background: #93c9a4; }
:root[data-decor="jardin"] .decor i:nth-child(2) { width: 36vw; height: 36vw; top: 6vw; right: -8vw; background: #d8cd88; animation-delay: -11s; }
:root[data-decor="jardin"] .decor i:nth-child(3) { width: 50vw; height: 50vw; bottom: -24vw; left: 18vw; background: #7fb8a8; animation-delay: -20s; }

:root[data-decor="nuit"] .decor i { opacity: .5; }
:root[data-decor="nuit"] .decor i:nth-child(1) { width: 48vw; height: 48vw; top: -16vw; left: -6vw; background: #2c4a7c; }
:root[data-decor="nuit"] .decor i:nth-child(2) { width: 34vw; height: 34vw; top: 2vw; right: -6vw; background: #5b4a86; animation-delay: -9s; }
:root[data-decor="nuit"] .decor i:nth-child(3) { width: 54vw; height: 54vw; bottom: -26vw; left: 20vw; background: #1f6b74; animation-delay: -19s; }

/* En thème clair, une ambiance nocturne serait illisible : elle s'efface. */
:root:not([data-theme="dark"]) .decor i { opacity: .3; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .decor i { opacity: .5; }
}

/* ── Ossature ─────────────────────────────────────────────────────── */

.barre {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--fond) 86%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--bordure);
}
.barre-int { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.sceau { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2); font-size: 17px; }
.titre-bloc { flex: 1; min-width: 0; }
.titre-bloc h1 { font-size: 17px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titre-bloc p { margin: 1px 0 0; font-size: 12px; color: var(--attenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
footer { max-width: 1240px; margin: 0 auto; padding: 8px 16px 36px; font-size: 12px; color: var(--faible); }

.carte { background: var(--surface); border: 1px solid var(--bordure); border-radius: 16px; box-shadow: var(--ombre); }
.carte > header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bordure); }
.carte > header h2 { font-size: 15px; letter-spacing: -.01em; }
.carte > header p { margin: 2px 0 0; font-size: 12px; color: var(--attenue); }
.carte > .corps { padding: 16px; }

.etiq { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--attenue); }

/* ── Pastille de synchronisation ──────────────────────────────────── */

.sync {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 9px; border: 1px solid var(--bordure); border-radius: 999px;
  background: var(--surface); font-size: 11.5px; font-weight: 500; color: var(--attenue);
  white-space: nowrap;
}
.sync .point { width: 7px; height: 7px; border-radius: 999px; background: var(--faible); flex: none; }
.sync[data-mode="partage"] .point { background: var(--vert); }
.sync[data-mode="envoi"] .point { background: var(--ambre); animation: pulse 1s ease-in-out infinite; }
.sync[data-mode="lecture"] .point { background: var(--ambre); }
@keyframes pulse { 50% { opacity: .3; } }
@media (max-width: 560px) { .sync .txt { display: none; } }

/* ── Indicateurs ──────────────────────────────────────────────────── */

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.tuile { background: var(--surface); border: 1px solid var(--bordure); border-radius: 16px; padding: 14px; box-shadow: var(--ombre); min-width: 0; }
.tuile .entete { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.pastille { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.chiffre { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.grand { font-size: 38px; }
.moyen { font-size: 28px; }
.sur { font-size: 12px; color: var(--faible); }
.chiffre.vide { color: var(--faible); font-size: .7em; }
.jauge { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 10px; }
.jauge > i { display: block; height: 100%; border-radius: 999px; transition: width .5s ease; }
.tuile .pied { margin: 8px 0 0; font-size: 12px; color: var(--attenue); }
.tendance { font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
.kpi-large { grid-column: span 2; }

/* Calendrier : une case par jour, teinte = moyenne du jour. */
/* Cases de taille fixe : laissées élastiques, dix semaines rendaient la
   tuile deux fois plus haute que ses voisines. */
.calendrier { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); grid-auto-columns: 12px; gap: 3px; justify-content: start; }
.calendrier i { display: block; width: 12px; height: 12px; border-radius: 3px; background: var(--surface-3); }
.repartition { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
.repartition span { flex: 1; border-radius: 3px 3px 0 0; background: var(--ardoise); min-height: 2px; }

/* ── Formulaire ───────────────────────────────────────────────────── */

.champ { margin-bottom: 18px; }
.champ:last-child { margin-bottom: 0; }
.champ > label, .champ > .etiq { display: block; margin-bottom: 6px; }

.saisie { width: 100%; padding: 9px 11px; background: var(--surface); color: var(--texte); border: 1px solid var(--bordure); border-radius: 11px; }
.saisie:focus { border-color: var(--ardoise); outline: none; }
textarea.saisie { resize: vertical; min-height: 60px; }

.segments { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--bordure); border-radius: 12px; }
.segments button { flex: 1 1 auto; min-width: 64px; padding: 8px 6px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--attenue); border: 1px solid transparent; text-align: center; }
.segments button:hover { background: var(--surface-3); color: var(--texte); }
.segments button[aria-checked="true"], .segments button[aria-pressed="true"] { background: var(--surface); color: var(--texte); border-color: var(--bordure-2); box-shadow: var(--ombre); }
.segments.compact button { padding: 5px 9px; font-size: 12px; flex: 0 0 auto; min-width: 0; }

.rangee-joie { display: flex; align-items: center; gap: 14px; }
.visage { font-size: 24px; line-height: 1; }
.valeur-joie { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1; width: 46px; }
.bornes { display: flex; justify-content: space-between; font-size: 11px; color: var(--faible); margin-top: 2px; }

input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 26px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: var(--piste, var(--surface-3)); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--piste, var(--surface-3)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 999px; background: var(--surface); border: 3px solid var(--accent, var(--ardoise)); box-shadow: var(--ombre); transition: transform .12s ease; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 999px; background: var(--surface); border: 3px solid var(--accent, var(--ardoise)); box-shadow: var(--ombre); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.12); }

.bascules { display: grid; gap: 8px; }
.bascule { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px; border: 1px solid var(--bordure); border-radius: 12px; background: var(--surface); }
.bascule:hover { background: var(--surface-2); }
.bascule[aria-checked="true"] { background: var(--surface-2); }
.bascule .ic { font-size: 17px; line-height: 1; filter: grayscale(1) opacity(.55); }
.bascule[aria-checked="true"] .ic { filter: none; }
.bascule .txt { flex: 1; min-width: 0; }
.bascule .txt b { display: block; font-weight: 500; font-size: 13.5px; }
.bascule .txt span { display: block; font-size: 12px; color: var(--attenue); }
.interrupteur { position: relative; width: 42px; height: 23px; border-radius: 999px; background: var(--surface-3); flex: none; transition: background .15s ease; }
.interrupteur i { position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 999px; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: left .15s ease; }
.bascule[aria-checked="true"] .interrupteur i { left: 21px; }

.bandeau { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; margin-bottom: 16px; background: var(--surface-2); border: 1px solid var(--bordure); border-radius: 12px; font-size: 12px; color: var(--attenue); }
.bandeau.alerte { border-color: var(--ambre); }

.principal { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 20px; padding: 11px 16px; background: var(--action); color: var(--action-texte); border-radius: 12px; font-weight: 600; font-size: 14px; transition: filter .15s ease; }
.principal:hover { filter: brightness(1.06); }
.principal.confirme { background: var(--vert); color: #fff; }
.principal[disabled] { opacity: .5; cursor: not-allowed; }

.secondaire { padding: 7px 11px; border: 1px solid var(--bordure); border-radius: 10px; font-size: 12px; font-weight: 500; color: var(--attenue); background: var(--surface); }
.secondaire:hover { background: var(--surface-2); color: var(--texte); }
.secondaire[disabled] { opacity: .45; cursor: default; }
.danger-txt { color: var(--rouge); }

/* ── Graphiques ───────────────────────────────────────────────────── */

.legende { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 10px; font-size: 12px; color: var(--attenue); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.zone-graphe { position: relative; }
.zone-graphe svg { display: block; width: 100%; height: auto; overflow: visible; }
.bulle { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--bordure); border-radius: 12px; box-shadow: var(--ombre); padding: 8px 10px; font-size: 12px; min-width: 140px; transform: translate(-50%, -105%); }
.bulle h4 { margin: 0 0 5px; font-size: 12px; font-family: var(--texte-fam); font-weight: 600; }
.bulle .l { display: flex; align-items: center; gap: 7px; }
.bulle .l b { margin-left: auto; font-weight: 600; }
.note-graphe { margin: 12px 0 0; font-size: 12px; color: var(--attenue); }

/* ── Journal ──────────────────────────────────────────────────────── */

.filtres { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-bottom: 14px; border-bottom: 1px solid var(--bordure); margin-bottom: 14px; }
.filtres label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--attenue); }
.filtres select, .filtres input[type="date"] { padding: 6px 8px; font-size: 12px; background: var(--surface); border: 1px solid var(--bordure); border-radius: 9px; }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--bordure); border-radius: 10px; font-size: 12px; font-weight: 500; color: var(--attenue); background: var(--surface); }
.puce:hover { background: var(--surface-2); }
.puce[aria-pressed="true"] { background: var(--surface-2); color: var(--texte); }
.recherche { display: flex; align-items: center; gap: 6px; flex: 1 1 170px; padding: 6px 9px; background: var(--surface); border: 1px solid var(--bordure); border-radius: 10px; }
.recherche input { flex: 1; min-width: 0; border: none; background: none; outline: none; font-size: 12px; }
.lien { font-size: 12px; font-weight: 500; color: var(--ardoise); background: none; }
.lien:hover { text-decoration: underline; }

.table-enveloppe { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th { text-align: left; padding: 6px 12px 8px 0; border-bottom: 1px solid var(--bordure); }
thead th button { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--attenue); display: inline-flex; align-items: center; gap: 4px; }
thead th button:hover { color: var(--texte); }
tbody td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--bordure); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
.barre-joie { display: inline-block; width: 58px; height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; vertical-align: middle; }
.barre-joie > i { display: block; height: 100%; border-radius: 999px; }
.marque { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 1px solid var(--bordure); border-radius: 7px; background: var(--surface-2); font-size: 11px; font-weight: 500; }
.notes-cel { max-width: 18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--attenue); }
.actions { text-align: right; white-space: nowrap; }
.icone-btn { padding: 5px; border-radius: 7px; color: var(--attenue); line-height: 0; }
.icone-btn:hover { background: var(--surface-2); color: var(--texte); }
.icone-btn.danger:hover { color: var(--rouge); }

.cartes-journal { display: none; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.cartes-journal li { border: 1px solid var(--bordure); border-radius: 12px; background: var(--surface-2); padding: 11px; }

.vide { text-align: center; padding: 32px 12px; color: var(--attenue); }
.vide p { margin: 0 0 14px; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--attenue); }

/* ── Fenêtres, réglages, messages ─────────────────────────────────── */

.voile { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; }
.fenetre { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--bordure); border-radius: 18px 18px 0 0; box-shadow: var(--ombre); }
.fenetre > header { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--bordure); z-index: 2; }
.fenetre > header h2 { font-size: 15px; }
.fenetre .corps { padding: 16px; }
.duo { display: flex; gap: 8px; margin-top: 20px; }
.duo > * { flex: 1; margin-top: 0; }
.annuler { padding: 11px 16px; border: 1px solid var(--bordure); border-radius: 12px; font-weight: 500; color: var(--attenue); }

<script id="code">
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   ÉTAT

   Un seul objet porte tout : les réglages et les entrées. Selon l'endroit
   où la page tourne, il vit à trois endroits différents —

     · publié dans l'artefact  → partagé, tout le monde voit la même chose
     · dans localStorage       → propre à cet appareil
     · en lecture seule        → visible, non modifiable

   C'est la couche Sync, plus bas, qui tranche.
   ══════════════════════════════════════════════════════════════════════ */

const TEINTES = [1, 2, 3, 4, 5];
const PROFILS_MAX = 5;   // cinq teintes validées : au-delà, elles se confondent
const NOTES_MAX = 500;
const PAS = 25;
const CLE_LOCALE = "joie:journal:v2";
const CLE_V1 = "joie:entrees:v1";
const CLE_THEME = "joie:theme";
const CLE_BROUILLON = "joie:brouillon";

const PARAMETRES_DEFAUT = {
  titre: "Journal de joie",
  sousTitre: "Momo, Sam & Samy",
  echelle: 10,
  seuilFiable: 3,
  decor: "aurore",
  animations: true,
  profils: [
    { id: "p-momo", nom: "Momo", teinte: 1 },
    { id: "p-sam", nom: "Sam", teinte: 2 },
    { id: "p-samy", nom: "Samy", teinte: 3 },
  ],
  facteurs: [
    { id: "f-biberon", nom: "Biberon", emoji: "🍼", teinte: 1 },
    { id: "f-plante", nom: "Plante verte", emoji: "🌿", teinte: 2 },
  ],
  lieux: [
    { id: "l-maison", nom: "Maison", emoji: "🏠" },
    { id: "l-parc", nom: "Parc", emoji: "🌳" },
    { id: "l-amis", nom: "Chez des amis", emoji: "🫂" },
    { id: "l-vacances", nom: "Vacances", emoji: "⛱️" },
    { id: "l-travail", nom: "Travail", emoji: "💼" },
  ],
  widgets: { moyenne: true, profils: true, facteur: true, lieu: true, serie: true, calendrier: true, repartition: true },
};

let ETAT = { version: 2, parametres: null, entrees: [] };

function identifiant(prefixe) {
  return (prefixe || "e") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function params() { return ETAT.parametres; }
function profils() { return ETAT.parametres.profils; }
function facteurs() { return ETAT.parametres.facteurs; }
function lieux() { return ETAT.parametres.lieux; }
function echelle() { return ETAT.parametres.echelle; }

function profil(id) { return profils().find((p) => p.id === id) || null; }
function facteur(id) { return facteurs().find((f) => f.id === id) || null; }
function lieu(id) { return lieux().find((l) => l.id === id) || null; }
function teinteDe(objet) { return "var(--serie-" + ((objet && objet.teinte) || 1) + ")"; }

/* ── Dates : ISO en mémoire, JJ/MM/AAAA à l'écran ────────────────────── */

function versIso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function aujourdhui() { return versIso(new Date()); }
function estDateIso(v) {
  if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const [a, m, j] = v.split("-").map(Number);
  const d = new Date(a, m - 1, j);
  return d.getFullYear() === a && d.getMonth() === m - 1 && d.getDate() === j;
}
function isoVersFr(iso) {
  if (!estDateIso(iso)) return iso;
  const [a, m, j] = iso.split("-");
  return j + "/" + m + "/" + a;
}
function isoVersJourMois(iso) { const [, m, j] = iso.split("-"); return j + "/" + m; }
function isoVersTexte(iso) {
  const [a, m, j] = iso.split("-").map(Number);
  return new Date(a, m - 1, j).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
}
function decalerIso(iso, jours) {
  const [a, m, j] = iso.split("-").map(Number);
  const d = new Date(a, m - 1, j);
  d.setDate(d.getDate() + jours);
  return versIso(d);
}

/* ── Chargement, migration ──────────────────────────────────────────── */

function normaliser(brut) {
  const etat = { version: 2, maj: (brut && brut.maj) || 0, parametres: null, entrees: [] };
  const p = Object.assign({}, PARAMETRES_DEFAUT, (brut && brut.parametres) || {});
  p.widgets = Object.assign({}, PARAMETRES_DEFAUT.widgets, (brut && brut.parametres && brut.parametres.widgets) || {});
  if (!Array.isArray(p.profils) || !p.profils.length) p.profils = PARAMETRES_DEFAUT.profils.slice();
  if (!Array.isArray(p.facteurs)) p.facteurs = PARAMETRES_DEFAUT.facteurs.slice();
  if (!Array.isArray(p.lieux)) p.lieux = PARAMETRES_DEFAUT.lieux.slice();
  p.echelle = p.echelle === 5 ? 5 : 10;
  etat.parametres = p;

  // Une entrée dont le profil n'existe plus n'a plus de sens : elle est
  // écartée à la lecture, comme elle l'est à la suppression du profil.
  const profilsConnus = new Set(p.profils.map((x) => x.id));
  const facteursConnus = new Set(p.facteurs.map((x) => x.id));
  const lieuxConnus = new Set(p.lieux.map((x) => x.id));

  const entrees = (brut && Array.isArray(brut.entrees)) ? brut.entrees : [];
  etat.entrees = entrees
    .filter((e) => e && estDateIso(e.date) && Number.isInteger(e.joie) && profilsConnus.has(e.profil))
    .map((e) => ({
      id: typeof e.id === "string" ? e.id : identifiant(),
      date: e.date,
      profil: e.profil,
      joie: Math.max(1, Math.min(p.echelle, e.joie)),
      facteurs: (Array.isArray(e.facteurs) ? e.facteurs : []).filter((f) => facteursConnus.has(f)),
      lieu: lieuxConnus.has(e.lieu) ? e.lieu : null,
      notes: typeof e.notes === "string" && e.notes ? e.notes : null,
    }));

  return etat;
}

/** Reprend un journal de la version 1 : personnes fixes, deux booléens. */
function migrerV1(anciennes) {
  const p = JSON.parse(JSON.stringify(PARAMETRES_DEFAUT));
  const parNom = { Momo: "p-momo", Sam: "p-sam", Samy: "p-samy" };
  const entrees = anciennes.filter((e) => e && parNom[e.personne] && estDateIso(e.date)).map((e) => ({
    id: typeof e.id === "string" ? e.id : identifiant(),
    date: e.date,
    profil: parNom[e.personne],
    joie: Math.max(1, Math.min(10, e.joie)),
    facteurs: [e.biberon ? "f-biberon" : null, e.planteVerte ? "f-plante" : null].filter(Boolean),
    lieu: null,
    notes: e.notes || null,
  }));
  return { version: 2, parametres: p, entrees };
}

async function chargerEtat() {
  // Deux voies de publication coexistent — le fichier de données et la page
  // elle-même. Elles peuvent toutes deux porter un journal : c'est
  // l'horodatage qui tranche, jamais l'ordre de lecture, sinon une version
  // ancienne écraserait la récente.
  const candidats = [];

  if (Sync.api) {
    try {
      const reponse = await fetch("data/journal.json", { cache: "no-store" });
      if (reponse.ok) {
        const lu = await reponse.json();
        if (lu && Array.isArray(lu.entrees)) candidats.push({ lu, source: "fichier" });
      }
    } catch (e) { /* fichier absent : première ouverture */ }

    try {
      const lu = JSON.parse(document.getElementById("donnees").textContent);
      if (lu && Array.isArray(lu.entrees) && lu.entrees.length) candidats.push({ lu, source: "page" });
    } catch (e) { /* pas de données publiées dans la page */ }
  }

  if (candidats.length) {
    candidats.sort((a, b) => (b.lu.maj || 0) - (a.lu.maj || 0));
    return { etat: normaliser(candidats[0].lu), source: candidats[0].source };
  }

  try {
    const local = localStorage.getItem(CLE_LOCALE);
    if (local) return { etat: normaliser(JSON.parse(local)), source: "local" };
    const v1 = localStorage.getItem(CLE_V1);
    if (v1) return { etat: normaliser(migrerV1(JSON.parse(v1))), source: "local" };
  } catch (e) { /* stockage illisible */ }

  return { etat: normaliser(null), source: "vide" };
}

/* ══════════════════════════════════════════════════════════════════════
   SYNCHRONISATION

   Quand la page tourne comme artefact publié, chaque changement republie
   le journal : toutes les vues ouvertes basculent sur la nouvelle version.
   Deux chemins, du plus doux au plus rustique —

     · la forme « fichiers » ne réécrit que data/journal.json et laisse
       cette vue-ci vivante ;
     · la forme « page » republie le document entier, régénéré depuis le
       modèle (jamais depuis le DOM rendu), et recharge toutes les vues.

   Ailleurs — hébergement statique, fichier local — on retombe sur le
   stockage du navigateur, et la pastille le dit franchement.
   ══════════════════════════════════════════════════════════════════════ */

const Sync = {
  api: null,
  mode: "local",        // local · partage · lecture
  forme: "fichiers",    // fichiers · page
  enAttente: false,
  minuterie: null,

  async init() {
    if (!(window.claude && typeof window.claude.use === "function")) return;
    try {
      this.api = await window.claude.use("artifact");
    } catch (e) {
      this.api = null;
    }
    if (this.api) {
      this.mode = "partage";
      majPastille();
    }
  },

  /** Regroupe les rafales de modifications en une seule publication. */
  planifier() {
    if (this.mode === "lecture") return;
    if (this.mode !== "partage") { sauverLocal(); return; }

    this.enAttente = true;
    majPastille("envoi");
    clearTimeout(this.minuterie);
    this.minuterie = setTimeout(() => this.publier(), 900);
  },

  async publier() {
    if (!this.api) return;
    const charge = JSON.stringify(ETAT);

    try {
      if (this.forme === "fichiers") {
        await this.api.publish({ "data/journal.json": charge });
      } else {
        await this.api.publish(documentComplet());
      }
      this.enAttente = false;
      majPastille();
      return;
    } catch (erreur) {
      const code = (erreur && erreur.code) || "upstream_error";

      if (code === "capability_disabled" && this.forme === "fichiers") {
        // Cette vue ne peut pas écrire fichier par fichier : on republie
        // la page entière. Elle rechargera ensuite — d'où le brouillon mis
        // de côté juste avant.
        this.forme = "page";
        stockerBrouillon();
        return this.publier();
      }

      if (code === "conflict") {
        // Quelqu'un a publié avant nous : les vues rechargent déjà sur la
        // version gagnante. Rien à retenter.
        signaler("Le journal a changé de son côté — la page se recharge.");
        return;
      }

      if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared") {
        this.mode = "lecture";
        majPastille();
        signaler("Vous consultez ce journal en lecture seule.", "erreur");
        rendre();
        return;
      }

      if (code === "rate_limited") {
        // Trop de publications : on ralentit au lieu d'insister.
        clearTimeout(this.minuterie);
        this.minuterie = setTimeout(() => this.publier(), 5000);
        return;
      }

      this.enAttente = false;
      majPastille();
      signaler("Synchronisation impossible pour l'instant.", "erreur");
    }
  },
};

function peutEcrire() { return Sync.mode !== "lecture"; }

function sauverLocal() {
  try {
    localStorage.setItem(CLE_LOCALE, JSON.stringify(ETAT));
  } catch (e) {
    signaler("Ce navigateur refuse d'enregistrer — la saisie sera perdue au rechargement.", "erreur");
  }
}

function enregistrerEtat() {
  ETAT.maj = Date.now();
  if (Sync.mode === "partage") Sync.planifier();
  else if (Sync.mode === "local") sauverLocal();
}

/**
 * Régénère le document complet à publier. Les trois morceaux sont lus là
 * où rien ne les altère : les balises de tête marquées, le modèle et le
 * texte du script. Le DOM rendu n'entre jamais dans la copie.
 */
function documentComplet() {
  const tetes = [...document.querySelectorAll('[data-joie]:not([charset]):not([name="viewport"])')]
    .map((el) => el.outerHTML).join("\n");
  const modele = document.getElementById("modele").innerHTML;
  const code = document.getElementById("code").textContent;
  const donnees = JSON.stringify(ETAT).replace(/</g, "\\u003c");

  const ouvre = "<" + "script";
  const ferme = "<" + "/script>";

  return [
    "<!doctype html>",
    '<html lang="fr">',
    "<head>",
    '<meta charset="utf-8">',

/** Met de côté la saisie en cours : une republication recharge la vue. */
function stockerBrouillon() {
  try { sessionStorage.setItem(CLE_BROUILLON, JSON.stringify(saisie)); } catch (e) {}
}
function reprendreBrouillon() {
  try {
    const brut = sessionStorage.getItem(CLE_BROUILLON);

}

/* ══════════════════════════════════════════════════════════════════════
   ANALYSE — fonctions pures
   ══════════════════════════════════════════════════════════════════════ */

function moyenne(v) { return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; }
function arrondir(v, d) { return v === null || !isFinite(v) ? null : Math.round(v * 10 ** d) / 10 ** d; }
function fmt(v, d) {
  d = d === undefined ? 1 : d;
  const a = arrondir(v, d);
  return a === null ? "—" : a.toFixed(d).replace(".", ",");
}

function statsProfils() {
  return profils().map((p) => {
    const siennes = ETAT.entrees.filter((e) => e.profil === p.id).sort((a, b) => a.date.localeCompare(b.date));
    const recentes = moyenne(siennes.slice(-7).map((e) => e.joie));
    const avant = moyenne(siennes.slice(-14, -7).map((e) => e.joie));
    return {
      profil: p,
      moyenne: moyenne(siennes.map((e) => e.joie)),
      nombre: siennes.length,
      tendance: recentes !== null && avant !== null ? recentes - avant : null,
    };
  });
}

function impact(facteurId, lot) {
  const source = lot || ETAT.entrees;
  const avec = source.filter((e) => e.facteurs.includes(facteurId)).map((e) => e.joie);
  const sans = source.filter((e) => !e.facteurs.includes(facteurId)).map((e) => e.joie);
  const ma = moyenne(avec), ms = moyenne(sans);
  const f = facteur(facteurId);
  return {
    facteur: f,
    moyenneAvec: ma, moyenneSans: ms,
    nAvec: avec.length, nSans: sans.length,
    delta: ma !== null && ms !== null ? ma - ms : null,
    fiable: avec.length >= params().seuilFiable && sans.length >= params().seuilFiable,
  };
}

function facteurLePlusInfluent() {
  const candidats = facteurs().map((f) => impact(f.id)).filter((i) => i.delta !== null && i.delta > 0);
  if (!candidats.length) return null;
  return candidats.reduce((meilleur, c) => (c.delta > meilleur.delta ? c : meilleur));
}

/** Le lieu de la plus haute moyenne, à condition d'y avoir assez mesuré. */
function lieuLePlusJoyeux() {
  const classement = lieux().map((l) => {
    const scores = ETAT.entrees.filter((e) => e.lieu === l.id).map((e) => e.joie);
    return { lieu: l, moyenne: moyenne(scores), nombre: scores.length };
  }).filter((x) => x.nombre >= 2);
  if (!classement.length) return null;
  return classement.reduce((meilleur, c) => (c.moyenne > meilleur.moyenne ? c : meilleur));
}

/** Jours consécutifs renseignés, en remontant depuis aujourd'hui ou hier. */
function serieEnCours() {
  const jours = new Set(ETAT.entrees.map((e) => e.date));
  if (!jours.size) return 0;
  let curseur = aujourdhui();
  if (!jours.has(curseur)) {
    curseur = decalerIso(curseur, -1);
    if (!jours.has(curseur)) return 0;
  }
  let compte = 0;
  while (jours.has(curseur)) { compte += 1; curseur = decalerIso(curseur, -1); }
  return compte;
}

function moyennesParJour() {
  const carte = new Map();
  for (const e of ETAT.entrees) {
    if (!carte.has(e.date)) carte.set(e.date, []);
    carte.get(e.date).push(e.joie);
  }
  const sortie = new Map();
  carte.forEach((scores, date) => sortie.set(date, moyenne(scores)));
  return sortie;
}

function repartition() {
  const paliers = new Array(echelle()).fill(0);
  for (const e of ETAT.entrees) paliers[Math.min(echelle(), Math.max(1, e.joie)) - 1] += 1;
  return paliers;
}

function serieTemporelle() {
  const parDate = new Map();
  for (const e of ETAT.entrees) {
    let p = parDate.get(e.date);
    if (!p) { p = { date: e.date, valeurs: {}, meta: {} }; parDate.set(e.date, p); }
    p.valeurs[e.profil] = e.joie;
    p.meta[e.profil] = { facteurs: e.facteurs, lieu: e.lieu };
  }
  return [...parDate.values()].sort((a, b) => a.date.localeCompare(b.date));
}

function comparaison(facteurId) {
  const bloc = (nom, lot) => {
    const i = impact(facteurId, lot);
    return { perimetre: nom, avec: i.moyenneAvec, sans: i.moyenneSans, nAvec: i.nAvec, nSans: i.nSans };
  };
  return [bloc("Collectif", ETAT.entrees)].concat(
    profils().map((p) => bloc(p.nom, ETAT.entrees.filter((e) => e.profil === p.id)))
  );
}

/* ── Indicateurs ────────────────────────────────────────────────────── */

const VISAGES = ["😞", "😔", "😕", "😐", "🙂", "😊", "😄", "😁", "🤩", "🥳"];

function couleurJoie(j) {
  const part = (j - 1) / Math.max(1, echelle() - 1);
  return part <= 0.3 ? "var(--rouge)" : part <= 0.65 ? "var(--ambre)" : "var(--vert)";
}
function visageJoie(j) {
  const index = Math.round(((j - 1) / Math.max(1, echelle() - 1)) * (VISAGES.length - 1));
  return VISAGES[Math.max(0, Math.min(VISAGES.length - 1, index))];
}
function humeur(j) {
  const part = (j - 1) / Math.max(1, echelle() - 1);
  return part <= 0.15 ? "Journée difficile" : part <= 0.4 ? "En demi-teinte"
    : part <= 0.6 ? "Correcte" : part <= 0.85 ? "Bonne journée" : "Excellente journée";
}

function jaugeHtml(v, couleur) {
  const part = v === null ? 0 : Math.max(0, Math.min(1, v / echelle())) * 100;
  return '<div class="jauge"><i style="width:' + part + "%;background:" + couleur + '"></i></div>';
}

function tendanceHtml(v) {
  if (v === null || Math.abs(v) < 0.05) return '<span class="tendance" style="color:var(--faible)">— stable</span>';
  const haut = v > 0;
  return '<span class="tendance" style="color:' + (haut ? "var(--vert-texte)" : "var(--rouge)") + '"'
    + ' title="Moyenne des 7 dernières mesures comparée aux 7 précédentes">'
    + (haut ? "↗ +" : "↘ −") + fmt(Math.abs(v)) + " pts</span>";
}

      + '<div class="repartition">' + barres + "</div>"

/* ── Formulaire de saisie ───────────────────────────────────────────── */

function entreeDe(date, profilId) {
  return ETAT.entrees.find((e) => e.date === date && e.profil === profilId) || null;
}

function rendreFormulaire() {
  if (!saisie.profil || !profil(saisie.profil)) saisie.profil = profils()[0].id;
  saisie.joie = Math.max(1, Math.min(echelle(), saisie.joie));

  $("f-date").value = saisie.date;
  $("f-date").max = aujourdhui();
  $("f-date-fr").textContent = estDateIso(saisie.date) ? isoVersFr(saisie.date) : "—";

  $("f-profil").innerHTML = profils().map((p) =>
    '<button type="button" role="radio" data-profil="' + p.id + '" aria-checked="' + (p.id === saisie.profil) + '"'
    + (p.id === saisie.profil ? ' style="border-color:' + teinteDe(p) + '"' : "") + ">" + echapper(p.nom) + "</button>"
  ).join("");

  const accent = couleurJoie(saisie.joie);
  const part = ((saisie.joie - 1) / Math.max(1, echelle() - 1)) * 100;
  const curseur = $("f-joie");
  curseur.max = echelle();
  curseur.value = saisie.joie;
  curseur.style.setProperty("--accent", accent);
  curseur.style.setProperty("--piste", "linear-gradient(90deg," + accent + " 0%," + accent + " " + part + "%,var(--surface-3) " + part + "%)");
  curseur.setAttribute("aria-valuetext", saisie.joie + " sur " + echelle() + " — " + humeur(saisie.joie));
  $("f-borne-max").textContent = echelle();
  $("f-valeur").textContent = saisie.joie;
  $("f-valeur").style.color = accent;
  $("f-visage").textContent = visageJoie(saisie.joie);
  $("f-humeur").textContent = humeur(saisie.joie);

  $("f-lieu").innerHTML = '<button type="button" role="radio" data-lieu="" aria-checked="' + (saisie.lieu === null) + '">Aucun</button>'
    + lieux().map((l) =>
      '<button type="button" role="radio" data-lieu="' + l.id + '" aria-checked="' + (l.id === saisie.lieu) + '">'
      + l.emoji + " " + echapper(l.nom) + "</button>"
    ).join("");

  $("f-facteurs").innerHTML = facteurs().length === 0
    ? '<p style="margin:0;font-size:12px;color:var(--attenue)">Aucun facteur suivi — ajoutez-en dans les réglages.</p>'
    : facteurs().map((f) => {
        const actif = saisie.facteurs.includes(f.id);
        return '<button type="button" class="bascule" role="switch" data-facteur="' + f.id + '" aria-checked="' + actif + '"'
          + (actif ? ' style="border-color:' + teinteDe(f) + '"' : "") + ">"
          + '<span class="ic" aria-hidden="true">' + f.emoji + "</span>"
          + '<span class="txt"><b>' + echapper(f.nom) + "</b><span>Présent ce jour</span></span>"
          + '<span class="interrupteur" aria-hidden="true"' + (actif ? ' style="background:' + teinteDe(f) + '"' : "") + "><i></i></span>"
          + "</button>";
      }).join("");

  if ($("f-notes").value !== saisie.notes) $("f-notes").value = saisie.notes;
  $("f-compte").textContent = saisie.notes.length + "/" + NOTES_MAX;

  const dejaLa = entreeDe(saisie.date, saisie.profil);
  const bandeau = $("bandeau");
  const nomProfil = profil(saisie.profil).nom;

  if (!peutEcrire()) {
    bandeau.classList.remove("cache");
    bandeau.classList.add("alerte");
    bandeau.innerHTML = '<span aria-hidden="true">👁</span><span>Ce journal vous est partagé en lecture seule : vous voyez tout, vous ne pouvez rien enregistrer.</span>';
  } else if (dejaLa) {
    bandeau.classList.remove("cache", "alerte");
    bandeau.innerHTML = '<span aria-hidden="true">✎</span><span>' + echapper(nomProfil) + " a déjà une entrée le "
      + isoVersFr(saisie.date) + " — les champs sont pré-remplis, la validation la mettra à jour.</span>";
  } else {
    bandeau.classList.add("cache");
  }

  const valider = $("f-valider");
  valider.disabled = !peutEcrire();
  if (!valider.classList.contains("confirme")) {
    valider.textContent = dejaLa ? "Mettre à jour l'entrée" : "Enregistrer la journée";
  }
}

let derniereCible = "";
function synchroniserCible() {
  if (!saisie.profil || !profil(saisie.profil)) saisie.profil = profils()[0].id;
  const cible = saisie.date + "|" + saisie.profil;
  if (cible === derniereCible) return;
  derniereCible = cible;
  const dejaLa = entreeDe(saisie.date, saisie.profil);
  if (dejaLa) {
    saisie.joie = dejaLa.joie;
    saisie.facteurs = dejaLa.facteurs.slice();
    saisie.lieu = dejaLa.lieu;
    saisie.notes = dejaLa.notes || "";
  } else {
    saisie.joie = Math.round(echelle() * 0.7);
    saisie.facteurs = [];
    saisie.lieu = null;
    saisie.notes = "";
  }
}

function enregistrerSaisie() {
  if (!peutEcrire()) return;
  if (!estDateIso(saisie.date)) { signaler("Choisissez une date valide.", "erreur"); return; }

  const existante = entreeDe(saisie.date, saisie.profil);
  const valeurs = {
    date: saisie.date,
    profil: saisie.profil,
    joie: saisie.joie,
    facteurs: saisie.facteurs.slice(),
    lieu: saisie.lieu,
    notes: saisie.notes.trim() || null,
  };

  if (existante) Object.assign(existante, valeurs);
  else ETAT.entrees.push(Object.assign({ id: identifiant() }, valeurs));

  enregistrerEtat();
  signaler(existante
    ? "Entrée du " + isoVersFr(saisie.date) + " mise à jour pour " + profil(saisie.profil).nom + "."
    : "Joie de " + profil(saisie.profil).nom + " enregistrée pour le " + isoVersFr(saisie.date) + ".");

  const valider = $("f-valider");
  valider.classList.add("confirme");
  valider.textContent = "Enregistré";
  setTimeout(() => { valider.classList.remove("confirme"); rendreFormulaire(); }, 1500);

  rendre();
}

/* ── Graphiques : SVG écrit à la main ───────────────────────────────── */

const SVG_NS = "http://www.w3.org/2000/svg";
const FORMES = ["cercle", "carre", "triangle", "losange", "croix"];

function noeud(nom, attrs) {
  const el = document.createElementNS(SVG_NS, nom);
  for (const cle in attrs) el.setAttribute(cle, attrs[cle]);
  return el;
}

/** La forme du marqueur double la couleur : l'identité ne tient pas à la teinte seule. */
function marqueur(x, y, index, couleur, t) {
  const taille = t || 4;
  const commun = { fill: couleur, stroke: "var(--surface)", "stroke-width": 2 };
  switch (FORMES[index % FORMES.length]) {
    case "carre":
      return noeud("rect", Object.assign({ x: x - taille, y: y - taille, width: taille * 2, height: taille * 2, rx: 1 }, commun));
    case "triangle":
      return noeud("polygon", Object.assign({ points: x + "," + (y - taille - 1) + " " + (x + taille + 1) + "," + (y + taille) + " " + (x - taille - 1) + "," + (y + taille) }, commun));
    case "losange":
      return noeud("polygon", Object.assign({ points: x + "," + (y - taille - 1) + " " + (x + taille + 1) + "," + y + " " + x + "," + (y + taille + 1) + " " + (x - taille - 1) + "," + y }, commun));
    case "croix":
      return noeud("path", Object.assign({ d: "M" + (x - taille) + " " + (y - taille) + "L" + (x + taille) + " " + (y + taille) + "M" + (x + taille) + " " + (y - taille) + "L" + (x - taille) + " " + (y + taille), stroke: couleur, "stroke-width": 3, "stroke-linecap": "round", fill: "none" }, {}));
    default:
      return noeud("circle", Object.assign({ cx: x, cy: y, r: taille }, commun));
  }
}

function marqueurHtml(index, couleur) {
  const forme = FORMES[index % FORMES.length];
  if (forme === "carre") return '<svg width="11" height="11" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="1" fill="' + couleur + '"></rect></svg>';
  if (forme === "triangle") return '<svg width="12" height="11" aria-hidden="true"><polygon points="6,1 11,10 1,10" fill="' + couleur + '"></polygon></svg>';
  if (forme === "losange") return '<svg width="12" height="12" aria-hidden="true"><polygon points="6,1 11,6 6,11 1,6" fill="' + couleur + '"></polygon></svg>';
  if (forme === "croix") return '<svg width="12" height="12" aria-hidden="true"><path d="M2 2L10 10M10 2L2 10" stroke="' + couleur + '" stroke-width="3" stroke-linecap="round"></path></svg>';
  return '<svg width="11" height="11" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.5" fill="' + couleur + '"></circle></svg>';
}

function graduations() {
  const max = echelle();
  if (max === 5) return [0, 1, 2, 3, 4, 5];
  return [0, 2, 4, 6, 8, 10];
}

function pointsFenetre() {
  const serie = serieTemporelle();
  if (vue.fenetre === "tout") return serie;
  const depuis = decalerIso(aujourdhui(), -Number(vue.fenetre));
  const coupee = serie.filter((p) => p.date >= depuis);
  return coupee.length ? coupee : serie;
}

function rendreCourbe() {
  const svg = $("courbe");
  svg.textContent = "";
  $("bulle-courbe").classList.add("cache");

  const points = pointsFenetre();
  const largeur = Math.max(320, $("zone-courbe").clientWidth || 640);
  const hauteur = largeur < 520 ? 250 : 310;
  const m = { haut: 10, droite: 10, bas: 26, gauche: 28 };
  svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
  svg.setAttribute("height", hauteur);

  $("sous-courbe").textContent = "Une courbe par personne, échelle 0 à " + echelle();
  $("legende-courbe").innerHTML = profils().map((p, i) =>
    "<span>" + marqueurHtml(i, teinteDe(p)) + echapper(p.nom) + "</span>").join("");

  if (!points.length) {
    const t = noeud("text", { x: largeur / 2, y: hauteur / 2, "text-anchor": "middle", fill: "var(--attenue)", "font-size": 13 });
    t.textContent = "Aucune mesure pour l'instant.";
    svg.append(t);
    return;
  }

  const x = (i) => points.length === 1
    ? m.gauche + (largeur - m.gauche - m.droite) / 2
    : m.gauche + (i * (largeur - m.gauche - m.droite)) / (points.length - 1);
  const y = (v) => m.haut + (1 - v / echelle()) * (hauteur - m.haut - m.bas);

  for (const v of graduations()) {
    svg.append(noeud("line", { x1: m.gauche, x2: largeur - m.droite, y1: y(v), y2: y(v), stroke: "var(--grille)", "stroke-width": 1 }));
    const t = noeud("text", { x: m.gauche - 7, y: y(v) + 4, "text-anchor": "end", fill: "var(--faible)", "font-size": 11 });
    t.textContent = v;
    svg.append(t);
  }

  const pas = Math.max(1, Math.ceil(points.length / (largeur < 520 ? 4 : 8)));
  points.forEach((p, i) => {
    if (i % pas !== 0 && i !== points.length - 1) return;
    const t = noeud("text", { x: x(i), y: hauteur - 7, "text-anchor": "middle", fill: "var(--faible)", "font-size": 11 });
    t.textContent = isoVersJourMois(p.date);
    svg.append(t);
  });

  profils().forEach((p, index) => {
    const couleur = teinteDe(p);
    const coords = [];
    points.forEach((point, i) => {
      const v = point.valeurs[p.id];
      if (v === undefined) return;
      coords.push([x(i), y(v)]);
    });
    if (coords.length > 1) {
      svg.append(noeud("polyline", {
        points: coords.map((c) => c[0] + "," + c[1]).join(" "),
        fill: "none", stroke: couleur, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
      }));
    }
    for (const c of coords) svg.append(marqueur(c[0], c[1], index, couleur));
  });

  const survol = noeud("line", { y1: m.haut, y2: hauteur - m.bas, stroke: "var(--bordure-2)", "stroke-width": 1, opacity: 0 });
  svg.append(survol);
  const capteur = noeud("rect", { x: 0, y: 0, width: largeur, height: hauteur, fill: "transparent" });
  svg.append(capteur);

  const bulle = $("bulle-courbe");
  capteur.addEventListener("mousemove", (evenement) => {
    const boite = svg.getBoundingClientRect();
    const px = ((evenement.clientX - boite.left) / boite.width) * largeur;
    let proche = 0, ecart = Infinity;
    points.forEach((p, i) => { const d = Math.abs(x(i) - px); if (d < ecart) { ecart = d; proche = i; } });

    const point = points[proche];
    survol.setAttribute("x1", x(proche));
    survol.setAttribute("x2", x(proche));
    survol.setAttribute("opacity", 1);

    let contenu = "<h4>" + isoVersTexte(point.date) + "</h4>";
    profils().forEach((p) => {
      const v = point.valeurs[p.id];
      if (v === undefined) return;
      const meta = point.meta[p.id] || { facteurs: [] };
      const emojis = meta.facteurs.map((id) => (facteur(id) ? facteur(id).emoji : "")).join("");
      const place = meta.lieu && lieu(meta.lieu) ? lieu(meta.lieu).emoji : "";
      contenu += '<div class="l num"><span class="pastille" style="background:' + teinteDe(p) + '"></span>'
        + '<span style="color:var(--attenue)">' + echapper(p.nom) + "</span><b>" + v + "</b>"
        + '<span aria-hidden="true">' + place + emojis + "</span></div>";
    });
    bulle.innerHTML = contenu;
    bulle.classList.remove("cache");
    const gauche = (x(proche) / largeur) * boite.width;
    bulle.style.left = Math.min(Math.max(gauche, 80), boite.width - 80) + "px";
    bulle.style.top = Math.max(60, evenement.clientY - boite.top - 8) + "px";
  });
  capteur.addEventListener("mouseleave", () => { bulle.classList.add("cache"); survol.setAttribute("opacity", 0); });
}

function rendreBarres() {
  const svg = $("barres");
  svg.textContent = "";
  $("bulle-barres").classList.add("cache");

  if (!facteurs().length) {
    $("legende-barres").innerHTML = "";
    $("note-barres").textContent = "Aucun facteur suivi pour l'instant — ajoutez-en dans les réglages.";
    svg.setAttribute("viewBox", "0 0 320 80");
    svg.setAttribute("height", 80);
    return;
  }

  if (!vue.facteurCompare || !facteur(vue.facteurCompare)) vue.facteurCompare = facteurs()[0].id;
  const f = facteur(vue.facteurCompare);
  const donnees = comparaison(f.id);
  const largeur = Math.max(320, $("zone-barres").clientWidth || 640);
  const hauteur = largeur < 520 ? 230 : 280;
  const m = { haut: 18, droite: 10, bas: 26, gauche: 28 };
  svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
  svg.setAttribute("height", hauteur);

  const couleurAvec = teinteDe(f);
  $("legende-barres").innerHTML =
    '<span><i style="width:11px;height:11px;border-radius:2px;background:' + couleurAvec + '"></i>Avec ' + echapper(f.nom.toLowerCase()) + "</span>"
    + '<span><i style="width:11px;height:11px;border-radius:2px;background:var(--surface-3);border:1px solid var(--bordure-2)"></i>Sans</span>';
  $("note-barres").textContent = "Un écart n'est pas une cause : il dit que les journées « " + f.nom.toLowerCase()
    + " » ont été plus joyeuses, pas qu'elles l'ont été grâce à ce facteur.";

  if (donnees.every((d) => d.avec === null && d.sans === null)) {
    const t = noeud("text", { x: largeur / 2, y: hauteur / 2, "text-anchor": "middle", fill: "var(--attenue)", "font-size": 13 });
    t.textContent = "Rien à comparer tant qu'aucune journée n'est enregistrée.";
    svg.append(t);
    return;
  }

  const y = (v) => m.haut + (1 - v / echelle()) * (hauteur - m.haut - m.bas);
  const base = y(0);

  for (const v of graduations()) {
    svg.append(noeud("line", { x1: m.gauche, x2: largeur - m.droite, y1: y(v), y2: y(v), stroke: "var(--grille)", "stroke-width": 1 }));
    const t = noeud("text", { x: m.gauche - 7, y: y(v) + 4, "text-anchor": "end", fill: "var(--faible)", "font-size": 11 });
    t.textContent = v;
    svg.append(t);
  }

  const bande = (largeur - m.gauche - m.droite) / donnees.length;
  const largeurBarre = Math.max(10, Math.min(46, (bande - 22) / 2));
  const bulle = $("bulle-barres");

  donnees.forEach((d, i) => {
    const centre = m.gauche + bande * i + bande / 2;

    const dessiner = (valeur, decalage, remplissage, contour) => {
      if (valeur === null) return;
      const sommet = y(valeur);
      const r = Math.min(4, base - sommet);
      const xg = centre + decalage;
      const chemin = "M" + xg + " " + base + " V" + (sommet + r) + " Q" + xg + " " + sommet + " " + (xg + r) + " " + sommet
        + " H" + (xg + largeurBarre - r) + " Q" + (xg + largeurBarre) + " " + sommet + " " + (xg + largeurBarre) + " " + (sommet + r)
        + " V" + base + " Z";
      const attrs = { d: chemin, fill: remplissage };
      if (contour) { attrs.stroke = contour; attrs["stroke-width"] = 1; }
      svg.append(noeud("path", attrs));
      const t = noeud("text", { x: xg + largeurBarre / 2, y: sommet - 6, "text-anchor": "middle", fill: "var(--attenue)", "font-size": 11 });
      t.textContent = fmt(valeur);
      svg.append(t);
    };

    dessiner(d.avec, -largeurBarre - 1, couleurAvec, null);
    dessiner(d.sans, 1, "var(--surface-3)", "var(--bordure-2)");

    const nom = noeud("text", { x: centre, y: hauteur - 7, "text-anchor": "middle", fill: "var(--attenue)", "font-size": 11 });
    nom.textContent = d.perimetre;
    svg.append(nom);

    const capteur = noeud("rect", { x: m.gauche + bande * i, y: m.haut, width: bande, height: hauteur - m.haut - m.bas, fill: "transparent" });
    capteur.addEventListener("mouseenter", () => {
      const ecart = d.avec !== null && d.sans !== null ? d.avec - d.sans : null;
      bulle.innerHTML = "<h4>" + echapper(d.perimetre) + "</h4>"
        + '<p class="num" style="margin:0;color:var(--attenue)">Avec : <b style="color:var(--texte)">' + fmt(d.avec, 2) + "</b> (" + d.nAvec + ")</p>"
        + '<p class="num" style="margin:2px 0 0;color:var(--attenue)">Sans : <b style="color:var(--texte)">' + fmt(d.sans, 2) + "</b> (" + d.nSans + ")</p>"
        + (ecart === null ? "" : '<p class="num" style="margin:5px 0 0;font-weight:600;color:'
          + (ecart >= 0 ? "var(--vert-texte)" : "var(--rouge)") + '">' + (ecart >= 0 ? "+" : "−") + fmt(Math.abs(ecart), 2) + " pt</p>");
      bulle.classList.remove("cache");
      const boite = svg.getBoundingClientRect();
      bulle.style.left = (centre / largeur) * boite.width + "px";
      bulle.style.top = boite.height * 0.42 + "px";
    });
    capteur.addEventListener("mouseleave", () => bulle.classList.add("cache"));
    svg.append(capteur);
  });
}

/* ── Journal ────────────────────────────────────────────────────────── */

function lignesFiltrees() {
  const terme = vue.recherche.trim().toLowerCase();
  const gardees = ETAT.entrees.filter((e) => {
    if (vue.profilsFiltres.length && !vue.profilsFiltres.includes(e.profil)) return false;
    if (vue.du && e.date < vue.du) return false;
    if (vue.au && e.date > vue.au) return false;
    if (vue.lieuFiltre && e.lieu !== vue.lieuFiltre) return false;
    if (vue.facteurFiltre && vue.etatFacteur !== "tous") {
      const present = e.facteurs.includes(vue.facteurFiltre);
      if (present !== (vue.etatFacteur === "avec")) return false;
    }
    if (terme && !(e.notes || "").toLowerCase().includes(terme)) return false;
    return true;
  });

  const signe = vue.sens === "asc" ? 1 : -1;
  const nom = (id) => (profil(id) ? profil(id).nom : "");
  return gardees.sort((a, b) => {
    if (vue.colonne === "joie") return signe * (a.joie - b.joie || a.date.localeCompare(b.date));
    if (vue.colonne === "profil") return signe * (nom(a.profil).localeCompare(nom(b.profil)) || a.date.localeCompare(b.date));
    return signe * (a.date.localeCompare(b.date) || nom(a.profil).localeCompare(nom(b.profil)));
  });
}

function filtreActif() {
  return vue.profilsFiltres.length || vue.du || vue.au || vue.lieuFiltre
    || (vue.facteurFiltre && vue.etatFacteur !== "tous") || vue.recherche;
}

function rendreFiltres() {
  const optionsFacteur = facteurs().map((f) =>
    '<option value="' + f.id + '"' + (vue.facteurFiltre === f.id ? " selected" : "") + ">" + echapper(f.nom) + "</option>").join("");
  const optionsLieu = lieux().map((l) =>
    '<option value="' + l.id + '"' + (vue.lieuFiltre === l.id ? " selected" : "") + ">" + l.emoji + " " + echapper(l.nom) + "</option>").join("");

  $("filtres").innerHTML =
    profils().map((p) => {
      const actif = vue.profilsFiltres.includes(p.id);
      return '<button class="puce" data-profil-filtre="' + p.id + '" aria-pressed="' + actif + '"'
        + (actif ? ' style="border-color:' + teinteDe(p) + '"' : "")
        + '><span class="pastille" style="background:' + teinteDe(p) + '"></span>' + echapper(p.nom) + "</button>";
    }).join("")
    + '<label>Du <input type="date" class="num" data-borne="du" value="' + vue.du + '"></label>'
    + '<label>au <input type="date" class="num" data-borne="au" value="' + vue.au + '"></label>'
    + (facteurs().length
      ? '<label>Facteur <select data-filtre="facteurFiltre"><option value="">Tous</option>' + optionsFacteur + "</select></label>"
        + '<label><select data-filtre="etatFacteur">'
        + ["tous", "avec", "sans"].map((v) => '<option value="' + v + '"' + (vue.etatFacteur === v ? " selected" : "") + ">"
          + (v === "tous" ? "peu importe" : v === "avec" ? "avec" : "sans") + "</option>").join("")
        + "</select></label>"
      : "")
    + (lieux().length ? '<label>Lieu <select data-filtre="lieuFiltre"><option value="">Tous</option>' + optionsLieu + "</select></label>" : "")
    + '<span class="recherche"><span aria-hidden="true" style="color:var(--faible)">⌕</span>'
    + '<input type="search" id="f-recherche" placeholder="Rechercher dans les notes" value="' + echapper(vue.recherche) + '"></span>'
    + '<button class="lien' + (filtreActif() ? "" : " cache") + '" id="reinit">Réinitialiser</button>';
}

function majReinit() {
  const bouton = $("reinit");
  if (bouton) bouton.classList.toggle("cache", !filtreActif());
}

function marquesHtml(e) {
  let html = e.facteurs.map((id) => {
    const f = facteur(id);
    if (!f) return "";
    return '<span class="marque" style="color:' + teinteDe(f) + ";border-color:" + teinteDe(f) + '">' + f.emoji + " " + echapper(f.nom) + "</span>";
  }).join(" ");
  return html || '<span style="color:var(--faible)">—</span>';
}

function lieuHtml(e) {
  const l = e.lieu ? lieu(e.lieu) : null;
  return l ? '<span class="marque">' + l.emoji + " " + echapper(l.nom) + "</span>" : '<span style="color:var(--faible)">—</span>';
}

function rendreJournal() {
  const lignes = lignesFiltrees();
  const visibles = lignes.slice(0, vue.limite);
  const restantes = lignes.length - visibles.length;

  $("journal-compte").textContent = lignes.length + " entrée" + (lignes.length > 1 ? "s" : "") + (filtreActif() ? " après filtrage" : "");
  $("export-csv").disabled = lignes.length === 0;
  $("export-json").disabled = lignes.length === 0;

  const zone = $("journal");

  if (!ETAT.entrees.length) {
    zone.innerHTML = '<div class="vide"><p>Le journal est vide. Saisissez une première journée à gauche —'
      + " ou remplissez-le d'un jeu de démonstration pour voir ce que le tableau de bord raconte.</p>"
      + (peutEcrire() ? '<button class="secondaire" id="demo">Charger six semaines de démonstration</button>' : "") + "</div>";
    return;
  }
  if (!lignes.length) {
    zone.innerHTML = '<p class="vide">Aucune entrée ne correspond à ces filtres.</p>';
    return;
  }

  const fleche = vue.sens === "asc" ? "↑" : "↓";
  const entete = (cle, libelle) =>
    '<th scope="col" aria-sort="' + (vue.colonne === cle ? (vue.sens === "asc" ? "ascending" : "descending") : "none") + '">'
    + '<button data-tri="' + cle + '">' + libelle + (vue.colonne === cle ? " " + fleche : "") + "</button></th>";

  let html = '<div class="table-enveloppe"><table><thead><tr>'
    + entete("date", "Date") + entete("profil", "Profil") + entete("joie", "Joie")
    + '<th scope="col"><span class="etiq">Lieu</span></th>'
    + '<th scope="col"><span class="etiq">Facteurs</span></th>'
    + '<th scope="col"><span class="etiq">Notes</span></th>'
    + '<th scope="col" class="actions"><span class="etiq">Actions</span></th>'
    + "</tr></thead><tbody>";

  for (const e of visibles) {
    const p = profil(e.profil);
    html += "<tr>"
      + '<td class="num" style="white-space:nowrap">' + isoVersFr(e.date) + "</td>"
      + '<td><span style="display:inline-flex;align-items:center;gap:6px"><span class="pastille" style="background:' + teinteDe(p) + '"></span>' + echapper(p.nom) + "</span></td>"
      + '<td><span style="display:inline-flex;align-items:center;gap:8px"><b class="num" style="width:16px">' + e.joie + "</b>"
      + '<span class="barre-joie"><i style="width:' + (e.joie / echelle()) * 100 + "%;background:" + teinteDe(p) + '"></i></span></span></td>'
      + "<td>" + lieuHtml(e) + "</td>"
      + "<td>" + marquesHtml(e) + "</td>"
      + '<td class="notes-cel" title="' + echapper(e.notes || "") + '">' + (e.notes ? echapper(e.notes) : "—") + "</td>"
      + '<td class="actions">'
      + (peutEcrire()
        ? '<button class="icone-btn" data-modifier="' + e.id + '" aria-label="Modifier l\'entrée du ' + isoVersFr(e.date) + '">✎</button>'
          + '<button class="icone-btn danger" data-supprimer="' + e.id + '" aria-label="Supprimer l\'entrée du ' + isoVersFr(e.date) + '">🗑</button>'
        : '<span style="color:var(--faible)">—</span>')
      + "</td></tr>";
  }
  html += "</tbody></table></div>";

  html += '<ul class="cartes-journal">';
  for (const e of visibles) {
    const p = profil(e.profil);
    html += "<li><div style='display:flex;justify-content:space-between;gap:8px;align-items:flex-start'>"
      + "<div><p style='margin:0;font-weight:500;display:flex;align-items:center;gap:6px'>"
      + '<span class="pastille" style="background:' + teinteDe(p) + '"></span>' + echapper(p.nom)
      + '<span class="num" style="color:var(--attenue);font-weight:400">· ' + isoVersFr(e.date) + "</span></p>"
      + "<p style='margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px'>" + lieuHtml(e) + " " + marquesHtml(e) + "</p></div>"
      + '<span class="chiffre num" style="font-size:24px;color:' + teinteDe(p) + '">' + e.joie + "</span></div>"
      + (e.notes ? "<p style='margin:8px 0 0;font-size:12px;color:var(--attenue)'>" + echapper(e.notes) + "</p>" : "")
      + (peutEcrire()
        ? "<div style='display:flex;justify-content:flex-end;gap:4px;margin-top:8px'>"
          + '<button class="icone-btn" data-modifier="' + e.id + '" aria-label="Modifier">✎</button>'
          + '<button class="icone-btn danger" data-supprimer="' + e.id + '" aria-label="Supprimer">🗑</button></div>'
        : "")
      + "</li>";
  }
  html += "</ul>";

  if (restantes > 0) {
    html += '<div class="pagination"><span class="num">' + visibles.length + " sur " + lignes.length + "</span>"
      + '<button class="secondaire" id="plus">Afficher ' + Math.min(PAS, restantes) + " de plus</button></div>";
  }

  zone.innerHTML = html;
}

/* ── Fenêtre de modification ────────────────────────────────────────── */

function ouvrirFenetre(titre, corpsHtml) {
  const voile = document.createElement("div");
  voile.className = "voile";
  voile.innerHTML = '<div class="fenetre" role="dialog" aria-modal="true" aria-label="' + echapper(titre) + '">'
    + "<header><h2>" + echapper(titre) + '</h2><button class="icone-btn" data-fermer aria-label="Fermer">✕</button></header>'
    + '<div class="corps">' + corpsHtml + "</div></div>";
  document.body.append(voile);

  const fermer = () => { voile.remove(); document.removeEventListener("keydown", surTouche); };
  function surTouche(e) { if (e.key === "Escape") fermer(); }
  document.addEventListener("keydown", surTouche);
  voile.addEventListener("mousedown", (e) => { if (e.target === voile) fermer(); });
  voile.addEventListener("click", (e) => { if (e.target.closest("[data-fermer]")) fermer(); });
  return { voile, fermer };
}

function ouvrirModification(id) {
  const entree = ETAT.entrees.find((e) => e.id === id);
  if (!entree || !peutEcrire()) return;
  const brouillon = Object.assign({}, entree, { facteurs: entree.facteurs.slice(), notes: entree.notes || "" });

  const { voile, fermer } = ouvrirFenetre("Modifier l'entrée",
    '<div class="champ"><label class="etiq" for="m-date">Date</label>'
    + '<input class="saisie num" type="date" id="m-date" max="' + aujourdhui() + '">'
    + '<p id="m-date-fr" style="margin:5px 0 0;font-size:12px;color:var(--faible)"></p></div>'
    + '<div class="champ"><span class="etiq">Profil</span><div class="segments" id="m-profil" role="radiogroup" aria-label="Profil"></div></div>'
    + '<div class="champ"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'
    + '<label class="etiq" for="m-joie" style="margin:0">Niveau de joie</label><span id="m-humeur" style="font-size:12px;color:var(--attenue)"></span></div>'
    + '<div class="rangee-joie"><span class="visage" id="m-visage" aria-hidden="true"></span>'
    + '<span class="valeur-joie num" id="m-valeur"></span>'
    + '<input type="range" id="m-joie" min="1" step="1"></div></div>'
    + '<div class="champ"><span class="etiq">Lieu</span><div class="segments" id="m-lieu" role="radiogroup" aria-label="Lieu"></div></div>'
    + '<div class="champ"><span class="etiq">Facteurs du jour</span><div class="bascules" id="m-facteurs"></div></div>'
    + '<div class="champ"><label class="etiq" for="m-notes">Notes</label>'
    + '<textarea class="saisie" id="m-notes" maxlength="' + NOTES_MAX + '"></textarea></div>'
    + '<div class="duo"><button class="annuler" data-fermer>Annuler</button>'
    + '<button class="principal" id="m-enregistrer" style="margin-top:0">Enregistrer</button></div>');

  const q = (sel) => voile.querySelector(sel);

  function peindre() {
    q("#m-date").value = brouillon.date;
    q("#m-date-fr").textContent = estDateIso(brouillon.date) ? isoVersFr(brouillon.date) : "—";

    q("#m-profil").innerHTML = profils().map((p) =>
      '<button type="button" role="radio" data-profil="' + p.id + '" aria-checked="' + (p.id === brouillon.profil) + '"'
      + (p.id === brouillon.profil ? ' style="border-color:' + teinteDe(p) + '"' : "") + ">" + echapper(p.nom) + "</button>").join("");

    const accent = couleurJoie(brouillon.joie);
    const part = ((brouillon.joie - 1) / Math.max(1, echelle() - 1)) * 100;
    const curseur = q("#m-joie");
    curseur.max = echelle();
    curseur.value = brouillon.joie;
    curseur.style.setProperty("--accent", accent);
    curseur.style.setProperty("--piste", "linear-gradient(90deg," + accent + " 0%," + accent + " " + part + "%,var(--surface-3) " + part + "%)");
    q("#m-valeur").textContent = brouillon.joie;
    q("#m-valeur").style.color = accent;
    q("#m-visage").textContent = visageJoie(brouillon.joie);
    q("#m-humeur").textContent = humeur(brouillon.joie);

    q("#m-lieu").innerHTML = '<button type="button" role="radio" data-lieu="" aria-checked="' + (brouillon.lieu === null) + '">Aucun</button>'
      + lieux().map((l) => '<button type="button" role="radio" data-lieu="' + l.id + '" aria-checked="' + (l.id === brouillon.lieu) + '">'
        + l.emoji + " " + echapper(l.nom) + "</button>").join("");

    q("#m-facteurs").innerHTML = facteurs().map((f) => {
      const actif = brouillon.facteurs.includes(f.id);
      return '<button type="button" class="bascule" role="switch" data-facteur="' + f.id + '" aria-checked="' + actif + '"'
        + (actif ? ' style="border-color:' + teinteDe(f) + '"' : "") + ">"
        + '<span class="ic" aria-hidden="true">' + f.emoji + "</span>"
        + '<span class="txt"><b>' + echapper(f.nom) + "</b><span>Présent ce jour</span></span>"
        + '<span class="interrupteur" aria-hidden="true"' + (actif ? ' style="background:' + teinteDe(f) + '"' : "") + "><i></i></span></button>";
    }).join("");

    if (q("#m-notes").value !== brouillon.notes) q("#m-notes").value = brouillon.notes;
  }
  peindre();

  voile.addEventListener("click", (e) => {
    const p = e.target.closest("[data-profil]");
    if (p) { brouillon.profil = p.dataset.profil; peindre(); return; }
    const l = e.target.closest("[data-lieu]");
    if (l) { brouillon.lieu = l.dataset.lieu || null; peindre(); return; }
    const f = e.target.closest("[data-facteur]");
    if (f) {
      const id = f.dataset.facteur;
      brouillon.facteurs = brouillon.facteurs.includes(id)
        ? brouillon.facteurs.filter((x) => x !== id) : brouillon.facteurs.concat(id);
      peindre();
      return;
    }
    if (e.target.closest("#m-enregistrer")) {
      if (!estDateIso(brouillon.date)) { signaler("Choisissez une date valide.", "erreur"); return; }
      const occupee = ETAT.entrees.find((x) => x.id !== entree.id && x.date === brouillon.date && x.profil === brouillon.profil);
      if (occupee) { signaler(profil(brouillon.profil).nom + " a déjà une entrée le " + isoVersFr(brouillon.date) + ".", "erreur"); return; }

      entree.date = brouillon.date;
      entree.profil = brouillon.profil;
      entree.joie = brouillon.joie;
      entree.facteurs = brouillon.facteurs.slice();
      entree.lieu = brouillon.lieu;
      entree.notes = brouillon.notes.trim() || null;
      enregistrerEtat();
      derniereCible = "";
      synchroniserCible();
      fermer();
      signaler("Entrée modifiée.");
      rendre();
    }
  });

  q("#m-joie").addEventListener("input", (e) => { brouillon.joie = Number(e.target.value); peindre(); });
  q("#m-date").addEventListener("change", (e) => { brouillon.date = e.target.value; peindre(); });
  q("#m-notes").addEventListener("input", (e) => { brouillon.notes = e.target.value; });
}

    + ' aria-pressed="' + (t === courante) + '" aria-label="Teinte ' + t + '"'
    + ' style="background:var(--serie-' + t + ')"></button>').join("") + "</span>";
}

    + (p.profils.length < PROFILS_MAX

        + '<input type="text" data-item="facteur" data-id="' + x.id + '" value="' + echapper(x.nom) + '" aria-label="Nom du facteur">'
        + pastilleTeintes("facteur", x.id, x.teinte)
        + '<button class="icone-btn danger" data-suppr="facteur" data-id="' + x.id + '" aria-label="Supprimer ce facteur">🗑</button></div>').join("")
    + '<div class="ajout"><input type="text" class="saisie" id="nouveau-facteur" placeholder="Ajouter un facteur"><button class="secondaire" data-ajout="facteur">Ajouter</button></div></div>'

    + '<div class="section-reglage"><h3>Lieux</h3><p>Où la journée s\'est passée. Le tableau de bord en tire le lieu le plus joyeux.</p>'
    + p.lieux.map((x) =>
