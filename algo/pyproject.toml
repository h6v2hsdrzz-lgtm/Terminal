[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldsilver"
version = "0.1.0"
description = "Backtest & validation anti-overfitting pour un algo de trading XAU/USD + XAG/USD"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
goldsilver = "goldsilver.cli:main"
goldsilver-live = "goldsilver.live.runner:main"
goldsilver-dashboard = "goldsilver.dashboard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# le dashboard sert ses fichiers statiques depuis le paquet installé :
# sans ceci, `pip install` livrerait un serveur sans interface.
[tool.setuptools.package-data]
goldsilver = ["dashboard/static/*.html", "dashboard/static/*.css",
              "dashboard/static/*.js", "dashboard/static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
